вот текст|прилага"], ["Формат: ударения, запись названий по звучанию, паузы, хронометраж", "ударен|транскрипц|по звучан|как слыш|кириллиц|русскими буквами|пауз|45|секунд|хронометраж|формат|таблиц|разметк"], ["Ограничения: смысл и формулировки текста не меняются", "без |не (меня|перепис|сокраща|добавля|трога)|только|огранич|смысл|дословн|сохран"], ["Что проверить: спорные слова отметить, прослушать пробный прогон", "провер|уточн|пометь|отметь|сомн|прослуш|послуш|пробн|тест|не уверен|спроси|покажи"]], "good": "Подготовил текст к синтезу, формулировки не менял. Названия записал по звучанию: «дата сайенс и машинное обучение», «ю-экс ю-ай дизайн», «эм-би-эй: управление в эд-тек», «один-эс аналитик». Расставил ударения в шести словах, где синтез обычно сбивается (слу́шателей, набо́р, о́чно-зао́чный и др.), и паузы после каждого названия программы. По темпу текст укладывается в 43–45 секунд. Приложил таблицу «как написано в титрах → как записано для озвучки», чтобы субтитры остались с оригинальным написанием. Два места отметил: «EdTech» — «эд-тек» или «эдтех», как принято у вас? И «ДПО» — читать аббревиатурой или развернуть? Рекомендую прослушать пробный прогон именно на этих фразах.", "poor": "Я переписал текст, чтобы он лучше звучал: заменил английские названия русскими — «наука о данных», «дизайн интерфейсов», «магистр делового администрирования». Если названия программ менять нельзя, уточните, пожалуйста: как они должны произноситься, нужны ли ударения и паузы, какой хронометраж и можно ли править формулировки?"}, "Y05": {"type": "c", "q": "К юбилею университета собираете ролик для LED-экрана в актовом зале, 4K. В нём нужны 40 секунд архивной записи выпускного 2009 года: 480p, 4:3, 25 кадров в секунду, лица в толпе мелкие, заметный шум. Под рукой Topaz Video AI. Что делаете?", "opts": [{"t": "Прогоняю весь фрагмент на максимальных настройках — до 4K и 60 кадров в секунду — и ставлю в ролик без просмотра: рендер долгий", "g": 1, "fb": "На максимальных настройках мелкие лица в толпе часто получают «восковую» кожу и дорисованные черты, а добавленные кадры дают рывки на быстрых движениях. На экране актового зала это увидят люди, которые на этой записи сняты. Десятисекундный тест с просмотром на большом экране стоит сделать до полного рендера."}, {"t": "Апскейл не трогаю совсем: ставлю запись небольшим окном в рамке с подписью «Архив, 2009» поверх фирменного фона", "g": 3, "fb": "Честная подача архива — рабочее и безопасное решение, и оно может оказаться финальным. Стоит добавить шаг до него: тест на коротком фрагменте покажет, даёт ли умеренное увеличение чистую картинку, — тогда окно можно сделать заметно крупнее."}, {"t": "Делаю тест на 10 секундах с лицами, сравниваю с оригиналом на большом экране; если лица плывут — беру умеренное увеличение и окно «архив»", "g": 5, "fb": "Решение принимается по картинке, а не по настройкам: тест на самом сложном участке — лицах — показывает, где апскейл помогает, а где начинает дорисовывать. Умеренное увеличение с шумоподавлением и подача в окне «архив» сохраняют и качество, и достоверность записи."}, {"t": "Растягиваю 480p на весь экран средствами монтажной программы и добавляю лёгкое размытие, чтобы пиксели не бросались в глаза", "g": 2, "fb": "На четырёхметровом экране растянутая в несколько раз запись превратится в мягкое пятно, а размытие уберёт последние детали. Здесь как раз случай, где апскейл стоит попробовать — на коротком тесте, с проверкой лиц, — а результат подать как архивный кадр в окне."}], "why": "потому|так как|лиц[оа]?|артефакт|дорис|воск|пласт|мыл|тест|фрагмент|провер|сравн|большом экране|больш.. экран|риск|достоверн|архив|шум|рывк|плавност"}, "W07": {"type": "c", "q": "Запускается серия «Факультет за 20 секунд»: 20 выпусков, в каждом — сгенерированная вставка-перебивка в едином стиле, и каждая нужна в трёх форматах: 9:16, 1:1 и 16:9. Итого 60 файлов за две недели, генерация в Runway на тарифе команды с ограниченным числом кредитов. Как организуете работу?", "opts": [{"t": "Пишу запрос под каждую вставку заново, по ситуации: так у каждого факультета получится своя картинка с характером", "g": 2, "fb": "Характер у вставок появится, а серия — нет: стиль, цвета и движение будут плавать от выпуска к выпуску, и перебивка перестанет работать как узнаваемый приём серии. Общую часть запроса стоит зафиксировать, а менять только тему факультета."}, {"t": "Фиксирую общий запрос, образец стиля и настройки, меняю только тему и формат; пробная партия из трёх вставок, затем вся серия", "g": 5, "fb": "Генерация становится повторяемой: постоянная часть — стиль, образец, настройки, переменная — тема и формат кадра. Пробная партия показывает, как композиция ведёт себя в вертикали и квадрате, до того как потрачены кредиты на все 60 файлов. Записанные настройки позволят через месяц доделать 21-й выпуск в том же стиле."}, {"t": "Генерирую все двадцать вставок только в 16:9, а вертикальную и квадратную версии получаю кадрированием на монтаже", "g": 3, "fb": "Кредиты сэкономлены, стиль единый — это рабочая логика. Но при кадрировании 16:9 в вертикаль остаётся меньше трети кадра: главный объект уедет за край, картинка потеряет резкость. Стоит добавить: композиция задаётся под каждый формат в запросе, а проверяется на пробной партии."}, {"t": "Собираю один большой запрос на все 60 файлов, запускаю генерацию на ночь и утром ставлю результаты в монтаж по списку", "g": 1, "fb": "Если стиль или композиция не попали с первого раза, это выяснится на 60 файлах сразу, а кредиты тарифа уже потрачены. Пробная партия из трёх вставок в трёх форматах занимает полчаса и показывает, что стоит поправить в запросе до запуска всей серии."}], "why": "потому|так как|един|стил|повтор|одинаков|кредит|пробн|тест|провер|настройк|шаблон|формат|композиц|серии|серия|узнава|риск|брак"}, "L01": {"type": "m", "q": "Конец модуля, у вас группа из 32 студентов. Какие из этих действий допустимы с точки зрения работы с данными студентов? Отметьте всё подходящее.", "opts": [{"t": "Сделать расшифровку вчерашнего семинара встроенной функцией LMS", "ok": true}, {"t": "Загрузить ведомость группы с ФИО в ChatGPT, чтобы посчитать средний балл", "ok": false}, {"t": "Попросить копилота в LMS подготовить черновик ответа студенту", "ok": true}, {"t": "Отправить запись семинара с голосами студентов во внешний сервис расшифровки", "ok": false}, {"t": "Вставить эссе студента с фамилией во внешний ИИ, чтобы он оценил текст", "ok": false}, {"t": "Спросить у внешнего ИИ идеи примеров к лекции, не упоминая студентов", "ok": true}], "ok_fb": "Верно: всё, где есть данные студентов, остаётся в LMS; наружу — только то, в чём студентов нет.", "fb": "Ориентир один: есть ли в материале данные студентов — ФИО, баллы, голоса, работы. Если есть, работаем только в LMS: там есть и расшифровка, и копилот. Во внешний ИИ можно идти с задачами, где студентов нет совсем, — например, за идеями примеров к лекции."}, "L02": {"type": "m", "q": "Вы провели в LMS двухчасовую лекцию, запись сохранилась. Что из перечисленного умеют ИИ-функции LMS? Отметьте всё верное.", "opts": [{"t": "Превратить запись занятия в текстовую расшифровку", "ok": true}, {"t": "Составить краткое содержание занятия по расшифровке", "ok": true}, {"t": "Найти в записи момент, где обсуждали нужную тему", "ok": true}, {"t": "Без вашего участия выставить итоговые оценки в ведомость", "ok": false}, {"t": "Гарантировать, что термины и фамилии расшифрованы без неточностей", "ok": false}], "ok_fb": "Верно: расшифровка, краткое содержание и поиск по записи — работа ИИ, а оценки и вычитка остаются за вами.", "fb": "ИИ в LMS делает три вещи: расшифровывает запись, собирает краткое содержание и ищет по записи нужный фрагмент. Термины, фамилии и формулы в расшифровке стоит просмотреть глазами, а итоговые оценки выставляет преподаватель."}, "L04": {"type": "j", "multi": false, "q": "Понедельник, вы открыли в LMS сводку по группе; до рубежного контроля 9 дней. С кем из студентов свяжетесь в первую очередь?", "opts": [{"t": "Анна: средний балл 4,6, заходила вчера, все работы сданы, вопросов не задавала", "ok": false}, {"t": "Игорь: средний балл 3,4 весь семестр, заходит регулярно, сдаёт работы с опозданием на 1–2 дня", "ok": false}, {"t": "Марина: средний балл 4,2, но не заходила в LMS 16 дней и пропустила два последних задания", "ok": true}, {"t": "Олег: средний балл 3,9, заходил три дня назад, одна работа не сдана, срок по ней — завтра", "ok": false}], "why_q": "Почему именно с этим студентом? Одной-двумя фразами.", "kw": [["резко упала активность: давно не заходит", "не заход|не появл|пропал|перестал|исчез|16 дн|давно|неактив|активност|две недел|молчит"], ["пропущены задания подряд", "пропу|не сда|задани|долг|задолж|работ[ыу] "], ["мало времени до контроля", "контрол|срок|дедлайн|9 дн|успе|времен|скоро|недел[яюи] "], ["риск отстать или уйти, пока ещё можно помочь", "риск|отста|отчисл|потер|уйд|уйти|брос|помочь|поддерж|выясн|узнать"]], "need": 2, "ok_fb": "Выбран студент с самым тревожным сигналом, и названо, что именно на него указывает.", "fb": "Первый звонок — Марине: хорошая студентка вдруг пропала на 16 дней и пропустила два задания подряд, а до контроля 9 дней. Сводка полезна именно такими переменами: ровно низкий балл Игоря и один долг Олега тоже стоит взять на заметку, но там ситуация не меняется резко. В обосновании назовите сигнал (активность, пропуски) и почему важно успеть сейчас."}, "L05": {"type": "p", "q": "Группа МН-21 (28 человек) сдаёт курсовую по менеджменту через LMS до 12 декабря, 23:59; работы, загруженные позже, по Положению о курсовых работах идут на защиту в резервный день. Напишите запрос копилоту в LMS, чтобы получить готовое напоминание для группы.", "checks": [["Суть: напоминание о сроке сдачи курсовой", "напомин|дедлайн|срок|курсов"], ["Кому и от кого: группа, куратор или преподаватель, откуда условия", "групп|студент|куратор|преподавател|от имени|МН-?21|положени"], ["Формат: короткое сообщение, тон, что выделить", "коротк|кратк|абзац|предложен|тон|дружелюб|вежлив|сообщен|формат|пункт|списк|выдел"], ["Ограничения: только заданные дата и условия, без запугивания", "не (додум|придум|выдум|меня|добавл|пуга|угрож|обеща)|без |только|строго"], ["Что сверить перед отправкой: дата, время, условия по Положению", "провер|свер|уточн|пометь|отметь|убедись|совпада"]], "good": "Коллеги из МН-21, добрый день! Напоминаю: курсовую по менеджменту нужно загрузить в LMS до 12 декабря, 23:59 (мск). Работы, загруженные позже, по Положению о курсовых работах выходят на защиту в резервный день. Если что-то мешает успеть — напишите мне до 10 декабря, разберёмся. Пометка для вас: дату резервного дня в запросе вы не указали — я её не вписывал; сверьте с графиком кафедры и добавьте перед отправкой.", "poor": "Уважаемые студенты! Напоминаем о необходимости сдать работу в установленный срок. Уточните, пожалуйста: какая группа, какая работа, точная дата и время, куда загружать и что будет при опоздании? Без этого получается только общий шаблон."}, "L06": {"type": "c", "q": "Автопроверка в LMS оценила 86 типовых работ по теории вероятностей. Один студент пишет: он решил задачу через формулу полной вероятности, а не по эталонному дереву событий, ответ совпал, но получил 4 балла из 10. Вы посмотрели — решение верное. Что делаете?", "opts": [{"t": "Оставляю 4 балла: автопроверка одинакова для всех 86 работ, а ручные исключения выглядят несправедливо по отношению к остальной группе.", "g": 1, "fb": "Одинаковая проверка справедлива, пока она проверяет то, что нужно. Здесь она сравнила ход решения с эталоном и не узнала верный способ. Спорные случаи разбирает преподаватель — и оценка за ним."}, {"t": "Исправляю балл вручную, просматриваю остальные работы с верным ответом и низким баллом, а нестандартный способ добавляю в эталон проверки.", "g": 5, "fb": "Студент получает заслуженный балл, и заодно находятся те, кто пострадал так же, но не написал. Дополненный эталон избавит от таких случаев в следующем потоке — автопроверка продолжает экономить время на типовых работах."}, {"t": "Проверяю работу этого студента вручную и исправляю ему балл на 10. Остальные 85 работ не трогаю: жалоб от других студентов не поступало.", "g": 3, "fb": "Для этого студента вопрос решён верно. Стоит сделать ещё шаг: отфильтровать работы, где ответ совпал, а балл низкий, — не все пишут преподавателю. И дополнить эталон, чтобы ситуация не повторилась."}, {"t": "Отключаю автопроверку по этому заданию и перепроверяю все 86 работ вручную: раз система не узнала верное решение, доверять ей нельзя.", "g": 2, "fb": "Желание разобраться верное, но типовые решения автопроверка оценивает корректно — перепроверять их вручную незачем. Достаточно выбрать спорные работы (верный ответ при низком балле) и разобрать вручную именно их."}], "why": "потому|так как|вручную|спорн|эталон|остальн|друг|верн|справедлив|провер|балл|нестандарт"}, "L07": {"type": "c", "q": "Вы куратор. В 21:40 второкурсник пишет в LMS: «Завалил два модуля подряд, не справляюсь. Наверное, заберу документы». Копилот тут же предлагает готовый ответ: пять советов по тайм-менеджменту и ссылку на расписание пересдач. Что делаете?", "opts": [{"t": "Отправляю ответ копилота как есть: он вежливый, с конкретными советами и ссылкой, а студент получит реакцию сразу, не дожидаясь утра.", "g": 1, "fb": "Скорость важна, но студент пишет не про тайм-менеджмент — он на грани ухода. Шаблонные советы в такой момент читаются как «вас не услышали». Здесь нужен живой ответ и разговор."}, {"t": "Правлю ответ копилота под себя, убираю лишние советы, добавляю «пишите, если будут вопросы» и отправляю от своего имени.", "g": 3, "fb": "Ответ стал человечнее, и это шаг в верную сторону. Но инициатива осталась у студента, которому сейчас трудно её проявить. Сильнее — самому предложить созвон в конкретное время."}, {"t": "Сам пишу пару тёплых строк и предлагаю созвон завтра в удобное ему время. К разговору смотрю его сводку в LMS и с копилотом собираю варианты по регламенту.", "g": 5, "fb": "Разделение точное: разговор о том, уходить или нет, ведёт человек, а ИИ помогает подготовиться — сводка покажет, где начались сложности, копилот соберёт варианты по регламенту: пересдачи, индивидуальный график. На созвон вы приходите с пониманием и с решениями."}, {"t": "Прошу копилота собрать из регламента порядок отчисления и оформления академического отпуска и отправляю студенту, чтобы он знал свои варианты.", "g": 2, "fb": "Информация точная и может пригодиться, но позже. Сейчас инструкция по отчислению прозвучит как согласие с его уходом. Сначала — разговор о том, что происходит; варианты по регламенту уместны уже внутри него."}], "why": "потому|так как|человек|разговор|созвон|лично|живо|эмоци|поддерж|уход|уйти|шаблон|услыш|довер|копилот"}, "E01": {"type": "m", "q": "Вы готовите для ректората записку о развитии факультета и хотите подключить Perplexity — внешний ИИ с поиском. Какие из этих данных можно в него передать? Отметьте всё подходящее.", "opts": [{"t": "Учебные планы программ конкурентов, опубликованные на их сайтах", "ok": true}, {"t": "Выгрузка отзывов студентов из LMS с фамилиями и группами", "ok": false}, {"t": "Открытая статистика вакансий по направлению с hh.ru", "ok": true}, {"t": "Внутренний отчёт о наборе, отчислениях и выручке факультета", "ok": false}, {"t": "Опубликованные данные мониторинга вузов Минобрнауки", "ok": true}], "ok_fb": "Верно: во внешний сервис идёт только то, что и так опубликовано; студенты и внутренняя аналитика остаются в контуре.", "fb": "Во внешний ИИ — только открытые источники: сайты конкурентов, статистика вакансий, опубликованный мониторинг. Отзывы студентов и внутренние отчёты о наборе и выручке анализируем в корпоративном ИИ-чате: это данные о людях и внутренняя аналитика университета."}, "E03": {"type": "p", "q": "У вас выгрузка из LMS: 600 отзывов студентов факультета за осенний семестр, фамилии уже убраны. К совещанию с заведующими кафедрами нужно понять, какие темы повторяются и что менять в первую очередь. Напишите запрос в корпоративный ИИ-чат.", "checks": [["Суть: разобрать массив отзывов на повторяющиеся темы", "отзыв|обратн\\S* связ|анкет|опрос|коммент"], ["Контекст: чьи отзывы, за какой период, для кого анализ", "декан|факультет|семестр|студент|выгрузк|файл|кафедр|совещан|прилага|приложен"], ["Формат: темы с долями и примерами цитат", "таблиц|списк|дол[яиюе]|процент|%|цитат|пример|формат|структур|топ|столб|частот"], ["Ограничения: только по тексту отзывов, без домыслов и имён", "не (додум|придум|выдум|обобщ|называ|упомин)|без |только|обезлич|фамили"], ["Что проверить: сколько отзывов в каждой теме, что не удалось отнести", "провер|пометь|отметь|выборк|сколько|количеств|числ[оа]|не уверен|спорн|не (удалось|вош|отн[её]с)|проч"]], "good": "Разобрано 600 отзывов, 9 тем. Топ-3: расписание и переносы занятий — 142 отзыва (24%), «за семестр пары по эконометрике переносили четыре раза»; скорость проверки работ — 98 (16%); устаревшие примеры в курсах 3-го года — 71 (12%). Полная таблица: тема, число отзывов, доля, две цитаты, кафедра. Пометки: 37 отзывов не удалось отнести ни к одной теме — вынесены отдельным списком; тема «расписание» на 80% из отзывов одной программы — стоит проверить на выборке, прежде чем обобщать на факультет.", "poor": "Студенты в целом довольны обучением, но отмечают отдельные сложности с организацией и нагрузкой. Уточните, пожалуйста: в каком виде нужны темы — списком или таблицей, нужны ли доли и цитаты, для кого выводы? И приложите саму выгрузку отзывов."}, "N01": {"type": "m", "q": "Вы готовитесь к новому семестру и хотите ускорить работу с помощью внешнего ИИ (не корпоративного ИИ-чата). Какие из этих материалов можно в него загрузить? Отметьте всё подходящее.", "opts": [{"t": "Ведомость группы с ФИО и баллами за прошлый семестр", "ok": false}, {"t": "План лекции по открытой рабочей программе с сайта университета", "ok": true}, {"t": "Методика оценивания кафедры с грифом «для внутреннего пользования»", "ok": false}, {"t": "Курсовые работы студентов с фамилиями на титульных листах", "ok": false}, {"t": "Статья из открытого научного журнала для составления вопросов", "ok": true}], "ok_fb": "Верно: наружу идут только открытые материалы; всё с данными студентов и внутренние методики — в корпоративном ИИ-чате.", "fb": "Два вопроса к любому материалу: есть ли в нём данные студентов и закрытая ли это разработка университета. Ведомость, курсовые с фамилиями и внутренняя методика остаются в корпоративном ИИ-чате. Открытая программа и опубликованная статья могут идти во внешний сервис."}, "N03": {"type": "p", "q": "Через неделю у вас лекция «Теории мотивации персонала» для второго курса направления «Управление персоналом» — полтора часа. Презентация должна быть в шаблоне из брендбука университета. Напишите запрос к ИИ, чтобы получить структуру лекции с опорными слайдами.", "checks": [["Суть: лекция по конкретной теме", "лекци|презентац|заняти|мотивац"], ["Для кого: курс, направление, что уже знают", "студент|курс|бакалавр|групп|направлен|управлени\\S* персонал|прошли|знают|конспект|материал"], ["Формат: полтора часа по блокам, слайды с заголовком и тезисами", "90|полтора|1,5|минут|блок|слайд|тезис|заголов|тайминг|формат|таблиц"], ["Ограничения: шаблон брендбука, объём текста на слайде", "брендбук|шаблон|фирменн|не (больше|более|перегруж)|без |только|максимум|одна мысль"], ["Что проверить: факты, авторы и годы теорий, тайминг", "провер|свер|уточн|пометь|отметь|убедись|корректн"]], "good": "Лекция на 90 минут, 5 блоков, 16 опорных слайдов. Блок 1 (10 мин): зачем HR-специалисту теории мотивации — слайды 1–2. Блок 2 (25 мин): содержательные теории — Маслоу, Герцберг, Макклелланд, слайды 3–8… Для каждого слайда: заголовок до 6 слов, до 4 тезисов, что показать (схема или пример), тип макета из шаблона брендбука. Пометки для вас: годы публикаций у Герцберга и Врума сверьте по учебнику кафедры; на блок 4 заложено обсуждение 15 минут — при большой группе лучше сократить до 10.", "poor": "План лекции: 1) Введение. 2) Основные теории мотивации. 3) Примеры. 4) Заключение. Уточните, пожалуйста: для какого курса лекция, сколько она длится, сколько нужно слайдов и есть ли требования к оформлению? Без этого структура получится общей."}, "N04": {"type": "p", "q": "У вас готов конспект по теме «Эластичность спроса» для второго курса. В этом семестре ту же тему нужно дать первокурсникам-менеджерам (без матанализа) и магистрам-экономистам. Напишите запрос к ИИ, чтобы получить две версии материала.", "checks": [["Суть: адаптировать материал по теме", "адапт|верси|вариант|упрост|углуб|эластичн|переработ|перепиш"], ["Для кого и на основе чего: две аудитории, исходный конспект", "перв\\S* курс|первокурс|магистр|бакалавр|уровен|групп|конспект|материал|аудитори"], ["Формат: объём, структура, примеры и задания в каждой версии", "объ[её]м|страниц|пример|структур|формат|раздел|таблиц|глоссар|задач|задани|вопрос"], ["Ограничения: смысл и определения те же, математика — по уровню", "не (меня|искаж|добавл|теря|использ)|без |только|сохран|т[ео]т? же|в рамках"], ["Что проверить: не исказился ли смысл при упрощении, корректность формул", "провер|свер|пометь|отметь|уточн|убедись|корректн|искаж"]], "good": "Версия для первого курса (3 страницы): эластичность через пример с ценой кофе у кампуса, формула в процентах без производных, 4 задачи на расчёт и глоссарий из 6 терминов. Версия для магистратуры (4 страницы): точечная и дуговая эластичность, вывод через производную, связь с выручкой и ценообразованием, мини-кейс с оценкой по данным продаж, 3 вопроса для обсуждения. Определения в обеих версиях совпадают с вашим конспектом. Пометка для вас: в упрощённой версии сказано «эластичность больше единицы — спрос чувствительный»; я опустил знак минус — проверьте, устраивает ли вас такое упрощение.", "poor": "Эластичность спроса показывает, как меняется спрос при изменении цены… Уточните, пожалуйста: для каких групп нужны версии, что студенты уже знают из математики, какой объём и нужны ли задачи? И приложите исходный конспект — иначе версии не будут согласованы между собой."}, "N05": {"type": "c", "q": "Второй курс менеджеров дважды слушал ваше объяснение дисконтирования и NPV, но на проверочной 19 из 27 студентов снова складывают денежные потоки разных лет без приведения. Через три дня следующее занятие. Что делаете?", "opts": [{"t": "Объясняю тему в третий раз по тем же слайдам, но медленнее и подробнее, а запись занятия выкладываю в LMS, чтобы студенты могли пересмотреть.", "g": 2, "fb": "Запись в LMS пригодится, но то же объяснение в третий раз вряд ли сработает иначе: дело, похоже, не в темпе, а в самом способе подачи. Попробуйте зайти с другой стороны — и здесь ИИ быстро даст варианты."}, {"t": "Прошу ИИ переписать моё объяснение проще и короче, без формул в начале, проверяю результат и на занятии даю тему уже в таком виде.", "g": 3, "fb": "Вы меняете подачу и проверяете текст — это верно. Но один новый вариант — снова ставка на один способ. Сильнее — получить несколько разных заходов и выбрать под то, где именно группа спотыкается."}, {"t": "Прошу ИИ дать три разных объяснения: через житейскую аналогию, через пошаговый числовой пример и через график. Выбираю по ошибкам в проверочной и проверяю расчёты.", "g": 5, "fb": "Несколько заходов вместо одного — и выбор под конкретную группу: проверочная показала, что студенты не чувствуют разницы между рублём сегодня и через год, значит, начинать стоит с аналогии, а закреплять числовым примером. Расчёты в примерах вы пересчитали — материал можно давать."}, {"t": "Даю студентам ссылку на ИИ-чат и задание: самостоятельно попросить его объяснить NPV понятным для себя способом, а на занятии перехожу к следующей теме.", "g": 1, "fb": "Студенты действительно могут учиться с ИИ, но без вашей проверки они получат объяснения разного качества, а пробел у 19 человек останется. Выбор способа объяснения под группу — работа преподавателя; ИИ здесь помощник в подготовке вариантов."}], "why": "потому|так как|вариант|способ|подход|аналог|пример|график|ошиб|групп|по-друг|иначе|выбра|провер"}, "N06": {"type": "c", "q": "Завтра семинар по трудовому праву. ИИ подготовил кейс об увольнении на испытательном сроке, и в тексте сказано: «по ст. 70 ТК РФ испытательный срок для менеджера по продажам — до шести месяцев». Вы помните, что шесть месяцев — только для руководителей, а для остальных — три. Что делаете?", "opts": [{"t": "Исправляю шесть месяцев на три и выдаю кейс студентам: неточность найдена, остальной текст выглядит грамотно и логично.", "g": 3, "fb": "Замеченную неточность вы поправили — хорошо. Но если модель ошиблась в одной норме, могла и в других: сроках уведомления, номерах статей. Перед выдачей стоит сверить все правовые ссылки кейса, а не только ту, что бросилась в глаза."}, {"t": "Сверяю все нормы и номера статей из кейса с актуальной редакцией ТК в КонсультантПлюс, исправляю текст и пересматриваю, не изменился ли от этого ответ кейса.", "g": 5, "fb": "Одна найденная неточность — повод проверить все факты, которые можно сверить: статьи, сроки, порядок уведомления. И важный второй шаг: с тремя месяцами вместо шести решение кейса может стать другим. Студенты получают материал, за который вы отвечаете."}, {"t": "Пишу ИИ, что в кейсе неточность, прошу перепроверить все нормы и прислать исправленную версию. Её и выдаю: модель уже учла замечание.", "g": 2, "fb": "Попросить ИИ исправить текст — нормальный ход, но его «перепроверил» не заменяет сверку с первоисточником: модель так же уверенно подтвердит и неверную норму. Исправленную версию всё равно нужно сверить с актуальной редакцией ТК."}, {"t": "Оставляю кейс как есть и добавляю задание «найдите неточность в условии»: так даже полезнее, а остальные нормы не проверяю — времени до семинара мало.", "g": 2, "fb": "Задание на поиск неточности — хороший приём, когда вы точно знаете, что она в кейсе одна. Сейчас это неизвестно: остальные нормы не сверены, и студенты могут запомнить неверное как верное. Сначала полная сверка, потом — осознанно оставленная «ловушка»."}], "why": "потому|так как|норм| ["Выводы ИИ на выборке обращений", 10], "X05": ["Сводка по проблемным зонам сервиса", 11], "G09": ["Какая модель для какой задачи", 6], "G10": ["Один герой на всю серию", 9], "G11": ["Узнаваемое лицо — только с согласием", 5], "G12": ["Досье генерации за пять минут", 7], "G13": ["Помечать ли «создано с ИИ»", 8], "G14": ["Фирменный стиль в своём контуре", 11], "G15": ["Бракуем нейросетевой шаблон", 9], "F01": ["Где искать артефакты", 6], "F02": ["Правка, которую не видно", 9], "F03": ["Исправить или забраковать", 8], "F04": ["Из 1024 пикселей в ролл-ап", 9], "F05": ["ИИ-изображение уходит в печать", 9], "F06": ["Кого-то напоминает: проверка сходства", 8], "F07": ["Знак, который можно защитить", 11], "F08": ["Стандарт приёмки ИИ-визуала", 12], "K07": ["Заголовок, текст и обложка разом", 8], "K08": ["Презентация по тезисам в шаблоне", 10], "K09": ["Библиотека сценариев команды", 12], "R07": ["Прототип — ещё не код", 6], "R08": ["Сценарий, который можно прокликать", 10], "R09": ["Доступность ИИ-макета", 9], "R10": ["Генерация из своих компонентов", 11], "R11": ["Проверено на людях или дорисовано ИИ", 10], "R12": ["Когда ИИ в продукте ошибается", 11], "R13": ["Правила ИИ-прототипирования", 12], "V07": ["Аватар вместо спикера: можно ли", 9], "V08": ["Регламент выпуска коротких видео", 12], "W05": ["Морфинг, руки, текст в кадре", 9], "W06": ["Генерация, сток или съёмка", 9], "W07": ["Двадцать вставок под три формата", 10], "W08": ["Правила видеогенерации", 12], "Y07": ["Маска без дрожащих краёв", 9], "Y08": ["Звук и музыка с подтверждённой лицензией", 9], "Y09": ["Раскрытие ИИ на площадке", 7], "Y10": ["Лекция на другом языке", 11], "I06": ["Обезличить до загрузки", 6], "I07": ["Почему нейросеть — не респондент", 7], "I08": ["ИИ-персона как гипотеза", 9], "I09": ["Порядок ИИ-анализа исследований", 12], "D01": ["Что нельзя отдавать рендер-сервису", 6], "D02": ["ИИ-изображение — не визуализация", 7], "D03": ["Концепт по фото площадки", 9], "D04": ["Десять атмосфер на одной геометрии", 10], "D05": ["Ассет до сцены: масштаб и лицензия", 10], "D06": ["Текстура без швов", 8], "D07": ["Это можно построить?", 11], "D08": ["Конвейер ракурсов и облёт", 11], "D09": ["Правила 3D-ИИ для команды", 12], "F09": ["Что нельзя загружать в сервис правки", 5], "V09": ["Согласие и лицензия до сборки ролика", 5], "X06": ["Что не выносится из системы разговоров", 5], "X07": ["Проверка автооценки на выборке", 7], "X08": ["Сводка обращений по справочнику тем", 6]}, "full": {"B05": {"task": "Пятница, 16:40. Деканат просит предупредить преподавателей кафедры: сдачу ведомостей переносят с 20 на 24 июня, потому что выгрузка из LMS задержалась. Письмо нужно отправить сегодня — короткое, спокойное и с новой датой, которую никто не перепутает.", "why": "ИИ берёт на себя черновик: структуру, вежливые формулировки, подбор тона. За вами — постановка и финальная вычитка: модель не знает, кто адресаты, что случилось и какую дату нельзя исказить. Чем точнее запрос, тем меньше правок: хороший запрос даёт письмо, которое можно отправлять после одной проверки дат и имён. Подпись под письмом ваша — значит, и ответственность за каждую строчку ваша.", "algo": ["Опишите ситуацию как коллеге: что произошло, от чьего имени письмо и кому оно адресовано. Например: «Я специалист деканата, пишу преподавателям кафедры: сдача ведомостей переносится с 20 на 24 июня из-за задержки выгрузки из LMS».", "Задайте формат результата: объём (до 5 предложений), тон (деловой, доброжелательный), структуру (что изменилось → новая дата → что сделать → к кому обратиться).", "Добавьте ограничения: чего в письме быть не должно (поиск виноватых, лишние подробности) и что обязательно (новая дата, контакт для вопросов).", "Попросите модель в конце перечислить, что вам стоит перепроверить. Затем сверьте даты, имена и контакты с источником — и отправляйте."], "practice": "Возьмите письмо, которое вам и так нужно написать на этой неделе: перенос занятия, напоминание о сроках, ответ коллеге. Напишите запрос в корпоративный ИИ-чат по четырём шагам. Модель пришлёт письмо и спросит: «Что из этого письма вы проверите перед отправкой и по какому источнику?» Ответьте одной-двумя фразами.", "check": {"q": "Нужно письмо преподавателям о переносе консультации перед экзаменом. Какой запрос даст результат, который можно отправить без переделки?", "opts": [{"t": "«Я методист кафедры. Напиши преподавателям письмо: консультация переносится с 12 на 14 мая, 15:00, ауд. 305. До 5 предложений, деловой тон, без объяснения причин. В конце перечисли, что мне сверить»", "g": 5, "fb": "Отлично: есть контекст, адресат, формат, ограничения и просьба назвать, что сверить. Такое письмо уходит после одной проверки даты и аудитории."}, {"t": "«Напиши преподавателям кафедры вежливое деловое письмо о том, что консультация перед экзаменом переносится с 12 на 14 мая, и попроси их обязательно предупредить об этом студентов своих групп»", "g": 3, "fb": "Хорошее начало: суть и адресат названы. Добавьте формат (объём, структура), время и аудиторию, ограничения — и правок после ответа почти не останется."}, {"t": "«Напиши, пожалуйста, красивое и вежливое письмо про перенос консультации перед экзаменом для наших преподавателей, чтобы было официально, грамотно и понятно всем, кто его получит»", "g": 1, "fb": "Пока модель не знает ни дат, ни автора, ни нужного объёма — она вернёт шаблон с пропусками. Добавьте ситуацию, формат и ограничения: это три лишние строки и минус десять минут правок."}]}}, "B06": {"task": "Вы попросили ИИ подготовить объявление для студентов о пересдаче. Ответ пришёл на полстраницы, в канцелярском тоне и без аудитории. Рука тянется открыть новый чат и написать всё заново — а через десять минут вы получите другой текст с другими недочётами.", "why": "Модель помнит весь диалог: ситуацию, адресата, даты. Новый чат стирает этот контекст, и вы снова тратите время на постановку. Одно точное уточнение обычно доводит ответ до нужного быстрее, чем второй заход с нуля. ИИ переписывает, а вы решаете, что именно не так и каким должен быть результат: назвать разрыв между «получил» и «нужно» может только человек, который знает задачу.", "algo": ["Прочитайте ответ целиком и отметьте, что уже подходит: это нужно сохранить. Например: «структура и даты верные».", "Назовите разрыв конкретно, по пунктам: что не так и как должно быть. Не «сделай лучше», а «сократи до 4 предложений, убери канцеляризмы, добавь аудиторию 214».", "Отправьте всё одним сообщением в том же диалоге и попросите менять только названное: «остальное оставь как есть».", "Сравните новую версию с первой: исправлено ли названное и не изменилось ли то, что подходило. Если после двух уточнений результат не тот — вернитесь к исходному запросу и дополните его контекстом."], "practice": "Откройте в корпоративном ИИ-чате любой недавний диалог, где ответ вас не устроил, или дайте модели новую задачу этой недели и дождитесь первого ответа. Напишите одно уточнение по шагам 2–3. Модель пришлёт новую версию и спросит: «Что вы сохранили из первого ответа, а что попросили изменить — и почему именно это?»", "check": {"q": "ИИ составил объявление о пересдаче: даты верные, но текст длинный и сухой, нет аудитории. Как вы поступите?", "opts": [{"t": "Пишу в том же диалоге: «Даты и порядок оставь. Сократи до 4 предложений, тон дружелюбнее, добавь аудиторию 214. Остальное не меняй» — и сверяю новую версию с первой", "g": 5, "fb": "Именно так: вы сохранили удачное, назвали разрыв по пунктам и проверили, что исправлено только нужное. Одно сообщение — и объявление готово."}, {"t": "Пишу в том же диалоге: «Получилось слишком длинно и как-то сухо, переделай, пожалуйста, чтобы объявление было лучше и понятнее студентам» — и смотрю, что изменится", "g": 3, "fb": "Верное направление: вы остались в диалоге и сохранили контекст. Следующий шаг — конкретика: сколько предложений, какой тон, что добавить. Тогда хватит одного уточнения вместо трёх."}, {"t": "Открываю новый чат и пишу запрос заново, на этот раз подробнее: раз первый ответ не подошёл, проще начать с чистого листа, чем разбираться, что именно в нём исправлять", "g": 1, "fb": "Так теряется всё, что модель уже знает о задаче, и верные даты придётся проверять заново. Попробуйте остаться в диалоге и назвать, что изменить: обычно это быстрее в два-три раза."}]}}, "B07": {"task": "ИИ помог собрать справку для заведующего кафедрой: число студентов на программе, сроки подачи документов на конкурс, ссылка на положение о стипендиях. Текст гладкий и убедительный. Завтра его увидит руководитель — и будет опираться на эти цифры.", "why": "ИИ экономит время на сборку текста, но не отличает точный факт от правдоподобного: цифра, дата или номер приказа могут оказаться устаревшими или придуманными — и звучать при этом одинаково уверенно. Проверка — часть работы, которая остаётся за вами, и занимает она минуты, если идти по списку. Пометка «проверено» нужна и вам, и коллегам: сразу видно, на что в документе можно опираться.", "algo": ["Выпишите из ответа всё проверяемое: цифры, даты, имена и должности, названия и номера документов, ссылки. Удобно попросить модель: «Перечисли списком все факты, цифры и ссылки из своего ответа».", "Для каждого пункта определите источник: отчёт из LMS, приказ, страница сайта университета, первичная таблица. Источник — документ или система, а не повторный вопрос к ИИ.", "Сверьте каждый пункт с источником. Ссылки откройте: существует ли страница и говорится ли там то, что утверждает текст. Расхождения исправьте по источнику.", "Пометьте результат: рядом с пунктом — «проверено, источник, дата». Что сверить не удалось — уберите из текста или отметьте «требует подтверждения»."], "practice": "Возьмите текст, который вы готовили с ИИ на этой неделе, или попросите корпоративный ИИ-чат составить короткую справку по вашей рабочей теме. Выпишите из неё проверяемые пункты и назовите источник для каждого. Модель спросит: «Какие три пункта вы проверите в первую очередь и где именно?» — и подскажет, если что-то проверяемое осталось вне списка.", "check": {"q": "В справке от ИИ для руководителя — три цифры по набору, срок подачи заявок и ссылка на положение. Что вы сделаете перед отправкой?", "opts": [{"t": "Выпишу цифры, срок и ссылку, сверю каждую с отчётом LMS, приказом и сайтом, открою ссылку и помечу в справке, что проверено и по какому источнику", "g": 5, "fb": "Точно: список проверяемого, сверка по первичным источникам и пометка. Руководитель видит, на что можно опираться, а вы спокойны за каждую цифру."}, {"t": "Перечитаю справку внимательно, сверю с отчётом ту цифру, которая выглядит подозрительно, а остальное оставлю: срок и ссылка похожи на правду и сомнений не вызывают", "g": 3, "fb": "Сверка с отчётом — верный ход. Осталось распространить его на всё проверяемое: ошибки ИИ чаще всего прячутся как раз в том, что выглядит правдоподобно. Список из шага 1 сделает это быстрым."}, {"t": "Попрошу ИИ ещё раз перепроверить собственные цифры, срок и ссылку и, если модель подтвердит, что всё верно, отправлю справку руководителю без дополнительной сверки", "g": 1, "fb": "Модель подтверждает свой ответ тем же способом, каким его составила, — к источникам она не обращается. Надёжнее сверить с отчётом, приказом и сайтом: это 5–7 минут по готовому списку."}]}}, "M03": {"task": "В четверг совещание по запуску новой магистерской программы: руководитель программы, методист, маркетинг и приёмная комиссия. Нужно за час договориться о сроках набора и распределить работу. Повестки пока нет, а участники спрашивают, что подготовить.", "why": "ИИ быстро превращает цель встречи в структуру: вопросы, тайминг, кто что готовит, какие материалы разослать заранее. Но цель встречи, состав участников и то, какое решение нужно принять, знаете только вы — без этого модель выдаст универсальную повестку «обо всём». За вами же остаётся проверка: реалистичен ли тайминг, все ли нужные люди названы, нет ли в материалах данных, которые не стоит передавать во внешний сервис.", "algo": ["Сформулируйте цель встречи одним предложением через результат: «К концу встречи у нас есть согласованные сроки набора и ответственные по каждому этапу».", "Опишите модели состав и контекст: кто участвует и за что отвечает, сколько времени, что уже решено, что вызывает споры. Внутренние документы прикладывайте только в разрешённом инструменте.", "Попросите повестку в формате таблицы: вопрос → какое решение нужно → кто докладывает → минуты. Отдельным списком — что каждому участнику подготовить и какие материалы разослать заранее.", "Проверьте результат: сумма минут укладывается во время встречи, каждый вопрос ведёт к решению, у каждого пункта есть человек. Лишнее уберите и разошлите повестку минимум за день."], "practice": "Возьмите ближайшую встречу из своего календаря. Напишите в корпоративный ИИ-чат запрос по шагам 1–3: цель, участники, время, формат. Модель пришлёт повестку и спросит: «Какой пункт вы бы убрали или сократили, чтобы уложиться во время, и какое решение должно быть принято по итогам?»", "check": {"q": "Вы готовите с ИИ повестку часового совещания по запуску новой программы. С чего начнёте запрос?", "opts": [{"t": "С цели и состава: какое решение нужно к концу часа, кто участвует и за что отвечает; попрошу таблицу «вопрос — решение — докладчик — минуты» и список, что кому подготовить", "g": 5, "fb": "Да: цель через результат, участники с ролями и явный формат. Такая повестка сразу рабочая — останется сверить тайминг и разослать за день."}, {"t": "С темы и времени: «Составь повестку совещания по запуску магистерской программы на один час», а участников, докладчиков и материалы добавлю потом сам, когда получу структуру", "g": 3, "fb": "Тема и время — полезная основа. Добавьте в запрос цель и состав участников: тогда модель сама распределит докладчиков и подскажет, что подготовить, и дорабатывать вручную почти не придётся."}, {"t": "С просьбы о шаблоне: «Дай универсальную повестку для рабочего совещания», чтобы потом каждый раз подставлять в неё нужные темы и использовать на всех встречах нашего отдела", "g": 1, "fb": "Универсальная повестка не знает, зачем собирается именно эта встреча, и разговор легко уйдёт в обсуждение без решений. Начните с цели и участников — это две фразы, а встреча станет вдвое полезнее."}]}}}}, "site": {"hero": {"role": "Графический дизайнер", "grade": "middle", "title": "Что вы уже умеете в работе с ИИ", "lines": ["Выберите свою должность — кейсы соберутся под её требования.", "Увидите, что уже закрыто по требованиям должности, а что уходит в трек.", "Каждый пробел закрывается коротким уроком на рабочей задаче."], "lead": "Результат влияет только на обучение: руководитель видит уровни, но не ответы."}, "search_examples": ["декан", "проектный менеджер", "генерация визуала", "Cursor"], "layers": {"1": "Для всех", "2": "Для тех, кто ведёт встречи и людей", "3": "Профильные"}, "divisions": {"IT-департамент": "ИИ-агенты пишут рутинный код и тесты; человек ставит задачу и читает результат.", "Дизайн": "Генерация визуала, макетов и видео — с отбором и доводкой руками дизайнера.", "Продажи": "Сводка по клиенту перед звонком и разбор разговора после него.", "Приёмная комиссия": "Ответы абитуриентам по проверенным данным, итоги встреч без ручного протокола.", "Отдел сопровождения клиентов": "Разбор звонков, письма и сводки по делу абитуриента — с проверкой сроков и условий.", "Проектный офис": "Статусы, риски и протоколы встреч собираются с ИИ; решения остаются за менеджером.", "ППС и сервис": "Учебные материалы, ИИ-инструменты LMS, анализ рынка программ и обратной связи студентов."}, "company": {"note": "Пример. Данные условные — так будет выглядеть сводка после первой волны оценки.", "rows": [["IT-департамент", 72, "Сильны в работе с агентами в коде; пробел — правила по данным при работе с внешними сервисами."], ["Дизайн", 61, "Уверенно генерируют визуал; пробел — проверка прав на изображения и доводка под бренд."], ["Проектный офис", 58, "Встречи и статусы с ИИ уже в привычке; пробел — оценка рисков с ИИ."], ["Приёмная комиссия", 44, "Базовые запросы освоены; пробел — проверка фактов перед ответом абитуриенту."], ["Отдел сопровождения клиентов", 41, "Пользуются сводками по клиенту; пробел — разбор своих звонков."], ["Продажи", 37, "Точечное использование; пробел — подготовка к контакту и разбор разговора."], ["ППС и сервис", 29, "Самый большой запас роста: материалы курсов и ИИ-инструменты LMS."]]}, "team": {"note": "Пример. Уровни без ответов; результаты влияют только на обучение.", "names": ["Иванов Павел", "Егорова Настя", "Сухов Александр", "Вишневская Елена"]}, "how": [["Откуда требования", "Первая итерация модели описала 35 должностей и 19 компетенций; мы сделали их измеримыми. Каждое требование — это конкретное действие, которое можно проверить одним рабочим кейсом. Формулировки сверены с отраслевым стандартом цифровых навыков, которым пользуются в 200 странах, и с рамками ОЭСР и ЮНЕСКО по грамотности в ИИ."], ["Кто оценивает", "Языковая модель. На каждый кейс два промпта: первый выдаёт рабочую ситуацию, второй разбирает ответ — ищет в нём признаки уровней и ставит уровень вместе с тем, чего не хватило до следующего. Это та же технология, которая уже оценивает знания студентов на учебной платформе. В прототипе разбор упрощённый, по ключевым словам, чтобы всё работало по ссылке без подключения к серверам."], ["Кто что видит", "Сотрудник видит всё своё: ответы, профиль, трек. Руководитель — уровни по компетенциям, без ответов. Компания — сводку по подразделениям без имён."], ["На что это влияет", "Только на обучение. Результат оценки — это список коротких уроков под конкретные пробелы, а не оценка человека. На аттестацию, грейд и зарплату результаты не влияют."]], "faq": [["Это аттестация?", "Нет. Результаты влияют только на обучение: сотрудник получает трек из коротких уроков. Баллов он не видит, статусов два — «закрыт» и «в трек»."], ["Сколько времени это займёт у человека?", "Оценка — один кейс на компетенцию, по 8–15 минут каждый: у большинства должностей это 3–6 кейсов, от получаса до часа. Кейсы между собой не связаны, поэтому их можно проходить в разные дни. Дальше уроки по 7–12 минут, два-три в неделю, прямо в рабочем чате."], ["Почему нельзя просто назначить всем курс по ИИ?", "Курс учит всех одному и тому же. Здесь человек не тратит время на то, что уже умеет, и учится тому, чего требует именно его должность."], ["Что увидит руководитель?", "Уровни сотрудников по компетенциям и кто уже закрыл требования роли. Ответов сотрудников руководитель не видит, рейтинга людей нет."], ["Можно ли доверять оценке языковой модели?", "Модель ставит уровень не на глаз: в проверяющем промпте описано, как выглядит ответ каждого уровня, и уровень засчитывается только вместе со всеми уровнями ниже. Любой результат сотрудник может оспорить примером из реальной работы — его посмотрит эксперт."], ["Откуда взялись требования к должностям?", "Из модели компетенций компании: она описала 35 должностей и 19 компетенций, мы сделали их измеримыми. Требования уточняются с экспертами подразделений — правится одна таблица, а не 35 профилей."], ["Что нужно от ИТ?", "На первом этапе — только сценарий в корпоративном ИИ-чате. Технология оценки уже работает на учебной платформе компании; интеграция с профилем сотрудника — следующим этапом."], ["А если человек не справился?", "Ничего страшного не происходит: пробел уходит в трек, урок закрывает его за несколько минут, после чего проверка повторяется на другом кейсе."], ["С кого начинаем?", "С новых сотрудников одной команды — 15–20 человек. Действующие сотрудники подключаются по приглашению руководителя, без сроков."]], "next": {"stages": [["Пилот", "4–6 недель", "Одна команда, 15–20 человек: оценка в корпоративном ИИ-чате, базовая компетенция, первые уроки. Замеряем, сколько времени уходит и закрываются ли пробелы."], ["Массовые компетенции", "6–8 недель", "Встречи, управление командой, речевая аналитика, проектная работа — то, что нужно большинству должностей. Около 40 уроков."], ["Вся компания", "3–4 месяца", "Остальные профиль "ППС и сервис", "role": "Декан факультета", "grade": null, "assessed": false, "date": null, "levels": {}}, {"name": "Белов Артур", "div": "ППС и сервис", "role": "Директор по сервису", "grade": null, "assessed": false, "date": null, "levels": {}}, {"name": "Нестерова Юлия", "div": "ППС и сервис", "role": "Директор по сервису", "grade": null, "assessed": false, "date": null, "levels": {}}, {"name": "Громов Роман", "div": "ППС и сервис", "role": "Директор по сервису", "grade": null, "assessed": true, "date": "18 сентября 2026", "levels": {"B": 3, "X": 4, "U": 3}}]}, "cases": {"cases": {"V": {"set": "design", "key": "V", "comp": "V", "level": 2, "kind": "логика", "title": "Три площадки к завтрашнему полудню", "timer": 12, "situation": "Личный кабинет студента с 10 ноября принимает заявления на перевод с одной формы обучения на другую — раньше это делали только в деканате. Отдел по работе со студентами записал на камеру начальника отдела: три минуты одним кадром, он называет шаги и сроки. Контент-менеджер ждёт файлы завтра до 12:00, в 13:00 ролик уходит в ленту, в сторис и на экраны в холлах четырёх корпусов: вертикальный 1080×1920, квадратный 1080×1080 и горизонтальный 1920×1080. Шаблон сборки у вас есть: заголовок, подпись спикера, три титра по шагам, финальный кадр с датой и адресом раздела, закадровая озвучка вступления и финала — три предложения вступления пишете вы, читает их шаблон. Субтитры шаблон ставит сам из автоматической расшифровки записи. В папке от отдела: запись начальника, служебная записка со сроками, архивный кадр с прошлогодней линейки, где крупно видны пятеро студентов, и музыкальный трек, который отдел нашёл в открытой подборке. Отдельным файлом — список написания: «Личный кабинет», «Перевод на другую форму», «Служба поддержки студентов», фамилия спикера. Сейчас 16:40, до конца дня у вас около двух часов, утром освободится ещё три.", "ask": "Пришлите порядок своей работы от папки с материалами до передачи файлов: что делаете на каждом шаге и зачем, что уходит дальше и кому. Списком из 6–10 пунктов, а не рассказом о подходе.", "ind": {"1": "Уровень 1 «по образцу»: порядок держится на выданной инструкции — заполнить поля шаблона (заголовок, титры, подпись, дата) и отдать сборку на проверку. Формат один, обычно тот же, в котором собирали в прошлый раз. Субтитры остаются такими, какими их поставила автоматическая расшифровка. Всё, что в инструкции не описано — архивный кадр, трек, второй и третий размеры, — человек не решает сам, а спрашивает автора шаблона или руководителя. Материал, на который нет разрешения или лицензии, в сборку не берёт и выносит это вопросом. Про срок сказано «успею», без раскладки по оставшимся часам.", "2": "Уровень 2 «самостоятельно»: человек ведёт задачу сам. Ролик собирается из шаблона и выходит в трёх форматах под три площадки, а не одним файлом с обрезкой под остальные. Автоматическая расшифровка правится по списку написания — названия разделов и фамилия, — при этом слова спикера и таймкоды остаются как есть. Озвучка вступления и финала сделана и прослушана целиком. Титры и тайминги человек смотрит в каждом формате отдельно, потому что в разных пропорциях строки встают по-разному. Архивный кадр с лицами студентов и трек из подборки в сборку не идут, пока нет разрешения и лицензии, и это решает он, а не руководитель. Названо, что уходит дальше и кому: файлы контент-менеджеру с подписью, какой куда, исходники и правленая расшифровка — туда, где их потом найдут. Шаги разложены по остатку срока. Признака, по которому ролик не выпускают, и проверки готового ролика на телефоне в ответе нет.", "3": "Уровень 3 «по ситуации»: сверх второго уровня до начала работы назван признак, по которому ролик уходит в брак, и что из этого следует. Например: титр не читается в вертикальном формате — значит правится копия шаблона, все три формата пересобираются и проверяются пробным рендером, а не подтирается один файл; или времени не хватает, и первым уходит формат для сторис, потому что по расписанию он публикуется раньше, а экраны в холлах переносятся на день — выбор назван вместе с ценой ошибки. Готовый ролик человек смотрит на телефоне, а не только в окне сборки, и проверяет кегль титров, контраст с фоном и отступ от кнопок площадки. Решение про синтезированный голос или замену спикера он принимает сам и получает письменное согласие до начала работы. Признак «перерос»: из этой задачи человек оставляет команде шаблон под три формата и правило выпуска — кто проверяет расшифровку, что помечается и где лежат исходники."}, "criteria": ["Прислан порядок шагов от папки с материалами до передачи файлов, а не рассуждение о задаче", "Ролик собирается из шаблона и выпускается в трёх форматах под три площадки", "Автоматическая расшифровка правится по списку написания, слова спикера и таймкоды не меняются", "Озвучка вступления и финала сделана и прослушана до выпуска форматов", "Титры и тайминги проверены в каждом из трёх форматов отдельно", "Архивный кадр с лицами студентов и трек из подборки не идут в сборку без разрешения и лицензии", "Названо, что уходит дальше и кому: файлы, исходники, правленая расшифровка", "Шаги разложены по остатку срока до 12:00"], "flags": ["Собран один формат, остальные два получены обрезкой без проверки титров", "Субтитры оставлены такими, какими их поставила автоматическая расшифровка", "Слова спикера переписаны «для гладкости» или сдвинуты таймкоды", "Архивный кадр с лицами студентов и трек из подборки идут в сборку без вопроса о разрешении и лицензии", "Дата и адрес раздела взяты по памяти, а не из материалов отдела", "Срок не разложен: «успею к утру» без шагов по часам", "Прислан рассказ о подходе вместо порядка шагов"], "why_kind": "Второй уровень здесь — человек сам ставит себе задачу и сам проверяет результат. Очерёдность сборки под срок, правка расшифровки до выпуска форматов и то, что уходит дальше и кому, в текст запроса к ИИ не умещаются: это видно только в порядке шагов и в том, что человек решает не брать в сборку.", "marks": {"1": аких случаях я|всегда делаю так"], ["случай не свой: работу сделал кто-то другой", "коллега сдела|команда сделала|за меня сдела|мне принесли готов"]], "sample": "В ноябре международный отдел ставил на англоязычную страницу приёмной кампании ролик-приветствие декана из архива 2011 года: запись 640×480, половина времени — крупный план лица. Срок был жёсткий, 12 ноября, ждал редактор отдела.\nГотового порядка под архивный ролик у нас не было. Декан два года как перешёл в другой вуз, поэтому первым делом я написал на кафедру и попросил письменное согласие на синтез его голоса — без него дубляж не начинаю. Параллельно взял у отдела список названий программ с произношением.\nДальше стоял выбор: поднимать разрешение всей записи или оставить архив как есть. Критерий назвал до теста: если на фрагменте с крупным планом черты лица меняются — апскейл не беру. Прогнал тест на двадцати секундах, сравнил с оригиналом на экране в холле и на телефоне: лицо поплыло, поэтому пошёл вторым путём — архивную запись оставил во вставке, резкость поднял только подписям и графике.\nСогласие пришло 9 ноября, после него я собрал дубляж с липсинком, сверил термины по списку и поставил на площадке отметку о синтезированном голосе. Подложку из прошлого ролика не взял: лицензия была с бесплатного тарифа. В итоге три версии вышли 12 ноября. С тех пор согласия и подтверждения лицензий мы складываем в одну папку проекта."}}, "I": {"set": "design", "key": "I", "comp": "I", "level": 2, "kind": "промпт", "title": "412 отзывов и три доработки", "timer": 13, "situation": "Служба поддержки и деканат отдали вам выгрузку обратной связи по личному кабинету студента: 412 отзывов за сентябрь — из формы «Сообщить о проблеме» внутри кабинета и из отзывов о мобильном приложении. В таблице шесть столбцов: дата, текст отзыва, оценка от 1 до 5, курс, институт и контакт — почта или телефон, которые форма просила для ответа; контакт заполнен в 180 строках. Во вторник в 11:00 продуктовая команда планирует работы на ноябр и рассуждение о задаче."], "why_kind": "Уровень 2 этой компетенции — самому поставить задачу на разбор массива: сколько проблем нужно, чем считается частота, откуда берутся цитаты и что вырезано из файла до загрузки. Всё это либо есть в тексте запроса, либо его нет. По рассказу о порядке работы не проверить: частоты и ссылки на строки появляются в ответе только тогда, когда их заказали.", "marks": {"1": [["контакты студентов убраны из файла до загрузки", "обезлич|персональн|контакт[а-яё]{0,3}.{0,25}(убра|уберу|удал|вырез|вычищ|нет в файл|не загруж)|(убра|уберу|удал|вырез|вычищ)[а-яё]{0,4}.{0,25}(контакт|почт|телефон|столбец)|без контактов|без почт"], ["назван источник — выгрузка отзывов", "выгрузк|412|отзыв"], ["сказано, для кого и к какому сроку результат", "команд|встреч|вторник|планир"]], "2": [["опора только на присланные строки, без достроек", "только на эт|только на присланн|только на приложенн|только на данны|только .{0,20}строк|не добавля|ничего не добавл|не придумыв|не выдумыв|не достраива"], ["частота: сколько отзывов подтверждают проблему", "частот|сколько отзыв|число отзыв|количество отзыв|сколько строк|сколько жалоб|посчитай.{0,25}(отзыв|строк|жалоб|упоминан)|как[а-яё]{0,2} это дол|в процентах от 412|дол[юя] от 412"], ["заказаны цитаты из самих отзывов", "дословн|цитат"], ["сказано, сколько проблем нужно выделить", "(^|[^а-яё])(пять|шесть|семь)(?![а-яё])|5 ?[–—-] ?7|не больше .{0,15}проблем|фиксированн[а-яё]* числ"], ["задана форма ответа: таблица или одинаковые поля", "таблиц|одинаков[а-яё]* пол|список проблем|по пунктам|одним списком"], ["видно, откуда взята каждая цитата", "номер[а-яё]* строк|строк[а-яё]* выгрузк|ссылк[а-яё]* на строк|ссылк[а-яё]* на отзыв|откуда взят|откуда цитат"], ["сказано, что числа и цитаты сверяются с выгрузкой", "сверю|сверить|сверя|сличу|перепровер|провер[юя] кажд"]], "3": [["вывод без опоры в данных помечен как предположение", "как предположен|помет[а-яё]{0,3} предположен|предположен[а-яё]*, а не|не как факт|без опоры в дан я: короткое название проблемы; сколько отзывов из 412 про неё говорят и какую это долю; три дословные цитаты без правок; номера строк выгрузки, откуда взята каждая цитата; среднюю оценку по этим строкам.\n\nОтдельно собери строки, которые не легли ни в одну проблему, и напиши, сколько их.\n\nНомера строк нужны обязательно: до встречи во вторник я сверю по ним каждое число и каждую цитату с выгрузкой, а команда будет выбирать по этой сводке три доработки на ноябрь."}, "D": {"set": "design", "key": "D", "comp": "D", "level": 2, "kind": "промпт", "title": "Холл приёмной комиссии за два дня", "timer": 13, "situation": "Холл первого корпуса переделывают под приёмную комиссию: 20 июня стартует приём документов. В холле должны работать шесть консультантов, сидеть очередь на 20 человек, стоять стойка навигации и стеллаж с брошюрами. Концепт смотрит проректор по развитию в среду, через два дня.\n\nСлужба эксплуатации отдала обмеры и поэтажный план с грифом «для внутреннего пользования»: холл 12,4 × 7,8 м, потолок 4,2 м, окна по длинной стене от 0,9 до 3,6 м. Две несущие колонны 0,6 × 0,6 м стоят в 4,1 м от входа. В торце пожарный выход, перед ним 1,4 м прохода. Витраж с гербом университета ректорат оставляет на месте.\n\nХозслужба закупает по перечню: светлый дуб, коммерческий линолеум серого тона, стекло, металл в графите; фирменный синий — только на акцентах по брендбуку.\n\nВы сняли холл на телефон и собрали белую модель по обмерам: ракурс от входа, высота камеры 1,6 м. Атмосферу хотите получить через ИИ поверх этого кадра. Модель, кадр и обмеры у вас на руках, до совещания два дня.", "ask": "Пришлите одним сообщением текст запроса к ИИ — тот самый, который отправите, и скажите, что к нему прикладываете. Сам запрос, а не описание порядка работы.", "ind": {"1": "Уровень 1 «по образцу»: запрос опирается на готовый пример или памятку площадки — «сделай зону приёмной комиссии, как в прошлом концепте». Названы помещение и назначение, иногда один материал. Габаритов, высоты потолка, колонн, пожарного прохода и витража в запросе нет: они остаются в обмерах. Исходный кадр либо не приложен, либо приложен без условия сохранить геометрию и ракурс. Поэтажный план наружу человек не отдаёт, а расхождение картинки с обмерами не правит сам, а несёт руководителю.", "2": "Уровень 2 «самостоятельно»: готового образца нет, запрос человек собирает сам, и по нему концепт может сложиться с первого раза. В запросе габариты холла и высота потолка числами; состав зоны — шесть мест консультантов, очередь на 20 человек, стойка навигации, стеллаж; материалы из перечня хозслужбы и правило по фирменному синему из брендбука; список того, что не двигается, — колонны, 1,4 м прохода у пожарного выхода, витраж с гербом. К запросу приложен собственный кадр белой модели или своё фото, а поэтажный план во внешний сервис не уходит: размеры перенесены в текст числами. Отдельным условием сказано, что геометрия, пропорции и ракурс не меняются и ИИ добавляет только свет, материалы и предметы. Отдельной строкой — что человек сам сверит результат с обмерами до показа проректору.", "3": "Уровень 3 «по ситуации»: сверх уровня 2 человек до результата называет признак, по которому вариант уходит в брак, — консоль или подвес без опоры, проход у пожарного выхода уже 1,4 м, мебель вне перечня закупки. Из этого признака вытекает порядок: сначала один пробный кадр и сверка, серия — после. Выбор между путями назван и обоснован сроком или ценой переделки: что отдаётся ИИ, а что человек собирает в модели сам, потому что до совещания два дня и переделка после показа стоит дороже пробного кадра. Сказано, какие кадры уходят проректору с пометкой «концепт, не для производства». Переросший уровень отдельно описывает, как это повторит коллега: копия сцены до запуска, зафиксированный ракурс, тестовый кадр перед серией."}, "criteria": ["Прислан текст запроса, который можно отправить как есть, и сказано, что к нему прикладывается", "В запросе габариты холла числами — 12,4 × 7,8 м — и высота потолка 4,2 м", "Перечислен состав зоны: шесть мест консультантов, очередь на 20 человек, стойка навигации, стеллаж с брошюрами", "Названы материалы из перечня хозслужбы и правило по фирменному синему из брендбука", "Перечислено, что не двигается: две колонны, 1,4 м прохода у пожарного выхода, витраж с гербом", "Есть условие не менять геометрию, пропорции и ракурс исходного кадра — ИИ добавляет только свет, материалы и предметы", "Названо, что человек сверит результат с обмерами до показа проректору", "Поэтажный план и обмеры во внешний сервис не загружаются: в запрос идёт собственный кадр модели или своё фото, размеры — числами в тексте"], "flags": ["Поэтажный план или скан помещения с грифом уходит во внешний сервис", "Габаритов в запросе нет — размеры заменены словами «просторный светлый холл»", "Не сказано, что геометрия и ракурс исходного кадра не меняются: ИИ перестраивает помещение по своему усмотрению", "Колонны, пожарный проход или витраж в запросе не упомянуты, хотя переносить их нельзя", "Материалы заданы вне перечня закупки или словами «современные, премиальные»", "Про сверку с обмерами до показа не сказано ничего: «посмотрю, что получится»", "Вместо текста запроса прислан порядок работы или рассуждение о подходе"], "why_kind": "Уровень 2 этой компетенции — собрать запрос на концепт пространства самому, без готового образца: габариты, материалы, список того, что не двигается, и условие не трогать геометрию и ракурс исходного кадра либо стоят в тексте запроса, либо их там нет. По рассказу о порядке работы это не видно — проверяется сам текст запроса и то, что к нему приложено.", "marks": {"1": [["названы помещение и назначение зоны", "холл|приёмн|приемн|зона ожидан|консультант"], ["поэтажный план наружу не уходит", "не загружа|не загружу|не прикладыва|не приложу|не отправля|не отправлю|не выгружа|не выгружу|не ухо|наружу не|внутренн"], ["назван исходник — свой кадр модели или фото", "бел[а-яё]* модел|по обмерам|фото|ракурс|кадр"]], "2": [["габариты холла и высота потолка числами", "(12,4|12\\.4|7,8|7\\.8)[\\s\\S]{0,400}(4,2|4\\.2)|(4,2|4\\.2)[\\s\\S]{0,400}(12,4|12\\.4|7,8|7\\.8)"], ["перечислено, что не двигается: колонны, пожарный проход, витраж", "колонн[\\s\\S]{0,300}(витраж|пожарн)|(витраж|пожарн)[\\s\\S]{0,300}колонн|витраж[\\s\\S]{0,300}пожарн|пожарн[\\s\\S]{0,300}витраж"], ["материалы из перечня закупки", "дуб(?![лр])|линолеум|графит"], ["состав зоны числами", "шесть мест|шесть рабочих|шесть консультант|шесть стол|6 мест|6 рабочих|6 консультант|6 стол|20 человек|двадцать человек|на 20"], ["геометрию, пропорции и ракурс не менять", "(геометри|ракурс|пропорц|перспектив)[\\s\\S]{0,60}(не мен|не измен|не трог|не перестра|не сдвига|сохран|без измен|фиксиру)|(не мен|не измен|не трог|не перестра|не сдвига|сохран|без измен|фиксиру)[\\s\\S]{0,60}(геометри|ракурс|пропорц|перспектив)|тот же ракурс|том же ракурс|этом же ракурс"], ["ИИ только добавляет свет и предметы, помещение не перестраивает", "добавля[а-яё]* только|добавь только|только добавля|только добавь|не перестра|не достраива|не переноси стен|стены не двига|новых стен не"], ["сверка результата с обмерами до показа", "сверю|сверя|сверит|сверьт|слич|провер[\\s\\S]{0,30}обмер|сопостав[\\s\\S]{0,30}обмер|сверк[а-яё]*[\\s\\S]{0,40}обмер|обмер[а-яё]*[\\s\\S]{0,40}сверк"]], "3": [["признак брака назван до результата", "браку|в брак|забраков|не приним|отклоня"], ["выбор между путями назван", "выбира[\\s\\S]{0,40}(между|из дв|вариант|путь|пути)|выбор[\\s\\S]{0,40}(между|из дв|вариант|путь|пути)|выберу[\\s\\S]{0,40}(из дв|один из|между|вариант)|сравн[\\s\\S]{0,40}вариант|альтернатив|два пути|двум[яа] путями|часть собер[\\s\\S]{0,40}сам|собер[\\s\\S]{0,40}сам[\\s\\S]{0,40}модел"], ["обоснование сроком или ценой переделки", "цена ошибки|дороже|не успе|переделк|до совещания два дня"], ["пометка «концепт, не для производства»", "не для производств|не производственн|концепт, не для|помет[кч][\\s\\S]{0,70}(концепт|производ)"], ["пробный кадр до серии", "пробн|тестов[а-яё]* кадр|сначала один кадр"]]}, "need": {"1": 2, "2": 5, "3": 2}, "stops": [["поэтажный план уходит во внешний сервис", "(^|[^е]\\s)(загружу|загружаю|залью|выгружу|выгружаю|скину|отправлю|отправляю|приложу|прикладываю|прикреплю|прикрепляю) (поэтажный план|план корпуса|план этажа|план и обмеры|обмеры|скан помещен)|(поэтажный план|план корпуса|план этажа|план и обмеры|обмеры|скан помещен)[а-яё]* (загружу|загружаю|залью|выгружу|выгружаю|скину|отправлю|отправляю|приложу|прикладываю|прикреплю|прикрепляю)"], ["результат берётся без сверки", "возьму как есть|беру как есть|отдам как есть|отдаю как есть|и так сойд|что получится, то и|сверять не буду|проверять не буду|ничего не сверя|без сверки отдам|без сверки покажу|(^|[^е]\\s)(отдам|отдаю|покажу|показываю|отправлю|отправляю) без (сверк|провер)"], ["размеры додуманы вместо обмеров", "размеры примерн|габариты примерн|размеры на глаз|размеры не важ|точные размеры не нужн|размеры прикину|прикину размеры"]], "sample": "Прикладываю свой кадр белой модели холла (ракурс от входа, камера 1,6 м) и фото, которое снял сам на телефон. Поэтажный план и обмеры службы эксплуатации не загружаю — размеры даю числами в тексте.\n\nЗадача: концепт зоны приёмной комиссии поверх приложенного кадра. Геометрию, пропорции и ракурс не менять — стены, колонны и окна остаются там, где они на модели; добавляй только свет, материалы, мебель и озеленение.\n\nПомещение: 12,4 × 7,8 м, потолок 4,2 м, окна по длинной стене от 0,9 до 3,6 м.\n\nЧто должно появиться в кадре: шесть рабочих мест консультантов с барьером, зона ожидания на 20 человек, стойка навигации у входа, стеллаж с брошюрами.\n\nНе двигается: две несущие колонны 0,6 × 0,6 м в 4,1 м от входа; проход 1,4 м у пожарного выхода в торце остаётся свободным; витраж с гербом на месте и не перекрывается мебелью.\n\nМатериалы только из перечня: светлый дуб, серый коммерческий линолеум, стекло, металл в графите. Фирменный синий — точечно, на акцентах по брендбуку.\n\nДай два кадра в этом же ракурсе: дневной и вечерний свет.\n\nПеред показом проректору сверяю результат с обмерами сам: положение колонн, ширину прохода у пожарного выхода, витраж."}, "B": {"set": "graphic", "key": "B", "comp": "B", "level": 2, "kind": "промпт", "title": "Семь слайдов для проректора", "timer": 12, "situation": "Через два дня проректор слушает итоги дня открытых дверей, презентацию собираете вы. Приёмная комиссия отдала справку: 1 840 посетителей против 1 310 год назад, 62% записались на технические направления, 410 человек оставили заявки, средняя оценка организации — 4,6 из 5. Презентация на 7 слайдов: на каждом нужен заголовок и два-три тезиса, и подписываете слайды вы. Справка — единственный источник этих цифр, в открытых материалах университета их нет. Число заявок комиссия обещала уточнить только к пятнице, то есть после защиты. Текстовые блоки вы хотите собрать через ИИ, справку к запросу приложить можете, вёрсткой займётесь отдельно.", "ask": "Пришлите одним сообщением текст запроса к ИИ — тот самый, который отправите. Сам запрос, а не описание порядка действий.", "ind": {"1": "Запрос в одну-две общие фразы вроде «напиши текст для презентации по итогам дня открытых дверей». Цифр из справки в запросе нет и справка не приложена, адресат не назван, формат не задан. Результат предполагается взять как есть, без упоминания сверки.", "2": "В запросе есть задача и адресат (презентация проректору), исходные цифры перенесены из справки или справка приложена как источник, задан формат (7 слайдов, заголовок и 2–3 тезиса), названо хотя бы одно ограничение (не добавлять данных, которых нет в справке), и отдельно сказано, что делать с неподтверждённым числом заявок и что сверить перед сдачей.", "3": "Сверх уровня 2: человек делит задачу — что отдаёт ИИ, а что пишет сам, и объясняет это ценой ошибки на защите. Просит вывод в форме, удобной для сверки (цифра рядом с источником или отдельный список использованных цифр), заказывает по два-три варианта заголовка под выбор и заранее называет признак, по которому вариант бракует."}, "criteria": ["Названы задача и адресат: для кого презентация и по какому поводу — не меньше одной фразы", "Все пять чисел из справки перенесены в запрос либо справка явно приложена как источник, а запрос ссылается на неё", "Задан формат результата: количество блоков (7) и структура одного блока (заголовок + 2–3 тезиса)", "Названо не меньше одного ограничения — например, не использовать данные вне справки или предельная длина тезиса", "Сказано, что делать с числом заявок, которое ещё не подтверждено: пометить, оставить место или не использовать", "Есть требование к проверке результата: сверить цифры и даты со справкой до сдачи", "Присланное — текст запроса, который можно отправить без переписывания"], "flags": ["В запросе цифры, которых нет в справке, или просьба «дополнить выводами» без опоры на данные", "Расчёт на то, что ИИ сам найдёт данные университета в интернете", "Неподтверждённое число заявок подаётся как окончательное", "В запрос попадают персональные данные посетителей или контакты из заявок", "Вместо текста запроса присланы рассуждения о подходе", "Требования заданы словами «сделай убедительно», «грамотно» без параметров", "Формат не задан вообще: ни количество блоков, ни структура слайда"], "why_kind": "Уровень 2 этой компетенции и есть умение собрать запрос из пяти частей и заложить в него сверку с источником — это видно только по тексту самого запроса.", "marks": {"1": [["названа задача — текст или тезисы для презентации", "презентац|слайд|тезис"], ["названа тема — итоги дня открытых дверей", "открыт(ых|ые) двер|итог|посетител|приём(ной|ная) комисс|приемн(ой|ая) комисс|справк"], ["это запрос к ИИ, а не рассказ о подходе", "нужн|напиши|собери|составь|сформулируй|подготов|сделай|дай |используй|возьми|помечай|оформи|распиши|выведи"]], "2": [["назван адресат — проректор", "проректор"], ["цифры из справки в запросе или справка приложена как источник", "1\\s*840|1\\s*310|62\\s*(%|процент)|4,6|(прилож|прилага|вложени)[\\s\\S]{0,40}справк|справк[\\s\\S]{0,40}(прилож|прилага|вложени)"], ["задан формат: 7 слайдов, заголовок и 2–3 тезиса", "(?=[\\s\\S]*(7\\s*слайд|семь слайд|7\\s*блок|семь блок))[\\s\\S]*(заголов[\\s\\S]{0,80}тезис|тезис[\\s\\S]{0,80}заголов)"], ["названо ограничение: только данные справки", "только (цифры|числа|данные|то, что) из|(цифр|числ|данн)[\\s\\S]{0,30}только из|только из (приложенн|справк|неё|нее|эт)|не добавля|ничего не добавля|ничего кроме справк|без собственных вывод|не выходи за справк|сверх (данных )?справк|другого источника нет|других источников нет|единственный источник"], ["сказано, что делать с неподтверждённым числом заявок", "(410|заявк)[\\s\\S]{0,90}(предварительн|уточн|не подтвержд|не окончательн|не финальн|могут измен|может измен)|(предварительн|уточн|не подтвержд|не окончательн|не финальн)[\\s\\S]{0,90}(410|заявк)|(помет|помеч|пиш|припиш|ставь|указыв)[\\s\\S]{0,40}предварительн"], ["названа сверка со справкой до сдачи", "сверю|сверить|сверя|сверк|слич|перепровер|(провер|пересчит)[\\s\\S]{0,40}справк|справк[\\s\\S]{0,40}(провер|пересчит)"], ["запрошен список использованных чисел с источником", "спис(ок|к)[\\s\\S]{0,40}(числ|цифр|дат)|перечисл[\\s\\S]{0,25}(числ|цифр|дат)|откуда[\\s\\S]{0,30}взят|с указанием источник|рядом[\\s\\S]{0,30}источник|стро(ку|ка|кой|ке) справк"]], "3": [["часть задачи оставлена себе, а не отдана ИИ", "сам напишу|напишу сам|пишу сам|соберу сам|сам собер|сам сформулиру|сам допишу|допишу сам|делаю сам|сделаю сам|оставляю себе|оставлю себе|не отдаю ИИ|ИИ не отдаю|отдаю ИИ только|ИИ отдаю только|тебе отдаю только"], ["решение объяснено ценой ошибки или сроком", "цена ошибк|цену ошибк|ценой ошибк|если ошиб[\\s\\S]{0,80}(защит|проректор|переделыв|не успе|поздно|подпис)|ошибк[\\s\\S]{0,50}(на защите|дорого|не успе|переделыв|поздно)|переделывать (будет )?некогда|некогда переделыв|второй попытки не будет|поправить (уже )?не успе|не успе[\\s\\S]{0,30}переделать|времени на переделку нет|на переделку (времени )?нет|риск[\\s\\S]{0,60}(защит|проректор|переделыв|срок|подпис)|два дня[\\s\\S]{0,40}(защит|срок)|срок[\\s\\S]{0,40}(два дня|не позволя)"], ["признак брака назван заранее", "браку|бракую|не приму|отклон|не беру вариант|сразу выбрасыва|снимаю вариант"]]}, "need": {"1": 2, "2": 6, "3": 2}, "stops": [["просит ИИ найти данные в интернете", "найди в интернете|поищи в интернете|погугли|возьми данные из интернета|найди актуальную статистик"], ["просит добавить цифры или выводы от себя", "добавь от себя|добавь свои (цифр|числ|данн|вывод)|дополни своими|придума(й|ешь) (цифр|числ|данн)|прикинь (цифр|числ)|оцени примерно"], ["берёт результат без сверки", "возьму как есть|беру как есть|вставлю как есть|отправлю как есть|сдам как есть|не буду сверя|сверять не буду|ничего не буду провер|не буду ничего провер|проверять ничего не буду|сразу отправлю проректору"], ["в запрос идут контакты посетителей", "контакты (посетител|абитуриент|из заявок)|телефоны (посетител|абитуриент)|фамилии посетител|выгрузк(у|а) заявок|заявки с контактами"]], "sample": "Нужны текстовые блоки для презентации на 7 слайдов: итоги дня открытых дверей. Через два дня презентацию слушает проректор, подписываю слайды я. Приложил справку приёмной комиссии — это единственный источник цифр, в открытых материалах университета их нет.\n\nДанные из справки: 1 840 посетителей против 1 310 год назад, 62% записались на технические направления, 410 заявок, средняя оценка организации 4,6 из 5.\n\nФормат: 7 слайдов, на каждом заголовок до 60 знаков и 2–3 тезиса по одной строке, тезис не длиннее 90 знаков.\n\nОграничения: используй только цифры из приложенной справки; не добавляй выводов, сравнений и прогнозов, которых в ней нет; в интернете данные университета не ищи. Число 410 заявок комиссия уточнит только в пятницу, то есть после защиты, — помечай его словом «предварительно» и не делай его главным тезисом слайда.\n\nПроверка: в конце выведи списком все числа и даты из текста, а напротив каждого — строку справки, откуда оно взято. Я сверю со справкой до сдачи."}, "G": {"set": "graphic", "key": "G", "comp": "G", "level": 2, "kind": "промпт", "title": "Три формата к шести вечера", "timer": 13, "situation": "Факультет дизайна проводит конференцию «Городские среды» 14 ноября, анонсы идут в соцсетях факультета. Вам нужны три фоновых изображения под анонс: пост 1080×1350, шапка сообщества 1600×400 и сторис 1080×1920. По брендбуку мероприятия работают два цвета — глубокий синий и песочный, из форм разрешены крупные дуги и плашки, людей и лиц в кадре нет, а заголовок верстается поверх изображения, то есть надписей на картинке быть не должно. Съёмки и покупки стоков в этот раз не будет, бюджет закрыт, остаётся генерация. Площадка требует пометку, если изображение сделано ИИ. Файлы ждут в SMM сегодня к 18:00, у вас три часа.", "ask": "Пришлите одним сообщением текст запроса в генератор изображений — тот, который отправите, вместе с тем, что к нему приложите. Рассказ о порядке работы не нужен.", "ind": {"1": "Запрос в одну фразу общего вида: «фон для конференции по городской среде в синем». Сцена не описана, соотношение и размеры не заданы, про серию и про три формата ничего нет, брендбук и пометка не упомянуты. Предполагается взять первый результат.", "2": "В запросе описана сцена (не меньше трёх элементов кадра и чего в кадре быть не должно), названы оба цвета брендбука и разрешённые формы, заданы все три формата с размером или соотношением, есть условие единой серии — что повторяется в трёх изображениях, и указана свободная зона под заголовок. Отдельно сказано, что перед передачей в SMM нужно сверить результат с брендбуком и поставить пометку об ИИ.", "3": "Сверх уровня 2: заранее назван признак, по которому вариант уходит в брак, и запрос рассчитан на несколько вариантов с выбором по этому признаку. Серия закрепляется так, чтобы её повторил коллега по описанию — через опорное изображение или зафиксированное описание стиля. Отдельно сказано, какой из трёх форматов генерацией закрывать не стоит, и почему — со ссылкой на цену ошибки или
