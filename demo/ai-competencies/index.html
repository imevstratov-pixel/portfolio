него, не перекладывать вину, без оправданий", "не (обеща|обвин|переклад|упомин|дава|оправд|гарант|назыв)|без |только|никаких"], ["Что проверить перед отправкой: даты и обязательства, которые письмо берёт на нас", "провер|свер|уточн|пометь|отметь|выдел|обязательств|перечисл"]], "good": "Уважаемая Елена Викторовна! Сдача курса адаптации переносится с 14 на 28 ноября: видеосъёмка модулей 7–12 завершилась на две недели позже плана. Модули 1–6 готовы, доступ к ним откроем 14 ноября, чтобы вы могли начать приёмку. Готова обсудить детали на созвоне в удобное для вас время. — Для вашей проверки перед отправкой: письмо берёт на нас два обязательства — доступ к модулям 1–6 с 14.11 и сдачу 28.11; подтвердите обе даты у подрядчика.", "poor": "Уважаемый заказчик! К сожалению, сроки проекта переносятся по независящим от нас причинам. Приносим извинения и гарантируем, что подобное не повторится. Уточните, пожалуйста: кому адресовано письмо, какая новая дата, что уже готово и чего в письме обещать не стоит?"}, "P07": {"type": "c", "q": "Заказчик прислал ТЗ на портал корпоративного обучения — 60 страниц. ИИ в корпоративном чате сделал резюме на две страницы, противоречий не отметил. Листая документ, вы случайно увидели: по п. 3.2 вход только через единую учётную запись университета, а по п. 7.5 слушатели компаний-партнёров регистрируются по e-mail и паролю. Завтра оценка работ с командой. Что делаете?", "opts": [{"t": "Беру резюме ИИ в основу оценки как есть: расхождение касается одной функции, с ним разберёмся уже на этапе разработки, а сдвигать оценку из-за него не стоит.", "g": 1, "fb": "Способ входа определяет архитектуру портала, и выяснять его на этапе разработки — значит переделывать. К тому же одно пропущенное противоречие подсказывает, что могут быть и другие. До оценки стоит проверить документ адресным запросом и задать вопросы заказчику."}, {"t": "Выбираю толкование сам: единая учётная запись надёжнее, значит, п. 7.5 — недосмотр заказчика. Закладываю в оценку вход по п. 3.2 и иду дальше по резюме.", "g": 2, "fb": "Противоречие замечено и не потеряно — это уже полдела. Но что важнее заказчику, знает только он: возможно, партнёры без учётной записи университета — ключевая аудитория портала. Добавьте вопрос заказчику и проверку остального документа."}, {"t": "Записываю найденное расхождение, отправляю заказчику вопрос по п. 3.2 и 7.5, а остальное резюме ИИ принимаю: в целом оно совпадает с тем, что я успел просмотреть.", "g": 3, "fb": "Вопрос заказчику — верный ход. Не хватает одного шага: резюме не ищет противоречий, пока об этом не попросили, и на 60 страницах их может быть несколько. Попросите ИИ адресно сопоставить требования между разделами и сверьте находки по тексту."}, {"t": "Даю ИИ адресную задачу: найти пары пунктов, которые расходятся, с номерами и цитатами. Сверяю находки по тексту ТЗ и до оценки отправляю заказчику список вопросов.", "g": 5, "fb": "Резюме отвечает на вопрос «о чём документ», а противоречия находятся отдельным запросом — по парам пунктов с номерами. Сверка по тексту отсеивает ложные находки, а список вопросов до оценки бережёт команду от переделок."}], "why": "потому|так как|противореч|расхожд|пункт|заказчик|вопрос|оценк|провер|свер|други[ехм]|резюме|переделк|архитектур"}, "C01": {"type": "m", "q": "Вы готовите письмо клиенту и хотите отшлифовать формулировки во внешнем ИИ-сервисе (не в ИИ-помощнике CRM и не в корпоративном ИИ-чате). Перед вами пять элементов карточки клиента. Отметьте те, которые можно туда отправить.", "opts": [{"t": "ФИО клиента и номер его мобильного телефона", "ok": false}, {"t": "Название программы и цена с официального сайта", "ok": true}, {"t": "Серия и номер паспорта из анкеты для договора", "ok": false}, {"t": "Суть возражения без имени: «дорого, сравнивает с другим вузом»", "ok": true}, {"t": "График платежей клиента и сумма его задолженности", "ok": false}], "ok_fb": "Верно: наружу уходит публичная информация и обезличенная суть ситуации. Всё, что указывает на конкретного человека, остаётся в CRM.", "fb": "Во внешний сервис можно отправить то, что и так опубликовано (программа, цена с сайта), и обезличенную суть: возражение без имени и контактов. ФИО, телефон, паспортные данные и платежи клиента обрабатываются только в ИИ-помощнике CRM или в корпоративном ИИ-чате. В письме клиенту его имя и условия появятся уже после — вы добавите их сами."}, "C02": {"type": "j", "multi": true, "q": "ИИ-консультант ведёт первую линию в чате с абитуриентами круглосуточно. Перед вами четыре ситуации из вчерашних диалогов. В каких из них разговор должен перейти к менеджеру? Отметьте всё подходящее.", "opts": [{"t": "В час ночи абитуриент спрашивает сроки приёма и перечень документов", "ok": false}, {"t": "Клиент просит рассрочку на 18 месяцев вместо стандартных 10", "ok": true}, {"t": "Клиентка пишет, что потеряла работу и хочет расторгнуть договор", "ok": true}, {"t": "Клиент уточняет длительность программы и формат занятий", "ok": false}], "why_q": "Почему именно эти ситуации остаются за человеком? Одной-двумя фразами.", "kw": [["решение и обязательства от имени компании", "обязательств|решени|услови|полномоч|обеща|исключен|договор|рассрочк|согласов"], ["нестандартный случай, которого нет в правилах", "нестандарт|индивидуальн|не по (скрипт|шаблон|правил)|сложн|особ[ыоае]|вне (скрипт|правил|стандарт)"], ["эмоции и сложная жизненная ситуация", "эмоц|расстро|пережива|сочувств|эмпат|человеческ|довери|жив[ыо]|поддерж|жизнен"], ["ответственность за последствия несёт человек", "ответствен|отвеча|последств|риск"]], "need": 2, "ok_fb": "Граница проведена точно, и названо, на чём она держится.", "fb": "Справочные вопросы — сроки, документы, формат занятий — ИИ-консультант закрывает сам в любое время суток. За человеком остаётся то, где нужно решение от имени компании (условия вне стандарта) и где клиенту трудно: расторжение договора из-за потери работы требует и внимания, и полномочий."}, "C04": {"type": "p", "q": "Вчера вечером ИИ-консультант 15 минут переписывался с Игорем: бакалавриат «Информационные системы», заочно, после колледжа. Стоимость Игорь уже знает, а его последний вопрос — зачтут ли дисциплины колледжа, чтобы учиться быстрее, — передан вам. Лог диалога лежит в карточке клиента. Напишите запрос ИИ-помощнику в CRM, чтобы получить ваше первое сообщение Игорю.", "checks": [["Задача: первое сообщение, которое продолжает разговор с места остановки", "сообщен|реплик|продолж|первы[йеа] (фраз|слов)|подхват|с того места|остановил"], ["Исходные материалы: лог диалога ИИ-консультанта в карточке", "лог|диалог|консультант|переписк|карточк|истори|crm|чат"], ["Формат: короткое сообщение, тон, канал", "коротк|кратк|предложен|тон|дружелюб|вежлив|мессенджер|формат|абзац|на «?вы"], ["Ограничения: не переспрашивать известное, не обещать того, чего нет в правилах", "не (переспраш|спрашив|задава|повтор|обеща|додум|придум|выдум|гарант)|без |только (из|по|то|факт)|уже (знает|известн|обсужд|назыв)"], ["Что проверить: условия перезачёта и факты из лога перед отправкой", "провер|свер|уточн|пометь|отметь|актуальн|выдел"]], "good": "«Игорь, здравствуйте! Это Мария, менеджер приёмной кампании. Вчера вы спрашивали про зачёт дисциплин колледжа — отвечаю: да, после профильного колледжа часть дисциплин перезачитывается, и срок обучения может сократиться. Пришлите, пожалуйста, фото приложения к диплому — посмотрим, что именно зачтут в вашем случае». Пометка для вас: срок сокращения я не называл — в логе его нет, сверьте с правилами перезачёта перед отправкой.", "poor": "«Здравствуйте! Меня зовут Мария, я менеджер университета. Подскажите, пожалуйста, какая программа вас интересует и какое у вас образование?» Чтобы продолжить с того места, где остановился диалог, уточните: откуда взять историю общения, на какой вопрос клиента отвечаем и каким должно быть сообщение?"}, "C05": {"type": "p", "q": "Компания «ТехноЛайн» хочет обучить 25 руководителей по программе «Управление проектами» (72 часа). В карточке сделки в CRM есть вводные: цена 38 000 ₽ за человека, скидка 10% для групп от 20 человек, желаемый старт — 10 ноября, контакт — директор по персоналу. Напишите запрос ИИ-помощнику в CRM, чтобы получить черновик коммерческого предложения.", "checks": [["Суть: коммерческое предложение на обучение группы", "кп|коммерческ|предложени|оффер"], ["Исходные материалы и адресат: карточка сделки, компания, кому пишем", "карточк|crm|сделк|компани|технолайн|директор|персонал|hr|вводн"], ["Формат: структура, объём, тон", "структур|раздел|страниц|объ[её]м|формат|таблиц|тон|делов|блок|пункт|коротк|кратк"], ["Ограничения: только цены и условия из карточки, никаких обещаний сверх них", "не (обеща|додум|придум|выдум|добавл|гарант|предлаг)|только (из|по|то|утвержд|факт|те)|без |прайс|строго по"], ["Что проверить: расчёт итоговой суммы, скидку, даты и обязательства", "провер|пересч|свер|уточн|пометь|отметь|выдел|покажи расч[её]т"]], "good": "Коммерческое предложение для «ТехноЛайн». Программа «Управление проектами», 72 часа, группа 25 человек, старт 10 ноября. Стоимость: 38 000 ₽ × 25 = 950 000 ₽, скидка 10% для групп от 20 человек — 95 000 ₽, итого 855 000 ₽. Что входит: занятия, материалы, итоговая аттестация, удостоверение. Для вашей проверки: пересчитайте итог; старт 10 ноября указан как желание клиента — подтвердите дату в расписании; срок действия предложения в карточке не задан — впишите сами.", "poor": "Предлагаем вашей компании качественное обучение руководителей по выгодной цене с гарантией результата и индивидуальным подходом. Чтобы предложение было предметным, уточните: откуда взять цену и скидку, сколько человек в группе, кому адресовано КП и какие условия в нём обещать нельзя?"}, "C06": {"type": "j", "multi": false, "q": "Утро, 9:30. ИИ в CRM расставил вашим лидам баллы приоритета и показывает, из чего каждый сложился. С кого начнёте день?", "opts": [{"t": "Сергей, 94 балла: заявка на MBA пять недель назад, высокий чек, четыре недозвона подряд", "ok": false}, {"t": "Анна, 89 баллов: заявка вчера, дважды открыла письмо с договором, просила набрать до 12:00", "ok": true}, {"t": "Дмитрий, 71 балл: спрашивал у ИИ-консультанта расписание, заявку и телефон не оставил", "ok": false}, {"t": "Ольга, 45 баллов: училась у нас в прошлом году, месяц назад смотрела страницу магистратуры", "ok": false}], "why_q": "Почему начинаете с этого лида? Сошлитесь на то, из чего сложился балл. Одной-двумя фразами.", "kw": [["свежая активность клиента", "свеж|вчера|недавн|активн|открыва|открыл|письм|горяч|т[её]пл"], ["договорённость о времени звонка", "до 12|до двенадцат|договор[её]нн|просил|жд[её]т|врем[яе]|обеща|окно"], ["смотрю, из чего сложился балл, а не только на число", "балл|оценк|основан|сигнал|признак|фактор|сложил|из чего|обоснован"], ["у других сигналы слабее или устарели", "недозвон|устар|недел[ьи]|давно|стар[ыа]|не оставил|чек"]], "need": 2, "ok_fb": "Выбор опирается на приоритизацию и на понимание того, какие сигналы за ней стоят.", "fb": "Начать стоит с Анны. Балл — подсказка, а решает то, из чего он сложился: заявка вчера, дважды открытое письмо с договором и просьба позвонить до 12:00 — сигналы свежие и с конкретным окном. У Сергея балл выше за счёт чека, но заявке пять недель и четыре недозвона — его разумно набрать следом в другое время дня."}, "C08": {"type": "c", "q": "Вы презентуете программу бакалавриата отцу абитуриента. Он перебивает: «Подождите. У вуза есть госаккредитация? Сыну дадут отсрочку от армии?» ИИ-подсказчик в CRM выводит: «Вопрос вне сценария. Верните клиента к блоку „Преимущества программы“». Про аккредитацию вы знаете точно, про отсрочку на заочной форме — не уверены. Что делаете?", "opts": [{"t": "Следую подсказке и продолжаю презентацию: сценарий собран по сотням успешных звонков, а к вопросам клиента перейдём в конце разговора, в отведённом для них блоке.", "g": 1, "fb": "Для этого клиента аккредитация и отсрочка — условие, без которого остальное неважно. Пока вопрос висит, презентацию он не слышит. Подсказка не знает, что стоит за вопросом, — это видите вы. Стоит ответить сейчас и вернуться к сценарию после."}, {"t": "Говорю: «Хороший вопрос, вернусь к нему через пару минут», заканчиваю блок о преимуществах по подсказке и после этого отвечаю так, как помню.", "g": 2, "fb": "Вопрос не потерян — это плюс. Но клиент спросил о главном для себя и ждёт ответа сейчас, а ответ «как помню» про отсрочку может оказаться неточным. Ответьте сразу на то, что знаете, а по отсрочке пообещайте проверенный ответ сегодня."}, {"t": "Сразу отвечаю на оба вопроса: аккредитация есть, отсрочку, скорее всего, дадут. Клиент спокоен, и я возвращаюсь к сценарию с того же места.", "g": 3, "fb": "Отойти от сценария ради важного вопроса — верное решение. Уязвимое место — «скорее всего» про отсрочку: на заочной форме правила другие, и неточный ответ станет обещанием. Скажите то, что знаете точно, а остальное уточните и пришлите письменно."}, {"t": "Отвечаю сейчас: аккредитация есть, пришлю ссылку на реестр. Про отсрочку говорю, что уточню и напишу сегодня до 18:00. Затем возвращаюсь к сценарию.", "g": 5, "fb": "Сценарий — опора, а не рельсы: вопрос о главном для клиента важнее порядка блоков. Точный ответ там, где вы уверены, и срок с обещанием уточнить там, где нет, — так вы не берёте на университет лишних обязательств и сохраняете доверие."}], "why": "потому|так как|клиент|вопрос|важн|довери|скрипт|сценари|подсказ|точн|уточн|обеща|отсрочк|аккредитац|обязательств"}, "X01": {"type": "j", "multi": true, "q": "Недельный отчёт речевой аналитики по линии сервиса: 3 400 звонков, соблюдение скрипта — 87%, средняя оценка — 78 из 100, негативная тональность — в 12% звонков, средняя длительность — 6:40 (неделей раньше — 6:10). Чего из этих цифр понять нельзя? Отметьте всё подходящее.", "opts": [{"t": "Решён ли вопрос клиента по итогам разговора", "ok": true}, {"t": "Какая доля звонков прошла с отступлениями от скрипта", "ok": false}, {"t": "Что вызвало негатив: оператор, продукт или ожидание на линии", "ok": true}, {"t": "Были ли отступления от скрипта уместны в тех разговорах", "ok": true}, {"t": "Как изменилась средняя длительность звонка за неделю", "ok": false}], "why_q": "Почему этого не видно в отчёте и как это узнать? Одной-двумя фразами.", "kw": [["цифры показывают, что произошло, но не почему", "причин|почему|контекст|ситуац|за цифр|что стоит"], ["результат для клиента система не измеряет", "реш[её]н|результат|итог|помог|довол|удовлетвор|проблем[аыу] клиент"], ["уместность оценивает человек, система сверяет формальные признаки", "уместн|отступ|формальн|слов[ао]|фраз|скрипт|маркер"], ["нужно слушать звонки на выборке", "послуш|прослуш|выборк|вручн|человек|сам[иа]? звонк|расшифровк"]], "need": 2, "ok_fb": "Отмечено то, чего автоматическая оценка не видит, и названо, как это восполнить.", "fb": "Отчёт надёжно считает формальное: долю звонков по скрипту, длительность, тональность. Он не знает, решён ли вопрос клиента, что именно вызвало негатив и было ли отступление от скрипта уместным, — это видно только в самих разговорах. Поэтому цифры показывают, где искать, а ответ даёт прослушивание выборки."}, "X04": {"type": "c", "q": "ИИ разобрал 1 900 обращений за октябрь и дал вывод: «Жалобы выросли на 34% из-за нового тарифа „Гибкий“, введённого 1 октября». Финансовый директор предлагает вернуть прежний тариф, совещание в четверг. В том же месяце обновили личный кабинет слушателя. Что делаете?", "opts": [{"t": "Выношу вывод ИИ на совещание как есть: тариф ввели 1 октября, жалобы выросли в октябре — связь по датам очевидна, а разобрано почти две тысячи обращений.", "g": 1, "fb": "Совпадение по датам ещё не причина: в октябре обновили и личный кабинет. Если рост связан с ним, возврат тарифа обойдётся дорого и жалоб не убавит. До совещания стоит прочитать выборку реальных жалоб и посмотреть, о чём они."}, {"t": "Задаю тот же вопрос другой модели и повторяю запрос в новой формулировке. Если вывод о тарифе совпадёт во всех трёх случаях — считаю его подтверждённым.", "g": 2, "fb": "Желание перепроверить — верное. Но три ответа ИИ на одних данных — это одно мнение, повторённое трижды: модели одинаково принимают совпадение дат за причину. Проверка — это реальные обращения, прочитанные человеком."}, {"t": "Прошу ИИ показать десять жалоб, подтверждающих вывод о тарифе, читаю их сам. Если они действительно про тариф — иду с выводом и примерами на совещание.", "g": 3, "fb": "Читать сами обращения — правильный шаг. Но примеры, подобранные в поддержку вывода, всегда его подтвердят. Нужна случайная выборка жалоб октября: какая доля про тариф, какая — про личный кабинет, и как это выглядело в сентябре."}, {"t": "Беру случайную выборку из 150 октябрьских жалоб, читаю и размечаю причины, сравниваю доли с сентябрём и с датой обновления кабинета. С этим иду на совещание.", "g": 5, "fb": "Случайная выборка покажет, какая доля жалоб действительно про тариф, а какая — про кабинет или что-то третье. Сравнение с сентябрём отделяет рост от привычного фона. Решение о тарифе будет опираться на факты, а разбор ИИ останется тем, чем и должен быть, — гипотезой."}], "why": "потому|так как|выборк|случайн|причин|совпад|корреляц|кабинет|тариф|провер|реальн|обращен|жалоб|гипотез|решени|сентябр"}, "A04": {"type": "p", "q": "Вы попросили агента добавить маску телефона в форму заявки абитуриента (components/forms/ApplicationForm.vue). В диффе четыре файла: форма (+22 строки), её тесты (+3 теста), а ещё composables/useApi.ts — таймаут запросов поднят с 10 до 30 секунд — и package.json с обновлённым axios. Напишите агенту ответ: что принимаете, что нет и что сделать дальше.", "checks": [["Что принимаете: правки по задаче — маска телефона и её тесты", "маск|телефон|форм[аеуы]|applicationform|принима|оставь|оставля|по задаче"], ["Что вышло за пределы задачи: useApi.ts и package.json", "useapi|package|таймаут|тайм-аут|timeout|axios|зависимост|лишн|посторонн|два (других )?файла"], ["Что сделать: откатить лишнее или вынести в отдельную задачу", "откат|верн|убер|отмен|revert|отдельн|вынес|исключ"], ["Границы: только файлы задачи, остальное не трогать", "только|не (трога|меня|затраг|обновля|прав)|без |за предел|в рамках|границ"], ["Что показать или объяснить: новый дифф, прогон тестов, зачем менялся таймаут", "провер|покаж|прогон|запусти|перезапус|дифф|diff|объясн|поясн|зачем|почему"]], "good": "Принято: маска телефона в ApplicationForm.vue и 3 теста остаются. Правки в composables/useApi.ts и package.json откатил — к задаче они не относятся. Поясняю, откуда они взялись: при прогоне тестов один запрос к тестовому API отвалился по таймауту, и я поднял лимит с 10 до 30 секунд, а axios обновил «заодно». Таймаут общий для всего кабинета, поэтому такое решение лучше принимать отдельно — могу описать наблюдение в отдельной задаче. Новый дифф: 2 файла, +41 строка; линтер и 14 тестов формы зелёные.", "poor": "Уточните, пожалуйста, что именно не так: все четыре файла изменены в рамках одной сессии, тесты зелёные. Если часть правок нужно убрать — назовите файлы и скажите, откатить их совсем или вынести отдельно. Пока оставляю дифф как есть: и маску, и новый таймаут, и обновлённый axios."}, "A05": {"type": "p", "q": "В модуле оплаты есть функция calcTuitionDiscount() — 140 строк вложенных if, автора давно нет, а вам на следующей неделе добавлять в неё новую скидку. На функцию есть 6 тестов в tests/Payment/DiscountTest.php. Поставьте агенту задачу: отрефакторить функцию так, чтобы поведение не изменилось.", "checks": [["Что сделать: рефакторинг функции расчёта скидки", "рефактор|упрост|разбей|разби|раздел|вынес|читаем|перепис|refactor"], ["Где: функция, файл, существующие тесты", "calctuitiondiscount|функци|файл|модул|discounttest|tests|существующ|6 тест|шесть тест|php"], ["Критерий готовности: поведение то же, тесты зелёные до и после", "поведени|зел[её]н|проход|до и после|тот же результат|те же (значен|результат)|сначала (допиши|дополни|добавь|покрой)|характериз|покрыт|готов"], ["Границы: сигнатуру, логику и старые тесты не менять", "не (меня|трога|исправля|правь|добавля|удаля|переименов)|только|без |сигнатур|интерфейс|огранич"], ["Что проверить и показать: прогон тестов, дифф, найденные странности", "провер|прогон|запусти|покаж|дифф|diff|план|сообщи|отмет|пометь|странн|уточн|спроси"]], "good": "План: 1) функцию пока не трогаю — к 6 существующим тестам добавляю 9, которые фиксируют текущие результаты по всем веткам (льгота, оплата за год, второй ребёнок, их сочетания); все 15 зелёные на старом коде; 2) разбиваю calcTuitionDiscount() на 4 приватных метода, сигнатура и возвращаемые значения прежние; 3) прогоняю тесты — 15 зелёных, дифф в 2 файлах. Странность: льгота и оплата за год сейчас складываются до 55% — я это не исправлял, а зафиксировал тестом; решение за вами.", "poor": "Переписал calcTuitionDiscount() в современном стиле: стало 60 строк. Заодно поправил сложение скидок — оно выглядело неверным — и поменял порядок аргументов, поэтому 2 из 6 тестов пришлось изменить под новую логику. Если поведение должно было остаться прежним, уточните: что считать неизменным, можно ли трогать сигнатуру и старые тесты и как вы хотите убедиться, что результат тот же?"}, "A07": {"type": "c", "q": "Выгрузка заявок из Битрикс в CRM каждую ночь пишет в лог «Undefined index: region» — около 40 раз; у этих заявок в CRM пустой регион, и они не попадают ни к одному менеджеру. Агент предлагает патч: $row['region'] ?? '' — ошибка из лога исчезнет. Что делаете?", "opts": [{"t": "Принимаю патч: ошибка из лога уходит, выгрузка идёт без предупреждений, задачу можно закрывать", "g": 1, "fb": "Лог станет чистым, а 40 заявок за ночь по-прежнему уйдут в CRM без региона и не попадут к менеджерам — только теперь об этом ничто не напомнит. Стоит сначала выяснить, откуда приходят заявки без региона."}, {"t": "Нахожу с агентом заявки без региона, воспроизвожу на одной, выясняю, где теряется поле, — и чиню там", "g": 5, "fb": "Это отладка причины: воспроизвести, найти место, где пропадает регион, — например, новая форма лендинга его не передаёт — и чинить там. Патч с ?? может остаться как страховка, но уже вместе с записью в лог и понятным поведением."}, {"t": "Прошу агента назвать вероятные причины, выбираю самую правдоподобную и чиню по ней без воспроизведения", "g": 3, "fb": "Гипотезы агента — хороший вход, и вы смотрите глубже симптома. Не хватает шага проверки: без воспроизведения на реальной заявке правдоподобная причина может оказаться не той, и ошибка вернётся."}, {"t": "Принимаю патч, чтобы лог не засорялся, и завожу задачу: разобраться с пустым регионом после релиза", "g": 2, "fb": "Задача на разбор — полезная часть. Но до неё заявки продолжат теряться уже молча: стоит хотя бы оставить в логе запись с номером заявки, а лучше — потратить полчаса на воспроизведение сейчас."}], "why": "потому|так как|причин|симптом|воспроизв|источник|лог|заявк|регион|теря|маскир|скрыва|скрое|провер|гипотез"}, "A08": {"type": "c", "q": "Вы ревьюите PR коллеги: 340 строк, новый эндпоинт выдачи сканов документов студента. Агент оставил 12 замечаний одним списком: десять — про имена переменных, порядок импортов и комментарии, два — что эндпоинт не проверяет, чей документ запрашивают, и падает на студенте без загруженных файлов. Что делаете?", "opts": [{"t": "Пересылаю автору все 12 замечаний списком: агент уже всё нашёл, пусть коллега сам решит, что править", "g": 2, "fb": "Коллега получит дюжину равнозначных пунктов, и проверка доступа затеряется между импортами и комментариями. Расставить вес замечаний — работа ревьюера."}, {"t": "Проверяю оба дефекта по коду сам и отмечаю как блокирующие; стилистику свожу в один необязательный пункт", "g": 5, "fb": "Замечания агента — вход, а не вердикт: вы убедились, что дефекты настоящие, отделили их от стилистики и оставили решение за собой. Автор сразу видит, что чинить обязательно, а повторяющуюся стилистику можно отдать линтеру."}, {"t": "Оставляю автору только два замечания про доступ и падение, остальные удаляю — в код при этом не смотрю", "g": 3, "fb": "Важное верно отделено от стилистики. Не хватает собственной проверки: агент мог неточно описать дефект или пропустить третий — десять минут в коде эндпоинта это покажут."}, {"t": "Одобряю PR: агент в основном придирается к стилю, а автор опытный и наверняка всё предусмотрел сам", "g": 1, "fb": "Вместе со стилистикой отсеялись два дефекта, один из которых — доступ к чужим документам. Замечания стоит хотя бы разделить на «стиль» и «поведение» и второе проверить по коду."}], "why": "потому|так как|дефект|стил|блокир|доступ|безопасн|провер|решени|приорит|важн|баг|ответствен|чужи"}, "T03": {"type": "p", "q": "В модуле оплаты есть функция splitInstallment(amount, months) в utils/installment.ts: делит стоимость обучения на равные платежи в рублях, остаток от деления добавляет к последнему платежу; срок — от 2 до 12 месяцев, иначе ошибка. Напишите агенту запрос на автотесты (Vitest) — такие, чтобы они упали, если функцию сломают.", "checks": [["Что нужно: автотесты на функцию расчёта платежей", "тест|test|покр"], ["Исходные материалы: файл, правила расчёта, фреймворк", "installment|utils|файл|vitest|правил|требован|остат|месяц|рассроч|плат[её]ж|срок"], ["Формат: конкретные ожидаемые значения, обычные и граничные случаи", "ожида|конкретн|значени|гранич|краев|кейс|случа|expect|сумм|таблиц|негатив|позитив"], ["Ограничения: функцию не менять, ожидания брать из правил, а не из её вывода", "не (меня|трога|правь|подгоня|мок|бери|копир|исправля)|только|без |из требован|из правил|огранич"], ["Проверка осмысленности: сломать функцию и убедиться, что тесты падают", "слома|лома|мутац|упа[дс]|упал|пада|красн|провер|покаж|убеди"]], "good": "Написал 8 тестов в utils/installment.spec.ts, ожидаемые значения взял из правил, а не из вывода функции: 100 000 на 3 месяца → 33 333, 33 333, 33 334; сумма платежей всегда равна стоимости; сроки 2 и 12 работают, 1 и 13 дают ошибку. Саму функцию не менял. Проверка осмысленности: временно убрал добавление остатка — упали 3 теста; заменил границу 12 на 13 — упал 1; вернул код — все зелёные. Не покрыто: отрицательная и нулевая сумма — в правилах не сказано, что должно происходить, уточните у аналитика.", "poor": "Написал 3 теста: функция возвращает массив, длина массива равна months, вызов (100000, 3) не выбрасывает исключение. Все зелёные. Если нужны проверки сумм и границ срока, уточните: по каким правилам считать ожидаемые значения, куда уходит остаток, можно ли менять саму функцию и как вы хотите убедиться, что тесты ловят поломку?"}, "T04": {"type": "p", "q": "Тестируете анкету абитуриента перед приёмной кампанией. По ТЗ: ФИО — от 2 до 100 символов, кириллица, пробел и дефис; телефон — +7 и 10 цифр; дата рождения — ДД.ММ.ГГГГ, возраст от 14 лет. Напишите запрос к ИИ на набор тестовых данных с краевыми случаями, который вы потом прогоните на стенде.", "checks": [["Что нужно: тестовые данные и краевые случаи для анкеты", "данны|краев|гранич|набор|значени|кейс"], ["Поля и ограничения из ТЗ", "фио|телефон|дат[аыуе]|рожден|100|символ|кириллиц|дефис|\\+7|возраст|14|тз|требован"], ["Формат: таблица — поле, значение, что проверяет, ожидаемый результат", "таблиц|csv|столб|колон|ожида|формат|json|по каждому полю|спис"], ["Ограничения: данные выдуманные, без реальных людей", "выдуман|вымышл|синтетич|фиктивн|нереальн|не (использ|бери|подставля|добавля)|без |только|обезлич"], ["Что проверить: где ТЗ молчит, что сверить на стенде", "провер|уточн|отмет|пометь|не определ|не описан|неясн|спроси|стенд|свер|прогон|вопрос"]], "good": "Таблица из 34 строк: поле, значение, что проверяет, ожидание по ТЗ. ФИО: 1 символ (отказ), 2 и 100 (принять), 101 (отказ), «Анна-Мария», двойной пробел, латиница «Ivanov», буква ё, пробелы по краям. Телефон: +7 и 9/10/11 цифр, 8 вместо +7, скобки и дефисы. Дата: 29.02.2011, 31.04.2010, ровно 14 лет сегодня, 14 лет завтра, 00.00.0000. Все значения выдуманные. В ТЗ не сказано, считать ли ё кириллицей, убирать ли пробелы по краям и принимать ли апостроф (О'Коннор) — такие строки помечены «поведение не определено»: стоит уточнить у аналитика и посмотреть, что сделает стенд.", "poor": "Тестовые данные: Иванов Иван Иванович, +79991234567, 01.01.2000; Петрова Анна Сергеевна, +79997654321, 15.05.2005. Чтобы добавить краевые случаи, уточните: какие ограничения у полей по длине и формату, в каком виде нужен набор и нужно ли указывать, что форма должна ответить на каждое значение?"}, "R01": {"type": "m", "q": "Вы работаете над новым экраном оплаты в рассрочку — запуск через два месяца — и хотите быстрее получить идеи во внешнем ИИ-сервисе (не в контуре компании). Что из перечисленного можно туда загрузить? Отметьте всё подходящее.", "opts": [{"t": "Макет незапущенного экрана оплаты в рассрочку с условиями и ставками", "ok": false}, {"t": "Скриншот действующей страницы программы с общедоступного сайта", "ok": true}, {"t": "Запись юзабилити-сессии: лицо, голос и имя студента, экран кабинета", "ok": false}, {"t": "Описание задачи словами: «экран выбора графика платежей», без макетов", "ok": true}, {"t": "Выгрузку из Hotjar с адресами почты и действиями пользователей", "ok": false}], "ok_fb": "Верно: наружу уходит только то, что и так опубликовано, и описание задачи без макетов и данных.", "fb": "Во внешний сервис можно отдать то, что уже видно всем, — действующую страницу сайта — и словесное описание задачи без макетов и данных. Незапущенные экраны с условиями рассрочки, записи сессий со студентами и выгрузки с адресами почты остаются внутри: для них есть корпоративный ИИ-чат и инструменты в контуре компании."}, "R03": {"type": "p", "q": "На сайте переделывают каталог: 86 программ, фильтры по уровню, формату и стоимости; половина абитуриентов приходит с телефона. В команде спор — фильтры боковой панелью или строкой чипов над списком. Напишите запрос в v0 или Figma AI на два варианта компоновки, которые можно положить рядом и сравнить на встрече.", "checks": [["Какой экран и какой вопрос решаем", "каталог|программ|фильтр"], ["Кто пользователь и как он выбирает", "абитуриент|пользовател|телефон|мобильн|смартфон|сценари|выбира|ищет|родител|посетител"], ["Формат: два варианта, чем отличаются, какой экран и детализация", "два |2 вариант|оба вариант|панел|чип|вайрфрейм|чернов|375|десктоп|рядом|формат"], ["Ограничения: одинаковое содержимое, компоненты дизайн-системы, условные данные", "одинаков|те же|тех же|одни и те же|без |не (добавля|придум|меня|использ)|только|дизайн-систем|компонент|условн"], ["Что сравнить и вынести на обсуждение", "сравн|плюс|минус|критери|провер|уточн|вопрос|сильн|слаб|обсужд|компромисс|отлич"]], "good": "Собрал два варианта каталога — мобильный 375 px и десктоп 1440 px, на одних и тех же 8 условных карточках программ. Вариант А: фильтры в боковой панели, на телефоне открываются кнопкой «Фильтры» на весь экран. Вариант Б: чипы над списком, на телефоне прокручиваются горизонтально, «Стоимость» раскрывается ползунком. Карточки, типографика и компоненты одинаковые — отличается только расположение фильтров. К сравнению: в А на телефоне до результата 3 касания, в Б — одно; зато в Б при шести и более фильтрах чипы уходят за край. Вопрос к команде: сколько фильтров будет через год?", "poor": "Вот страница каталога: баннер с фотографией кампуса, карусель «Популярные программы» и сетка карточек с рейтингом. Второй вариант — то же самое в тёмной теме. Чтобы варианты можно было сравнивать по делу, уточните: кто пользователь и с какого устройства он приходит, чем именно варианты должны отличаться, что в них должно быть одинаковым и по каким признакам вы будете их сравнивать?"}, "R04": {"type": "p", "q": "В личном кабинете абитуриента делают экран загрузки документов: паспорт, аттестат, СНИЛС; файлы PDF или JPG до 10 МБ. Нужны тексты для трёх состояний — пустого, загрузки и ошибки. Напишите запрос к ИИ, чтобы получить тексты, которые можно ставить в макет.", "checks": [["Что нужно: тексты для состояний экрана", "текст|состоян|пуст|ошибк|загрузк|микрокоп"], ["Контекст: кто пользователь, какие документы и требования к файлам", "абитуриент|пользовател|паспорт|аттестат|снилс|pdf|jpg|10 ?мб|кабинет|поступа"], ["Формат: заголовок, пояснение, кнопка; длина; число вариантов", "заголов|кнопк|подпис|поясн|символ|знак|таблиц|вариант|коротк|длин|формат|строк"], ["Ограничения по тону и содержанию", "без |не (обвиня|пугай|использ|придум|пиши|добавля)|на «?вы|тон|спокойн|дружелюб|редполитик|только|прост"], ["Что проверить или уточнить: причины ошибок, длина строк", "провер|уточн|спроси|отмет|пометь|причин|помест|помеща|влез|вопрос|разработ"]], "good": "Таблица: состояние — заголовок (до 40 знаков) — пояснение (до 90) — кнопка. Пустое: «Загрузите документы» / «Паспорт, аттестат и СНИЛС — PDF или JPG до 10 МБ. Можно с телефона, фото подойдёт» / «Выбрать файл». Загрузка: «Загружаем аттестат…» / «Осталось около 10 секунд, страницу можно не закрывать». Ошибка — по причинам: файл больше 10 МБ, неподходящий формат, обрыв связи; в каждой — что случилось и что сделать, без кодов и без вины пользователя: «Файл больше 10 МБ. Сожмите его или сфотографируйте документ заново» / «Выбрать другой файл». Уточните у разработки, какие ещё ошибки возвращает сервер: для них сейчас стоит общий текст, я его пометил.", "poor": "Пустое состояние: «Нет данных». Загрузка: «Loading…». Ошибка: «Ошибка 413. Некорректный файл». Чтобы тексты подошли к макету, уточните: кто пользователь и что он загружает, какие бывают причины ошибок, сколько знаков помещается в заголовок и кнопку и каким тоном продукт говорит с человеком?"}, "R06": {"type": "c", "q": "Экран «Сравнение программ» на десктопе — таблица: до 4 программ в столбцах и 12 параметров в строках. 65% абитуриентов открывают сайт с телефона, и в 375 px таблица не помещается. Figma AI предложил адаптацию: та же таблица шрифтом 9 px с горизонтальной прокруткой. Что делаете?", "opts": [{"t": "Принимаю вариант Figma AI: все данные на месте, ничего не потеряно, а к прокрутке пользователи привыкнут", "g": 2, "fb": "Формально ничего не потеряно, но шрифт 9 px и прокрутка в две стороны на телефоне не читаются — сравнение перестаёт работать. Адаптация — это решение о том, что важно на маленьком экране, и принять его стоит вам."}, {"t": "Решаю, что важно с телефона: две программы рядом и 5 ключевых параметров, остальное — по кнопке; сверяю с продактом", "g": 5, "fb": "Вы упрощаете осознанно: сценарий с телефона — быстро сравнить стоимость, срок и формат, а полный список остаётся в одном касании. ИИ дальше пригодится, чтобы собрать этот вариант и проверить его на 360 и 414 px."}, {"t": "Убираю половину параметров, чтобы таблица влезла, — на свой вкус, без данных о том, что смотрят абитуриенты", "g": 3, "fb": "Решение упростить — верное направление. Чтобы оно было обоснованным, стоит опереться на данные о том, какие параметры сравнивают чаще, и согласовать с продактом, что уходит под кнопку, а не исчезает совсем."}, {"t": "Ставлю на телефоне заглушку «Сравнение удобнее открыть на компьютере», десктопную версию оставляю как есть", "g": 1, "fb": "С телефона приходят 65% абитуриентов — для них функция фактически исчезнет. Лучше оставить на маленьком экране сокращённое сравнение, чем не оставить никакого."}], "why": "потому|так как|важн|приорит|упрост|сценари|телефон|мобильн|чита|пользовател|абитуриент|данн|ключев|решени"}, "I01": {"type": "j", "multi": true, "q": "ИИ обобщил 250 ответов опроса о платформе; анкету показывали тем, кто прошёл курс до конца. Какие утверждения из его сводки нельзя нести команде, пока вы не проверили их по исходной выгрузке? Отметьте всё подходящее.", "opts": [{"t": "«Большинство студентов довольны платформой и готовы её рекомендовать»", "ok": true}, {"t": "«Как пишет один из студентов: „Я бы бросил учёбу, если бы не куратор Анна“»", "ok": true}, {"t": "«Жалобы на двойное списание при оплате единичны (3 ответа), их можно не учитывать»", "ok": true}, {"t": "«В сводку вошли 250 ответов, собранных в мае после окончания курса»", "ok": false}], "why_q": "Что именно может быть не так с отмеченными утверждениями? Одной-двумя фразами.", "kw": [["смещение выборки: отвечали только дошедшие до конца", "выборк|смещ|репрезент|только те|тольк[оа] (довольн|дошед|заверш)|дош[её]л|дошед|до конца|заверши|бросивш|ушедш|не все студент|не спрашивал"], ["цитата может быть выдумана или пересказана", "цитат|выдум|придум|дословн|пересказ|перефраз|галлюцин|нет в выгрузк|не найд|сочин"], ["редкий, но важный сигнал теряется при обобщении", "редк|единичн|теря|сглаж|усредн|списан|деньг|критичн|серь[её]зн|важн|три ответа|3 ответа"]], "need": 2, "ok_fb": "Отмечены все три утверждения, которые требуют проверки, и названо почему: выборка смещена, цитату нужно найти в выгрузке, а редкий сигнал может оказаться самым важным.", "fb": "Проверки требуют три утверждения. «Большинство довольны» — анкету видели только те, кто дошёл до конца курса; ушедших никто не спросил. Цитату нужно найти в выгрузке дословно: ИИ умеет сочинять правдоподобные. А три жалобы на двойное списание — редкий сигнал, который при обобщении теряется, хотя речь о деньгах. Сколько ответов и когда они собраны — это вводные, которые вы сами дали. В обосновании стоит назвать хотя бы две причины из трёх."}, "I03": {"type": "p", "q": "После первой сессии 23% студентов онлайн-бакалавриата перестают заходить на платформу. Гипотеза команды: они не понимают, что и когда сдавать дальше. На следующей неделе у вас 8 интервью по 30 минут с теми, кто перестал заходить. Напишите запрос к ИИ на гайд интервью.", "checks": [["Что нужно: гайд интервью", "гайд|интервью|вопрос|сценари"], ["Гипотеза и респонденты", "гипотез|отток|переста|брос|ушл|ушедш|студент|респондент|сесси|не понима|бакалавр"], ["Формат: 30 минут, блоки с таймингом, число вопросов", "30|минут|блок|тайминг|разогрев|структур|таблиц|\\d+ вопрос|част[иь]|формат"], ["Ограничения: открытые вопросы о прошлом опыте, без наводящих", "открыт|наводящ|не (подсказ|упомин|называ|спрашива|задава|использ)|без |прошл|опыт|последн[а-я]+ раз|только|нейтральн"], ["Что проверить: где вопросы подталкивают к гипотезе, что уточнить", "провер|уточн|отмет|пометь|подталк|пилот|спроси|альтернатив|опроверг|критик"]], "good": "Гайд на 30 минут, 4 блока: знакомство и контекст учёбы (5 мин), последняя неделя на платформе — «расскажите, как это было» (10 мин), момент, когда перестали заходить (10 мин), завершение (5 мин). 14 открытых вопросов о прошлом опыте, к каждому — уточняющие. Гипотезу про сроки сдачи респонденту не называю: о ней спрашиваю косвенно — «как вы узнавали, что делать дальше?». Добавил вопросы под альтернативные причины: работа, деньги, сложность программы — чтобы гипотезу можно было и опровергнуть. Два вопроса пометил как рискованные: могут подталкивать к ответу. Стоит прогнать гайд на одном пилотном интервью и сверить хронометраж.", "poor": "Вопросы для интервью: 1. Вам нравится наша платформа? 2. Согласны ли вы, что непонятно, что сдавать дальше? 3. Стали бы вы заходить чаще, если бы мы добавили календарь дедлайнов? Чтобы собрать полноценный гайд, уточните: с кем интервью, сколько времени на разговор, какую гипотезу проверяем и о чём спрашивать напрямую не стоит?"}, "I04": {"type": "c", "q": "Claude разобрал 400 отзывов о личном кабинете и в выводах пишет: «Главная проблема — запутанная навигация». Вы открыли приложенные цитаты: они про расписание, уведомления и оплату, про навигацию — ни одной. Через час презентация команде. Что делаете?", "opts": [{"t": "Несу вывод в презентацию как есть: ИИ прочитал все 400 отзывов, а я успел просмотреть только цитаты", "g": 1, "fb": "Вывод, под которым нет ни одной цитаты, пока остаётся правдоподобным предположением. Если команда возьмёт его в работу, квартал может уйти на навигацию, о которой студенты не писали. За час можно успеть поиск по выгрузке."}, {"t": "Ищу в выгрузке отзывы про навигацию и считаю их; в презентации разделяю подтверждённое и предположения", "g": 5, "fb": "Вывод проверяется на сырых данных: поиск по словам «найти», «меню», «где», подсчёт, пара дословных цитат. Что подтвердилось — идёт как факт с числом, остальное — как гипотеза, и команда видит разницу."}, {"t": "Спрашиваю ИИ, уверен ли он в выводе про навигацию; если подтвердит и объяснит — оставляю в презентации", "g": 2, "fb": "Сомнение верное, но ИИ подтвердит свой вывод тем же уверенным тоном. Проверка — это строки выгрузки, а не повторный вопрос: попросите номера отзывов про навигацию и откройте их сами."}, {"t": "Убираю из презентации все выводы ИИ и показываю только то, что успею за час перечитать вручную", "g": 3, "fb": "Непроверенное в презентацию не попадёт — это надёжно. Но вместе с ним теряются выводы, под которыми цитаты есть: достаточно проверить спорный пункт, а остальное оставить с числами и цитатами."}], "why": "потому|так как|цитат|данн|подтвержд|правдоподоб|провер|выгрузк|сыр|отзыв|гипотез|посчит|счита|факт"}, "I05": {"type": "c", "q": "Разбор отзывов дал шесть проблем личного кабинета с частотой: от расписания на телефоне (22%) до двойных списаний при оплате (2%). В спринт помещаются две. Завтра планирование, и ИИ уже предложил «взять две самые частые». Как готовитесь к обсуждению?", "opts": [{"t": "Прошу ИИ выбрать две проблемы и несу его выбор как итог анализа данных: так решение выглядит объективным", "g": 1, "fb": "Выбор ИИ — одно из мнений, а не итог: он не знает ни стоимости разработки, ни того, что двойное списание — это деньги и доверие студентов. Решает команда, а ваша часть — подготовить для решения основу."}, {"t": "По каждой проблеме готовлю с ИИ гипотезу причины и 1–2 решения с эффектом и трудозатратами, помечаю допущения", "g": 5, "fb": "Команда получает материал для разговора: шесть гипотез, варианты решений, оценки и честно помеченные допущения. С вашей рекомендацией двух проблем обсуждение пойдёт о критериях, а не о вкусах, — и решение останется за командой."}, {"t": "Беру две самые частые проблемы: частота — понятный критерий, а гипотезы и решения команда найдёт в спринте", "g": 3, "fb": "Частота — полезный критерий, но не единственный: списания у 2% могут весить больше, чем неудобство у 22%. Стоит добавить гипотезы о причинах и варианты решений — без них неясно, поместятся ли эти две проблемы в спринт."}, {"t": "Приношу команде все шесть проблем списком без подготовки: пусть на планировании вместе выберут любые две", "g": 2, "fb": "Решение за командой — это верно. Но без гипотез, вариантов решений и оценок планирование уйдёт на выяснение того, что можно было подготовить с ИИ за час до встречи."}], "why": "потому|так как|гипотез|вариант|команд|обсужд|эффект|трудозатрат|критери|частот|допущен|решени|влияни|риск|деньг"}, "G01": {"type": "m", "q": "Вы готовите визуалы к приёмной кампании и собираетесь работать во внешнем генераторе (Midjourney, Recraft). Что из перечисленного можно туда загрузить или вставить в запрос? Отметьте всё подходящее.", "opts": [{"t": "PDF брендбука университета: логотипы, сетка, правила вёрстки", "ok": false}, {"t": "Описание стиля словами: «белый фон, синий акцент, крупная геометрия»", "ok": true}, {"t": "Макет кампании «Приём-2027», которая стартует только через месяц", "ok": false}, {"t": "Иллюстрацию чужого автора с Behance с просьбой «сделай так же»", "ok": false}, {"t": "Свой набросок композиции от руки — без логотипа и без текстов", "ok": true}, {"t": "Фото студентов со съёмки Дня открытых дверей — чтобы заменить фон", "ok": false}], "ok_fb": "Верно: наружу уходят только описание стиля словами и собственные наброски без закрытых элементов.", "fb": "Во внешний генератор можно отдать то, что и так не закрыто и принадлежит вам: описание стиля словами и свой набросок без логотипа. Брендбук и незапущенные креативы — внутренние материалы, чужая иллюстрация — чужие права, а фото студентов — изображения людей, которые не давали согласия на загрузку в сторонний сервис."}, "G02": {"type": "j", "multi": true, "q": "Для наружной рекламы приёмной кампании вы сгенерировали в Midjourney иллюстрацию: студентка с ноутбуком на фоне города. Макет завтра уходит в печать — 200 афиш и баннер 3×6 м. Какие риски здесь реальны? Отметьте всё подходящее.", "opts": [{"t": "В картинке может оказаться узнаваемый чужой персонаж, логотип на вывеске или стиль конкретного автора", "ok": true}, {"t": "Условия сервиса на вашем тарифе могут не разрешать использовать изображения в коммерческой рекламе", "ok": true}, {"t": "Оттенки и характер графики могут разойтись с брендбуком, и афиша выпадет из общего ряда кампании", "ok": true}, {"t": "Сгенерированная картинка для печати не годится совсем: довести её до типографского размера невозможно", "ok": false}], "why_q": "Почему это проверяют до печати и кто за это отвечает? Одной-двумя фразами.", "kw": [["права: лицензия сервиса и чужие узнаваемые элементы", "права|прав на|правов|правообл|лиценз|коммерч|услови|чуж|автор|товарн|персонаж|претенз|суд"], ["соответствие брендбуку", "бренд|фирмен|стил|гайд|цвет|оттен|узнава"], ["цена вопроса после печати: тираж, перепечатка, снятие рекламы", "тираж|перепечат|печат|снять|снима|деньг|дорого|штраф|репутац|поздно"], ["отвечает дизайнер, а не генератор", "ответствен|отвеча|дизайнер|сам[аи]? |на мне|на нас|провер"]], "need": 2, "ok_fb": "Отмечены реальные риски и названо, почему их закрывают до печати: права и брендбук проверяет дизайнер, а после тиража любая находка стоит перепечатки.", "fb": "Реальных риска три: чужие узнаваемые элементы в картинке, условия тарифа сервиса и расхождение с брендбуком. Разрешение к ним не относится — изображение можно увеличить и доработать. В обосновании стоит назвать хотя бы два из четырёх: права и лицензия, брендбук, цена находки после печати, ответственность дизайнера за то, что ушло в тираж."}, "G04": {"type": "p", "q": "Бриф от студенческого офиса: афиша хакатона «Код города» 14–15 ноября, аудитория — студенты 1–2 курсов, носители — А3 и пост в VK. Стиль описываем словами: белый фон, синий акцент, крупная геометрия, без фотографий. К арт-директору нужно идти с тремя заметно разными вариантами. Напишите запрос в генератор (Recraft или Midjourney) и укажите, по каким критериям будете отбирать.", "checks": [["Что за визуал и для какого события", "афиш|хакатон|постер|плакат|визуал|иллюстрац|облож"], ["Бриф: аудитория, носители, стиль словами", "студент|аудитор|курс|a3|а3|vk|вк|пост|стил|син[иеяю]|бел|геометр|фирмен|бриф"], ["Формат: три варианта и чем они различаются", "три |трёх|трех|3 |вариант|концепц|отлича|разн|вертикал|пропорц|размер|формат"], ["Ограничения: чего на картинке быть не должно", "без |не (добавля|использ|рису|пиш|нужно|надо)|огранич|избега|никаких|исключ"], ["Критерии отбора и что проверить по результату", "критери|отбер|отбор|выбер|сравн|провер|читаем|считыва|место под|оцен|подход"]], "good": "Готово: три варианта в вертикальной пропорции А3. Первый — типографический: крупные синие скобки и курсор на белом, верхняя треть свободна под название. Второй — геометрия: сетка городских кварталов из синих блоков, место под текст слева. Третий — один крупный знак: синяя стрелка-маршрут через весь лист. Фотографий, надписей и логотипов нет. По вашим критериям: место под заголовок и дату есть во всех трёх; с трёх метров лучше всего считывается третий; второй при обрезке до квадрата под VK теряет правый край — могу перекомпоновать. Какой берём в доработку?", "poor": "Вот афиша на тему «хакатон»: тёмно-синий фон, неоновые линии, фото людей за ноутбуками и надпись «HACKATHON». Чтобы попасть в задачу, подскажите: для кого афиша и на каких носителях, какой стиль и цвета, сколько вариантов нужно и чем они должны различаться, чего на картинке быть не должно и по каким признакам вы будете выбирать лучший?"}, "G05": {"type": "j", "multi": true, "q": "По брендбуку: синий — #1D4ED8, шрифт заголовков — Raleway, логотип не перекрашивают и держат не ближе 60 px от края. Коллега собрал карточку 1080×1080 для VK на основе сгенерированной иллюстрации и просит посмотреть перед публикацией. Что здесь расходится с брендбуком? Отметьте всё подходящее.", "opts": [{"t": "Синие фигуры на иллюстрации — оттенок #4361EE, с фиолетовым подтоном", "ok": true}, {"t": "Заголовок «Магистратура: приём до 25 августа» набран шрифтом Montserrat", "ok": true}, {"t": "Логотип стоит в правом верхнем углу, в 12 px от края карточки", "ok": true}, {"t": "Фон карточки белый, иллюстрация занимает правую половину", "ok": false}, {"t": "Логотип в исходном синем цвете, пропорции не искажены", "ok": false}], "why_q": "Как вы это проверили бы и почему на глаз недостаточно? Одной-двумя фразами.", "kw": [["цвет сверяют по значению, а не на глаз", "цвет|оттен|hex|#|пипетк|син[иеяю]|код"], ["шрифт сверяют с заданным в брендбуке", "шрифт|гарнитур|типограф|inter|montserrat|начертан"], ["логотип: отступы и охранное поле меряют", "лого|отступ|охранн|кра[йяю]|px|пиксел|измер|линейк"], ["сверка идёт по брендбуку пункт за пунктом", "брендбук|гайд|сверя|сравн|чек-?лист|по пункт|правил"]], "need": 2, "ok_fb": "Найдены все три расхождения и названо, чем их ловят: значение цвета, название шрифта и отступ логотипа сверяют с брендбуком, а не оценивают на глаз.", "fb": "Расхождений три: оттенок синего (#4361EE вместо #1D4ED8), шрифт заголовка (Montserrat вместо Raleway) и логотип в 12 px от края при минимуме 60 px. Белый фон и логотип в исходном цвете брендбуку соответствуют. В обосновании стоит назвать хотя бы два способа проверки: цвет — пипеткой по коду, шрифт — по названию в макете, отступы — измерением, всё вместе — по пунктам брендбука."}, "G06": {"type": "c", "q": "Вторник. К пятнице отделу маркетинга нужно 40 карточек программ бакалавриата к старту приёма — каждая под три площадки: VK 1080×1080, Telegram 1280×720, сторис 1080×1920. Названия программ и даты лежат в таблице, фоновые иллюстрации вы генерируете по описанию стиля. Как организуете работу?", "opts": [{"t": "Генерирую и собираю каждую карточку отдельно, по очереди под каждую площадку — так надёжнее всего контролировать качество", "g": 2, "fb": "Контроль хороший, но это 120 ручных сборок — к пятнице такой объём не помещается, а единообразие между карточками держать трудно."}, {"t": "Собираю шаблон под три формата, данные из таблицы подставляю пакетно, фоны генерирую серией, затем просматриваю все выгрузки", "g": 5, "fb": "Один шаблон, пакетная подстановка и серия фонов по единому описанию дают повторяемый результат, а просмотр всех выгрузок оставляет качество за вами."}, {"t": "Делаю 40 карточек под VK вручную, а версии для Telegram и сторис получаю автоматическим ресайзом и отдаю без просмотра", "g": 1, "fb": "Ресайз квадрата в 9:16 и 16:9 почти всегда обрезает заголовок или логотип — без просмотра это уйдёт в публикацию."}, {"t": "Собираю шаблон и пакетно выгружаю всё за вечер, просматриваю первые пять карточек и, если они в порядке, отдаю весь пакет", "g": 3, "fb": "Подход верный, но сбои пакетной сборки обычно сидят в длинных названиях и нестандартных строках — первые пять их не покажут. Стоит просмотреть всё."}], "why": "потому|так как|шаблон|пакет|повтор|единообраз|провер|просмотр|срок|успе|формат|объ[её]м"}, "G07": {"type": "c", "q": "Руководитель программы «Архитектура среды» просит для лендинга «фото нашей новой мастерской»: ремонт закончили на прошлой неделе, съёмки ещё не было, лендинг запускают через четыре дня. «Сгенерируйте что-нибудь похожее, никто не отличит». Что делаете?", "opts": [{"t": "Генерирую реалистичный интерьер мастерской по описанию руководителя и ставлю на лендинг как фото нашего пространства", "g": 1, "fb": "Абитуриент придёт и увидит другое помещение. Изображение реального места, выданное за фото, — это обещание, которое университет не сможет подтвердить."}, {"t": "Объясняю, что реальное место показываем снимком: договариваюсь о съёмке за день, а генерацию предлагаю для фоновой графики", "g": 5, "fb": "Граница проведена точно: то, что абитуриент увидит своими глазами, снимают; генерация остаётся для иллюстраций и фонов, где она ничего не обещает."}, {"t": "Генерирую интерьер, но ставлю под изображением подпись «визуализация» — так мы никого не введём в заблуждение до съёмки", "g": 3, "fb": "Подпись делает это честнее, но визуализация всё равно не покажет настоящую мастерскую. При четырёх днях в запасе реальный снимок достижим и убедительнее."}, {"t": "Беру в фотобанке снимок похожей мастерской: это настоящая фотография, значит вопросов к достоверности не возникнет", "g": 2, "fb": "Фото настоящее, но помещение чужое — для абитуриента разницы с генерацией нет. Лучше показать свою мастерскую, пусть и снятую просто."}], "why": "потому|так как|реальн|настоящ|довер|обман|заблужд|ожидан|абитуриент|съ[её]мк|снима|сним|уместн|обеща"}, "K01": {"type": "j", "multi": true, "q": "У вас в работе шесть задач по осенней кампании, и есть агент (Claude Cowork) с доступом к рабочей папке и макетам. Какие задачи стоит отдать агенту, потому что он сэкономит время? Отметьте всё подходящее.", "opts": [{"t": "Переименовать 120 слоёв в макете лендинга по принятой в команде схеме", "ok": true}, {"t": "Выгрузить 24 баннера в трёх размерах и разложить файлы по папкам площадок", "ok": true}, {"t": "Собрать 15 референсов афиш образовательных событий со ссылками и пометками", "ok": true}, {"t": "Поправить кернинг в заголовке одной афиши перед отправкой в печать", "ok": false}, {"t": "Заменить дату «18 октября» на «25 октября» в одном готовом посте", "ok": false}, {"t": "Выбрать из трёх концепций ту, с которой идти на защиту к арт-директору", "ok": false}], "why_q": "По какому признаку вы отличаете задачу для агента от задачи, которую быстрее сделать самому? Одной-двумя фразами.", "kw": [["объём и повторяемость: много однотипных действий", "повтор|однотип|рутин|много|массов|пакет|десятк|сотн|объ[её]м|монотон"], ["есть понятное правило, которое можно описать", "правил|схем|шаблон|формал|ч[её]тк|критери|алгоритм|инструкц|описа"], ["разовую мелочь быстрее сделать руками, чем объяснять", "разов|единичн|мелк|мелоч|быстрее (рук|сам)|вручную|руками|дольше объясн|минут|секунд"], ["вкус и решение остаются за дизайнером", "вкус|решени|иде[яю]|смысл|творч|выбор|ответствен|насмотр|глаз"]], "need": 2, "ok_fb": "Отмечены задачи, где агент действительно экономит время, и назван признак: большой объём однотипных действий по понятному правилу.", "fb": "Агенту подходят три задачи: переименование 120 слоёв, выгрузка 24 баннеров в трёх размерах и подборка референсов — там много однотипных действий по правилу, которое легко описать. Кернинг в одном заголовке и замена одной даты быстрее делаются руками, чем ставится задача, а выбор концепции — решение дизайнера. В обосновании стоит назвать хотя бы два признака: объём и повторяемость, описываемое правило, разовая мелочь, вкус и решение."}, "K03": {"type": "p", "q": "Вам передали макет лендинга программы «Цифровой маркетинг» в Figma: 140 слоёв с именами вроде «Rectangle 47», «Group 12 copy 3», «Frame 2091», скрытые дубли. Завтра макет уходит верстальщику, которому нужны понятные имена и выгруженные иконки и иллюстрации. Поставьте агенту (Claude Cowork с доступом к файлу) задачу навести порядок и подготовить выгрузку.", "checks": [["Задача: привести в порядок слои и сделать выгрузку", "сло[йеёи]|переимен|порядок|структур|выгруз|экспорт|имена|назван"], ["С чем работать и для кого: файл, страница, верстальщик", "макет|файл|figma|фигм|лендинг|страниц|фрейм|верстальщик|разработчик|верстк"], ["Формат: схема имён, форматы и размеры выгрузки, папки", "схем|префикс|kebab|латиниц|вида |например|svg|png|webp|@2x|2x|папк|формат|секци"], ["Ограничения: что не менять и не удалять", "не (меняй|трогай|удаляй|сдвигай|двигай|изменяй|переноси|объединяй)|без (изменен|удален)|огранич|только |копи[июя]|дубликат"], ["Что показать для проверки: план, список изменений, спорные места", "провер|отч[её]т|список|покажи|сначала|план|уточн|спроси|сомн|спорн|не уда|перед тем"]], "good": "Работал в копии файла. Переименовал 131 слой по схеме «секция/элемент/состояние»: hero/title, hero/btn-primary, programs/card-01 и так далее; сгруппировал по шести секциям лендинга. Геометрию, стили и порядок наложения не менял. Девять слоёв оставил как есть и вынес в список: непонятно, к какой секции они относятся, и четыре скрытых дубля — удалять без вас не стал. Выгрузил 18 иконок в SVG и 6 иллюстраций в PNG @1x и @2x, папки icons и images, имена совпадают с именами слоёв. Посмотрите список спорных слоёв — и можно передавать верстальщику.", "poor": "Переименовал слои: Layer 1, Layer 2 … Layer 140, всё выгрузил в PNG одной папкой. Чтобы верстальщику было удобно, уточните, пожалуйста: по какой схеме называть слои, что именно выгружать и в каких форматах, можно ли удалять скрытые дубли и менять группировку и нужен ли вам список изменений перед тем, как я сохраню файл?"}, "K04": {"type": "p", "q": "Контент-план VK и Telegram на неделю 22–28 сентября лежит в таблице: восемь постов — три анонса вебинаров, дедлайн подачи документов в магистратуру, две истории выпускников, подборка программ и итоги Дня открытых дверей. Заголовки и даты согласованы, шаблон карточки 1080×1080 есть в Figma. Поставьте агенту (Claude Cowork) задачу собрать пакет карточек так, чтобы вам осталось отобрать лучшие.", "checks": [["Задача: карточки к постам недели из одного шаблона", "пост|карточ|шаблон|контент|публикац|визуал|пакет"], ["Исходные материалы: таблица плана, тексты, файл шаблона", "таблиц|план|заголов|текст|дат[ыау]|файл|figma|фигм|из шаблон|исходн|строк"], ["Формат: сколько вариантов на пост, размер, имена файлов", "вариант|по (два|две|три|2|3)|1080|размер|png|jpg|им[яе]н|назван|папк|формат|штук"], ["Ограничения: что в шаблоне и текстах не менять", "не (меняй|трогай|переписыв|сокращай|изменяй|двигай|добавля)|без (изменен|правок)|огранич|только |строго"], ["Что проверить и пометить: переносы, длинные заголовки, сомнения", "провер|перенос|не вле|не помещ|влез|длинн|пометь|отметь|покажи|список|уточн|критери|отбер|отбор"]], "good": "Собрал 16 карточек 1080×1080: по два варианта на каждый из восьми постов — с акцентом на заголовок и с акцентом на дату. Тексты взял из таблицы без правок, шрифты, цвета и положение логотипа из шаблона не менял. Файлы названы по дате и номеру варианта: 0922_webinar-marketing_v1.png и так далее. Обратите внимание на три места: заголовок «Итоги Дня открытых дверей: 1 400 гостей за один день» в варианте 1 идёт в четыре строки и подходит вплотную к полю; в истории выпускницы нет фото в папке — поставил заглушку; в посте про дедлайн в таблице две разные даты, 25 и 26 сентября, — взял первую и пометил. Остальные 13 карточек готовы к отбору.", "poor": "Сделал восемь картинок на тему образования. Чтобы собрать именно ваш пакет, подскажите: где лежат план публикаций и шаблон, брать ли заголовки и даты из таблицы дословно, сколько вариантов нужно на каждый пост и в каком размере, что в шаблоне нельзя менять и что пометить для вашей проверки — например, заголовки, которые не помещаются?"}, "K05": {"type": "c", "q": "Каждый понедельник вы собираете для отдела маркетинга выгрузку: 12 баннеров недели в четырёх размерах, имена файлов по схеме, папки по площадкам, архив в общий диск. Уходит около часа, шаги всегда одни и те же. Агент (Claude Cowork) у вас уже есть. Как поступите?", "opts": [{"t": "Продолжаю собирать руками: час в неделю — немного, зато я уверен в каждом файле и ничего не нужно настраивать и отлаживать", "g": 2, "fb": "Надёжно, но это около 50 часов в год на работу, где нет ни одного дизайнерского решения. Уверенность в файлах можно сохранить и при сборке агентом — проверкой."}, {"t": "Каждый понедельник заново объясняю агенту в чате, что и как выгрузить, и поправляю по ходу, если он понял задачу иначе", "g": 3, "fb": "Время уже экономится, но объяснение каждый раз немного разное — и результат тоже. Следующий шаг — записать шаги один раз."}, {"t": "Записываю шаги, схему имён и проверки как сценарий, сверяю прогон с прошлой ручной выгрузкой и дальше запускаю его, просматривая итог", "g": 5, "fb": "Сценарий записан один раз, проверен на известном результате, а итог вы по-прежнему просматриваете — рутина ушла, контроль остался."}, {"t": "Поручаю агенту раз и навсегда: пусть по понедельникам сам собирает архив и сразу кладёт в общий диск маркетинга без моего участия", "g": 1, "fb": "Сбои автоматики — не тот размер, старая версия баннера — маркетинг увидит раньше вас. Перед передачей нужен ваш просмотр."}], "why": "потому|так как|сценари|повтор|один раз|кажд|экономи|время|час|провер|сверя|контрол|просмотр|одинаков|стабильн"}, "K06": {"type": "c", "q": "Агент собрал и выгрузил 40 баннеров программ для приёмной кампании, через час пакет нужно отдать в отдел маркетинга. Вы открыли первые десять файлов — в трёх съехала типографика: длинное название программы вылезло за поле, в одном подменился шрифт. Что делаете?", "opts": [{"t": "Исправляю руками три найденных баннера и отправляю весь пакет: остальные файлы собраны тем же шаблоном, значит с ними всё в порядке", "g": 2, "fb": "Три из десяти — это закономерность, а не случайность: среди оставшихся тридцати, скорее всего, есть такие же. Их тоже стоит открыть."}, {"t": "Отправляю пакет как есть и предупреждаю, что возможны мелкие огрехи: 37 из 40 — хороший результат, правки маркетинг пришлёт списком", "g": 1, "fb": "Проверка перед передачей — часть вашей работы: заказчик не должен искать сбои автоматики за дизайнера."}, {"t": "Прошу агента самого перепроверить все 40 файлов на типографику и отправляю пакет, если в его отчёте замечаний не окажется", "g": 3, "fb": "Как первый проход годится, но агент не заметил эти сбои при сборке — его отчёт стоит дополнить своим просмотром всех файлов."}, {"t": "Просматриваю все 40, ищу общую причину — длинные названия, нет шрифта, — правлю шаблон, перевыгружаю затронутые файлы и сверяю их", "g": 5, "fb": "Найдена причина, а не только три симптома: просмотрено всё, правка внесена в шаблон, повторная выгрузка проверена — к заказчику уходит чистый пакет."}], "why": "потому|так как|причин|все |всех|остальн|провер|просмотр|шаблон|закономерн|системн|заказчик|повтор|типограф|шрифт"}, "V01": {"type": "j", "multi": true, "q": "Каждую неделю выходит рилс «Отзыв студента»: 30 секунд из интервью, собирается по шаблону в Remotion. Перед вами шесть элементов такого ролика. Какие из них можно задавать параметрами шаблона, а не монтировать руками? Отметьте всё подходящее.", "opts": [{"t": "Плашка с именем студента, названием программы и курсом в начале ролика", "ok": true}, {"t": "Выбор тридцати самых сильных секунд из восьмиминутного интервью", "ok": false}, {"t": "Субтитры из вычитанной расшифровки с таймкодами, в фирменном шрифте", "ok": true}, {"t": "Склейка в месте, где студент сбился и начал фразу заново с середины", "ok": false}, {"t": "Финальная плашка со ссылкой на программу и датой окончания приёма", "ok": true}, {"t": "Цветокоррекция кадра, который сняли против окна в пасмурный день", "ok": false}], "why_q": "По какому признаку вы отличили одно от другого? Одной-двумя фразами.", "kw": [["в шаблон уходит то, что подставляется как данные: тексты, имена, даты", "данны|подстав|текст|имя|имен|дат|параметр|переменн|пол[ея]|таблиц|заполн"], ["структура повторяется от ролика к ролику: то же место, тот же стиль", "повтор|одинаков|кажд|от ролика|из раза|типов|однотип|стандарт|то же|те же|одно и то же|правил|место"], ["ручным остаётся то, где нужен смысловой выбор или взгляд на картинку", "смысл|выбор|выбира|реш|на глаз|оцен|вкус|сужден|человек|вручную|руками|уникал|индивидуал|творч|содержан"]], "need": 2, "ok_fb": "Отмечено то, что подставляется как данные, и назван признак: повторяющаяся структура уходит в параметры, смысловой выбор и работа с картинкой остаются за вами.", "fb": "Параметрами задаются три элемента: плашка с именем и программой, субтитры из готовой расшифровки и финальная плашка со ссылкой и датой — это тексты, которые каждый раз встают в одно и то же место. Отбор сильного фрагмента, склейка на оговорке и цветокоррекция сложного кадра требуют смотреть материал и решать по смыслу — это ручной монтаж."}, "V03": {"type": "p", "q": "Ролик «5 причин выбрать магистратуру» на 30 секунд собран из шаблона в Remotion вертикальным, 9:16, для VK Клипов. К четвергу он же нужен квадратным 1:1 для ленты Telegram-канала и горизонтальным 16:9 для VK Видео. Тексты пяти титров и финальная плашка лежат в файле reasons.json. Напишите запрос ИИ-ассистенту, чтобы он выпустил ролик в трёх форматах из одного шаблона.", "checks": [["Что делаем: один ролик в трёх форматах из одного шаблона", "форматах|три (формат|верси|вариант)|тр[её]х|верси|сери|адаптир|под площадк|под кажд"], ["Исходники: готовый вертикальный ролик, шаблон, файл с текстами", "шаблон|remotion|json|исходн|готов|вертикальн|титр|данны|файл"], ["Форматы и площадки: соотношения сторон, размеры, длительность", "9:16|1:1|16:9|квадрат|горизонт|1080|1920|30 ?сек|секунд|vk|клип|telegram|телеграм|разрешен|площадк"], ["Ограничения: тексты, шрифты и порядок сцен не меняются", "без |не (меня|трога|сокраща|перепис|добавля)|только|огранич|шрифт|брендбук|фирмен|одинаков|те же|тот же"], ["Что проверить: титры не вылезают за кадр, безопасные зоны, превью", "провер|уточн|покажи|превью|помеща|влез|обрез|безопасн|читаем|перенос|край|кадр из"]], "good": "Вынес размер кадра в параметр шаблона и собрал три версии из одного reasons.json: 1080×1920 для VK Клипов, 1080×1080 для Telegram, 1920×1080 для VK Видео — все по 30 секунд, тексты, шрифты и порядок сцен одинаковые. В квадрате титр «Диплом без отрыва от работы» не помещался в две строки — уменьшил кегль на 4 пункта только для этого формата, текст не сокращал. В вертикальной версии нижняя плашка поднята над зоной интерфейса площадки. Приложил по одному кадру с самым длинным титром из каждой версии — посмотрите, всё ли читается.", "poor": "Могу пересобрать ролик, но мне не хватает данных. Уточните, пожалуйста: какие именно форматы и размеры нужны и для каких площадок, откуда брать тексты титров, можно ли менять кегль и переносы, если текст не помещается, или шаблон трогать нельзя? Без этого получится только растянутая копия вертикального ролика."}, "V04": {"type": "p", "q": "Ролик-отзыв на 40 секунд: студентка рассказывает о программе «Продуктовый менеджмент». Descript сделал расшифровку для субтитров, но в ней «магистра тура» вместо «магистратура», «эл эм эс» вместо «LMS», «кастом дев» вместо «CustDev» и «продуктовый менеджер» вместо названия программы. Напишите запрос к ИИ, чтобы получить выверенный текст субтитров, готовый к загрузке в ролик.", "checks": [["Что делаем: правим расшифровку для субтитров", "расшифровк|субтитр|транскрипт|текст ролика|титр"], ["Исходные материалы: текст расшифровки и список верных терминов", "термин|глоссари|словар|списо?к|назван|магистратур|lms|custdev|продуктовый менеджмент|прилага|ниже|вот текст"], ["Формат: SRT с таймкодами, длина строк", "srt|таймкод|тайминг|формат|строк|знак|символ|две строки|2 строки|секунд"], ["Ограничения: слова спикера не переписывать, таймкоды не сдвигать", "без |не (меня|перепис|трога|сдвига|добавля|улучша|сокраща)|только|огранич|дословн|как сказан|сохран"], ["Что проверить: сомнительные места пометить, правки показать списком", "провер|уточн|пометь|отметь|сомн|покажи|список (правок|исправлен)|выдели|неразборчив|не уверен|спроси"]], "good": "Исправил расшифровку по вашему списку терминов, 7 замен: «магистра тура» → «магистратура» (3 раза), «эл эм эс» → «LMS» (2), «кастом дев» → «CustDev», «продуктовый менеджер» → «Продуктовый менеджмент» в названии программы. Слова студентки и таймкоды не менял, формат — SRT, строки до 38 знаков, не больше двух на экран. Два места пометил [?]: на 00:21 слышно то ли «на втором модуле», то ли «на втором модеме», на 00:33 фамилия преподавателя — сверьте по звуку. Список правок с таймкодами приложил отдельно.", "poor": "Я отредактировал текст: убрал слова-паразиты, сделал фразы короче и выразительнее. Названия и термины оставил как в расшифровке — не уверен, какие из них верные. Уточните, пожалуйста: как правильно пишутся термины и название программы, в каком формате нужны субтитры и можно ли менять формулировки студентки?"}, "V05": {"type": "c", "q": "Шаблон анонса в Remotion сделан под вертикаль: 9:16, 15 секунд, титры по 3 секунды. Пришла задача: тот же анонс для экрана в холле кампуса — горизонтальный 16:9, 25 секунд, титры держатся по 5 секунд, потому что читают на ходу. Вертикальные анонсы по этому шаблону выходят каждую неделю. Что делаете?", "opts": [{"t": "Прошу ИИ-ассистента переписать шаблон под горизонталь прямо в рабочем файле, собираю ролик для холла и проверяю его на экране", "g": 3, "fb": "Ролик для холла получится, и вы его проверили — это хорошо. Но рабочий шаблон теперь горизонтальный, и в понедельник вертикальный анонс придётся восстанавливать. Стоит добавить: размер и тайминг выносятся в параметры, а вертикальная сборка проверяется после правки."}, {"t": "Прошу ИИ-ассистента вынести размер кадра и длительность титров в параметры — в копии шаблона; делаю тестовый рендер обоих форматов", "g": 5, "fb": "Шаблон начинает работать на обе задачи: формат и тайминг стали данными, а не кодом. Работа в копии и тестовый рендер вертикали показывают, что еженедельные анонсы не пострадали. Ассистент пишет правку, вы проверяете результат в обоих форматах."}, {"t": "Собираю вертикальный ролик как обычно, вписываю его в горизонтальный кадр с размытыми полями и замедляю до 25 секунд", "g": 2, "fb": "Быстро, но на экране в холле две трети площади займут размытые поля, титры останутся мелкими, а замедление сделает переходы вязкими. Шаблон стоит доработать под задачу: вынести размер и тайминг в параметры — ассистент справится с этим за один заход."}, {"t": "Прошу ИИ-ассистента поменять размер и тайминг, сборка проходит без сообщений в консоли — сразу отдаю файл на экран в холле", "g": 1, "fb": "Сборка без сообщений говорит только о том, что код запускается. Уехали ли титры за край, не наложилась ли плашка на заголовок, успевает ли текст прочитаться на ходу — видно только на просмотре. И стоит проверить, что вертикальная версия шаблона по-прежнему собирается."}], "why": "потому|так как|параметр|копи|слома|провер|рендер|вертикал|шаблон|повтор|риск|тайминг|кажд|недел|оба|обоих|просмотр|посмотр"}, "V06": {"type": "c", "q": "Рилс на 20 секунд об олимпиаде для школьников собран, публикация в VK Клипах через час. На мониторе всё выглядит хорошо. Открываете на телефоне: белые титры теряются на светлом фоне аудитории, кегль мелкий, нижнюю строку перекрывают кнопки площадки. Что делаете?", "opts": [{"t": "Публикую в срок: дата и ссылка продублированы в описании под роликом, а титры поправлю в следующем выпуске", "g": 1, "fb": "Описание под клипом открывают единицы, а ролик смотрят без звука и с телефона — дата олимпиады и ссылка до школьников не дойдут. Час до публикации — достаточно, чтобы поправить параметры титров и пересобрать ролик."}, {"t": "Увеличиваю кегль титров на глаз, пересобираю и публикую в срок — смотреть на телефоне второй раз уже некогда", "g": 3, "fb": "Направление верное: проблема исправляется в параметрах шаблона. Стоит добавить подложку под текст и поднять нижнюю строку из зоны кнопок, а потом ещё раз открыть ролик на телефоне — именно этот просмотр и нашёл проблему в первый раз."}, {"t": "Убираю титры совсем: закадровый голос и так всё рассказывает, а кадр без текста выглядит чище и современнее", "g": 2, "fb": "Кадр станет чище, но большинство смотрит клипы без звука — без титров ролик перестанет сообщать дату и условия олимпиады. Титры стоит сохранить и сделать читаемыми: кегль, подложка, безопасная зона."}, {"t": "Правлю параметры титров: кегль, тёмная подложка, отступ от нижней зоны; пересобираю, смотрю на телефоне, сверяю тайминги и брендбук", "g": 5, "fb": "Проблема решается там, где возникла, — в параметрах шаблона, и исправление останется для следующих роликов. Повторный просмотр на телефоне подтверждает результат, а заодно проверены тайминги и брендбук: ролик уходит в публикацию проверенным целиком."}], "why": "потому|так как|телефон|мобильн|без звука|чита|подложк|контраст|кегл|безопасн|зон|провер|просмотр|посмотр|брендбук|тайминг|риск|школьник|аудитор"}, "W01": {"type": "m", "q": "Вы собираете рекламный ролик приёмной кампании: он пойдёт в платное продвижение и на сайт университета. Четыре варианта, откуда взять сгенерированные вставки. Какие из них допустимы? Отметьте всё подходящее.", "opts": [{"t": "Фон из Adobe Firefly на корпоративной подписке: её условия разрешают коммерческое использование", "ok": true}, {"t": "Вставка с личного бесплатного тарифа видеогенератора: водяной знак сервиса обрезан кадрированием", "ok": false}, {"t": "Персонаж по запросу «в стиле студии Pixar»: получился узнаваемый герой известного мультфильма", "ok": false}, {"t": "Абстрактная анимация из Runway на оплаченном тарифе команды; условия лицензии сохранены в проекте", "ok": true}], "ok_fb": "Верно: в рекламу идёт то, что сделано на тарифе с правом коммерческого использования и не повторяет чужих персонажей, — а условия лицензии сохранены рядом с проектом.", "fb": "Допустимы два варианта: Firefly на корпоративной подписке и Runway на оплаченном тарифе команды — в обоих условия разрешают коммерческое использование, и это можно подтвердить. Бесплатные тарифы обычно дают право только на личное использование, и удаление водяного знака этого не меняет. Узнаваемый персонаж чужой студии остаётся чужим, даже если его нарисовала нейросеть: для рекламы стоит описать собственный образ, без имён студий и героев в запросе."}, "W03": {"type": "p", "q": "В ролике приёмной кампании есть 12 секунд закадрового текста: «Учитесь в своём ритме: лекции вечером и в записи, задания — когда удобно вам». Съёмки под этот фрагмент нет, нужна фоновая анимация, поверх которой встанут титры. Напишите запрос в Runway или Kling, чтобы получить три варианта фона и выбрать пригодный для монтажа.", "checks": [["Что генерируем: фоновая анимация под фрагмент ролика", "фон|анимац|вставк|подложк|футаж|видеоряд"], ["Смысл и стиль: о чём закадровый текст, цвета, характер графики", "закадр|текст|смысл|ритм|вечер|гибк|стил|цвет|син[иеяю]|#1d4ed8|фирмен|референс|образ|настроен|спокойн|минимал|абстракт|геометр"], ["Формат: три варианта, длительность, кадр, цикл", "три|3 вариант|вариант|12|секунд|16:9|9:16|1920|1080|горизонт|вертикал|цикл|зацикл|длительн|fps"], ["Ограничения: без текста, лиц и резких движений, место под титры", "без |не (добавля|использ|рису|отвлека|нужно|должн)|огранич|избега|никаких|исключ|место под|свободн|низк.. контраст"], ["По каким признакам отбирать: артефакты, мерцание, читаемость титров поверх", "провер|отбер|отбор|выбер|сравн|артефакт|мерца|дрожа|читаем|поверх|критери|пригодн|укажи|опиши"]], "good": "Сгенерировал три варианта по 12 секунд, 1920×1080, 24 кадра в секунду. А — медленный переход от тёплого вечернего света к утреннему, мягкие градиенты. Б — белый фон, синие (#1D4ED8) линии плавно складываются в циферблат и расходятся. В — размытые огни вечернего города с медленным сдвигом камеры. Текста, лиц и логотипов нет, центр и нижняя треть кадра спокойные — титры встанут поверх. По пригодности: в варианте В на 8-й секунде огни мерцают, под титрами это будет заметно; А и Б чистые, Б ближе к фирменному стилю. Могу перегенерировать В или продлить Б до бесшовного цикла.", "poor": "Вот анимация: студент с ноутбуком бежит по неоновому городу, вокруг летают часы и надписи «STUDY ANYTIME». Получился один вариант на 5 секунд. Чтобы попасть в задачу, уточните: о чём закадровый текст, в каком стиле и цветах фон, сколько вариантов и какой длительности нужно, будет ли поверх текст и чего в кадре быть не должно?"}, "Y01": {"type": "j", "multi": true, "q": "В плане видеопроизводства на месяц — четыре задачи с синтезом речи и генерацией видео. Для каких из них до начала работы нужно письменное согласие человека? Отметьте всё подходящее.", "opts": [{"t": "Клонировать голос преподавателя, чтобы доозвучить исправленную фразу в уже записанной лекции", "ok": true}, {"t": "Озвучить анонс вебинара стандартным голосом из библиотеки сервиса синтеза речи по его лицензии", "ok": false}, {"t": "Собрать в HeyGen говорящий аватар выпускницы по её фотографии и тексту письменного отзыва", "ok": true}, {"t": "Сгенерировать абстрактный фон без людей для заставки серии вебинаров в фирменных цветах", "ok": false}], "why_q": "Почему именно они — и что ещё стоит сделать при публикации таких роликов? Одной-двумя фразами.", "kw": [["голос и лицо принадлежат конкретному человеку", "голос|лиц[оа]|внешност|образ|изображен|реальн|конкретн|живо|человек|личност|биометр|персональн"], ["зритель услышит или увидит то, чего человек не говорил и не записывал", "не говорил|не произносил|не записыв|не снима|от (его|её|ее) имени|припис|подмен|поддел|дипфейк|довер|ввод|обман|репутац"], ["согласие оформляется заранее, а в ролике указывается, что фрагмент сгенерирован", "согласи|разрешен|письмен|подпис|договор|пометк|помет|указ|маркир|сгенерирован|синтезирован|источник|дисклеймер"]], "need": 2, "ok_fb": "Отмечены задачи, где используется голос и лицо реального человека, и названо, что с этим делать: согласие до начала работы и пометка о синтезе при публикации.", "fb": "Согласие нужно в двух задачах: клон голоса преподавателя и аватар выпускницы. В обеих зритель видит или слышит конкретного человека, который этого не произносил, — даже если исправлена одна фраза, а отзыв написан ею самой. Согласие оформляется письменно и до начала работы, а в ролике указывается, что фрагмент синтезирован. Библиотечный голос по лицензии сервиса и абстрактный фон ничьих прав на голос и изображение не затрагивают."}, "Y03": {"type": "p", "q": "Для вебинара «ИИ в работе методиста» готова статичная обложка 1920×1080: портрет спикера, заголовок, синие геометрические фигуры на светлом фоне — всё на отдельных слоях. Пока участники подключаются, на экране должна крутиться живая заставка: бесшовный цикл на 5 секунд. Напишите запрос в Runway или Luma Dream Machine, чтобы оживить обложку.", "checks": [["Что делаем: оживляем статичную обложку в зацикленную заставку", "ожив|анимир|анимац|цикл|зацикл|луп|loop|заставк|движен"], ["Исходник: обложка и её слои — что движется, что остаётся на месте", "обложк|макет|сло[йяие]|исходн|png|картинк|изображен|портрет|спикер|фигур|заголов|фон"], ["Формат: 5 секунд, размер кадра, бесшовный стык", "5 ?сек|пять сек|секунд|1920|1080|16:9|бесшовн|первый и последний|последний кадр|fps|кадров|mp4"], ["Ограничения: лицо, текст и логотип не искажаются, движение спокойное", "без |не (меня|трога|искажа|деформир|двига|добавля|анимир)|только|огранич|статичн|неподвижн|на месте|медленн|плавн|едва"], ["Что проверить: стык цикла, лицо спикера, читаемость заголовка", "провер|уточн|стык|шов|скач|рывок|искажен|артефакт|читаем|покажи|сравн|убедись"]], "good": "Собрал цикл на 5 секунд, 1920×1080, 30 кадров в секунду. Движутся только фон и фигуры: три синих круга медленно плывут по дуге с лёгким параллаксом, фон смещается на 2% и возвращается. Портрет спикера и заголовок статичны — взял их из ваших слоёв без генерации, поэтому лицо и буквы не изменились. Первый и последний кадр совпадают, на повторе стыка не видно — проверил на трёх проигрываниях подряд. Один нюанс: маленький круг на 3-й секунде проходит близко к заголовку; могу увести его траекторию ниже.", "poor": "Вот анимация обложки: камера резко наезжает на спикера, он поворачивает голову и улыбается, буквы заголовка разлетаются частицами. Длительность 4 секунды, в конце — затемнение. Чтобы получилась заставка под вашу задачу, уточните: что должно двигаться, а что оставаться на месте, нужен ли бесшовный повтор, какая длительность и можно ли менять лицо и текст?"}, "Y04": {"type": "p", "q": "Ролик о наборе на ДПО озвучивается синтезом речи в HeyGen. В закадровом тексте на 45 секунд — названия программ: «Data Science и машинное обучение», «UX/UI-дизайн», «MBA: управление в EdTech», «1С-аналитик». На пробном прогоне синтез прочитал «у-икс-у-и», а «MBA» — по-русски, «мба». Напишите запрос к ИИ, чтобы подготовить текст к озвучке так, чтобы названия звучали правильно.", "checks": [["Что делаем: готовим закадровый текст к синтезу речи", "озвуч|синтез|закадр|диктор|начитк|голос|произношен|произнос"], ["Исходные материалы: текст и список названий с верным звучанием", "назван|программ|термин|data science|ux|mba|1с|списо?к|словар|текст ниже|
