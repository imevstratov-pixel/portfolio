орму.", "levels": {"1": "Работает по правилу о материалах: тексты с персональными данными и закрытыми методиками во внешние сервисы не отправляет; спорный случай выносит руководителю", "2": "Готовит черновики заданий, оформляет лекции, адаптирует под уровень группы"}, "who_needs": "Нужна преподавателю.", "top_level": 2, "lines": [{"name": "Обращение с данными", "checks": "какие материалы не уходят во внешние сервисы и когда вопрос выносится руководителю"}, {"name": "Сборка материала", "checks": "собраны ли задания и лекции по программе курса и требованиям к оформлению"}, {"name": "Адаптация под группу", "checks": "подогнаны ли объяснение и глубина материала под уровень конкретной группы"}]}, {"id": 19, "code": "X", "name": "Аналитика клиентского опыта", "model_name": "ИИ в аналитике клиентского опыта", "layer": 3, "description": "Массивы обращений, речевая аналитика для контроля качества, сводки для решений.", "tagline": "Массивы обращений, речевая аналитика для контроля качества, сводки для решений.", "how_it_looks": "тысяча двести обращений за месяц превращаются в список причин с долями. Речевая аналитика показывает качество обслуживания по всей линии, а не по трём прослушанным звонкам. Перед управленческим решением выводы проверяются на выборке реальных обращений.", "levels": {"1": "Открывает автоматическую оценку разговора и сверяет её с записью по чек-листу отдела; оценку сам не меняет, а сообщает руководителю", "2": "Разбирает массивы обращений и выделяет повторяющиеся причины", "3": "Отличает системную проблему от единичного случая, проверяет выводы на выборке", "4": "Готовит сводки по проблемным зонам для управленческих решений"}, "who_needs": "Нужна директору по сервису.", "top_level": 4, "lines": [{"name": "Проверка результата", "checks": "сверка автоматической оценки и выводов ИИ с первоисточником и выборкой обращений"}, {"name": "Масштаб разбора", "checks": "отличает повторяющуюся причину и систему от единичного случая на массиве обращений"}, {"name": "Обращение с данными", "checks": ""}]}, {"id": 20, "code": "F", "name": "Правка и печать изображений", "model_name": "ИИ в доводке и выпуске визуала", "layer": 3, "description": "Убирает артефакты и правит изображение по инструкции, поднимает разрешение, готовит файл в печать по требованиям типографии.", "tagline": "Убирает артефакты и правит изображение по инструкции, поднимает разрешение, готовит файл в печать по требованиям типографии.", "how_it_looks": "сгенерированная изображение почти никогда не готова. Дизайнер убирает лишнее и расширяет фон под формат, находит шестой палец и поплывший логотип, поднимает разрешение под ролл-ап и при 100% проверяет, что апскейл не дорисовал деталей. Файл в печать готовит по требованиям типографии: dpi, профиль CMYK, вылеты. Перед сдачей делает обратный поиск по изображению: нет ли сходства с чужим персонажем или знаком.", "levels": {"1": "Проверяет изображение при 100% масштабе по списку типовых артефактов и отмечает найденное; результат показывает руководителю; что генерировать заново, сам не решает", "2": "Правит изображение по инструкции так, что правка не видна при 100%; единичные артефакты исправляет, вариант с артефактами в нескольких зонах бракует; готовит файл по требованиям типографии; проверяет сходство обратным поиском", "3": "Делает знак для айдентики: генерацию берёт как эскиз, перестраивает вручную и фиксирует свой вклад по этапам, чтобы знак можно было зарегистрировать", "4": "Пишет для команды стандарт приёмки: чек-лист артефактов, требования к исходникам, кто подписывает выпуск в печать"}, "who_needs": "Уровень для Middle: Графический дизайнер — 3, SMM-дизайнер — 2, Веб-дизайнер — 1, Средовой (3D) дизайнер — 1. Junior — на уровень ниже, Senior — выше.", "new_in_design_layer": true, "top_level": 4, "lines": [{"name": "Проверка результата", "checks": "находит артефакты при 100% и решает судьбу варианта"}, {"name": "Правка и печать", "checks": "незаметность правки и готовность файла к носителю и печати"}, {"name": "Обращение с данными", "checks": "сходство с чужим и авторский вклад в знак"}]}, {"id": 21, "code": "D", "name": "Визуализация пространств", "model_name": "ИИ в проектировании среды и 3D-визуализации", "layer": 3, "description": "Концепты пространств по фото площадки, рендер поверх своей модели, 3D-ассеты и текстуры, сверка с моделью и регламентом площадки до показа.", "tagline": "Концепты пространств по фото площадки, рендер поверх своей модели, 3D-ассеты и текстуры, сверка с моделью и регламентом площадки до показа.", "how_it_looks": "дизайнер собирает белую модель стенда по габаритам площадки и за час получает десяток вариантов атмосферы поверх своей геометрии, а не один рендер за ночь. Мебель и декор второго плана генерируются по фото, приводятся к масштабу и проверяются на лицензию тарифа. Перед показом заказчику изображение сверяют с моделью и регламентом площадки: ИИ часто рисует консоль без опоры и подвес, который никто не согласует.", "levels": {"1": "Проверяет ИИ-рендер по чек-листу площадки: опоры, масштаб, материалы; планы и сканы площадок наружу не загружает; расхождение с планом показывает руководителю", "2": "Делает концепт по фото и габаритам площадки с сохранёнными пропорциями, делает ИИ-рендер поверх своей модели без смены геометрии и ракурса, генерирует ассеты и текстуры и приводит их к масштабу, полигонажу и лицензии", "3": "Сверяет каждую ИИ-визуализацию с моделью и регламентом площадки до показа заказчику, собирает повторяемый конвейер от сцены до облёта и проверяет тестовые кадры", "4": "Пишет правила для команды и подрядчиков: разрешённые сервисы и тарифы, проверки перед показом, пометка «концепт, не для производства»"}, "who_needs": "Уровень для Middle: Средовой (3D) дизайнер — 2. Junior — на уровень ниже, Senior — выше.", "new_in_design_layer": true, "top_level": 4, "lines": [{"name": "Обращение с данными", "checks": "что из материалов заказчика можно загружать во внешние сервисы"}, {"name": "Постановка задачи ИИ", "checks": "как собран запрос на концепт пространства — назначение, габариты, сценарий, материалы"}, {"name": "Проверка результата", "checks": "сверена ли визуализация с моделью, планом и требованиями площадки до показа"}, {"name": "Сцена и ассеты", "checks": "приведены ли рендер, ассеты и текстуры к сцене — геометрия, масштаб, повторяемость конвейера"}]}], "atoms": [{"id": "B01", "comp": 1, "anchor": false, "level": 1, "type": "action", "text": "Пишет запрос по шаблону роли и заполняет все его поля: контекст, формат, ограничения, что проверить; нет нужного поля — шаблон не меняет, а спрашивает автора", "task_type": 2, "task_brief": "два запроса на одну задачу, выбрать рабочий + чем он лучше", "line": "Постановка задачи ИИ"}, {"id": "B02", "comp": 1, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, какие данные нельзя отправлять во внешние сервисы и где посмотреть список разрешённых инструментов; данные вне списка наружу не отправляет, а спрашивает руководителя", "task_type": 1, "task_brief": "пять материалов, отметить те, что можно отправить наружу", "line": "Обращение с данными"}, {"id": "B03", "comp": 1, "anchor": false, "level": 1, "type": "action", "text": "Проверяет ответ ИИ по чек-листу: сверяет каждую цифру, дату и ссылку с источником; расхождение сам не исправляет, а показывает руководителю", "task_type": 2, "task_brief": "ответ ИИ с ошибкой, отметить сомнительные места + что насторожило", "line": "Проверка результата"}, {"id": "B04", "comp": 1, "anchor": false, "level": 1, "type": "action", "text": "Берёт для работы с ИИ только задачи из списка своей роли и отдаёт результат на проверку; задачу вне списка не берёт, а спрашивает руководителя", "task_type": 2, "task_brief": "шесть задач роли, отметить подходящие + по какому признаку отбирали", "line": "Граница поручения"}, {"id": "B05", "comp": 1, "anchor": false, "level": 2, "type": "action", "text": "Пишет запрос под типовую задачу из пяти частей: контекст, от кого и кому, формат, ограничения, что проверить", "task_type": 3, "task_brief": "письмо коллегам о переносе дедлайна из-за задержки данных", "line": "Постановка задачи ИИ"}, {"id": "B06", "comp": 1, "anchor": false, "level": 2, "type": "action", "text": "Получив неполный ответ, одним-двумя уточнениями называет, чего не хватает, что добавить, в каком формате и что сверить с источником, — не начиная заново", "task_type": 3, "task_brief": "первый ответ намеренно неполный, оценивается уточнение", "line": "Постановка задачи ИИ"}, {"id": "B07", "comp": 1, "anchor": false, "level": 2, "type": "action", "text": "Перед использованием проверяет факты, цифры и ссылки и помечает, что проверено", "task_type": 3, "task_brief": "справка от ИИ с двумя цифрами и ссылкой, подготовить к отправке", "line": "Проверка результата"}, {"id": "B08", "comp": 1, "anchor": false, "level": 3, "type": "action", "text": "Находит в ответе фактическую ошибку и решает, что проверить руками, а что исправить в запросе", "task_type": 4, "task_brief": "ИИ уверенно указал приказ Минобрнауки № 1187 от 2025 года", "line": "Проверка результата"}, {"id": "B09", "comp": 1, "anchor": false, "level": 3, "type": "action", "text": "Решает, какую часть задачи отдавать ИИ, а какую нет, и объясняет решение через риск и цену ошибки", "task_type": 4, "task_brief": "задача с персональными данными, юридической частью и рутиной", "line": "Граница поручения"}, {"id": "B10", "comp": 1, "anchor": false, "level": 4, "type": "action", "text": "Составляет для коллег шаблон запроса и инструкцию по повторяющейся задаче подразделения", "task_type": 5, "task_brief": "инструкция «как готовить ежемесячный статус с ИИ»", "line": "Постановка задачи ИИ"}, {"id": "B11", "comp": 1, "anchor": false, "level": 4, "type": "knowledge", "text": "Формулирует для команды правила: что проверять, что не передавать, кто отвечает за результат", "task_type": 5, "task_brief": "правила работы с ИИ для команды из шести человек", "line": "Обращение с данными"}, {"id": "U01", "comp": 3, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, какие данные о сотрудниках нельзя передавать ИИ: оценки, зарплаты, персональные обстоятельства; данные вне списка ИИ не передаёт, а спрашивает руководителя", "task_type": 1, "task_brief": "пять типов данных о людях, отметить недопустимые", "line": "Обращение с данными"}, {"id": "U02", "comp": 3, "anchor": false, "level": 2, "type": "action", "text": "Готовит доклад наверх с ИИ и проверяет каждую цифру по источнику", "task_type": 3, "task_brief": "доклад по трём источникам с пометкой непроверенного", "line": "Проверка результата"}, {"id": "U03", "comp": 3, "anchor": false, "level": 2, "type": "action", "text": "Формулирует задачу подчинённому с критериями приёмки, сроком и ожидаемым результатом", "task_type": 3, "task_brief": "задача менеджеру «разобраться с оттоком в группе»", "line": "Постановка задачи ИИ"}, {"id": "U04", "comp": 3, "anchor": false, "level": 3, "type": "action", "text": "Разбирает варианты решения: плюсы, минусы, риски, сценарии — отличает разбор по существу от общих слов", "task_type": 4, "task_brief": "ИИ выдал двенадцать рисков, восемь шаблонные", "line": "Проверка результата"}, {"id": "U05", "comp": 3, "anchor": false, "level": 3, "type": "action", "text": "Готовит материалы для оценки сотрудников так, что решение остаётся за руководителем", "task_type": 4, "task_brief": "ИИ предлагает ранжировать команду по «эффективности»", "line": "Обращение с данными"}, {"id": "U06", "comp": 3, "anchor": false, "level": 4, "type": "action", "text": "Объясняет команде, где ИИ применим, а где решение за человеком, и закрепляет это правилами", "task_type": 5, "task_brief": "памятка команде о границах применения ИИ в решениях", "line": "Обращение с данными"}, {"id": "S01", "comp": 4, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, что из разговора с клиентом нельзя выносить за пределы системы и как хранятся записи; запись за пределы системы не выносит", "task_type": 1, "task_brief": "четыре ситуации с записью разговора, отметить допустимые", "line": "Обращение с данными"}, {"id": "S02", "comp": 4, "anchor": false, "level": 1, "type": "tool", "text": "Находит свой звонок в системе, открывает автоматический разбор и сверяет его с записью по чек-листу; расхождение не правит сам, а сообщает руководителю", "task_type": 1, "task_brief": "что входит в автоматический разбор звонка", "line": "Проверка результата"}, {"id": "S03", "comp": 4, "anchor": false, "level": 2, "type": "tool", "text": "Читает разбор — темы, возражения, соблюдение скрипта, оценка качества — и понимает, на что смотреть в первую очередь", "task_type": 2, "task_brief": "разбор с четырьмя замечаниями, с чего начать + почему", "line": "Проверка результата"}, {"id": "S04", "comp": 4, "anchor": false, "level": 2, "type": "action", "text": "Использует эталонные звонки коллег как образец и переносит конкретный приём в свой разговор", "task_type": 3, "task_brief": "фрагмент эталонного звонка, разбор приёма под свою ситуацию", "line": "Изменения в своей работе"}, {"id": "S05", "comp": 4, "anchor": false, "level": 3, "type": "action", "text": "Готовит выводы по своим звонкам к встрече с руководителем: что меняю и почему", "task_type": 3, "task_brief": "десять звонков за неделю, три вывода с проверкой по расшифровкам", "line": "Изменения в своей работе"}, {"id": "S06", "comp": 4, "anchor": false, "level": 3, "type": "action", "text": "Отличает системную ошибку в своей работе от случайного замечания системы", "task_type": 4, "task_brief": "система отметила нарушение скрипта там, где менеджер сознательно отошёл", "line": "Проверка результата"}, {"id": "P01", "comp": 5, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, какие проектные данные нельзя передавать наружу: бюджеты, условия договоров, персональные данные; данные вне списка наружу не передаёт и возвращает вопрос руководителю", "task_type": 1, "task_brief": "шесть фрагментов проектных документов, отметить допустимые", "line": "Обращение с данными"}, {"id": "P02", "comp": 5, "anchor": false, "level": 1, "type": "action", "text": "Готовит с ИИ черновик проектного документа из списка разрешённых и отдаёт на проверку; документ вне списка с ИИ не готовит, а спрашивает руководителя", "task_type": 2, "task_brief": "список из шести документов, отметить подходящие + почему", "line": "Сборка документа"}, {"id": "P03", "comp": 5, "anchor": false, "level": 2, "type": "action", "text": "Готовит черновик проектного документа: устав, план, протокол — по структуре и под конкретный проект", "task_type": 3, "task_brief": "устав проекта по вводным заказчика", "line": "Сборка документа"}, {"id": "P04", "comp": 5, "anchor": false, "level": 2, "type": "action", "text": "Собирает сводку статуса из разрозненных источников и проверяет даты и цифры по ним", "task_type": 3, "task_brief": "чат команды, таблица задач, два письма → статус-отчёт", "line": "Проверка результата"}, {"id": "P05", "comp": 5, "anchor": false, "level": 2, "type": "action", "text": "Готовит черновик письма заказчику и проверяет тон и обязательства перед отправкой", "task_type": 3, "task_brief": "письмо о переносе срока по вине подрядчика", "line": "Передача и правила"}, {"id": "P06", "comp": 5, "anchor": false, "level": 3, "type": "action", "text": "Анализирует риски проекта с ИИ и отличает реальные риски от шаблонных", "task_type": 4, "task_brief": "двенадцать рисков, восемь общих", "line": "Проверка результата"}, {"id": "P07", "comp": 5, "anchor": false, "level": 3, "type": "action", "text": "Разбирает большой документ требований: выделяет суть и находит противоречия", "task_type": 4, "task_brief": "в ТЗ два пункта противоречат друг другу, ИИ их не заметил", "line": "Проверка результата"}, {"id": "P08", "comp": 5, "anchor": false, "level": 4, "type": "action", "text": "Задаёт для проектного офиса стандарт подготовки документов с ИИ", "task_type": 5, "task_brief": "стандарт работы с ИИ-документами для офиса", "line": "Передача и правила"}, {"id": "C01", "comp": 6, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, какие данные клиента не выносятся во внешние сервисы и что можно использовать в письме; данные вне списка в письмо не переносит и возвращает вопрос руководителю", "task_type": 1, "task_brief": "пять элементов карточки клиента, отметить допустимые для внешнего ИИ", "line": "Обращение с данными"}, {"id": "C02", "comp": 6, "anchor": false, "level": 1, "type": "action", "text": "Отвечает клиенту по шаблонам из базы и передаёт разговор человеку по правилу: цена, сроки, претензия; ответ вне базы не сочиняет, а спрашивает руководителя", "task_type": 2, "task_brief": "четыре ситуации, отметить требующие человека + почему", "line": "Граница ИИ и человека"}, {"id": "C03", "comp": 6, "anchor": false, "level": 2, "type": "tool", "text": "Готовится к контакту по истории клиента и сводке из карточки, проверяя ключевые факты", "task_type": 3, "task_brief": "карточка клиента с историей → подготовка к звонку", "line": "Контекст клиента"}, {"id": "C04", "comp": 6, "anchor": false, "level": 2, "type": "tool", "text": "Просматривает диалог ИИ-консультанта и продолжает разговор с этой точки, не переспрашивая клиента", "task_type": 3, "task_brief": "лог диалога → первая реплика менеджера", "line": "Контекст клиента"}, {"id": "C05", "comp": 6, "anchor": false, "level": 2, "type": "action", "text": "Готовит письмо или коммерческое предложение с ИИ и проверяет цифры и обязательства", "task_type": 3, "task_brief": "КП по вводным из карточки", "line": "Проверка результата"}, {"id": "C06", "comp": 6, "anchor": false, "level": 2, "type": "tool", "text": "Использует приоритизацию лидов при планировании дня и понимает, чем она обоснована", "task_type": 2, "task_brief": "список лидов с приоритетами, с кого начать + почему", "line": "Контекст клиента"}, {"id": "C07", "comp": 6, "anchor": false, "level": 3, "type": "action", "text": "Фиксирует итог обращения сводкой от ИИ, сверяя её с содержанием разговора", "task_type": 4, "task_brief": "сводка приписала клиенту согласие, которого не было", "line": "Проверка результата"}, {"id": "C08", "comp": 6, "anchor": false, "level": 3, "type": "action", "text": "Решает, когда отойти от предложенного ИИ сценария разговора", "task_type": 4, "task_brief": "клиент задаёт вопрос вне скрипта, ИИ предлагает вернуть в скрипт", "line": "Граница ИИ и человека"}, {"id": "A01", "comp": 7, "anchor": true, "level": 1, "type": "action", "text": "Запускает агента по инструкции команды: отдельная ветка, один репозиторий, задача из списка; задачу вне списка не запускает, а спрашивает руководителя", "task_type": 2, "task_brief": "четыре последствия работы агента, отметить реальные + почему", "line": "Постановка задачи ИИ"}, {"id": "A02", "comp": 7, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, что нельзя передавать агенту: ключи, персональные данные, закрытый код вне контура; материал вне списка агенту не передаёт и оставляет во внутреннем контуре", "task_type": 1, "task_brief": "шесть артефактов проекта, отметить допустимые", "line": "Обращение с данными"}, {"id": "A03", "comp": 7, "anchor": false, "level": 2, "type": "action", "text": "Ставит агенту задачу с контекстом репозитория: что менять, где, по каким правилам, что не трогать, критерий готовности", "task_type": 3, "task_brief": "добавить валидацию email в форму регистрации на Vue", "line": "Постановка задачи ИИ"}, {"id": "A04", "comp": 7, "anchor": false, "level": 2, "type": "action", "text": "Читает сгенерированный код перед принятием и отклоняет изменения за пределами задачи", "task_type": 3, "task_brief": "дифф агента с лишним изменением", "line": "Проверка результата"}, {"id": "A05", "comp": 7, "anchor": false, "level": 2, "type": "tool", "text": "Использует агента для рефакторинга и покрытия тестами, сохраняя поведение", "task_type": 3, "task_brief": "фрагмент с тестами, рефакторинг без изменения поведения", "line": "Постановка задачи ИИ"}, {"id": "A06", "comp": 7, "anchor": false, "level": 3, "type": "action", "text": "Разбивает крупную задачу на шаги и ведёт агента по ним, контролируя промежуточные результаты", "task_type": 4, "task_brief": "агент переписал модуль авторизации: 14 файлов, 900 строк, тесты зелёные", "line": "Постановка задачи ИИ"}, {"id": "A07", "comp": 7, "anchor": false, "level": 3, "type": "action", "text": "Отлаживает с агентом: воспроизведение, логи, гипотезы — проверяет причину, а не симптом", "task_type": 4, "task_brief": "агент предлагает патч, убирающий ошибку из лога", "line": "Проверка результата"}, {"id": "A08", "comp": 7, "anchor": false, "level": 3, "type": "action", "text": "Проводит код-ревью с агентом: замечания как вход, решение за собой, отличает стилистику от дефекта", "task_type": 4, "task_brief": "двенадцать замечаний агента, из них два реальных дефекта", "line": "Проверка результата"}, {"id": "A09", "comp": 7, "anchor": false, "level": 4, "type": "action", "text": "Задаёт команде правила работы с агентами: доступы, ревью, границы автономии, ответственность", "task_type": 5, "task_brief": "правила работы с агентами для команды разработки", "line": "Обращение с данными"}, {"id": "T01", "comp": 8, "anchor": false, "level": 1, "type": "action", "text": "Сверяет каждый сгенерированный тест-кейс с пунктом требований по чек-листу и отмечает кейсы без источника; кейс без пункта не дописывает, а спрашивает руководителя", "task_type": 2, "task_brief": "тридцать кейсов от ИИ, отметить, что проверить + почему", "line": "Проверка результата"}, {"id": "T02", "comp": 8, "anchor": false, "level": 2, "type": "action", "text": "Генерирует тест-кейсы и проверяет полноту: позитивные, негативные, краевые", "task_type": 3, "task_brief": "фича «сброс пароля по email»", "line": "Постановка задачи ИИ"}, {"id": "T03", "comp": 8, "anchor": false, "level": 2, "type": "tool", "text": "Пишет автотесты с агентом и проверяет их осмысленность: тест падает при поломке функции", "task_type": 3, "task_brief": "функция + запрос на тесты, затем функцию ломают", "line": "Проверка результата"}, {"id": "T04", "comp": 8, "anchor": false, "level": 2, "type": "action", "text": "Готовит тестовые данные и краевые случаи с ИИ и проверяет их на реальном поведении системы", "task_type": 3, "task_brief": "данные для формы с ограничениями по длине и формату", "line": "Постановка задачи ИИ"}, {"id": "T05", "comp": 8, "anchor": false, "level": 3, "type": "action", "text": "Анализирует падение автотестов с ИИ и отличает баг в коде от проблемы теста", "task_type": 4, "task_brief": "лог падения, агент предлагает «починить тест»", "line": "Проверка результата"}, {"id": "T06", "comp": 8, "anchor": false, "level": 4, "type": "action", "text": "Выстраивает для команды процесс генерации и ревью тестов с ИИ", "task_type": 5, "task_brief": "регламент тестирования с ИИ", "line": "Проверка результата"}, {"id": "G01", "comp": 9, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, какие материалы нельзя загружать во внешние генераторы — брендбук, незапущенные креативы, чужие работы, — и какой контур для них разрешён; материал вне разрешённого контура не загружает, а спрашивает руководителя", "task_type": 1, "task_brief": "шесть материалов, отметить допустимые", "line": "Обращение с данными"}, {"id": "G02", "comp": 9, "anchor": false, "level": 1, "type": "action", "text": "Проверяет сгенерированное по памятке о правах: тариф, сходство с чужим знаком, лицо человека; при совпадении в публикацию не отдаёт, а спрашивает руководителя", "task_type": 2, "task_brief": "четыре риска использования генерации, отметить реальные + почему", "line": "Проверка результата"}, {"id": "G03", "comp": 9, "anchor": false, "level": 2, "type": "action", "text": "Формулирует запрос на концепт: стиль, композиция, образцы, ограничения — и дорабатывает его по результату", "task_type": 3, "task_brief": "обложка для анонса программы в фирменном стиле", "line": "Постановка задачи ИИ"}, {"id": "G04", "comp": 9, "anchor": false, "level": 2, "type": "action", "text": "Генерирует не меньше трёх разных вариантов и отбирает их по критериям, названным до генерации: пункты брифа, место под текст, носители", "task_type": 3, "task_brief": "три варианта визуала под один бриф", "line": "Проверка результата"}, {"id": "G05", "comp": 9, "anchor": false, "level": 2, "type": "tool", "text": "Проверяет результат на соответствие брендбуку: цвета, шрифты, отступы, логотип", "task_type": 2, "task_brief": "визуал с тремя нарушениями брендбука, отметить + почему", "line": "Проверка результата"}, {"id": "G06", "comp": 9, "anchor": false, "level": 3, "type": "tool", "text": "Собирает повторяемую цепочку — референс → генерация → правка → апскейл → форматы площадок — и передаёт её коллеге так, что она воспроизводится", "task_type": 4, "task_brief": "нужно 40 карточек под три площадки к пятнице", "line": "Постановка задачи ИИ"}, {"id": "G07", "comp": 9, "anchor": false, "level": 3, "type": "action", "text": "Решает, где хватит генерации, а где нужны ручной дизайн или съёмка: реальное место, людей и продукт компании показывает снимком", "task_type": 4, "task_brief": "клиент просит «фото нашего офиса» — генерировать или снимать", "line": "Проверка результата"}, {"id": "G08", "comp": 9, "anchor": false, "level": 4, "type": "action", "text": "Пишет для команды правила генерации: разрешённые сервисы и контур, проверки перед выпуском, где и как хранить досье генерации", "task_type": 5, "task_brief": "правила ИИ-генерации для дизайн-команды", "line": "Обращение с данными"}, {"id": "G09", "comp": 9, "anchor": false, "level": 1, "type": "action", "text": "Запускает генерацию на модели из таблицы отдела с её настройками по умолчанию; задачу, которой в таблице нет, не подбирает сам, а спрашивает руководителя", "task_type": 2, "task_brief": "пять задач дизайнера, подобрать класс инструмента + почему", "line": "Постановка задачи ИИ"}, {"id": "G10", "comp": 9, "anchor": false, "level": 2, "type": "action", "text": "Удерживает стиль, персонажа или продукт в серии изображений с помощью референсов — без «плавания» лица и фирменных деталей", "task_type": 3, "task_brief": "серия из шести карточек с одним героем-маскотом", "line": "Постановка задачи ИИ"}, {"id": "G11", "comp": 9, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, что изображение узнаваемого человека — и «похожего на» — нельзя генерировать и публиковать без согласия, и куда идти за согласием; без согласия работу не начинает и возвращает задачу автору брифа", "task_type": 1, "task_brief": "пять сценариев с людьми на визуале, отметить допустимые", "line": "Обращение с данными"}, {"id": "G12", "comp": 9, "anchor": false, "level": 2, "type": "action", "text": "Сохраняет досье генерации вместе с исходниками: инструмент и версия, запрос, референсы, доля ручной доработки", "task_type": 3, "task_brief": "сдать макет в архив так, чтобы через год можно было подтвердить права", "line": "Обращение с данными"}, {"id": "G13", "comp": 9, "anchor": false, "level": 2, "type": "action", "text": "Перед публикацией сверяется с правилом компании и требованиями площадки и ставит пометку «создано с ИИ» штатным инструментом там, где она требуется", "task_type": 4, "task_brief": "реалистичное «фото со дня открытых дверей» сгенерировано — публиковать как есть?", "line": "Обращение с данными"}, {"id": "G14", "comp": 9, "anchor": false, "level": 3, "type": "tool", "text": "Настраивает стилевую модель или набор референсов на разрешённых материалах компании — в разрешённом контуре — и проверяет, что серия проходит брендбук", "task_type": 4, "task_brief": "нужна серия из 60 иллюстраций в фирменной манере; брендбук наружу нельзя", "line": "Постановка задачи ИИ"}, {"id": "G15", "comp": 9, "anchor": false, "level": 3, "type": "action", "text": "Бракует варианты с приметами шаблонной генерации — глянцевая кожа, неон, места, которых нет у компании, — по заранее названным критериям и объясняет причину брака тому, кто заказал визуал", "task_type": 4, "task_brief": "три обложки, все «красивые»; одна уйдёт в рекламу приёмной кампании", "line": "Проверка результата"}, {"id": "K01", "comp": 10, "anchor": false, "level": 1, "type": "action", "text": "Выполняет задачи из списка рутины отдела по инструкции: переименование слоёв, выгрузки, подборки; задачу вне списка не автоматизирует, а приносит руководителю", "task_type": 2, "task_brief": "шесть задач дизайнера, отметить подходящие агенту + почему", "line": "Постановка задачи ИИ"}, {"id": "K02", "comp": 10, "anchor": false, "level": 2, "type": "action", "text": "Ставит ИИ задачу на подборку референсов по брифу: сколько, как сгруппировать, пояснение к каждому, ограничения брифа, проверка источников и прав", "task_type": 3, "task_brief": "подборка референсов под бриф с ограничениями", "line": "Постановка задачи ИИ"}, {"id": "K03", "comp": 10, "anchor": false, "level": 2, "type": "tool", "text": "Поручает ИИ переименовать слои по схеме имён и выгрузить файлы в нужных форматах и размерах: указывает, что не менять и не удалять, и просит список изменений на проверку", "task_type": 3, "task_brief": "макет с хаотичными именами слоёв → порядок и выгрузка", "line": "Постановка задачи ИИ"}, {"id": "K04", "comp": 10, "anchor": false, "level": 2, "type": "action", "text": "Собирает с ИИ пакет карточек по контент-плану из одного шаблона: задаёт число вариантов на пост, размер и имена файлов, запрещает менять тексты и шаблон, просит пометить спорные переносы", "task_type": 3, "task_brief": "восемь постов на неделю из одного шаблона", "line": "Постановка задачи ИИ"}, {"id": "K05", "comp": 10, "anchor": false, "level": 3, "type": "tool", "text": "Записывает повторяющуюся задачу как сценарий для ИИ — шаги, схема имён, проверки — и сверяет первый прогон с ручным результатом", "task_type": 4, "task_brief": "одна и та же сборка выгрузок занимает час каждую неделю", "line": "Постановка задачи ИИ"}, {"id": "K06", "comp": 10, "anchor": false, "level": 3, "type": "action", "text": "Перед передачей просматривает весь пакет от ИИ, а не выборку: находит общую причину сбоя (длинный текст, подмена шрифта), правит шаблон и перевыгружает затронутые файлы", "task_type": 4, "task_brief": "агент выгрузил 40 файлов, в трёх съехала типографика", "line": "Проверка результата"}, {"id": "K07", "comp": 10, "anchor": false, "level": 2, "type": "action", "text": "Собирает с ИИ связку «заголовок + текст + визуал» под публикацию так, что текст на изображении без ошибок и совпадает с подписью", "task_type": 3, "task_brief": "пост о старте набора — заголовок, подпись, обложка", "line": "Проверка результата"}, {"id": "K08", "comp": 10, "anchor": false, "level": 2, "type": "action", "text": "Собирает презентацию с ИИ по тезисам и приводит её к фирменному шаблону: сетка, шрифты, одна мысль на слайд; проверяет факты и цифры", "task_type": 3, "task_brief": "12 слайдов для декана по тезисам и таблице", "line": "Проверка результата"}, {"id": "K09", "comp": 10, "anchor": false, "level": 4, "type": "action", "text": "Ведёт для команды библиотеку сценариев и шаблонов: что автоматизировано, как запускать, кто проверяет результат", "task_type": 5, "task_brief": "библиотека сценариев дизайн-команды", "line": "Постановка задачи ИИ"}, {"id": "R01", "comp": 11, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, какие продуктовые материалы не выносятся во внешние инструменты: незапущенные экраны, данные пользователей; такие материалы во внешние инструменты не загружает", "task_type": 1, "task_brief": "пять материалов, отметить допустимые", "line": "Обращение с данными"}, {"id": "R02", "comp": 11, "anchor": false, "level": 2, "type": "action", "text": "Собирает интерактивный прототип экрана по описанию задачи и пользователя — на компонентах дизайн-системы", "task_type": 3, "task_brief": "экран «Мои курсы» в личном кабинете студента", "line": "Постановка задачи ИИ"}, {"id": "R03", "comp": 11, "anchor": false, "level": 2, "type": "action", "text": "Генерирует два варианта компоновки одного экрана, которые отличаются одним решением, чтобы положить их рядом и сравнить на встрече", "task_type": 3, "task_brief": "два варианта одного экрана под сравнение", "line": "Постановка задачи ИИ"}, {"id": "R04", "comp": 11, "anchor": false, "level": 2, "type": "action", "text": "Готовит тексты для состояний экрана — пустое, загрузка, ошибка: заголовок, пояснение и кнопка в пределах заданной длины", "task_type": 3, "task_brief": "три состояния для экрана загрузки документов", "line": "Состояния и адаптация"}, {"id": "R05", "comp": 11, "anchor": false, "level": 2, "type": "tool", "text": "Перед передачей в разработку сверяет прототип с дизайн-системой — сетка, шаг отступов, компоненты библиотеки — и приводит отклонения к системе, сохраняя идею экрана", "task_type": 4, "task_brief": "красивый вариант нарушает сетку дизайн-системы", "line": "Проверка результата"}, {"id": "R06", "comp": 11, "anchor": false, "level": 3, "type": "action", "text": "Адаптирует экран под телефон по данным о задачах пользователя: ключевое оставляет на экране, остальное убирает за кнопку, а не уменьшает шрифт", "task_type": 4, "task_brief": "десктопный экран не помещается в мобильный без потерь", "line": "Состояния и адаптация"}, {"id": "R07", "comp": 11, "anchor": false, "level": 1, "type": "action", "text": "Передаёт прототип разработке по чек-листу и помечает, что сделано ИИ; сроки по коду не называет, а передаёт вопрос руководителю", "task_type": 2, "task_brief": "четыре утверждения о сгенерированном прототипе, отметить верные + почему", "line": "Передача и правила"}, {"id": "R08", "comp": 11, "anchor": false, "level": 2, "type": "tool", "text": "Собирает кликабельный прототип в коде по макету и описанию сценария так, что сценарий проходится от начала до конца", "task_type": 3, "task_brief": "сценарий «подать документы онлайн» — от входа до подтверждения", "line": "Постановка задачи ИИ"}, {"id": "R09", "comp": 11, "anchor": false, "level": 2, "type": "action", "text": "Проверяет ИИ-макет на доступность: контраст, размер кликабельных зон, порядок фокуса, альтернативные тексты — и исправляет найденное", "task_type": 3, "task_brief": "экран расписания — что проверить и как поставить задачу ИИ", "line": "Проверка результата"}, {"id": "R10", "comp": 11, "anchor": false, "level": 3, "type": "tool", "text": "Подключает дизайн-систему к ИИ-инструменту — библиотека, токены, связь с кодом, — чтобы генерация шла из готовых компонентов, а не «рисовала похожее»", "task_type": 4, "task_brief": "ИИ каждый раз рисует кнопки заново, разработка возвращает макеты", "line": "Постановка задачи ИИ"}, {"id": "R11", "comp": 11, "anchor": false, "level": 3, "type": "action", "text": "Проверяет гипотезу рабочим ИИ-прототипом на реальных пользователях и отделяет проверенное от того, что «дорисовал» ИИ", "task_type": 4, "task_brief": "прототип понравился пяти респондентам, но два шага ИИ придумал сам", "line": "Проверка результата"}, {"id": "R12", "comp": 11, "anchor": false, "level": 3, "type": "action", "text": "Проектирует ИИ-функцию продукта: что показываем при неуверенности модели, как пользователь исправляет ошибку, где раскрываем, что отвечает ИИ", "task_type": 4, "task_brief": "ИИ-помощник в личном кабинете уверенно назвал неверный срок оплаты", "line": "Состояния и адаптация"}, {"id": "R13", "comp": 11, "anchor": false, "level": 4, "type": "action", "text": "Задаёт команде правила ИИ-прототипирования: что генерируем, как сверяем с дизайн-системой, что передаём в разработку", "task_type": 5, "task_brief": "правила ИИ-прототипирования для продуктовой команды", "line": "Передача и правила"}, {"id": "L01", "comp": 12, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, что персональные данные студентов не переносятся во внешние сервисы, и работает только в LMS; данные студентов за пределы LMS не выносит", "task_type": 1, "task_brief": "шесть действий преподавателя, отметить допустимые", "line": "Обращение с данными"}, {"id": "L02", "comp": 12, "anchor": false, "level": 1, "type": "tool", "text": "Открывает в LMS расшифровку, краткое содержание и поиск по записи и выгружает их по инструкции; функцию вне инструкции не включает, а спрашивает руководителя", "task_type": 1, "task_brief": "что умеет ИИ в LMS — отметить всё верное", "line": "Инструменты LMS"}, {"id": "L03", "comp": 12, "anchor": false, "level": 2, "type": "action", "text": "Готовит ответы на типовые вопросы студентов с ИИ и проверяет их по регламенту", "task_type": 3, "task_brief": "вопрос о пересдаче → ответ со ссылкой на регламент", "line": "Проверка результата"}, {"id": "L04", "comp": 12, "anchor": false, "level": 2, "type": "tool", "text": "Смотрит сводку по успеваемости и активности группы, находит тех, кто рискует отстать", "task_type": 2, "task_brief": "сводка по группе, с кем связаться в первую очередь + почему", "line": "Инструменты LMS"}, {"id": "L05", "comp": 12, "anchor": false, "level": 2, "type": "action", "text": "Формирует рассылки и напоминания студентам, сверяя даты и условия", "task_type": 3, "task_brief": "напоминание о дедлайне курсовой для группы", "line": "Проверка результата"}, {"id": "V01", "comp": 13, "anchor": false, "level": 1, "type": "action", "text": "Заполняет в шаблоне ролика поля из инструкции — тексты, имена, даты — и отдаёт сборку на проверку; элемент вне инструкции не меняет, а спрашивает автора шаблона", "task_type": 2, "task_brief": "шесть элементов ролика, отметить автоматизируемые + почему", "line": "Сборка по шаблону"}, {"id": "V02", "comp": 13, "anchor": false, "level": 2, "type": "tool", "text": "Собирает ролик из шаблона: тексты, титры, переходы задаются параметрами", "task_type": 3, "task_brief": "анонс мероприятия на 15 секунд из шаблона", "line": "Сборка по шаблону"}, {"id": "V03", "comp": 13, "anchor": false, "level": 2, "type": "tool", "text": "Выпускает серию однотипных видео под площадки, меняя данные шаблона", "task_type": 3, "task_brief": "один ролик в трёх форматах под три площадки", "line": "Сборка по шаблону"}, {"id": "V04", "comp": 13, "anchor": false, "level": 2, "type": "action", "text": "Ставит автоматические субтитры и озвучку и исправляет в расшифровке термины и названия программ по списку, не меняя слов спикера и таймкодов", "task_type": 3, "task_brief": "ролик с расшифровкой, где перепутаны термины", "line": "Проверка результата"}, {"id": "V05", "comp": 13, "anchor": false, "level": 3, "type": "tool", "text": "Переделывает шаблон сборки под новый формат с ИИ-ассистентом: выносит размер кадра и тайминги в параметры, работает в копии шаблона и проверяет оба формата тестовым рендером", "task_type": 4, "task_brief": "шаблон под вертикаль, а нужен горизонтальный с другим таймингом", "line": "Сборка по шаблону"}, {"id": "V06", "comp": 13, "anchor": false, "level": 3, "type": "action", "text": "Перед публикацией смотрит готовый ролик на телефоне и проверяет титры (кегль, контраст с фоном, отступ от кнопок площадки), тайминги и брендбук", "task_type": 4, "task_brief": "ролик готов, но титры не читаются на мобильном", "line": "Проверка результата"}, {"id": "V07", "comp": 13, "anchor": false, "level": 3, "type": "action", "text": "Решает, заменять ли реального спикера ИИ-аватаром или синтезированным голосом, и до начала работы получает письменное согласие человека, с которого сделан аватар", "task_type": 4, "task_brief": "ректор занят, маркетинг предлагает «оживить его фото» для поздравления", "line": "Обращение с данными"}, {"id": "V08", "comp": 13, "anchor": false, "level": 4, "type": "action", "text": "Ведёт для команды библиотеку шаблонов роликов и правила выпуска: кто проверяет, что помечаем, где исходники", "task_type": 5, "task_brief": "регламент выпуска коротких видео", "line": "Сборка по шаблону"}, {"id": "V09", "comp": 13, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, что нельзя ставить в ролик без разрешения: голос и лицо человека, чужую музыку и кадры без лицензии; материал без согласия и лицензии в сборку не берёт, а спрашивает руководителя", "task_type": 1, "task_brief": "отметить материалы, которые можно взять в ролик прямо сейчас", "line": "Обращение с данными"}, {"id": "W01", "comp": 14, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает ограничения на коммерческое использование сгенерированного видео и изображений: условия тарифа, правила площадок о раскрытии ИИ-контента, правило компании о пометке; ролик без пометки не публикует", "task_type": 1, "task_brief": "четыре сценария использования, отметить допустимые", "line": "Обращение с данными"}, {"id": "W02", "comp": 14, "anchor": false, "level": 2, "type": "action", "text": "Формулирует запрос на концепт: стиль, композиция, образцы, ограничения", "task_type": 3, "task_brief": "заставка для ролика в фирменном стиле", "line": "Постановка задачи ИИ"}, {"id": "W03", "comp": 14, "anchor": false, "level": 2, "type": "action", "text": "Генерирует три варианта вставки по описанию и отбирает для монтажа по признакам: нет артефактов и мерцания, есть свободная зона под титры, длительность совпадает с фрагментом", "task_type": 3, "task_brief": "три варианта фоновой анимации под закадровый текст", "line": "Проверка результата"}, {"id": "W04", "comp": 14, "anchor": false, "level": 2, "type": "action", "text": "Генерирует серию шотов с одним персонажем или локацией от референсов и первого/последнего кадра так, что при склейке не «прыгают» лицо, костюм и свет", "task_type": 3, "task_brief": "три шота со студенткой-героиней для ролика о кампусе", "line": "Постановка задачи ИИ"}, {"id": "W05", "comp": 14, "anchor": false, "level": 3, "type": "action", "text": "Находит в сгенерированном видео артефакты — морфинг, физика, руки, текст в кадре, мерцание — и решает: перегенерация, маска, ручная правка или отказ", "task_type": 4, "task_brief": "в лучшем дубле на третьей секунде «плывёт» логотип на толстовке", "line": "Проверка результата"}, {"id": "W06", "comp": 14, "anchor": false, "level": 3, "type": "action", "text": "Считает бюджет генерации — кредиты, итерации, время — и решает, что дешевле: генерация, сток или съёмка", "task_type": 4, "task_brief": "нужен 20-секундный ролик с городом; кредитов на 15 попыток", "line": "Постановка задачи ИИ"}, {"id": "W07", "comp": 14, "anchor": false, "level": 3, "type": "tool", "text": "Фиксирует для серии вставок общий запрос, образец стиля и настройки, меняет только тему и формат площадки, проверяет на пробной партии из трёх", "task_type": 4, "task_brief": "серия из двадцати вставок под три формата", "line": "Постановка задачи ИИ"}, {"id": "W08", "comp": 14, "anchor": false, "level": 4, "type": "action", "text": "Пишет для команды правила видеогенерации: разрешённые модели и тарифы, что проверяем, как помечаем", "task_type": 5, "task_brief": "правила видеогенерации для продакшена", "line": "Обращение с данными"}, {"id": "Y01", "comp": 15, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, что голос и лицо человека — в том числе «похожий» синтез — используются только с письменного согласия, и где шаблон согласия; без согласия голос и лицо не синтезирует и не публикует", "task_type": 2, "task_brief": "четыре ситуации, отметить требующие согласия + почему", "line": "Обращение с данными"}, {"id": "Y02", "comp": 15, "anchor": false, "level": 2, "type": "action", "text": "Собирает с ИИ по брифу раскадровку и 2–3 варианта сценария: сцены, хронометраж каждой, что в кадре, закадровый текст", "task_type": 3, "task_brief": "раскадровка ролика на минуту по брифу", "line": "Постановка задачи ИИ"}, {"id": "Y03", "comp": 15, "anchor": false, "level": 2, "type": "tool", "text": "Оживляет статичный макет: движение от изображения с управлением камерой и ключевыми кадрами, бесшовный цикл; лица и текст берёт из исходных слоёв без генерации", "task_type": 3, "task_brief": "статичная обложка → пятисекундный цикл", "line": "Производство материала"}, {"id": "Y04", "comp": 15, "anchor": false, "level": 2, "type": "tool", "text": "Готовит озвучку и локализацию через синтез речи и проверяет произношение терминов", "task_type": 3, "task_brief": "закадровый текст с названиями программ", "line": "Проверка результата"}, {"id": "Y05", "comp": 15, "anchor": false, "level": 3, "type": "tool", "text": "Повышает разрешение и частоту кадров архивного видео через тест: прогоняет фрагмент с лицами, сравнивает с оригиналом на целевом экране и отказывается от апскейла, если лица меняются", "task_type": 4, "task_brief": "архивная запись 480p нужна в ролике на большом экране", "line": "Проверка результата"}, {"id": "Y06", "comp": 15, "anchor": false, "level": 4, "type": "action", "text": "Пишет для видеопроизводства правила по сгенерированному материалу: что можно генерировать, чьё согласие нужно, где хранятся подтверждения лицензий, как помечается ролик", "task_type": 5, "task_brief": "памятка по генерации и правам для видеопроизводства", "line": "Обращение с данными"}, {"id": "Y07", "comp": 15, "anchor": false, "level": 2, "type": "tool", "text": "Делает маски, ротоскоп и удаление объектов ИИ-инструментом и проверяет края на движении и волосах покадрово", "task_type": 3, "task_brief": "убрать случайного прохожего из интервью на 8 секунд", "line": "Производство материала"}, {"id": "Y08", "comp": 15, "anchor": false, "level": 2, "type": "tool", "text": "Чистит звук и собирает музыкальную подложку ИИ-инструментом, проверяя условия лицензии тарифа для коммерческого использования", "task_type": 3, "task_brief": "подложка для ролика приёмной кампании + шумная запись интервью", "line": "Обращение с данными"}, {"id": "Y09", "comp": 15, "anchor": false, "level": 2, "type": "action", "text": "Перед публикацией выставляет раскрытие ИИ на площадке, если в ролике реалистичные синтетические люди, события или голос", "task_type": 4, "task_brief": "в ролике синтезированный голос диктора и сгенерированная толпа", "line": "Обращение с данными"}, {"id": "Y10", "comp": 15, "anchor": false, "level": 3, "type": "tool", "text": "Делает дубляж и липсинк на другой язык и проверяет артикуляцию, термины и согласие спикера на синтез его голоса", "task_type": 4, "task_brief": "лекцию профессора нужно выпустить на английском к форуму", "line": "Производство материала"}, {"id": "I01", "comp": 16, "anchor": false, "level": 1, "type": "action", "text": "Готовит подборку отзывов по инструкции и отмечает в сводке цитаты, которых нет в отзывах; вывод по такой сводке не делает сам, а показывает руководителю", "task_type": 2, "task_brief": "сводка по отзывам, отметить сомнительные утверждения + почему", "line": "Проверка результата"}, {"id": "I02", "comp": 16, "anchor": false, "level": 2, "type": "action", "text": "Разбирает массив отзывов и выделяет повторяющиеся проблемы с частотой и цитатами", "task_type": 3, "task_brief": "400 отзывов из формы обратной связи", "line": "Разбор отзывов и интервью"}, {"id": "I03", "comp": 16, "anchor": false, "level": 2, "type": "action", "text": "Готовит гайд интервью под гипотезу — блоки с таймингом, открытые вопросы о прошлом опыте без наводящих — и черновой разбор расшифровок по этому гайду", "task_type": 3, "task_brief": "гайд на 30 минут под гипотезу об оттоке", "line": "Разбор отзывов и интервью"}, {"id": "I04", "comp": 16, "anchor": false, "level": 3, "type": "action", "text": "Сверяет каждый вывод ИИ с исходной выгрузкой: находит и считает подтверждающие отзывы, выводы без опоры в данных помечает как предположение", "task_type": 4, "task_brief": "ИИ утверждает, что главная проблема — навигация, в цитатах этого нет", "line": "Проверка результата"}, {"id": "I05", "comp": 16, "anchor": false, "level": 3, "type": "action", "text": "К каждой проблеме готовит гипотезу причины и 1–2 решения с ожидаемым эффектом и трудозатратами, допущения помечает", "task_type": 4, "task_brief": "из шести проблем нужно выбрать две для спринта", "line": "Разбор отзывов и интервью"}, {"id": "I06", "comp": 16, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, что расшифровки интервью и отзывы с персональными данными обезличиваются до загрузки в ИИ-сервис; необезличенный материал в сервис не загружает", "task_type": 1, "task_brief": "пять материалов исследования, отметить готовые к загрузке", "line": "Обращение с данными"}, {"id": "I07", "comp": 16, "anchor": false, "level": 1, "type": "action", "text": "Использует ИИ-персону только для задач из списка — гипотезы и черновик гайда — и помечает материал как черновик; за выводами о пользователях идёт к руководителю", "task_type": 2, "task_brief": "четыре способа использовать ИИ-персону, отметить допустимые + почему", "line": "ИИ-персона вместо людей"}, {"id": "I08", "comp": 16, "anchor": false, "level": 3, "type": "action", "text": "Использует ИИ-персону только для гипотез и черновика гайда и подписывает результат как гипотезу. На просьбу заменить интервью нейросетью отвечает планом с интервью в срок руководителя", "task_type": 4, "task_brief": "руководитель просит «опросить нейросеть вместо студентов — быстрее»", "line": "ИИ-персона вместо людей"}, {"id": "I09", "comp": 16, "anchor": false, "level": 4, "type": "action", "text": "Задаёт команде порядок ИИ-анализа исследований: что обезличиваем, как храним, как помечаем выводы «проверено на сырых данных»", "task_type": 5, "task_brief": "порядок ИИ-анализа для исследовательской практики", "line": "Обращение с данными"}, {"id": "E01", "comp": 17, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, что данные о студентах и внутренняя аналитика не выносятся во внешние сервисы; такие данные наружу не отправляет, а оставляет во внутреннем контуре", "task_type": 1, "task_brief": "пять источников данных, отметить допустимые", "line": "Обращение с данными"}, {"id": "E02", "comp": 17, "anchor": false, "level": 2, "type": "action", "text": "Собирает обзор программ конкурентов и трендов рынка образования с проверкой источников", "task_type": 3, "task_brief": "обзор пяти программ по направлению с указанием источников", "line": "Проверка результата"}, {"id": "E03", "comp": 17, "anchor": false, "level": 2, "type": "action", "text": "Анализирует обратную связь студентов массивом и выделяет повторяющиеся темы", "task_type": 3, "task_brief": "600 отзывов по факультету за семестр", "line": "Материалы для решения"}, {"id": "E04", "comp": 17, "anchor": false, "level": 3, "type": "action", "text": "Готовит концепцию новой программы с ИИ и проверяет спрос на реальных данных", "task_type": 4, "task_brief": "ИИ предлагает запустить программу, которой нет у конкурентов", "line": "Проверка результата"}, {"id": "E05", "comp": 17, "anchor": false, "level": 4, "type": "action", "text": "Готовит сценарии развития факультета и материалы для защиты решений", "task_type": 5, "task_brief": "три сценария развития на год с обоснованием", "line": "Материалы для решения"}, {"id": "N01", "comp": 18, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, что материалы с персональными данными и закрытыми методиками не уходят во внешние сервисы; материал вне списка наружу не отправляет, а спрашивает руководителя", "task_type": 1, "task_brief": "пять материалов преподавателя, отметить допустимые", "line": "Обращение с данными"}, {"id": "N02", "comp": 18, "anchor": false, "level": 2, "type": "action", "text": "Готовит черновики заданий, кейсов и тестов и сверяет каждый с программой курса и требованиями к формату", "task_type": 3, "task_brief": "пять задач по теме с разбором типичных ошибок", "line": "Сборка материала"}, {"id": "N03", "comp": 18, "anchor": false, "level": 2, "type": "action", "text": "Оформляет презентации и лекции по брендбуку университета", "task_type": 3, "task_brief": "структура лекции на полтора часа с опорными слайдами", "line": "Сборка материала"}, {"id": "N04", "comp": 18, "anchor": false, "level": 2, "type": "action", "text": "Адаптирует материал под уровень группы: упрощает или углубляет", "task_type": 3, "task_brief": "одна тема для первого курса и для магистратуры", "line": "Адаптация под группу"}, {"id": "X01", "comp": 19, "anchor": false, "level": 1, "type": "action", "text": "Сверяет автоматическую оценку разговора с записью по чек-листу отдела и отмечает, чего оценка не покрывает; оценку сам не меняет, а сообщает руководителю", "task_type": 2, "task_brief": "отчёт речевой аналитики, отметить, что нельзя понять из цифр + почему", "line": "Проверка результата"}, {"id": "X02", "comp": 19, "anchor": false, "level": 2, "type": "action", "text": "Разбирает массив обращений и отзывов, выделяет повторяющиеся причины", "task_type": 3, "task_brief": "1200 обращений за месяц → причины с долями", "line": "Масштаб разбора"}, {"id": "X03", "comp": 19, "anchor": false, "level": 3, "type": "action", "text": "Использует речевую аналитику для контроля качества, отличая систему от единичного случая", "task_type": 4, "task_brief": "у одного оператора десять нарушений скрипта за неделю", "line": "Масштаб разбора"}, {"id": "X04", "comp": 19, "anchor": false, "level": 3, "type": "action", "text": "Проверяет выводы ИИ на выборке реальных обращений перед управленческим решением", "task_type": 4, "task_brief": "ИИ утверждает, что жалобы выросли из-за нового тарифа", "line": "Проверка результата"}, {"id": "X05", "comp": 19, "anchor": false, "level": 4, "type": "action", "text": "Готовит сводки по проблемным зонам сервиса для управленческих решений", "task_type": 5, "task_brief": "квартальная сводка по качеству сервиса с рекомендациями", "line": "Масштаб разбора"}, {"id": "X06", "comp": 19, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, что из записей разговоров и обращений не выносится за пределы системы: записи, контакты и реквизиты клиента; такие данные наружу не отправляет и оставляет в системе", "task_type": 1, "task_brief": "выбрать, что можно вынести из системы в отчёт", "line": "Обращение с данными"}, {"id": "X07", "comp": 19, "anchor": false, "level": 2, "type": "action", "text": "Проверяет выводы автоматической оценки на выборке: берёт десять разговоров и отмечает, где оценка разошлась с содержанием", "task_type": 2, "task_brief": "выбрать, как проверить вывод автоматической оценки, и обосновать", "line": "Проверка результата"}, {"id": "X08", "comp": 19, "anchor": false, "level": 1, "type": "action", "text": "Собирает обращения за неделю в сводку по темам из справочника отдела; тему, которой в справочнике нет, сам не заводит, а приносит руководителю", "task_type": 2, "task_brief": "выбрать, куда отнести обращение вне справочника, и обосновать", "line": "Масштаб разбора"}, {"id": "F01", "comp": 20, "anchor": false, "level": 1, "type": "action", "text": "Проверяет изображение при 100% по списку артефактов и отмечает найденное: анатомия, текст, геометрия, тени; что переделывать, решает не сам, а спрашивает руководителя", "task_type": 2, "task_brief": "сгенерированный постер, отметить артефакты + что насторожило", "line": "Проверка результата"}, {"id": "F02", "comp": 20, "anchor": false, "level": 2, "type": "action", "text": "Правит изображение по инструкции — убирает или заменяет объект, расширяет фон, меняет деталь — так, что правка не видна при 100% масштабе", "task_type": 3, "task_brief": "на фото аудитории убрать проектор и расширить кадр под баннер 3:1", "line": "Правка и печать"}, {"id": "F03", "comp": 20, "anchor": false, "level": 2, "type": "action", "text": "Проверяет сгенерированное при 100% на артефакты: единичные исправляет по маске, вариант с артефактами сразу в нескольких зонах бракует", "task_type": 3, "task_brief": "три варианта с артефактами — запрос на исправление и критерий брака", "line": "Проверка результата"}, {"id": "F04", "comp": 20, "anchor": false, "level": 2, "type": "tool", "text": "Готовит результат к выпуску по требованиям носителя: апскейл до нужного dpi, векторизация, цветовой профиль — и при 100% проверяет, что апскейл не дорисовал деталей", "task_type": 3, "task_brief": "иллюстрация 1024 px нужна на ролл-ап 85×200 см", "line": "Правка и печать"}, {"id": "F05", "comp": 20, "anchor": false, "level": 2, "type": "action", "text": "Готовит ИИ-изображение к печати: разрешение под формат, CMYK и профиль, вылеты, проверка на 100%", "task_type": 4, "task_brief": "афиша уходит в типографию через час, в макете ИИ-фон", "line": "Правка и печать"}, {"id": "F06", "comp": 20, "anchor": false, "level": 2, "type": "action", "text": "До передачи заказчику проверяет обратным поиском по изображению, нет ли сходства с известными персонажами, знаками и стоковыми изображениями; найденное перерабатывает", "task_type": 4, "task_brief": "маскот для олимпиады «кого-то напоминает»", "line": "Обращение с данными"}, {"id": "F07", "comp": 20, "anchor": false, "level": 3, "type": "action", "text": "Разрабатывает айдентику с ИИ так, чтобы знак можно было зарегистрировать: генерацию берёт как эскиз, перестраивает знак вручную, фиксирует этапы и свой вклад", "task_type": 4, "task_brief": "логотип форума целиком из генератора — заказчик хочет регистрировать знак", "line": "Обращение с данными"}, {"id": "F08", "comp": 20, "anchor": false, "level": 4, "type": "action", "text": "Пишет для команды стандарт приёмки ИИ-визуала: чек-лист артефактов, требования к исходникам, кто подписывает выпуск в печать", "task_type": 5, "task_brief": "стандарт приёмки для команды из шести дизайнеров", "line": "Проверка результата"}, {"id": "F09", "comp": 20, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, какие исходники нельзя загружать в сервисы правки и апскейла: неанонсированные материалы, чужие работы, фото людей без согласия; материал вне списка не загружает, а спрашивает руководителя", "task_type": 1, "task_brief": "выбрать из пяти файлов те, что можно загрузить в сервис апскейла", "line": "Обращение с данными"}, {"id": "D01", "comp": 21, "anchor": true, "level": 1, "type": "knowledge", "text": "Знает, какие материалы нельзя загружать во внешние 3D- и рендер-сервисы: планы и сканы площадок заказчика, неанонсированные стенды, модели с ограничивающей лицензией; материал вне списка не загружает, а спрашивает руководителя", "task_type": 1, "task_brief": "шесть материалов, отметить допустимые", "line": "Обращение с данными"}, {"id": "D02", "comp": 21, "anchor": false, "level": 1, "type": "action", "text": "Проверяет ИИ-рендер по чек-листу площадки: опоры, масштаб по плану, материалы из списка; расхождение с планом не правит, а показывает руководителю", "task_type": 2, "task_brief": "ИИ-рендер стенда с четырьмя ошибками — что нельзя построить + что насторожило", "line": "Проверка результата"}, {"id": "D03", "comp": 21, "anchor": false, "level": 2, "type": "action", "text": "Формулирует запрос на концепт пространства по описанию и фото площадки — назначение, габариты, сценарий посетителя, материалы — так, что варианты сохраняют пропорции помещения", "task_type": 3, "task_brief": "концепт стенда 6×4 м по фото пустого зала и брифу", "line": "Постановка задачи ИИ"}, {"id": "D04", "comp": 21, "anchor": false, "level": 2, "type": "tool", "text": "Делает ИИ-рендер поверх белой модели или вида из редактора так, что геометрия, пропорции и ракурс совпадают с исходником", "task_type": 3, "task_brief": "вид белой модели → три варианта атмосферы", "line": "Сцена и ассеты"}, {"id": "D05", "comp": 21, "anchor": false, "level": 2, "type": "tool", "text": "Генерирует 3D-ассет по изображению или описанию и доводит его до сцены: масштаб, полигонаж, материалы, права на использование", "task_type": 3, "task_brief": "стойка ресепшн по эскизу — запрос, чек-лист доводки, допустимая лицензия", "line": "Сцена и ассеты"}, {"id": "D06", "comp": 21, "anchor": false, "level": 2, "type": "tool", "text": "Генерирует бесшовную текстуру или набор карт материала и проверяет стыки, масштаб фактуры и карты на тестовом объекте", "task_type": 3, "task_brief": "фактура «тёплое дерево» для стен стенда", "line": "Сцена и ассеты"}, {"id": "D07", "comp": 21, "anchor": false, "level": 3, "type": "action", "text": "Сверяет ИИ-визуализацию с моделью и требованиями площадки до показа заказчику: находит нестроящиеся элементы и решает, что исправить, а что подписать «концепт, не для производства»", "task_type": 4, "task_brief": "заказчик согласовал ИИ-изображение с шестиметровой консолью; в модели её нет", "line": "Проверка результата"}, {"id": "D08", "comp": 21, "anchor": false, "level": 3, "type": "tool", "text": "Собирает повторяемый конвейер визуализации — сцена, ракурсы, ИИ-рендер, апскейл, облёт — или поручает рутину ИИ-ассистенту в 3D-редакторе: сохраняет копию сцены до запуска, проверяет тестовые кадры и находит сбои (сбитые материалы, масштаб текстур)", "task_type": 4, "task_brief": "к пятнице 12 ракурсов и облёт; агент сбил привязку материалов", "line": "Сцена и ассеты"}, {"id": "D09", "comp": 21, "anchor": false, "level": 4, "type": "action", "text": "Задаёт команде правила работы с 3D-ИИ: разрешённые инструменты и тарифы, что проверяется перед показом, как помечаются концепты", "task_type": 5, "task_brief": "памятка для 3D-команды и подрядчиков", "line": "Обращение с данными"}], "roles": [{"name": "Frontend-разработчик (Vue / Nuxt)", "group": "IT-департамент", "step": null, "oneliner": "Собирает интерфейсы, с которыми работают студенты и сотрудники: личный кабинет, формы, страницы приёмной кампании.", "where_ai": "Агент в репозитории пишет за разработчика рутину — валидацию формы, покрытие тестами, разбор чужого кода, — но задачу ставит и дифф читает человек. Тест-кейсы генерируются по описанию фичи и сверяются с требованиями. В переписке и документации — типовые письма и описания задач.", "requirements": {"1": {"junior": 2, "middle": 3, "senior": 4}, "7": {"junior": 2, "middle": 3, "senior": 4}, "8": {"junior": 1, "middle": 2, "senior": 3}}, "same_as": null}, {"name": "PHP-разработчик", "group": "IT-департамент", "step": null, "oneliner": "Отвечает за серверную часть внутренних систем: интеграции, обработку заявок, выгрузки.", "where_ai": "Агент разбирает устаревший код, которому несколько лет и у которого нет автора; помогает воспроизвести ошибку по логам и найти причину, а не залечить симптом. Тестовые данные и краевые случаи готовятся за минуты.", "requirements": {"1": {"junior": 2, "middle": 3, "senior": 4}, "7": {"junior": 2, "middle": 3, "senior": 4}, "8": {"junior": 1, "middle": 2, "senior": 3}}, "same_as": "Frontend-разработчика"}, {"name": "Разработчик платформы Битрикс", "group": "IT-департамент", "step": null, "oneliner": "Дорабатывает платформу, на которой держится приёмная кампания и работа с абитуриентами.", "where_ai": "Много однотипного кода и интеграций — агент делает первый проход, разработчик проверяет и правит. Важнее обычного правила по данным: в системе персональные данные абитуриентов.", "requirements": {"1": {"junior": 2, "middle": 3, "senior": 4}, "7": {"junior": 2, "middle": 3, "senior": 4}, "8": {"junior": 1, "middle": 2, "senior": 3}}, "same_as": "Frontend-разработчика"}, {"name": "Верстальщик", "group": "IT-департамент", "step": null, "oneliner": "Верстает страницы и письма: лендинги кампаний, рассылки, внутренние страницы.", "where_ai": "Агент собирает разметку по макету и правит мелочи, верстальщик проверяет вёрстку на реальных разрешениях и в почтовых клиентах, где автоматика ошибается чаще всего.", "requirements": {"1": {"junior": 2, "middle": 3, "senior": 4}, "7": {"junior": 1, "middle": 2, "senior": 3}}, "same_as": null}, {"name": "Тестировщик ПО (QA)", "group": "IT-департамент", "step": null, "oneliner": "Проверяет, что сделанное работает и не ломает соседнее.", "where_ai": "Набор тест-кейсов по описанию фичи — за минуты вместо часа, дальше сверка с требованиями. Автотесты пишутся с агентом и проверяются просто: сломай функцию, тест должен упасть. При падении ИИ помогает отличить баг в коде от проблемы теста.", "requirements": {"1": {"junior": 2, "middle": 3, "senior": 4}, "8": {"junior": 2, "middle": 3, "senior": 4}, "7": {"junior": 1, "middle": 2, "senior": 3}}, "same_as": null}, {"name": "SMM-дизайнер", "group": "Дизайн", "step": null, "oneliner": "Делает визуал и короткие видео для соцсетей университета: анонсы, новости, кампании.", "where_ai": "Восемь постов на неделю собираются из одного шаблона; ролик выходит в трёх форматах под три площадки за час. Герой и стиль кампании держатся в серии, сгенерированное доводится — лишнее убрано, фон расширен под формат. Перед публикацией решается, нужна ли пометка «создано с ИИ».", "requirements": {"1": {"junior": 2, "middle": 2, "senior": 3}, "9": {"junior": 1, "middle": 2, "senior": 3}, "20": {"junior": 1, "middle": 2, "senior": 2}, "10": {"junior": 2, "middle": 3, "senior": 3}, "13": {"junior": 1, "middle": 2, "senior": 3}, "14": {"junior": null, "middle": 1, "senior": 2}}, "same_as": null, "core": 10}, {"name": "Веб-дизайнер", "group": "Дизайн", "step": null, "oneliner": "Проектирует страницы и интерфейсы сайта и личных кабинетов.", "where_ai": "Кликабельный прототип страницы — за час вместо недели, и обсуждение с командой идёт по конкретному, а не по словам. Прототип собирается из компонентов дизайн-системы, перед передачей в разработку проверяется на соответствие ей и на доступность.", "requirements": {"1": {"junior": 2, "middle": 2, "senior": 3}, "9": {"junior": 1, "middle": 2, "senior": 2}, "20": {"junior": null, "middle": 1, "senior": 2}, "10": {"junior": null, "middle": 1, "senior": 2}, "11": {"junior": 2, "middle": 3, "senior": 3}}, "same_as": null, "core": 11}, {"name": "Видео/моушен-дизайнер", "group": "Дизайн", "step": null, "oneliner": "Снимает и собирает видео: ролики для кампаний, анимация, заставки.", "where_ai": "Раскадровка по брифу, серия шотов с одним героем, оживление статичных макетов, маски и удаление лишнего из кадра. Закадровая озвучка синтезом с проверкой произношения названий программ; музыка — с подтверждением лицензии. Голос и лицо реального человека — только с согласия.", "requirements": {"1": {"junior": 2, "middle": 2, "senior": 3}, "13": {"junior": 1, "middle": 2, "senior": 2}, "14": {"junior": 1, "middle": 2, "senior": 3}, "15": {"junior": 2, "middle": 3, "senior": 3}}, "same_as": null, "core": 15}, {"name": "Графический дизайнер", "group": "Дизайн", "step": null, "oneliner": "Делает печатную и цифровую графику: макеты, презентации, айдентику мероприятий.", "where_ai": "Варианты по брифу генерируются пачкой и доводятся: правка по инструкции, артефакты, апскейл под формат, подготовка к печати. Рутина в макетах — переименование слоёв, сборка выгрузок — уходит ИИ. Права и сходство с чужими работами проверяются до того, как макет ушёл в печать.", "requirements": {"1": {"junior": 2, "middle": 2, "senior": 3}, "9": {"junior": 2, "middle": 2, "senior": 3}, "20": {"junior": 2, "middle": 3, "senior": 3}, "10": {"junior": 1, "middle": 2, "senior": 3}}, "same_as": null, "core": 20}, {"name": "Продуктовый дизайнер", "group": "Дизайн", "step": null, "oneliner": "Отвечает за то, как устроен продукт для пользователя: от исследования до готового интерфейса.", "where_ai": "Четыреста отзывов превращаются в шесть проблем с частотой и цитатами; гипотеза проверяется кликабельным прототипом за дни, а не недели. Выводы исследования проверяются на сырых данных — ИИ умеет уверенно обобщать то, чего в отзывах не было. Отдельная задача — как ведёт себя ИИ-функция в самом продукте, когда модель ошибается.", "requirements": {"1": {"junior": 2, "middle": 2, "senior": 3}, "11": {"junior": 2, "middle": 3, "senior": 4}, "16": {"junior": 1, "middle": 2, "senior": 3}}, "same_as": null, "core": 11}, {"name": "Средовой (3D) дизайнер", "group": "Дизайн", "step": null, "oneliner": "Проектирует пространства и 3D-визуализации: стенды, интерьеры, сцены.", "where_ai": "Концепт по фото площадки — за день; десяток атмосферных вариантов поверх своей белой модели — за час. Мебель и текстуры второго плана генерируются и доводятся до сцены. Перед показом заказчику всё сверяется с моделью и регламентом площадки: ИИ рисует то, что нельзя построить.", "requirements": {"1": {"junior": 2, "middle": 2, "senior": 3}, "9": {"junior": 1, "middle": 2, "senior": 2}, "20": {"junior": null, "middle": 1, "senior": 2}, "10": {"junior": 1, "middle": 2, "senior": 2}, "21": {"junior": 1, "middle": 2, "senior": 3}}, "same_as": null, "core": 21}, {"name": "Менеджер по продажам", "group": "Продажи", "step": null, "oneliner": "Ведёт клиента от первого контакта до оплаты.", "where_ai": "Перед звонком — сводка истории клиента из карточки за минуту. ИИ-консультант уже поговорил с клиентом: менеджер видит, до чего дошёл разговор, и продолжает с этой точки. После звонка — автоматический разбор: возражения, соблюдение скрипта, оценка качества, и эталонные звонки коллег как образец.", "requirements": {"1": 2, "4": 2, "6": 2}, "same_as": null, "note": "В модели три карточки — разные направления с общими требованиями"}, {"name": "Специалист клиентской службы", "group": "Приёмная комиссия", "step": 1, "oneliner": "Принимает обращения абитуриентов и родителей, помогает с документами.", "where_ai": "Черновик ответа на типовой вопрос — за секунды, дальше проверка по регламенту. Важнее всего правила по данным: в обращениях персональные данные абитуриентов, во внешние сервисы они не уходят.", "requirements": {"1": 2}, "same_as": null}, {"name": "Старший специалист клиентской службы", "group": "Приёмная комиссия", "step": 2, "oneliner": "То же плюс сложные обращения и наставничество новичков.", "where_ai": null, "requirements": {"1": 2}, "same_as": null}, {"name": "Заместитель руководителя клиентской службы", "group": "Приёмная комиссия", "step": 3, "oneliner": "Отвечает за работу группы и качество обслуживания.", "where_ai": "Доклад наверх собирается из трёх источников с проверкой цифр; разбор вариантов решения помогает увидеть риски, которые не пришли в голову. Данные о людях — оценки, зарплаты — во внешние сервисы не уходят.", "requirements": {"1": 3, "3": 2}, "same_as": null}, {"name": "Руководитель клиентской службы", "group": "Приёмная комиссия", "step": 4, "oneliner": "Отвечает за службу целиком: людей, качество, процессы.", "where_ai": null, "requirements": {"1": 3, "3": 3}, "same_as": null}, {"name": "Менеджер по работе с абитуриентами", "group": "Отдел сопровождения клиентов", "step": 1, "oneliner": "Ведёт абитуриента от заявки до зачисления: документы, личное дело, коммуникация.", "where_ai": "Сводка по клиенту перед контактом, продолжение диалога после ИИ-консультанта, черновик письма с проверкой сроков и условий. Автоматический разбор своих звонков показывает, где разговор пошёл не так.", "requirements": {"1": 2, "4": 2, "6": 2}, "same_as": null}, {"name": "Старший менеджер по работе с абитуриентами", "group": "Отдел сопровождения клиентов", "step": 2, "oneliner": "То же плюс сложные случаи и помощь коллегам.", "where_ai": null, "requirements": {"1": 2, "4": 3, "6": 3}, "same_as": null}, {"name": "Ведущий менеджер по работе с абитуриентами", "group": "Отдел сопровождения клиентов", "step": 2, "oneliner": "Ведёт самые сложные дела и наставничество; следующий шаг — руководитель группы.", "where_ai": null, "requirements": {"1": 2, "4": 3, "6": 3}, "same_as": null}, {"name": "Руководитель группы", "group": "Отдел сопровождения клиентов", "step": 3, "oneliner": "Отвечает за результат группы менеджеров.", "where_ai": null, "requirements": {"1": 3, "4": 3, "3": 2}, "same_as": null}, {"name": "Заместитель руководителя отдела", "group": "Отдел сопровождения клиентов", "step": 3, "oneliner": "Помогает руководителю вести отдел, замещает его.", "where_ai": null, "requirements": {"1": 3, "4": 3, "3": 2}, "same_as": "руководителя группы"}, {"name": "Руководитель отдела сопровождения клиентов", "group": "Отдел сопровождения клиентов", "step": 4, "oneliner": "Отвечает за отдел: людей, показатели, качество работы с абитуриентами.", "where_ai": null, "requirements": {"1": 3, "4": 3, "3": 3}, "same_as": null}, {"name": "Координатор проектов", "group": "Проектный офис", "step": 1, "oneliner": "Ведёт документацию и календарь проектов, собирает статусы.", "where_ai": "Протоколы и статус-отчёты собираются из чата, таблицы задач и писем — с проверкой дат по источникам. Повестка к встрече — за минуту. орожило? Одной-двумя фразами.", "kw": [["выдуманные факты и реквизиты", "выдум|галлюцин|придум|не существ|реквизит|номер|приказ"], ["цифры и устаревшие данные", "цифр|устар|данн|процент|стат"], ["уверенный тон — не признак верности", "уверен|тон|убедит"], ["ответственность за проверку на человеке", "ответствен|провер|сверя|сам"]], "need": 2, "ok_fb": "Отмечено всё, что проверяют руками, и названо почему.", "fb": "Проверяют всё, что можно сверить: реквизиты документов, цифры, ссылки. ИИ пишет уверенно и тогда, когда выдумывает, — отвечает за результат тот, кто его отправил."}, "B05": {"type": "p", "q": "Нужно письмо коллегам из смежного отдела: перенос дедлайна по проекту на неделю из-за задержки данных. Напишите запрос к ИИ, чтобы получить готовое письмо.", "checks": [["Контекст: что случилось и почему", "задерж|данн|перенос|дедлайн|срок"], ["От кого и кому", "от имени|роль|коллег|отдел|адресат"], ["Формат: объём, тон", "абзац|коротк|тон|делов|предлож|формат"], ["Ограничения", "не (упомин|писать|обвин)|обязательно|укажи|без "], ["Что проверить", "провер|убедись|уточни|дат"]], "good": "Коллеги, из-за задержки поставки данных со стороны подрядчика переносим дедлайн на неделю — новая дата 15.09. Что это меняет для вас: … Готов ответить на вопросы.", "poor": "Уточните, пожалуйста: кому адресовано письмо, какой проект и какая новая дата? Без этого могу составить только шаблон."}, "A06": {"type": "c", "q": "Агент за один запрос переписал модуль авторизации: 14 файлов, 900 строк изменений, тесты зелёные. Что делаете?", "opts": [{"t": "Мержу изменения: тесты зелёные, значит модуль работает так, как задумано", "g": 1, "fb": "Зелёные тесты проверяют только то, что покрыто тестами."}, {"t": "Откатываю и веду агента по шагам: план, затем по одному модулю с ревью после каждого", "g": 5, "fb": "Работа по шагам с контролем на каждом — это и есть уровень «по ситуации»."}, {"t": "Читаю весь дифф целиком за один подход и после этого мержу изменения", "g": 3, "fb": "Лучше, чем вслепую, но 900 строк одним куском читаются плохо."}, {"t": "Прошу агента дописать тесты; если и они зелёные — принимаю изменения в ветку", "g": 2, "fb": "Агент проверяет сам себя тем же пониманием задачи."}], "why": "потому|так как|риск|провер|ревью|шаг|контрол"}, "T02": {"type": "p", "q": "Фича: «пользователь может сбросить пароль по email». Напишите запрос, чтобы получить набор тест-кейсов.", "checks": [["Описание фичи", "сброс|парол|email|почт"], ["Виды кейсов: позитивные, негативные, краевые", "негатив|позитив|краев|гранич|ошиб"], ["Формат: таблица, шаги, ожидание", "таблиц|шаг|ожида|формат"], ["Ограничения системы", "срок|токен|минут|лимит|требован"], ["Что уточнить", "уточн|вопрос|если не"]], "good": "Таблица: 1 — валидный email → письмо со ссылкой, срок 15 минут; 2 — незарегистрированный → нейтральное сообщение; 3 — повтор за минуту → лимит; …", "poor": "Тест-кейсы: 1. Пользователь вводит email. 2. Приходит письмо. 3. Пользователь меняет пароль."}, "G09": {"type": "j", "multi": true, "q": "На неделе у вас пять задач, и под каждую коллега-стажёр уже предложил класс ИИ-инструмента. В каких парах «задача → инструмент» выбор верный? Отметьте всё подходящее.", "opts": [{"t": "Сцена «студенты в коворкинге» для обложки буклета → генератор изображений, сильный в фотореализме", "ok": true}, {"t": "Убрать строительные леса с готового фото корпуса → сгенерировать корпус заново по словесному описанию", "ok": false}, {"t": "Иконки направлений, которые пойдут и на визитку, и на баннер 3×6 м → векторный генератор, отдающий кривые", "ok": true}, {"t": "Логотип студенческого клуба для печати на мерче → фотореалистичный генератор, а потом увеличить картинку", "ok": false}, {"t": "Афиша с крупной надписью «День открытых дверей» внутри картинки → модель, которая держит текст и кириллицу", "ok": true}], "why_q": "Чем генерация отличается от редактирования и зачем под задачу подбирать класс модели? Одной-двумя фразами.", "kw": [["редактирование меняет часть готового изображения, остальное сохраняет", "готов|исходн|сохран|остальн|фрагмент|област|правк|правит|редактир|заливк|имеющ"], ["генерация создаёт новое изображение с нуля", "с нуля|заново|нов(ое|ую|ая|ый)|созда[её]т|создать|друг(ое|ой|ую)|по описан"], ["у классов моделей разные сильные стороны: фотореализм, текст в картинке, вектор", "вектор|крив|масштаб|фотореал|реалист|надпис|кирилл|букв|сильн|лучше (всего )?(справ|держ|уме)|заточен"]], "need": 2, "ok_fb": "Пары выбраны верно, и названо главное: редактирование сохраняет готовый кадр, генерация создаёт новый, а класс модели подбирают под сильную сторону.", "fb": "Верные пары — фотореализм для сцены, векторный генератор для иконок и модель, которая держит текст, для афиши с надписью. Леса с готового фото убирают редактором с генеративной заливкой: генерация с нуля нарисует другое здание. Логотип для мерча нужен в кривых — увеличенная растровая картинка для печати на ткани не подойдёт. В обосновании стоит назвать хотя бы два из трёх: редактирование сохраняет исходник, генерация создаёт новое, у классов моделей разные сильные стороны."}, "G10": {"type": "p", "q": "У приёмной кампании есть свой маскот; эталонная иллюстрация утверждена арт-директором и лежит у вас вместе с листом персонажа (анфас, профиль, три эмоции). Нужна серия из шести карточек «Шаги поступления» для соцсетей, 1080×1350: на каждой маскот кампании в новой сцене. Работаете в генераторе изображений из разрешённого контура. Напишите запрос на серию так, чтобы герой не «поплыл».", "checks": [["Что за серия и кто герой", "сери|карточ|маскот|геро[йяюе]|персонаж"], ["Референсы: эталон и лист персонажа как основа", "референс|эталон|образ[е]?ц|утвержд|исходн|прилага|приложен|прикладыва|лист персонаж|как на "], ["Формат: шесть сцен, размер, что меняется от карточки к карточке", "шесть|6 |1080|размер|пропорц|вертикал|сцен|поз[аыуе]|кажд(ая|ой|ую)|формат"], ["Что не должно меняться: фирменные детали, пропорции, цвета, манера", "не (меня|добавля|искажа|трога)|без |один и тот же|тот же|та же|одинаков|неизмен|сохран|остаётся|остается"], ["Что проверить в серии и что отбраковать", "провер|сравн|сверь|сверя|брак|плава|плыв|уплы|совпада|отлича|расхожд"]], "good": "Готово: шесть карточек 1080×1350, на всех маскот собран по листу персонажа — те же пропорции, цвета и фирменные детали костюма, плоская заливка без градиентов. Сцены: выбирает программу за ноутбуком, собирает документы, подаёт заявление, ждёт списки, празднует зачисление, идёт на первую пару. Меняются только поза, реквизит и фон; верхняя треть свободна под заголовок. По вашей проверке: на четвёртой карточке у героя пропала фирменная деталь костюма, на шестой цвет героя темнее эталона — обе перегенерировала с теми же референсами, теперь совпадает. Посмотрите серию в ряд: если где-то герой всё же отличается, назовите карточку.", "poor": "Вот шесть картинок с маскотом: на первой — реалистичный персонаж в очках, на второй — мультяшный, дальше стиль тоже разный. Чтобы герой был одним и тем же, подскажите: какой эталон и лист персонажа взять за основу, что в герое менять нельзя (фирменные детали, цвета, пропорции, манера), какие шесть сцен и в каком размере нужны и по каким признакам сверять серию между собой?"}, "G11": {"type": "m", "q": "К приёмной кампании вы готовите визуалы с людьми — часть с генерацией, часть с обработкой фото. Какие из действий допустимы? Отметьте всё подходящее.", "opts": [{"t": "Сгенерировать собирательного «студента» для обложки буклета и проверить, что он не похож на реального человека", "ok": true}, {"t": "Сгенерировать ректора в скафандре для поздравления ко Дню космонавтики: он человек публичный, ему будет приятно", "ok": false}, {"t": "Сделать героиню афиши «похожей на известную актрису»: имя в запросе не называть, только типаж и причёску", "ok": false}, {"t": "Обработать в разрешённом контуре фото выпускницы, которая подписала согласие на использование изображения в рекламе", "ok": true}, {"t": "Взять фото первокурсника из его открытого профиля в соцсети и «оживить» для
