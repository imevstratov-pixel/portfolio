постро|не стро|модел|сверк|сверя|концепт|заказчик|обязательств|обещан|бюджет|срок|риск|довер|честн"}, "D08": {"type": "c", "q": "К пятнице заказчику нужны 12 ракурсов стенда и 15-секундный облёт. Вы поручили ИИ-агенту в 3D-редакторе расставить камеры и запустить пакетный рендер; копия сцены до запуска сохранена. В среду утром смотрите первые четыре кадра: на стойке ресепшн вместо синего пластика — дерево, у ламелей слетел масштаб текстуры. Похоже, агент переименовал объекты и сбил привязку материалов. Что делаете?", "opts": [{"t": "Рендер не останавливаю — времени мало: материалы на готовых кадрах поправлю ИИ-перерисовкой поверх картинки, а облёт соберу из тех кадров, что получатся", "g": 1, "fb": "Оставшиеся восемь кадров отрендерятся с той же ошибкой, а перерисовка поверх картинки на каждом ракурсе даст немного разные материалы — в облёте стойка начнёт «плыть» от кадра к кадру. Причина в сцене, там её и стоит исправить: до пятницы времени на это хватает."}, {"t": "Останавливаю рендер и вручную переназначаю материалы на стойке и ламелях; затем заново запускаю того же агента с прежней инструкцией на все двенадцать ракурсов", "g": 3, "fb": "Остановить рендер и починить сцену — верное начало. Стоит добавить: агент с прежней инструкцией, скорее всего, снова переименует объекты. В инструкции нужен запрет трогать имена и материалы, а перед полным запуском — два тестовых кадра. И проверить стоит всю сцену: привязка могла слететь не только там, где это бросилось в глаза."}, {"t": "Останавливаю рендер, возвращаю сохранённую копию сцены, нахожу сбой в журнале агента; запрещаю ему менять имена и материалы, сверяю два тестовых кадра и перезапускаю", "g": 5, "fb": "Сбой пойман на первых кадрах и исправлен в источнике: копия сцены возвращает все привязки разом, журнал показывает, на каком шаге агент вышел за рамки задачи, а запрет в инструкции и тестовые кадры не дают ошибке повториться. Конвейер остаётся в работе — и к следующему проекту он уже надёжнее."}, {"t": "Отказываюсь от агента и конвейера совсем: расставляю все двенадцать камер и настройки рендера вручную, как раньше, — в срочных проектах автоматике доверять не стоит", "g": 2, "fb": "Вручную результат будет предсказуемым, но среда и четверг уйдут на рутину, а на облёт времени останется мало. Сбой здесь типовой и лечится быстро: вернуть копию сцены, ограничить агента в инструкции, проверить два тестовых кадра. Автоматике стоит доверять рутину — а проверку оставлять себе."}], "why": "потому|так как|материал|привязк|копи[яюи]|верси|откат|журнал|лог[аеи ]|тест|провер|агент|инструкц|огранич|запрет|повтор|конвейер|срок|риск|плыв|причин|источник"}, "F09": {"type": "m", "q": "Вам прислали пять файлов для правки и апскейла в внешнем сервисе. Что можно загрузить прямо сейчас? Отметьте всё подходящее.", "opts": [{"t": "Свой макет из опубликованной прошлогодней кампании: текст и графика без лиц", "ok": true}, {"t": "Фотография студента с дня открытых дверей: согласие на съёмку есть, на обработку ИИ — нет", "ok": false}, {"t": "Референс из чужого портфолио: скачан с сайта студии, лицензия не проверена", "ok": false}, {"t": "Собственная иллюстрация для внутреннего отчёта: опубликована в корпоративном канале", "ok": true}, {"t": "Макет незапущенной кампании: анонс через две недели", "ok": false}], "ok_fb": "Верно: в сервис уходит только своё и уже опубликованное, где нет лиц и чужих прав.", "fb": "Загружать можно только своё и уже опубликованное. Фото человека без согласия на обработку ИИ, чужая работа без лицензии и незапущенный макет остаются во внутреннем контуре — по такому файлу идут к руководителю."}, "V09": {"type": "m", "q": "Собираете ролик из шаблона. Какие материалы можно взять в сборку прямо сейчас? Отметьте всё подходящее.", "opts": [{"t": "Музыка из библиотеки шаблона: лицензия входит в тариф компании", "ok": true}, {"t": "Синтез голоса преподавателя по записи лекции: письменного согласия нет", "ok": false}, {"t": "Кадры со съёмки кампуса: снимали по договору, права у компании", "ok": true}, {"t": "Трек из клипа, который сейчас в тренде площадки", "ok": false}, {"t": "Лицо выпускника из прошлогоднего ролика: согласие было на тот ролик", "ok": false}], "ok_fb": "Верно: в сборку идёт только то, на что есть лицензия или письменное согласие под эту работу.", "fb": "Нужны лицензия на материал и письменное согласие человека именно на эту работу. Согласие на прошлый ролик не переносится, а трек из тренда — чужие права. Такой материал в сборку не берут и спрашивают руководителя."}, "X06": {"type": "m", "q": "Готовите отчёт по качеству сервиса за месяц. Что можно вынести из системы разговоров в документ для отдела? Отметьте всё подходящее.", "opts": [{"t": "Доля разговоров, где не прозвучал вопрос о сроке", "ok": true}, {"t": "Аудиозапись показательного разговора", "ok": false}, {"t": "Три частые темы обращений с числом упоминаний", "ok": true}, {"t": "Телефон и фамилия клиента из жалобы — как пример", "ok": false}, {"t": "Номер договора клиента, чтобы коллеги нашли историю", "ok": false}], "ok_fb": "Верно: наружу уходят только цифры и темы, записи и данные клиента остаются в системе.", "fb": "Из системы выносят счётный результат: доли, темы, число упоминаний. Записи, контакты и реквизиты клиента остаются внутри — если для разбора нужен конкретный случай, его смотрят в системе."}, "X07": {"type": "j", "multi": false, "q": "Автоматическая оценка показывает: за неделю 78% разговоров «без выявления потребности». Руководитель просит вынести это на планёрку. Что сделать сначала?", "opts": [{"t": "Вынести цифру на планёрку как есть: выборка большая, инструмент один и тот же для всех", "ok": false}, {"t": "Взять десять разговоров из этих 78% и послушать, совпадает ли отметка системы с тем, что было в разговоре", "ok": true}, {"t": "Сравнить с прошлой неделей: если цифра не изменилась, значит оценка работает верно", "ok": false}, {"t": "Запросить у поставщика системы описание алгоритма оценки", "ok": false}], "why_q": "Зачем это делать до планёрки? Одной-двумя фразами.", "kw": [["сверка с первоисточником", "прослуш|послуш|сверя|сверить|запис|перв(ому|оисточ)|содержан"], ["выборка", "выборк|десять|10|несколько разговоров|случайн"], ["цена ошибки", "ошиб|неверн|разош|ложн|не подтверд|решение"]], "need": 2, "ok_fb": "Верно: вывод инструмента проверяют на выборке разговоров до того, как он станет основанием для решения.", "fb": "Автоматическая оценка — это разметка, а не факт. До планёрки берут десять разговоров из той же группы и сверяют отметку с содержанием: если система путает уточняющий вопрос с выявлением потребности, цифра не про людей, а про настройку инструмента."}, "X08": {"type": "j", "multi": false, "q": "Собираете недельную сводку обращений по справочнику тем отдела. Три обращения — про новый сервис рассрочки, такой темы в справочнике нет. Что делаете?", "opts": [{"t": "Отношу к ближайшей теме «оплата», чтобы сводка сошлась", "ok": false}, {"t": "Завожу новую тему «рассрочка» и отмечаю её в справочнике", "ok": false}, {"t": "Оставляю обращения без темы, отмечаю их в сводке отдельной строкой и приношу руководителю", "ok": true}, {"t": "Не включаю эти обращения в сводку: их всего три", "ok": false}], "why_q": "Почему так? Одной-двумя фразами.", "kw": [["справочник ведёт не сотрудник", "справочник|список тем|не завож|не мен|руководител|владел"], ["не терять сигнал", "не терять|не выбрас|видно|отдельн|сигнал|новая тема"], ["не искажать данные", "не искаж|не подгон|не относ|ближайш|оплат|сойдётся"]], "need": 2, "ok_fb": "Верно: обращение вне справочника видно в сводке и уходит к руководителю, а не подгоняется под соседнюю тему.", "fb": "На первом уровне справочник тем берут готовым. Обращение, которому в нём нет места, не прячут в соседнюю тему и не выбрасывают: его показывают отдельной строкой и приносят тому, кто ведёт справочник."}, "B01": {"type": "j", "multi": false, "q": "Вебинар для слушателей программы «Управление проектами» переносится с 24 на 26 сентября, нужно сообщение в чат группы. Коллеги написали два запроса к ИИ. Какой сработает лучше?", "opts": [{"t": "Запрос А: «Напиши, пожалуйста, красивое, грамотное и очень вежливое сообщение о том, что наш вебинар переносится, — так, чтобы никто не обиделся и все обязательно пришли»", "ok": false}, {"t": "Запрос Б: «Ты куратор онлайн-программы. Вебинар переносится с 24 на 26 сентября, 19:00, ссылка прежняя. Напиши слушателям сообщение в чат: до 5 предложений, дружелюбно, без причин переноса»", "ok": true}], "why_q": "Чем он лучше? Одной-двумя фразами.", "kw": [["контекст: что случилось и для кого", "контекст|ситуац|кому|для кого|слушател|дат[аыу]|конкретн|что (именно )?(случил|произошл|перенос)"], ["роль, от чьего имени", "рол[ьи]|куратор|от (чьего )?имени|от лица"], ["формат результата", "формат|объ[её]м|длин|тон|структур|предложени|дружелюб|коротк"], ["ограничения", "огранич|без причин|без |не (упомин|объясн|пис)|рамк"]], "need": 2, "ok_fb": "Выбран рабочий запрос, и названо, что именно в нём работает.", "fb": "Рабочий запрос — Б. В нём есть роль (куратор программы), контекст (какой вебинар, новые дата и время, кому пишем), формат (до 5 предложений, дружелюбный тон) и ограничение (без причин переноса). В запросе А модели придётся всё это угадывать, и сообщение выйдет общим. В обосновании назовите хотя бы две из этих частей."}, "U02": {"type": "p", "q": "К пятнице директору по клиентскому сервису нужен доклад об итогах сентября. У вас три источника: выгрузка обращений из CRM, отчёт речевой аналитики по качеству звонков и таблица с оценками клиентов (NPS). Напишите запрос к ИИ, чтобы собрать доклад.", "checks": [["Задача: доклад об итогах месяца", "доклад|отч[её]т|итог|справк|сводк"], ["Для кого и из каких источников", "директор|руководств|источник|crm|выгрузк|аналитик|nps|для кого|материал"], ["Формат: объём и структура", "страниц|слайд|пункт|структур|абзац|коротк|формат|тезис|раздел"], ["Ограничения: только данные источников", "только (из|по|на|то)|не (придум|добавля|округл|домысл|выдум)|без |не включай|огранич|обезлич|фамил"], ["Пометка непроверенного и ссылка на источник у цифр", "пометь|помет|отметь|непровер|провер|укажи.{0,40}источник|источник.{0,40}(кажд|цифр)|свер|сомн|не подтвержд"]], "good": "Итоги сентября, 1 страница. Обращения: 1 240, на 8 % больше августа [CRM, лист «Сводка»]. Средняя оценка качества звонков — 81 из 100, слабое место — работа с возражением о цене [речевая аналитика, с. 3]. NPS — 46 [таблица оценок]. Требует проверки: доля повторных обращений 17 % — в выгрузке и в отчёте аналитики цифры расходятся; причина роста обращений в источниках не указана — это предположение, а не факт.", "poor": "Уточните, пожалуйста: для кого доклад, какого объёма и какие данные у вас есть? Пока могу дать общую структуру: введение, основные показатели, выводы. Цифры без источников я подставлять не буду."}, "U04": {"type": "c", "q": "Вы решаете, как разгрузить вторую линию поддержки слушателей с 1 ноября: подключить чат-бота или нанять двух операторов. ИИ по вашему запросу выдал двенадцать рисков, восемь из них — вроде «нехватка ресурсов» и «сопротивление изменениям», они подошли бы любому проекту. Что делаете?", "opts": [{"t": "Вставляю в записку директору все двенадцать: чем полнее перечень рисков, тем основательнее выглядит разбор", "g": 2, "fb": "Восемь общих фраз не помогут выбрать между ботом и операторами, а четыре содержательных риска среди них потеряются. Объём списка — не глубина разбора."}, {"t": "Даю ИИ наши цифры и условия, прошу по каждому риску — что его вызовет у нас, вероятность и цену; содержательные проверяю с командой", "g": 5, "fb": "Общие слова появляются, когда модели не хватает данных о ситуации. С цифрами по обращениям и срокам разбор становится предметным, а проверка с командой оставляет решение за вами."}, {"t": "Вычёркиваю восемь шаблонных рисков, а четыре оставшихся переношу в записку в том виде, как их сформулировал ИИ", "g": 3, "fb": "Шум убран — это верно. Но оставшиеся четыре не проверены и не привязаны к вашим цифрам, а риски, которых ИИ не увидел без контекста, так и не появились."}, {"t": "Раз рисков так много, прошу ИИ самому выбрать вариант с меньшим риском и принимаю его рекомендацию как решение", "g": 1, "fb": "Выбор на основе шаблонного списка будет таким же шаблонным. И решение о людях и бюджете остаётся за руководителем — ИИ даёт материал для него, а не ответ."}], "why": "потому|так как|поскольку|риск|провер|конкрет|цифр|данн|контекст|общи[ех]|шаблон|по существу|чтобы|решени"}, "S03": {"type": "j", "multi": false, "q": "Система разобрала ваш звонок с абитуриентом магистратуры и оставила четыре замечания. С какого вы начнёте работу над следующими звонками?", "opts": [{"t": "В приветствии не названо имя менеджера — отступление от скрипта", "ok": false}, {"t": "Возражение «дорого» осталось без ответа, после него клиент завершил разговор; то же в 4 из 6 звонков недели", "ok": true}, {"t": "Доля речи менеджера — 68 % при рекомендованных 60 %", "ok": false}, {"t": "Слово «как бы» прозвучало девять раз за семь минут разговора", "ok": false}], "why_q": "Почему начинаете с него? Одной-двумя фразами.", "kw": [["влияние на результат разговора", "результат|сделк|продаж|завершил|уш[её]л|потер|сорвал|срыва|конверс|исход|отказ|деньг|заявк"], ["повторяемость", "повтор|регулярн|систем|не перв|4 из|четыр[её]х|кажд|част[оы]|несколько звонк|не случайн"], ["возражение — ключевой момент", "возражен|дорого|цен[аеуы]|стоимост"], ["остальное — форма, подождёт", "мелоч|форм[аеы]|второстепенн|не влия|космет|потом|остальн|менее важн"]], "need": 2, "ok_fb": "Выбрано замечание, которое стоит сделок, и названо, почему оно первое.", "fb": "Начинать стоит с возражения «дорого»: после него клиент закончил разговор, и это повторяется в четырёх звонках из шести — значит, дело не в случайности и именно здесь теряются заявки. Имя в приветствии, доля речи и слова-паразиты — замечания о форме, на исход этого разговора они не повлияли. В обосновании назовите два признака: влияние на результат и повторяемость."}, "S05": {"type": "p", "q": "В пятницу у вас встреча один на один с руководителем группы продаж. В системе речевой аналитики — десять ваших звонков за неделю с расшифровками и разборами. Напишите запрос к встроенному ИИ-помощнику системы, чтобы подготовить три вывода о том, что вы меняете в работе.", "checks": [["Задача: выводы по своим звонкам за неделю", "звонк|разговор|разбор"], ["Для чего и на каких материалах: встреча с руководителем, расшифровки", "руководител|встреч|расшифровк|менеджер|материал|один на один"], ["Формат: три вывода — что меняю и почему", "три |3 вывод|вывод|пункт|коротк|формат|структур|что (я )?меня"], ["Ограничения: только по этим звонкам, без общих советов", "только (из|по|на|то)|не (придум|обобщ|домысл|оправд|выдум)|без |не упомин|огранич|общих"], ["Проверка: каждый вывод подтверждён местами из расшифровок", "цитат|пример|номер[аы]? звонк|ссылк|подтвер|провер|в каких звонках|таймкод|свер|фрагмент"]], "good": "1) Возражение о цене остаётся без ответа — звонки 2, 5, 7, 9 («дорого» → сразу переход к рассрочке). Меняю: сначала вопрос, с чем клиент сравнивает. 2) Следующий шаг не назначен в 3 звонках из 10 (№ 1, 4, 8: «я вам перезвоню» без даты). Меняю: дату и время контакта называю до прощания. 3) В звонках 3 и 6 блок вопросов пропущен — в обоих клиент сам просил короче, это не проблема. Сверьте цитаты по расшифровкам: в звонке 7 запись местами неразборчива.", "poor": "По звонкам можно сказать, что стоит внимательнее слушать клиента, лучше работать с возражениями и соблюдать скрипт. Уточните, сколько выводов нужно, для кого они и надо ли подтверждать каждый местами из расшифровок — тогда отвечу предметно."}, "S06": {"type": "c", "q": "Клиентка в начале звонка сказала: «У меня пять минут, программу я изучила, расскажите только про рассрочку». Вы пропустили блок вопросов о потребностях, ответили по делу, договор подписан. Система поставила 62 из 100 и отметила нарушение скрипта. Что делаете?", "opts": [{"t": "Ничего: система не понимает контекста, договор подписан, а значит, замечание можно спокойно пропустить", "g": 2, "fb": "В этом звонке вы, скорее всего, правы. Но без взгляда на другие разборы вы не узнаете, случайность это замечание или привычка пропускать вопросы, которую система заметила раньше вас."}, {"t": "Впредь проговариваю блок вопросов полностью, даже когда клиент торопится, чтобы оценка больше не падала", "g": 1, "fb": "Так работа подстраивается под оценку, а не под клиента: торопящийся человек, которого ведут по всем вопросам, скорее положит трубку. Скрипт — средство, а не цель."}, {"t": "Смотрю разборы за месяц: пропускаю ли я этот блок без причины; к этому звонку пишу руководителю комментарий с цитатой клиентки", "g": 5, "fb": "Вы отделили случайное замечание от возможной системной ошибки: один осознанный отход объяснён цитатой, а повторяемость проверена по данным. Если пропуск встречается и без причины — это уже ваша точка роста."}, {"t": "Оставляю к звонку комментарий, что отошёл от скрипта сознательно, а остальные свои разборы не открываю", "g": 3, "fb": "Этот звонок объяснён, и это полезно. Не хватает второго шага: проверить по другим разборам, не повторяется ли пропуск блока там, где клиент никуда не спешил."}], "why": "потому|так как|поскольку|риск|провер|повтор|систем|случайн|контекст|клиент|осознан|сознательн|чтобы|привычк"}, "A01": {"type": "j", "multi": true, "q": "Команда личного кабинета студента переходит с чата на Claude Code: агент запускается прямо в репозитории на Nuxt. Что из перечисленного действительно меняется по сравнению с чатом? Отметьте всё подходящее.", "opts": [{"t": "Агент сам правит файлы и запускает команды в проекте, а не только показывает код в окне ответа", "ok": true}, {"t": "Агент читает всё, что лежит в рабочей папке: конфиги, .env с ключами, выгрузки с данными студентов", "ok": true}, {"t": "Ничего не меняется: пока разработчик сам не скопирует код из ответа, проект остаётся прежним", "ok": false}, {"t": "Если после правок агента тесты зелёные, за ошибку на проде отвечает инструмент, а не разработчик", "ok": false}], "why_q": "Какие риски это добавляет по сравнению с чатом? Одной-двумя фразами.", "kw": [["агент действует сам: меняет файлы, запускает команды", "меня|правит|изменя|перепис|запуска|выполня|команд|действ|удал|слома"], ["агенту видно всё содержимое проекта", "доступ|чита|видит|видн|\\.env|ключ|секрет|токен|конфиг|персональн|данны"], ["проверка и ответственность остаются за человеком", "ответствен|провер|дифф|ревью|контрол|просмотр|читать|отвеча"]], "need": 2, "ok_fb": "Отмечены реальные отличия, и названо, какие риски они добавляют: агент действует в проекте сам и видит всё, что в нём лежит, — а отвечает за результат разработчик.", "fb": "Реальных отличия два: агент сам меняет файлы и запускает команды, и ему доступно всё содержимое рабочей папки, включая .env и выгрузки. Отсюда риски: лишние правки в соседних файлах и утечка секретов или данных. В обосновании стоит назвать хотя бы два из трёх: агент действует сам, видит весь проект, дифф и ответственность остаются за разработчиком."}, "A02": {"type": "m", "q": "Вы чините форму регистрации абитуриента с агентом, принятым в команде разработки: он работает в репозитории внутри контура компании. Что из перечисленного можно дать агенту в работу? Отметьте всё подходящее.", "opts": [{"t": "Компонент RegistrationForm.vue и его тесты из рабочего репозитория", "ok": true}, {"t": "Файл .env с ключом платёжного шлюза и токеном доступа к CRM", "ok": false}, {"t": "Дамп таблицы заявок: ФИО, телефоны и паспортные данные абитуриентов", "ok": false}, {"t": "Текст ошибки из консоли и stack trace без данных пользователей", "ok": true}, {"t": "Публичную документацию Nuxt и README с правилами оформления кода", "ok": true}, {"t": "Исходники модуля оплаты — в личный аккаунт стороннего ИИ-сервиса", "ok": false}], "ok_fb": "Верно: агенту достаются код задачи, обезличенные логи и публичная документация. Ключи, персональные данные и закрытый код за пределами контура — нет.", "fb": "Агенту можно дать компонент с тестами из рабочего репозитория, текст ошибки без данных пользователей и публичную документацию. Остальное остаётся у вас: ключи и токены из .env, дамп с персональными данными абитуриентов (для отладки хватит трёх выдуманных записей) и закрытый код, если он уходит в личный аккаунт стороннего сервиса вне контура компании."}, "A03": {"type": "p", "q": "В форме регистрации абитуриента (Nuxt 3, компонент components/auth/RegistrationForm.vue) поле email принимает что угодно, и за неделю в CRM ушло 46 заявок с адресами вроде «ivanov@mail». Напишите задачу агенту в репозитории, чтобы он добавил валидацию email и не задел лишнего.", "checks": [["Что сделать: валидация email в форме регистрации", "валидац|e-?mail|почт|корректн|адрес"], ["Где менять: компонент, файл, место в репозитории", "компонент|файл|\\.vue|registrationform|папк|репозитор|composable|директор|components"], ["Критерий готовности: что должно работать в итоге", "готов|тест|критери|сообщени|подсказк|кнопк|считается|должн|блокир|не отправля"], ["Правила и границы: что не трогать", "не (трога|меня|затраг|правь|добавля|устанавл)|только|без |правил|линтер|eslint|как в проекте|существующ"], ["Что проверить или показать перед сдачей", "провер|уточн|спроси|покажи|запусти|прогон|план|дифф"]], "good": "План: 1) в components/auth/RegistrationForm.vue добавляю правило для поля email через уже используемый в проекте useFormRules — новых зависимостей нет; 2) под полем появляется сообщение «Проверьте адрес: нужен формат name@domain.ru», кнопка «Зарегистрироваться» неактивна, пока адрес некорректен; 3) добавляю 5 тестов в RegistrationForm.spec.ts: пустое поле, «ivanov@mail», пробелы по краям, кириллический домен, корректный адрес. Остальные поля, стили и запрос к API не трогаю. После правок запущу линтер и тесты и покажу дифф — он затронет 2 файла.", "poor": "Уточните, пожалуйста: в каком файле форма, чем в проекте принято валидировать поля и как понять, что задача готова — сообщение под полем, блокировка кнопки, тесты? Без этого я могу поставить новую библиотеку валидации и переписать форму целиком, а это заденет соседние поля и стили."}, "T01": {"type": "j", "multi": true, "q": "Вы тестируете подачу заявления в личном кабинете абитуриента. По описанию фичи ИИ за две минуты выдал таблицу из 30 тест-кейсов, и выглядит она убедительно. Что нужно проверить, прежде чем брать кейсы в работу? Отметьте всё подходящее.", "opts": [{"t": "Каждое требование из ТЗ покрыто хотя бы одним кейсом, включая отказ в загрузке скана больше 10 МБ", "ok": true}, {"t": "Ожидаемые результаты в кейсах совпадают с ТЗ, а не с тем, как ИИ сам представил себе поведение формы", "ok": true}, {"t": "Кейсов получилось ровно тридцать, и у каждого заполнены все столбцы таблицы: шаги, данные, результат", "ok": false}, {"t": "Формулировки шагов написаны грамотно, в едином стиле и в одинаковой степени подробности по всем кейсам", "ok": false}], "why_q": "Почему аккуратной таблицы от ИИ недостаточно? Одной-двумя фразами.", "kw": [["сверка с требованиями, а не с описанием", "требован|тз|спецификац|постановк|документац|аналитик"], ["ИИ опирается на своё понимание задачи и может додумать", "додум|понима|выдум|предполож|догад|интерпрет|придум|галлюц|представ|сам реш"], ["пропуски в покрытии и неверные ожидаемые результаты", "пропус|покры|упус|не хвата|ожидаем|лимит|неверн|ошиб|неполн|краев|гранич"]], "need": 2, "ok_fb": "Выбрано главное — сверка с требованиями, и объяснено почему: ИИ строит кейсы по своему пониманию задачи, поэтому возможны пропуски и додуманные ожидания.", "fb": "Проверять стоит две вещи: покрыто ли каждое требование ТЗ и совпадают ли ожидаемые результаты с ТЗ. Количество кейсов и аккуратность формулировок о качестве не говорят. В обосновании стоит назвать хотя бы два признака: сверяем с требованиями; ИИ проверяет своё понимание задачи и может додумать; отсюда пропуски в покрытии и неверные ожидаемые результаты."}, "T05": {"type": "c", "q": "После вчерашнего мержа в ночном прогоне упал автотест оплаты: «скидка 15% при оплате за год: expected 85 000, received 100 000». Агент разобрал лог и предлагает «починить тест» — заменить ожидаемое значение на 100 000. Что делаете?", "opts": [{"t": "Принимаю правку агента: он разобрал лог, прогон снова зелёный, релиз не задерживается", "g": 1, "fb": "Прогон станет зелёным, но тест перестанет проверять скидку. Если её сломал вчерашний мерж, студенты начнут платить 100 000 вместо 85 000, и об этом никто не узнает. Сначала стоит выяснить, какое из двух чисел правильное."}, {"t": "Сверяю с требованиями и вчерашним диффом, какая сумма верная: если скидку сломал код — завожу баг, тест не трогаю", "g": 5, "fb": "Это и есть разбор падения: сначала понять, что должно быть по требованиям, потом решать, где проблема — в коде или в тесте. Агент здесь полезен для поиска места в диффе, а решение остаётся за вами."}, {"t": "Помечаю тест как skip, чтобы прогон не мешал релизу, и завожу задачу разобраться после выкатки", "g": 2, "fb": "Причина останется неизвестной, а релиз уйдёт с возможной поломкой скидки. Сверка с требованиями и вчерашним диффом занимает минут пятнадцать — её стоит сделать до выкатки."}, {"t": "Отклоняю правку агента и пересылаю лог разработчику без разбора: пусть сам решает, что с этим делать", "g": 3, "fb": "Тест останется честным — это хорошо. Но разбор падения — часть вашей работы: стоит добавить, какая сумма верна по требованиям и какой коммит изменил расчёт, тогда разработчик получит баг-репорт, а не загадку."}], "why": "потому|так как|требован|тз|баг|причин|провер|ожида|маскир|скрыва|скрое|скидк|код|слома|дифф|мерж"}, "G03": {"type": "p", "q": "Нужна обложка для анонса программы «Продуктовый дизайн» (старт 1 октября) — для сайта и VK, 1200×630. Фирменный стиль: синий #1D4ED8, белый фон, крупная геометрия, без фотографий; сам брендбук во внешний генератор загружать нельзя. Напишите запрос в Recraft на концепт обложки.", "checks": [["Что за изображение и для чего", "облож|анонс|баннер|программ|иллюстрац"], ["Стиль и образцы: цвета, характер графики", "стил|фирмен|цвет|син[иеяю]|#1d4ed8|минимал|референс|образ|палитр|в духе|геометр|плоск"], ["Композиция и формат: размер, где место под текст", "композиц|формат|размер|1200|пропорц|горизонт|место под|слева|справа|центр|соотношен|поля|свободн"], ["Ограничения: чего на картинке быть не должно", "без |не (добавля|использ|рису|пиш|нужно)|огранич|избега|никаких|исключ"], ["Что проверить или доработать по результату", "провер|уточн|доработ|вариант|итерац|поправ|сравн|затем|после"]], "good": "Готово: 4 варианта 1200×630. Белый фон, справа — композиция из крупных синих (#1D4ED8) кругов и дуг, складывающихся в условный экран интерфейса; левая треть пустая под заголовок и дату. Текста, логотипов, людей и градиентов нет. В варианте 3 геометрия заходит на поле под текст — могу сдвинуть её на 80 px вправо или уменьшить. Какой вариант берём в доработку?", "poor": "Вот обложка на тему «дизайн»: синий градиент, фотография ноутбука, на экране надпись «DESIGN COURSE». Чтобы попасть в ваш стиль, уточните: какие цвета и какая графика, какой размер, где оставить место под заголовок и чего на картинке быть не должно?"}, "K02": {"type": "p", "q": "Вам поручили айдентику Дня открытых дверей 18 октября. В брифе: аудитория — школьники 16–18 лет и их родители; носители — ролл-ап, афиша А3 и сторис; два фирменных цвета; без стоковых фото людей. Поставьте агенту (Claude Cowork) задачу собрать подборку референсов, с которой можно идти к арт-директору.", "checks": [["Задача: подборка референсов и под что именно", "референс|подборк|пример|образц|мудборд"], ["Бриф: мероприятие, аудитория, носители", "бриф|аудитор|школьник|абитуриент|родител|открытых дверей|мероприят|ролл|афиш|сторис|носител|айдентик"], ["Формат: сколько, как сгруппировать, что написать про каждый", "таблиц|ссылк|групп|количеств|штук|\\d+ ?(референс|пример|вариант|образц)|коммент|почему|формат|спис|кратк"], ["Ограничения из брифа и по источникам", "без |не (бери|включа|использ|добавля|старше)|огранич|только|исключ|не более|два цвета|двух цвет"], ["Что проверить: источники, права, рабочие ссылки", "провер|уточн|источник|прав|лиценз|актуальн|спроси|откуда"]], "good": "Собрал 14 референсов айдентики образовательных мероприятий за 2023–2025 годы, в трёх группах: крупная типографика (5), геометрия и паттерны (5), иллюстрация (4). По каждому — ссылка на источник, носитель, что именно стоит взять и как это ложится на два цвета. Фото людей нет ни в одном. Два примера — работы студий с портфолио на Behance: как образец для обсуждения подходят, копировать приёмы один в один не стоит. Три ссылки открываются только после входа — отметил их в таблице.", "poor": "Вот 30 красивых афиш и баннеров. Подскажите, пожалуйста: для какого мероприятия и аудитории подборка, на каких носителях будет айдентика, какие есть ограничения по цветам и фото и в каком виде вам удобно — списком ссылок или таблицей с комментариями? Пока подборка получилась общей."}, "R02": {"type": "p", "q": "К четвергу команда обсуждает новый экран «Мои курсы» в личном кабинете студента. По опросу 70% заходят с телефона, чтобы понять, что сдавать на этой неделе, а сейчас курсы идут списком по алфавиту. Напишите запрос в v0 или Figma AI на черновой прототип экрана к обсуждению.", "checks": [["Какой экран и какую задачу он решает", "мои курсы|курс|кабинет"], ["Кто пользователь и зачем он приходит", "студент|пользовател|заочн|телефон|смартфон|хочет|нужно (быстро|увидеть|понять)|сценари|приходит|заходит"], ["Состав экрана и формат результата", "карточк|прогресс|дедлайн|срок сдач|кнопк|блок|сетк|вайрфрейм|мобильн|десктоп|состоян|сортир|черновик|чернов"], ["Ограничения: компоненты, данные, чего не добавлять", "без |не (добавля|придум|использ|выдум)|огранич|только|дизайн-систем|компонент|условн"], ["Что проверить, уточнить или сравнить", "провер|уточн|спроси|вопрос|вариант|сравн|предлож"]], "good": "Собрал черновой мобильный экран 375 px. Сверху блок «Сдать на этой неделе»: 2 задания с дедлайнами и кнопкой «Перейти». Ниже — карточки курсов, отсортированные по ближайшему дедлайну: название, прогресс в процентах, следующее занятие. Пустое состояние — «На этой неделе сдавать нечего». Использовал только карточку, прогресс-бар и кнопку; данные условные. Для обсуждения: показывать ли завершённые курсы отдельной вкладкой или сворачивать их внизу? Могу собрать второй вариант.", "poor": "Вот экран «Мои курсы»: сетка из шести карточек с обложками, рейтингом и кнопкой «Купить». Чтобы прототип был про вашу задачу, уточните: кто пользователь и зачем он заходит на экран, что должно быть видно первым, мобильный это экран или десктоп и какими компонентами пользоваться?"}, "R05": {"type": "c", "q": "Для экрана записи на курс Figma AI собрал эффектный вариант, и продакту он понравился больше остальных. При проверке видно: отступы 10 и 18 px вместо шага 8, карточка нестандартной ширины, кнопка не из библиотеки. Завтра передача в разработку. Что делаете?", "opts": [{"t": "Передаю как есть: вариант понравился продакту, а отступы и кнопку разработчики поправят по ходу вёрстки", "g": 1, "fb": "Разработчики сверстают то, что нарисовано: появятся кнопка и карточка, которых нет в библиотеке, и их придётся поддерживать отдельно. Проверку на соответствие дизайн-системе стоит сделать до передачи — она на вашей стороне."}, {"t": "Привожу вариант к сетке и компонентам библиотеки, сохраняя идею; спорное отдельно предлагаю владельцу дизайн-системы", "g": 5, "fb": "Идея остаётся, а в разработку уходит макет, который собирается из готовых компонентов. Если нестандартная карточка действительно лучше — это предложение в дизайн-систему, а не тихое исключение в одном экране."}, {"t": "Передаю с пометкой в макете: «отступы и кнопка нестандартные, верстайте в точности как нарисовано»", "g": 2, "fb": "Пометка честная, но она закрепляет отклонение: у экрана появятся свои отступы и своя кнопка, и через полгода таких экранов будет десять. Быстрее привести вариант к сетке сейчас — обычно это час работы."}, {"t": "Откладываю сгенерированный вариант и передаю прежний экран, собранный вручную строго по дизайн-системе", "g": 3, "fb": "В разработку уйдёт корректный макет — это надёжно. Но теряется находка, которая понравилась продакту: её можно сохранить, пересобрав вариант на сетке и на компонентах библиотеки."}], "why": "потому|так как|сетк|систем|компонент|библиотек|разработ|консистент|единообраз|поддерж|токен|отступ|идею|идея"}, "V02": {"type": "p", "q": "В понедельник нужен анонс Дня открытых дверей: 18 октября, 12:00, главный корпус, регистрация на сайте. Ролик на 15 секунд, вертикальный, для VK Клипов. У команды есть шаблон анонса в Remotion: заголовок, три титра, переходы и финальная плашка задаются параметрами. Напишите запрос ИИ-ассистенту, чтобы он собрал ролик из шаблона.", "checks": [["Что собираем: ролик-анонс из готового шаблона", "ролик|анонс|видео|шаблон"], ["Исходные данные: мероприятие, дата, тексты титров", "дат|октябр|12:00|назван|текст|титр|заголов|открытых дверей|мероприят|корпус|регистрац"], ["Формат: длительность, размер, тайминг сцен", "15|секунд|вертикал|9:16|1080|формат|тайминг|хронометраж|длительн"], ["Ограничения: что в шаблоне не менять", "без |не (меня|трога|добавля|использ)|только|огранич|фирмен|брендбук|шрифт|параметр"], ["Что проверить перед выгрузкой", "провер|уточн|читаем|покажи|превью|помещ|спроси|влез|успева"]], "good": "Заполнил параметры шаблона: заголовок «День открытых дверей», титры «18 октября, 12:00» → «Главный корпус» → «Встреча с деканами и экскурсия», финальная плашка «Регистрация на сайте». Формат 1080×1920, 15 секунд: заголовок 3 с, три титра по 3 с, финал 3 с, переходы — штатные из шаблона. Шрифты, цвета и код шаблона не менял. Третий титр не помещался в две строки — сократил до «Деканы и экскурсия»; посмотрите превью, устраивает ли формулировка и успевает ли текст прочитаться.", "poor": "Могу собрать ролик, но в шаблоне сейчас остались тексты-заглушки. Уточните, пожалуйста: какие заголовок и титры поставить, дата и место мероприятия, длительность и формат — вертикальный или горизонтальный? И можно ли менять шрифты и переходы или только параметры шаблона?"}, "W02": {"type": "p", "q": "Запускается серия интервью «Истории выпускников» — 12 выпусков для VK Видео и сайта. Нужна общая заставка на 4 секунды в фирменном стиле: синий #1D4ED8, белый, крупная геометрия; название серии вы наложите сами на монтаже. Напишите запрос в Runway или Kling на концепт заставки.", "checks": [["Что генерируем и для чего", "заставк|интро|открывающ|ролик|серии|серия"], ["Стиль и образцы: цвета, характер графики", "стил|фирмен|цвет|син[иеяю]|#1d4ed8|минимал|референс|образ|палитр|в духе|геометр|плоск|графи"], ["Композиция и формат: движение, длительность, место под название", "композиц|секунд|16:9|горизонт|движени|камер|центр|место под|формат|длительн|кадр|финал|свободн"], ["Ограничения: чего в кадре быть не должно", "без |не (добавля|использ|рису|пиш|нужно)|огранич|избега|никаких|исключ"], ["Что проверить или доработать по результату", "провер|уточн|вариант|доработ|поправ|сравн|затем|после"]], "good": "Сгенерировал 3 варианта по 4 секунды, 16:9, 1920×1080. Белый фон; синие (#1D4ED8) круги и дуги плавно съезжаются из-за краёв кадра и к третьей секунде образуют рамку, центр кадра остаётся пустым под название серии. Камера статична, текста, логотипов, людей и градиентов нет. В варианте 2 на последних кадрах дуга слегка дрожит — могу перегенерировать финал или замедлить движение. Какой вариант дорабатываем?", "poor": "Вот заставка: неоновые частицы летят на камеру, в финале — объёмная надпись «ALUMNI STORIES» на тёмном фоне. Чтобы попасть в ваш стиль, уточните: какие цвета и графика, сколько секунд и какой формат кадра, где оставить место под название и чего в кадре быть не должно?"}, "Y02": {"type": "p", "q": "Пришёл бриф на ролик для приёмной кампании: магистратура «Управление образовательными проектами», аудитория — работающие специалисты 25–35 лет, главная мысль — «учёба совмещается с работой», хронометраж 60 секунд, один съёмочный день в кампусе, без актёров. Напишите запрос к ИИ, чтобы получить раскадровку и варианты сценария к встрече с заказчиком.", "checks": [["Что нужно: раскадровка и варианты сценария", "раскадровк|сценари|сторибор"], ["Бриф: программа, аудитория, главная мысль", "бриф|аудитор|специалист|абитуриент|программ|магистрат|посыл|мысл|цель|для кого|совмеща"], ["Формат: хронометраж, сцены, таблица, число вариантов", "60|минут|секунд|сцен|кадр|таблиц|хронометраж|вариант|закадр|план"], ["Ограничения производства и содержания", "без |не (добавля|придум|использ|выдум)|огранич|только|бюджет|один (съ[её]мочн|день)|кампус"], ["Что проверить или уточнить: факты, цифры, реализуемость", "провер|уточн|спроси|вопрос|факт|цифр|реализуем|пометь|отметь"]], "good": "Два варианта сценария на 60 секунд, в каждом таблица из 8 сцен: хронометраж, что в кадре, крупность, закадровый текст. Вариант А — «День студента»: утро на работе, вечер в кампусе, защита проекта. Вариант Б — три коротких истории реальных студентов с титрами. Оба снимаются за один день в кампусе, без актёров — в кадре студенты и преподаватели. Цифр о программе я не придумывал: в сценах 5 и 7 стоят пометки «нужен факт от заказчика» — длительность обучения и формат занятий. Сцена 3 варианта А требует офисной локации — уточните, есть ли она, или заменю на переговорную в кампусе.", "poor": "Вот сценарий рекламного ролика об университете: дрон над кампусом, актёры в роли студентов, слоган «Будущее начинается здесь», 95% выпускников находят работу. Чтобы сделать раскадровку под вашу задачу, уточните: какая программа и аудитория, главная мысль, хронометраж, условия съёмки и в каком виде нужен результат?"}, "P03": {"type": "p", "q": "Приёмная комиссия заказала чат-бот для ответов абитуриентам: запуск к 1 июня, бюджет 1,8 млн ₽, команда из четырёх человек. Вводные — в письме заказчика и в переписке в корпоративном чате. Напишите запрос к ИИ, чтобы получить черновик устава проекта.", "checks": [["Суть: какой документ и по какому проекту", "устав|чат-?бот|вводн|паспорт проект|цел[ьи] проект"], ["Исходные материалы и роли: письмо заказчика, переписка, команда", "заказчик|при[её]мн|письм|переписк|команд|спонсор|роль|роли"], ["Формат: разделы устава, объём", "раздел|структур|шаблон|объ[её]м|страниц|таблиц|пункт"], ["Ограничения: срок, бюджет, ничего не додумывать", "не (додум|придум|выдум)|бюджет|1,8|срок|июн|только (из|по|то)|без "], ["Что проверить или уточнить у заказчика", "провер|уточн|пометь|отметь|вопрос|пробел|не хвата|неясн"]], "good": "Устав проекта «Чат-бот для абитуриентов». Цель: к 1 июня снять с операторов приёмной комиссии типовые вопросы. Заказчик — приёмная комиссия, бюджет 1,8 млн ₽, команда — 4 человека, роли расписаны. Разделы: цель, границы, результаты, сроки, бюджет, команда, допущения. Вопросы к заказчику, которых нет во вводных: кто принимает результат, какая доля обращений считается успехом, кто отвечает за базу ответов.", "poor": "Могу предложить общий шаблон устава: цель, сроки, бюджет, команда, риски. Чтобы заполнить его под ваш проект, пришлите вводные заказчика: что запускаем, к какой дате, в каком бюджете и кто в команде. Какие разделы приняты в вашем проектном офисе?"}, "P06": {"type": "c", "q": "Проект — электронное личное дело абитуриента к старту приёмной кампании 20 июня. ИИ составил реестр из двенадцати рисков: восемь звучат как «нехватка ресурсов» и «срыв сроков», четыре — про ваш проект (обмен с 1С не протестирован, подрядчик уходит в отпуск в июле). Завтра реестр нужно показать заказчику. Что делаете?", "opts": [{"t": "Отправляю все двенадцать рисков с оценками вероятности и влияния, которые поставил ИИ: реестр выглядит полным, а заказчик сам увидит, что для него важно.", "g": 2, "fb": "Реестр получится длинным, но не рабочим: восемь строк подойдут любому проекту, и четыре настоящих риска в них потеряются. Оценки ИИ без вашего знания проекта — догадка. Стоит привязать каждый риск к проекту до отправки."}, {"t": "Оставляю четыре конкретных, а каждый общий разбираю с ИИ и командой: чем он оборачивается именно здесь и когда. Что не конкретизируется — убираю, остальным назначаю владельцев.", "g": 5, "fb": "Так и работает разбор рисков с ИИ: «нехватка ресурсов» превращается в «единственный аналитик занят на приёмной кампании до 15 июня» — или уходит из реестра. Команда добавит то, чего ИИ о проекте не знает, а у каждого риска появится владелец."}, {"t": "Убираю восемь общих рисков как шаблонные и отправляю заказчику четыре конкретных: короткий реестр лучше длинного, а времени до завтра немного.", "g": 3, "fb": "Отсеять шаблонное — верный ход. Но за общей формулировкой иногда стоит настоящий риск: «срыв сроков» может значить, что тестирование попадает на пик кампании. Добавьте шаг: попробовать конкретизировать общие риски и спросить команду, чего в списке нет."}, {"t": "Прошу ИИ сгенерировать ещё двадцать рисков, чтобы было из чего выбирать, и отбираю из большого списка те, что выглядят правдоподобно для заказчика.", "g": 1, "fb": "Без новых вводных о проекте ИИ выдаст ещё двадцать общих формулировок — выбор станет шире, но не точнее. Полезнее дать ему контекст: сроки кампании, интеграции, состав команды — и конкретизировать то, что уже есть."}], "why": "потому|так как|конкретн|шаблон|общи[ехй]|проект|владел|команд|контекст|реальн|заказчик"}, "C03": {"type": "p", "q": "Через 20 минут звонок Марине: интересуется магистратурой «Управление персоналом», за два месяца три контакта, последний — с ИИ-консультантом, обсуждали рассрочку. Вся история — в карточке клиента в CRM. Напишите запрос ИИ-помощнику в CRM, чтобы подготовиться к звонку.", "checks": [["Задача: подготовка к звонку этому клиенту", "звон|разговор|подготов|созвон"], ["Исходные материалы: карточка, история контактов, диалог с ИИ-консультантом", "карточк|истори|crm|консультант|переписк|прошл|контакт"], ["Формат: короткая сводка по пунктам", "сводк|коротк|кратк|пункт|список|тезис|абзац|формат|структур"], ["Ограничения: только факты из карточки, ничего не додумывать", "не (додум|придум|выдум|предполаг)|только (из|по|факт|то)|без |дословн"], ["Что проверить: даты, условия, договорённости — со ссылкой на запись", "провер|свер|уточн|отметь|пометь|источник|дат[аыу]|откуда|когда именно"]], "good": "Сводка к звонку. 1) Интерес: магистратура «Управление персоналом», заочная форма (контакт 14.08). 2) Главный вопрос — рассрочка: ИИ-консультант 09.09 назвал условия, клиент решения не озвучил. 3) Возражение из первого звонка: совмещение с работой. 4) С чего продолжить: вернуться к рассрочке. Проверьте перед звонком: действуют ли названные условия рассрочки сейчас — в карточке они без даты тарифа.", "poor": "Марина интересуется обучением, с ней уже общались. Рекомендую уточнить её потребности и рассказать о преимуществах программы. Подскажите, что именно важно к звонку — история контактов, возражения, договорённости? И в каком виде удобнее получить результат?"}, "C07": {"type": "c", "q": "После звонка ИИ записал в карточку итог: «Клиент согласился оплатить первый семестр до 25 сентября». В разговоре клиент сказал другое: «Подумаю, посоветуюсь с мужем, наберите в пятницу». Что делаете?", "opts": [{"t": "Оставляю сводку как есть: клиент настроен хорошо и, скорее всего, оплатит, а текст сформировала система, и переписывать его вручную — не моя задача.", "g": 1, "fb": "В карточке останется согласие, которого не было: коллега выставит счёт, прогноз оплат покажет лишнюю сделку, а клиент получит давление вместо обещанного звонка. Итог обращения фиксирует менеджер, сводка ИИ — только черновик."}, {"t": "Сводку не трогаю, но ниже добавляю свой комментарий: «На самом деле клиент пока думает». Кто откроет карточку — прочитает оба текста и разберётся.", "g": 2, "fb": "В карточке окажутся два противоречащих итога, а отчёты и следующий коллега возьмут первый — от ИИ. Лучше исправить саму сводку по записи разговора и поставить задачу на пятницу."}, {"t": "Исправляю итог по записи разговора: «Решение не принято, советуется с семьёй, перезвонить в пятницу», ставлю задачу на звонок и сообщаю руководителю группы о неточности сводки.", "g": 5, "fb": "Итог совпадает с тем, что сказал клиент, следующий шаг назначен, а сигнал о неточности поможет понять, разовый это сбой или сводки стоит проверять внимательнее всей группе."}, {"t": "Исправляю в сводке фразу про согласие на «клиент думает» и закрываю обращение: главное, что неверного обязательства в карточке больше нет.", "g": 3, "fb": "Главное сделано — согласия, которого не было, в карточке нет. Не хватает двух вещей: договорённости о звонке в пятницу с задачей в CRM и сигнала о неточности сводки, чтобы её могли поправить."}], "why": "потому|так как|соглас|запис|разговор|факт|клиент|свер|карточк|обязательств|не говорил|не было"}, "L03": {"type": "p", "q": "Студент пишет в LMS: «Не сдал экзамен по статистике. Сколько раз можно пересдать, в какие сроки и платно ли это?» Правила — в «Положении о текущем контроле и промежуточной аттестации». Напишите запрос копилоту в LMS, чтобы получить готовый ответ студенту.", "checks": [["Суть вопроса: пересдача экзамена", "пересда|экзамен|аттестац|задолженност"], ["Кому отвечаем и на какой документ опираемся", "студент|куратор|регламент|положени|документ|приложен|прикладыва|текст"], ["Формат: короткое сообщение, тон, ссылка на пункт", "коротк|кратк|абзац|предложен|тон|дружелюб|вежлив|сообщен|формат|ссылк|пункт"], ["Ограничения: только по регламенту, ничего не обещать сверх него", "только (по|из|на|то)|не (додум|придум|выдум|обеща)|без |строго по|опирайся"], ["Что проверить: сроки, число попыток; чего в регламенте нет — пометить", "провер|уточн|пометь|отметь|нет в (регламент|положени|документ)|не указан|не найд|не сказано"]], "good": "Здравствуйте! По Положению о промежуточной аттестации (п. 5.3) экзамен можно пересдать дважды: первый раз преподавателю, второй — комиссии. Пересдачи бесплатные и проходят в сроки ликвидации задолженностей — их назначает деканат. Пометка для вас: конкретных дат этого семестра в Положении нет — уточните в графике деканата перед отправкой.", "poor": "Обычно в вузах экзамен можно пересдать один-два раза, условия зависят от правил учебного заведения. Чтобы ответ был точным, приложите регламент или укажите, на какой документ опираться. Кому адресован ответ и в каком тоне его написать?"}, "N02": {"type": "p", "q": "В четверг семинар по статистике у первого курса экономистов, тема — «Доверительные интервалы». Нужны пять задач с разбором типичных ошибок студентов. Напишите запрос к ИИ, чтобы получить черновик, который останется проверить.", "checks": [["Суть: задачи по конкретной теме", "задач|задани|доверительн|интервал"], ["Для кого: курс, направление, что уже прошли", "студент|курс|бакалавр|экономист|уровен|семинар|лекци|конспект|прошли|знают"], ["Формат: пять задач, решение, разбор типичных ошибок", "пять|5 |разбор|решени|типичн|ошиб|формат|таблиц"], ["Ограничения: сложность, только пройденный материал", "не (использ|выход|дава|сложнее)|без |только|в рамках|сложност"], ["Что проверить: расчёты, однозначность условий", "провер|пересчит|уточн|корректн|однозначн|решаем|свер|пометь"]], "good": "Задача 1. По выборке из 36 чеков средний чек — 1 240 ₽, стандартное отклонение — 300 ₽. Постройте 95%-й доверительный интервал. Решение: 1 240 ± 1,96·300/6 = [1 142; 1 338]. Типичная ошибка: делят на n, а не на √n. …Задачи 2–5 в том же виде, по возрастанию сложности. На что посмотреть вам: в задаче 4 выборка мала (n = 12) — нужен t-критерий; проверьте, проходили ли его.", "poor": "Вот пять задач по статистике: 1) Найдите среднее. 2) Постройте интервал… Уточните, пожалуйста: для какого курса и направления задачи, что студенты уже прошли и нужен ли разбор решений? Без этого сложность и формулировки — наугад."}, "E02": {"type": "p", "q": "К заседанию учёного совета нужен обзор пяти магистерских программ конкурентов по направлению «Бизнес-аналитика»: что преподают, сколько стоит, чем отличаются. Напишите запрос к ИИ с поиском (Perplexity или Deep Research), чтобы получить обзор, которому можно доверять.", "checks": [["Суть: обзор программ конкурентов", "обзор|сравн|конкурент|программ"], ["Контекст: направление, уровень, для кого обзор", "декан|факультет|магистр|бизнес-?аналит|направлен|вуз|университет|сов[еи]т"], ["Формат: таблица с критериями сравнения", "таблиц|столб|критери|формат|структур|стоимост|цен[аыу]|длительност|параметр"], ["Ограничения: официальные и актуальные данные, ничего не додумывать", "только|не (додум|придум|выдум)|официальн|актуальн|2026|без |не старше"], ["Источники и проверка: ссылка к каждому факту, пометка, где данных нет", "источник|ссылк|провер|url|пометь|отметь|не найден|подтвержд|дат[аыу] "]], "good": "Таблица: 5 программ × 6 критериев (вуз, длительность, формат, стоимость за год, ключевые модули, партнёры-работодатели). У каждой ячейки — ссылка на страницу программы и дата обращения. Пометки: стоимость программы №3 на сайте не опубликована — взята из агрегатора, нужно подтвердить; у программы №5 учебный план 2024 года.", "poor": "Популярные программы по бизнес-аналитике есть в нескольких ведущих вузах; стоимость — в среднем от 300 до 600 тысяч в год. Уточните, какой уровень образования интересует, по каким критериям сравнивать и нужны ли ссылки на источники?"}, "E04": {"type": "c", "q": "По итогам обзора рынка ИИ предлагает запустить магистратуру «Этика ИИ в образовании»: такой программы нет ни у одного из пяти конкурентов — «свободная ниша». Учёный совет через две недели. Что делаете?", "opts": [{"t": "Выношу концепцию на совет как свободную нишу: обзор показал, что конкурентов нет, а первым на рынке быть выгодно. Детали доработаем после решения.", "g": 1, "fb": "Программы может не быть у конкурентов и потому, что на неё нет спроса. Совет получит идею без единой цифры об абитуриентах и работодателях. Сначала стоит проверить спрос на реальных данных."}, {"t": "Прошу ИИ оценить объём рынка и число потенциальных абитуриентов по этой программе и добавляю его расчёт в концепцию как обоснование спроса.", "g": 2, "fb": "Вопрос верный — есть ли спрос, но оценка ИИ без источников остаётся предположением в виде цифр. Нужны данные, которые можно показать: вакансии, поисковые запросы, заявки из CRM."}, {"t": "Проверяю спрос на данных: вакансии на hh, статистика поисковых запросов, вопросы и заявки абитуриентов в CRM за прошлую кампанию, короткий опрос работодателей. На совет иду с цифрами.", "g": 5, "fb": "Концепцию готовит ИИ, а спрос подтверждают данные: рынок труда, интерес абитуриентов, мнение работодателей. С такими цифрами совет решает по фактам, а «ниша» либо подтверждается, либо честно снимается."}, {"t": "Предлагаю совету сразу запустить пилот — короткую программу ДПО на 30 мест по этой теме: набор сам покажет, есть ли интерес у рынка.", "g": 3, "fb": "Пилот — хороший способ проверить идею, но и он стоит времени преподавателей и бюджета на набор. Сначала — дешёвая проверка по имеющимся данным: вакансии, запросы, заявки в CRM. Пилот — следующим шагом, если спрос виден."}], "why": "потому|так как|спрос|данн|ниш|конкурент|вакан|заяв|провер|цифр|работодател|абитуриент"}, "X02": {"type": "p", "q": "За август в службу сервиса пришло 1 200 обращений: звонки, чат, почта. Выгрузка из CRM обезличена и лежит в таблице. К совещанию в понедельник нужен список повторяющихся причин с долями. Напишите запрос к ИИ.", "checks": [["Суть: причины обращений за месяц", "обращен|жалоб|причин"], ["Исходные данные: выгрузка, каналы, что в колонках", "выгрузк|файл|таблиц|колон|столб|канал|чат|звонк|почт|данн|crm"], ["Формат: причины с долями, количеством, примерами", "дол[яией]|процент|%|топ|частот|количеств|формат|цитат|пример"], ["Ограничения: не додумывать, одна причина на обращение, только обезличенное", "не (додум|придум|выдум|объедин)|только|без |обезлич|персональн|одн[ау] причин"], ["Что проверить: сумма долей, спорные обращения, выборка для ручной сверки", "провер|выборк|пересч|уточн|сумм|100|неясн|прочее|не удалось|сомнит|спорн"]], "good": "Причины обращений за август (1 200): 1) не приходит доступ к LMS после оплаты — 312 (26%); 2) вопросы по графику платежей — 228 (19%); 3) перенос сессии — 156 (13%) … «Прочее» — 96 (8%). Сумма — 100%. По каждой причине — три примера с номерами строк. 41 обращение отнесено с сомнением — список приложен для ручной проверки.", "poor": "Клиенты чаще всего обращаются по вопросам оплаты, доступа и расписания. Чтобы посчитать доли, пришлите выгрузку и уточните: какие в ней колонки, нужна ли одна причина на обращение и в каком виде показать результат?"}, "X03": {"type": "c", "q": "Речевая аналитика звонков показала: у оператора Ольги за неделю десять нарушений скрипта при среднем по группе — два. Раньше замечаний к ней не было. Что делаете?", "opts": [{"t": "Слушаю эти десять звонков: какой пункт скрипта пропущен и в каких ситуациях. Сравниваю с прошлыми неделями Ольги и с коллегами на таких же обращениях — и после этого говорю с ней.", "g": 5, "fb": "Отчёт показывает, где смотреть, а не что произошло. Десять нарушений могут оказаться одним пунктом скрипта, который не подходит к новому типу обращений, — тогда это вопрос к скрипту, а не к оператору. Разговор после разбора будет предметным."}, {"t": "Сразу приглашаю Ольгу на разговор, показываю отчёт аналитики с десятью нарушениями и прошу объяснить, что происходило на этой неделе.", "g": 3, "fb": "Поговорить с оператором нужно, и делать это быстро — правильно. Но без прослушанных звонков разговор пойдёт о цифре, а не о причине. Добавьте шаг до встречи: послушать звонки и сравнить с прошлыми неделями."}, {"t": "Назначаю всей группе повторное обучение по скрипту: если система фиксирует нарушения, значит, скрипт подзабыли, и освежить его полезно каждому.", "g": 2, "fb": "Данные говорят об одном операторе за одну неделю — для вывода о группе их мало. Обучение займёт время у тех, у кого нарушений нет, а причина у Ольги останется неизвестной. Сначала — разбор её звонков."}, {"t": "Снижаю Ольге оценку качества за неделю по данным отчёта: система считает всех одинаково, десять нарушений против двух — объективная разница.", "g": 1, "fb": "Решение о человеке принято по одной цифре за одну неделю. Аналитика могла неверно распознать речь или считать нарушением уместное отступление от скрипта. До выводов — прослушать звонки и понять, система это или случай."}], "why": "потому|так как|систем|единичн|случа|звон|послуш|причин|сравн|скрипт|данн|недел|разобра"}, "I02": {"type": "p", "q": "Из формы обратной связи в личном кабинете студента за семестр набралось 400 отзывов — выгрузка в таблице, без имён. Перед планированием квартала нужно понять, какие проблемы повторяются. Напишите запрос к ИИ.", "checks": [["Суть: повторяющиеся проблемы в отзывах", "отзыв|обратн[а-я]+ связ|проблем|жалоб"], ["Исходные данные и контекст: откуда отзывы, о каком продукте", "форм[аыеу]|личн|кабинет|студент|выгрузк|файл|таблиц|дизайнер|продукт|семестр"], ["Формат: темы с частотой и цитатами", "частот|количеств|сколько|цитат|топ|дол[яией]|процент|формат|групп"], ["Ограничения: цитаты дословно, не додумывать, без персональных данных", "дословн|не (додум|придум|выдум|перефраз|меня|обобщ)|только|без |обезлич|персональн"], ["Что проверить: номера строк у цитат, пересчёт, спорные отзывы", "провер|выборк|уточн|пересч|свер|номер|строк|не удалось|неясн|спорн|сомнит"]], "good": "Повторяющиеся проблемы (400 отзывов): 1) не найти расписание с телефона — 87 отзывов (22%): «три раза тыкаю, пока дойду до пар» (строка 114); 2) уведомления о дедлайнах приходят поздно — 64 (16%) … По каждой теме — 3 дословные цитаты с номером строки. 23 отзыва не отнесены ни к одной теме — список приложен.", "poor": "Студенты в целом довольны личным кабинетом, но отмечают неудобную навигацию и проблемы с уведомлениями. Чтобы дать частоту и цитаты, пришлите выгрузку и уточните: как группировать отзывы и в каком виде нужен результат?"}, "B04": {"type": "j", "multi": true, "q": "Перед вами шесть задач из обычной рабочей недели сотрудника любого отдела. Какие из них уже сейчас разумно делать вместе с ИИ в корпоративном чате? Отметьте всё подходящее.", "opts": [{"t": "Набросать черновик ответа на типовое письмо коллеги из смежного отдела", "ok": true}, {"t": "Сделать краткий пересказ 30-страничного регламента перед совещанием", "ok": true}, {"t": "Окончательно решить, кому из двух сотрудников отказать в отпуске", "ok": false}, {"t": "Собрать структуру и тезисы презентации к квартальному отчёту отдела", "ok": true}, {"t": "Назвать точный остаток бюджета отдела, не открывая учётную систему", "ok": false}, {"t": "Предложить пять вариантов формулировки объявления для сотрудников", "ok": true}], "why_q": "По какому признаку вы отбирали задачи? Одной-двумя фразами.", "kw": [["работа с текстом, черновики и рутина", "текст|чернов|рутин|повтор|типов|шаблон|пересказ|структур|набро|вариант"], ["результат легко проверить самому", "провер|свер|перечит|контрол|поправ|оцен(ю|ить|ива)|вижу"], ["решение и ответственность остаются за человеком", "решени|ответствен|за человек|о людях|про людей|судьб|сам[аи]? (реша|принима)|руководител"], ["точные данные берут из системы, а не у ИИ", "точн|цифр|данны|систем[аеуы]|выдум|придум|не знает|источник|бюджет|доступ"]], "need": 2, "ok_fb": "Отмечены задачи, где ИИ экономит время, и назван признак, по которому их отличают от остальных.", "fb": "С ИИ удобно делать четыре задачи: черновик письма, пересказ регламента, структуру презентации и варианты объявления. Это работа с текстом, где есть исходный материал, а результат вы за пару минут проверите и поправите сами. Решение об отпуске касается людей и остаётся за руководителем, а остаток бюджета — точная цифра, которую берут из учётной системы: ИИ её не знает и может назвать правдоподобную. В обосновании назовите хотя бы два признака отбора."}, "B06": {"type": "p", "q": "Вы вставили в корпоративный ИИ-чат новый порядок согласования отпусков и попросили: «Составь объявление для сотрудников». ИИ ответил: «Уважаемые коллеги! В компании меняется порядок согласования отпусков. Просим ознакомиться с новым порядком и соблюдать его. По вопросам обращайтесь в отдел кадров». В ответе нет главного: порядок действует с 1 ноября, заявление подают на корпоративном портале не позже чем за 14 дней. Напишите следующее сообщение ИИ, чтобы довести этот ответ до нужного, а не начинать заново.", "checks": [["Сказано, чего именно не хватает в ответе", "не хватает|нет (глав|дат|срок|конкрет|информ|свед)|пропу|не указан|не сказано|упущ|отсутств|добав|дополн|слишком общ|общие слова|включи|впиши"], ["Названо, что добавить: дата, срок, куда подавать", "1 ноября|ноябр|14|четырнадцат|портал|заявлен|дат[аыу]|за сколько|куда подавать"], ["Задан формат: объём, тон, структура", "коротк|короче|сократ|предложен|пункт|списк|абзац|тон|формат|прощ|заголов|выдел|структур"], ["Доработка прежнего ответа, а не новый текст с нуля", "остав|сохран|не (меня|трога|перепис|удаля)|остальн|тот же|этот (же )?(текст|вариант|ответ)|тво[йе][мг]?о? (текст|вариант|ответ)|доработ|исправ|поправ|обращени|концовк"], ["Что сверить с исходным документом", "провер|свер|убедись|уточн|по (порядк|регламент|документ)|соответств|не (придум|выдум|добавляй от)|только (из|по|то)|совпада"]], "good": "Доработал прежний вариант — обращение и концовку оставил. «Уважаемые коллеги! С 1 ноября меняется порядок согласования отпусков. Что важно: 1) заявление подаётся на корпоративном портале; 2) срок — не позже чем за 14 дней до начала отпуска. По вопросам обращайтесь в отдел кадров». Дата, срок и способ подачи взяты из вашего документа. Исключений для отпуска по семейным обстоятельствам в нём нет — если они действуют, пришлите формулировку, добавлю.", "poor": "Вот ещё один вариант: «Коллеги, обращаем ваше внимание на обновлённый порядок согласования отпусков. Просим внимательно его изучить». Подскажите, что именно не подошло в первом ответе, что нужно добавить и что оставить как есть, — тогда доработаю точечно, а не буду писать заново."}, "B07": {"type": "p", "q": "Руководитель попросил справку о пользе наставничества для новых сотрудников. ИИ написал: «По данным опроса рынка труда за 2024 год, 67 % новичков с наставником проходят испытательный срок быстрее. Срок адаптации в среднем сокращается на 30 %. Подробнее — в отчёте “Адаптация персонала — 2024” на сайте исследовательского центра». Через два часа справку нужно отправить. Напишите запрос к ИИ, который поможет подготовить её к отправке: проверить сомнительные места и пометить, что проверено.", "checks": [["Задача: проверить факты справки до отправки", "провер|свер|подтверд|достоверн|откуда|обоснов"], ["Что именно проверяем: две цифры, ссылка, источник", "цифр|процент|67|30|ссылк|источник|отч[её]т|опрос|исследован"], ["Формат: таблица или пометки у каждого утверждения", "таблиц|списк|по пунктам|столб|статус|пометь|помет|отметь|формат|рядом с|напротив|кажд(ое|ого|ому) утвержд"], ["Ограничение: не выдумывать источники, честно писать «не знаю»", "не (придум|выдум|домысл|подставл|сочин|добавля)|если (не|нет)|честно|напиши,? что не|без |только (реальн|существ|то)|огранич"], ["Что остаётся на ручную проверку и как помечается результат", "проверено|вручную|руками|сам[аи]? (откро|провер|найд|свер|перейд)|открою|перейду|не подтвержд|убер|удал|замен|оригинал|первоисточник|по нашим данным|найду"]], "good": "Таблица для проверки. 1) «67 % новичков с наставником быстрее проходят испытательный срок» — источник: я не могу назвать конкретный опрос, цифра требует первоисточника; статус: не подтверждено. 2) «Адаптация сокращается на 30 %» — встречается в обзорах как оценка, точного исследования не назову; статус: не подтверждено. 3) Отчёт «Адаптация персонала — 2024» — не уверен, что документ с таким названием существует; откройте сайт центра и проверьте сами. Что сделать до отправки: найти первоисточник или заменить цифры данными вашего отдела кадров; подтверждённое пометить «проверено, источник, дата», остальное убрать из справки.", "poor": "Я перечитал справку: текст выглядит логичным и непротиворечивым, цифры правдоподобны. Если нужно что-то большее — уточните, какие именно утверждения проверить, в каком виде показать результат и как поступить с тем, для чего я не смогу назвать источник."}, "B08": {"type": "c", "q": "Вы готовите письмо партнёрским школам о сроках приёма и спросили ИИ, до какого числа принимают документы. Ответ: «По приказу Минобрнауки № 1187 от 2025 года — до 25 августа». На официальном портале правовых актов приказа с таким номером о сроках приёма вы не нашли. Письмо уходит через час. Что делаете?", "opts": [{"t": "Оставляю как есть: ИИ назвал точный номер и год приказа, а такие подробности обычно не появляются из ниоткуда", "g": 1, "fb": "Точные реквизиты — как раз то, что ИИ дописывает охотнее всего: номер и год звучат убедительно и тогда, когда документа нет. Школы получат письмо со ссылкой, которую нельзя найти."}, {"t": "Срок беру из правил приёма на сайте вуза; ИИ даю текст документа и прошу отвечать только по нему, отмечая пробелы", "g": 5, "fb": "Оба шага на месте. Срок вы взяли руками из первоисточника, без ссылки на ненайденный приказ, а запрос исправили так, чтобы ИИ опирался на документ, а не на память, и показывал пробелы."}, {"t": "Упоминание приказа из письма убираю, а дату 25 августа оставляю: она совпадает с тем, что было в прошлом году", "g": 3, "fb": "Несуществующей ссылки в письме не будет — это полезно. Но дата пришла из того же ответа и тоже не сверена: сроки приёма меняются каждый год, их стоит взять из действующих правил приёма."}, {"t": "Прошу ИИ перепроверить ответ и прислать ссылку на приказ; если он подтвердит номер и дату — отправляю письмо", "g": 2, "fb": "ИИ, который дописал номер приказа, так же уверенно допишет и ссылку на него. Подтверждение нужно от первоисточника: портала правовых актов или правил приёма на сайте вуза."}], "why": "потому|так как|поскольку|риск|провер|свер|первоисточник|источник|документ|выдум|придум|реквизит|не существ|чтобы|отвеча|запрос"}, "B09": {"type": "c", "q": "До завтра нужно разослать 60 участникам программы уведомления об изменении условий договора. У вас таблица с ФИО, телефонами и суммами доплат; текст должен опираться на пункт 4.2 договора. Под рукой корпоративный ИИ-чат и внешний ИИ-сервис. Как делите работу?", "opts": [{"t": "Загружаю таблицу и договор во внешний ИИ-сервис и прошу сразу 60 готовых писем: так быстрее всего, а тексты потом просмотрю по диагонали", "g": 1, "fb": "Рутина закрыта, но цена высока: ФИО, телефоны и суммы ушли за пределы компании, а формулировку об условиях договора никто не проверил. Риск здесь несоразмерен сэкономленному часу."}, {"t": "Шаблон без имён и сумм пишу с ИИ, формулировку по пункту 4.2 согласую с юристом, данные подставляю слиянием в почте и сверяю выборочно", "g": 5, "fb": "Задача разделена по цене ошибки: ИИ получил текстовую рутину без данных людей, юридическая формулировка прошла через специалиста, а персональные данные остались в таблице и почте."}, {"t": "Делаю всё вручную без ИИ: в задаче и персональные данные, и договор, поэтому надёжнее вообще его не подключать, даже если уйдёт день", "g": 3, "fb": "Данные и договор в безопасности. Но черновик шаблона без имён и сумм ничем не рискует — эту часть можно было отдать ИИ и потратить освободившееся время на сверку сумм."}, {"t": "Загружаю таблицу и договор в корпоративный ИИ-чат, прошу готовые письма с формулировкой по договору и рассылаю сам, не отвлекая юриста", "g": 2, "fb": "Данные остались внутри компании — это верно. Но формулировка об изменении условий договора ушла 60 людям без юриста, а суммы в письмах никто не сверил: ошибка здесь стоит дороже, чем час согласования."}], "why": "потому|так как|поскольку|риск|цен[аеуы] ошибк|персональн|данн|юрист|юридич|договор|рутин|провер|свер|чтобы|отвеча|утечк"}, "U01": {"type": "m", "q": "Вы руководите группой и готовите в ИИ-чате материалы к полугодовым встречам с сотрудниками. Какие из этих сведений о людях нельзя передавать ИИ? Отметьте всё подходящее.", "opts": [{"t": "Оценки сотрудников по итогам аттестации вместе с фамилиями", "ok": true}, {"t": "Размеры окладов и премий каждого участника вашей группы", "ok": true}, {"t": "Сведения о больничных и семейных обстоятельствах сотрудника", "ok": true}, {"t": "Текст должностной инструкции без имён и личных сведений", "ok": false}, {"t": "Общее число задач, которые группа закрыла за квартал", "ok": false}], "ok_fb": "Верно: оценки, зарплаты и личные обстоятельства людей в ИИ не передаются; обезличенные документы и общая статистика — можно.", "fb": "В ИИ не передают три вида сведений о сотрудниках: оценки и результаты аттестации, зарплаты и премии, личные обстоятельства — здоровье, семья. Должностная инструкция без имён и общая статистика группы никого не раскрывают, с ними работать можно. Если нужна помощь с текстом для встречи, опишите ситуацию без имён и без этих сведений."}, "U03": {"type": "p", "q": "В группе потока «Интернет-маркетинг» за сентябрь ушли 9 слушателей из 60 — обычно уходят 3–4. Вы хотите поручить менеджеру сопровождения Ксении «разобраться с оттоком в группе». Напишите запрос к ИИ, чтобы превратить эту фразу в постановку задачи: ожидаемый результат, срок и критерии приёмки.", "checks": [["Контекст: что за отток и в каких цифрах", "отток|ушл|уход|отчисл|9 |девят|слушател|групп"], ["Кому ставим задачу и на каких данных", "менеджер|ксени|подчин[её]н|сотрудник|исполнител|crm|выгрузк|данны|обзвон|опрос"], ["Ожидаемый результат и его вид", "результат|причин|списк|таблиц|страниц|отч[её]т|предложен|план|формат|структур|вывод"], ["Срок и критерии приёмки", "срок|до \\d|к \\d|пятниц|недел|дней|критери|при[её]мк|приму|считается|готов[оа]? (, )?(если|когда)"], ["Что уточнить и чего не додумывать", "уточн|вопрос|провер|не хватает|пометь|предполож|не (придум|выдум|додум)|свер|спроси"]], "good": "Постановка для Ксении. Контекст: в сентябре из группы ушли 9 слушателей из 60 при обычных 3–4. Результат: таблица по девяти ушедшим — причина со слов слушателя, дата последней активности в LMS, был ли контакт куратора — и три предложения, что изменить в октябре; объём — одна страница. Срок: до пятницы, 10 октября. Принимаю, если: причины получены от самих слушателей не меньше чем в семи случаях из девяти, у каждого предложения есть ответственный и срок, цифры сходятся с CRM. Уточните до выдачи задачи: есть ли у Ксении доступ к выгрузке LMS и можно ли звонить тем, кто оформил возврат.", "poor": "Задача: проанализировать отток в группе и подготовить предложения. Чтобы постановка получилась рабочей, уточните: о какой группе и каких цифрах речь, кому адресована задача, что должно быть на выходе, к какому сроку и по каким признакам вы поймёте, что работа сделана."}, "U05": {"type": "c", "q": "Вы готовитесь к полугодовой оценке восьми сотрудников и загрузили в корпоративный ИИ-чат выгрузку из трекера под кодами вместо фамилий: закрытые задачи, сроки, возвраты на доработку. ИИ предлагает: «Могу ранжировать команду по эффективности и выделить двух самых слабых». Что делаете?", "opts": [{"t": "Соглашаюсь: рейтинг от ИИ беспристрастнее моего взгляда, двух нижних сразу беру в план серьёзного разговора", "g": 1, "fb": "Рейтинг строится только на том, что попало в трекер: сложность задач, больничный или помощь коллегам в нём не видны. Решение о людях в таком виде фактически принимает ИИ, а отвечать за него вам."}, {"t": "От рейтинга отказываюсь; прошу по каждому свести факты с источником, без выводов. Контекст и оценку добавляю сам", "g": 5, "fb": "ИИ делает то, что умеет хорошо, — собирает факты в удобный вид. Контекст, которого нет в трекере, и сама оценка остаются за вами, как и разговор с каждым сотрудником."}, {"t": "Прошу рейтинг, но только для себя: сотрудникам его не показываю и учитываю как одно из мнений при оценке", "g": 3, "fb": "Осторожность здесь есть. Но увиденный рейтинг трудно «развидеть»: он задаёт первое впечатление ещё до разговора с человеком. Надёжнее просить факты по каждому, а не готовые места."}, {"t": "Прошу ИИ сначала описать формулу эффективности и веса показателей, чтобы рейтинг получился объективным", "g": 2, "fb": "Прозрачная формула лучше непрозрачной, но и она считает только то, что есть в трекере. Вывод о человеке по-прежнему делает ИИ — руководителю остаётся лишь подписать."}], "why": "потому|так как|поскольку|риск|решени|контекст|факт|ответствен|руководител|человек|люд|оценк|чтобы|не вид|якор|предвзят"}, "S01": {"type": "m", "q": "Ваши звонки с клиентами записываются и хранятся в системе речевой аналитики. Какие из этих действий с записью разговора допустимы? Отметьте всё подходящее.", "opts": [{"t": "Слушаю свой звонок и читаю расшифровку в системе с рабочего компьютера", "ok": true}, {"t": "Скачиваю запись и отправляю коллеге в личный мессенджер, чтобы посоветоваться", "ok": false}, {"t": "Копирую расшифровку с именем и телефоном клиента во внешний ИИ-чат для разбора", "ok": false}, {"t": "Отправляю руководителю ссылку на звонок внутри системы, чтобы разобрать вместе", "ok": true}], "ok_fb": "Верно: запись и расшифровка остаются в системе, а делятся ими ссылкой с теми, у кого есть доступ.", "fb": "Запись разговора с клиентом живёт внутри системы: там её слушают, читают расшифровку и делятся ссылкой с руководителем, у которого есть доступ. Файл в личном мессенджере и расшифровка во внешнем ИИ-чате выносят имя, телефон и обстоятельства клиента за пределы компании. Для разбора есть встроенный ИИ-помощник системы, а хранятся и удаляются записи по регламенту — собственные копии для этого не нужны."}, "S02": {"type": "m", "q": "Вы нашли в системе речевой аналитики свой вчерашний звонок с абитуриентом и открыли автоматический разбор. Что в него входит? Отметьте всё подходящее.", "opts": [{"t": "Темы разговора и возражения, которые прозвучали от клиента", "ok": true}, {"t": "Отметки о том, какие этапы скрипта соблюдены, а какие нет", "ok": true}, {"t": "Оценка качества разговора и замечания к отдельным моментам", "ok": true}, {"t": "Решение руководителя о вашей премии по итогам этого месяца", "ok": false}, {"t": "Паспортные данные и адрес клиента из других систем компании", "ok": false}], "ok_fb": "Верно: в разборе — темы, возражения, соблюдение скрипта и оценка качества с замечаниями.", "fb": "Автоматический разбор строится только по самому разговору: темы, возражения клиента, соблюдение скрипта по этапам и оценка качества с замечаниями. Он открывается из карточки звонка рядом с записью и расшифровкой. Решений о премии в нём нет — это материал для вашей работы и разговора с руководителем. Данных клиента из других систем там тоже нет."}, "S04": {"type": "p", "q": "В подборке эталонных звонков в речевой аналитике есть разговор вашей коллеги. На «мне нужно подумать» она отвечает: «Конечно. Чтобы было проще решить — что вам важнее сверить: расписание или стоимость?» — и договаривается о звонке в четверг в 12:00. У вас после «я подумаю» клиенты чаще всего пропадают. Напишите запрос встроенному ИИ-помощнику системы, чтобы разобрать этот приём и перенести его в свои разговоры.", "checks": [["Задача: разобрать приём из эталонного звонка", "эталон|при[её]м|образц|коллег|фрагмент|пример звонк"], ["Своя ситуация: где это нужно в моих звонках", "мои[хм]? |своих|свои |у меня|мой |моей|мне |подума|пропада|не перезванива"], ["Формат: шаги приёма и варианты фраз", "шаг|пункт|фраз|формулиров|вариант|коротк|таблиц|формат|скрипт|по частям|структур"], ["Ограничения: не копировать дословно, без общих советов", "не (копир|придум|выдум|обобщ|повторя)|дословн|без |только (из|по|на|то)|сво(ими|им) слов|под мо|огранич|общих"], ["Проверка: места в моих звонках, куда приём подходит", "цитат|таймкод|номер[аы]? звонк|в каких (моих )?звонках|провер|подтвер|свер|покажи|найди|места|за (недел|месяц)"]], "good": "Приём коллеги из трёх шагов: 1) согласие без спора («Конечно»); 2) вопрос с выбором, который превращает «подумаю» в конкретное сомнение — расписание или стоимость; 3) следующий контакт с днём и временем. В ваших звонках за неделю «я подумаю» прозвучало в № 2, 5 и 8: во всех трёх разговор закончился фразой «хорошо, буду ждать звонка» без даты. Варианты под ваши программы: «Понимаю. Подскажите, что хочется взвесить — нагрузку по времени или оплату?»; «Давайте я наберу вас в среду после 15:00 — к этому времени успеете обсудить дома?» Сверьте цитаты по расшифровкам: в звонке № 5 реплика клиента записана неразборчиво.", "poor": "Коллега хорошо работает с возражением: она вежлива и удерживает контакт с клиентом. Советую внимательнее слушать клиента и назначать следующий шаг. Уточните, в каких ваших звонках искать похожие моменты и в каком виде дать разбор — по шагам, с вариантами фраз? Тогда отвечу предметно."}, "P01": {"type": "m", "q": "Вы готовите документы по проекту и хотите ускориться с помощью внешнего ИИ-сервиса (не корпоративного ИИ-чата). Перед вами шесть фрагментов проектных документов. Отметьте те, которые можно отправить наружу.", "opts": [{"t": "Строка сметы: «Этап 2 — 640 тыс. ₽, резерв 10%, оплата после акта»", "ok": false}, {"t": "Шаблон протокола встречи: разделы и поля, без названий и имён", "ok": true}, {"t": "Пункт договора с подрядчиком: штраф 0,1% за день просрочки", "ok": false}, {"t": "Список участников пилота: ФИО, учебная группа, мобильный телефон", "ok": false}, {"t": "Структура плана-графика: названия этапов без дат, сумм и фамилий", "ok": true}, {"t": "Описание метода оценки рисков из опубликованного стандарта", "ok": true}], "ok_fb": "Верно: наружу уходят шаблоны, обезличенные структуры и опубликованные материалы. Бюджеты, условия договоров и персональные данные остаются внутри.", "fb": "Во внешний сервис можно отправить то, что не раскрывает проект: пустой шаблон, структуру без дат, сумм и имён, опубликованный стандарт. Сметы, условия договоров и списки людей с контактами обрабатываются только в корпоративном ИИ-чате."}, "P02": {"type": "j", "multi": true, "q": "На этой неделе по проекту нужно подготовить шесть документов. Для каких из них стоит собрать черновик с ИИ в корпоративном чате, потому что это заметно сэкономит время? Отметьте всё подходящее.", "opts": [{"t": "Протокол часовой встречи с заказчиком — по расшифровке записи", "ok": true}, {"t": "Заявка на пропуск для подрядчика — три поля в системе охраны", "ok": false}, {"t": "Статус-отчёт за неделю — по таблице задач и чату команды", "ok": true}, {"t": "Акт сдачи-приёмки — по утверждённой форме бухгалтерии", "ok": false}, {"t": "План коммуникаций проекта — по вводным из устава и типовой структуре", "ok": true}, {"t": "Допсоглашение об изменении цены договора — его готовит юрист", "ok": false}], "why_q": "По какому признаку вы отделили подходящие документы от остальных? Одной-двумя фразами.", "kw": [["объёмный текст с типовой структурой", "структур|типов|шаблон|объ[её]м|много текст|больш|длинн"], ["есть исходные материалы, из которых собирается черновик", "исходн|материал|расшифровк|чат|таблиц|источник|вводн|собра|собир"], ["короткую форму быстрее заполнить самому", "форм[аыеу]|бланк|пол[яей][ ,.]|быстрее|минут|эконом|дольше|заполн|коротк"], ["юридически значимый текст остаётся за юристом", "юрид|юрист|договор|соглашен|ответствен|цен[аыу]|значим"]], "need": 2, "ok_fb": "Отмечены документы, где ИИ действительно экономит время, и назван признак, по которому они отличаются.", "fb": "ИИ выручает там, где много текста, понятная структура и есть исходные материалы: протокол по расшифровке, статус-отчёт по таблице и чату, план коммуникаций по уставу. Форму из трёх полей быстрее заполнить самому, чем объяснять задачу и проверять ответ, а допсоглашение о цене — юридически значимый текст, его ведёт юрист."}, "P04": {"type": "p", "q": "В пятницу спонсору проекта «Мобильное приложение для слушателей» нужен статус-отчёт за неделю. Сведения разбросаны: чат команды в корпоративном мессенджере, таблица задач и два письма — от подрядчика о сдвиге тестирования и от заказчика с новым требованием. Напишите запрос к ИИ в корпоративном чате, чтобы получить черновик отчёта.", "checks": [["Суть: статус-отчёт по проекту за неделю", "статус|отч[её]т|сводк|состояни[ея] проект"], ["Исходные материалы: чат команды, таблица задач, письма", "чат|таблиц|письм|переписк|источник|приложен|прикладыва|выгрузк"], ["Формат: разделы, объём, для кого отчёт", "раздел|структур|формат|пункт|коротк|кратк|страниц|спонсор|сделано|блок|риск"], ["Ограничения: только факты из источников, ничего не додумывать", "не (додум|придум|выдум|добавл|предполаг)|только (из|по|то|факт)|без |строго по"], ["Что проверить: даты и цифры со ссылкой на источник, расхождения между источниками", "провер|свер|уточн|пометь|отметь|откуда|расхожд|расход|не совпад|противореч|ссылк"]], "good": "Статус на 14 ноября. Сделано: экран расписания, авторизация (таблица задач, строки 12–18). В работе: push-уведомления — 60%. Сроки: подрядчик сдвигает тестирование с 17 на 24 ноября (письмо от 12.11). Новое требование заказчика: офлайн-доступ к материалам (письмо от 13.11) — в план не включено, нужна оценка. Расхождение для вашей проверки: в таблице задача «Оплата в приложении» закрыта 10.11, а в чате 13.11 разработчик пишет, что ждёт ключи от платёжного шлюза.", "poor": "Проект идёт в целом по плану, команда работает над задачами, есть отдельные риски по срокам. Чтобы собрать отчёт по вашему проекту, приложите источники — чат, таблицу задач, письма — и уточните: для кого отчёт, какие разделы нужны и что делать, если данные в источниках не сходятся?"}, "P05": {"type": "p", "q": "Вы ведёте проект для корпоративного заказчика — курс адаптации новых сотрудников из 12 модулей. Сдача переносится с 14 на 28 ноября: студия-подрядчик задержала видеосъёмку на две недели. Об этом нужно написать директору по персоналу заказчика. Напишите запрос к ИИ в корпоративном чате, чтобы получить черновик письма.", "checks": [["Суть: перенос срока, причина и новая дата", "перенос|сдвиг|задерж|срок|подрядчик|28|съ[её]мк"], ["Кому и от кого: заказчик, ваша роль в проекте", "заказчик|клиент|от имени|руководител[ья] проект|менеджер|адресат|директор"], ["Формат: объём, тон, структура письма", "тон|делов|коротк|кратк|абзац|объ[её]м|формат|структур|вежлив|спокойн|уважит"], ["Ограничения: не обещать лиш
