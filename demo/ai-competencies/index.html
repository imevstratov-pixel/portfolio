правая половина.\n\nСерия: во всех трёх повторяются одна и та же дуга навеса и доля синего к песочному примерно 70 на 30. Собирай все три от одного опорного изображения: кадрируй и дополняй по сторонам, а не рисуй каждое заново.\n\nДай по три варианта на каждый формат.\n\nК запросу приложу свой набросок композиции и коды двух цветов числами. Брендбук во внешний инструмент не загружаю. Перед выгрузкой в соцсети сверяю результат с брендбуком мероприятия и ставлю пометку «создано с ИИ»."}, "K": {"set": "graphic", "key": "K", "comp": "K", "level": 2, "kind": "промпт", "title": "Двадцать семь карточек к четвергу", "timer": 12, "situation": "Приёмная кампания: девять факультетов проводят онлайн-встречи с деканами, по одной на факультет, с 13 по 21 октября. Контент-менеджер ждёт макеты в четверг до 15:00 — дальше он выкладывает их по расписанию сам и править не будет. На каждый факультет нужны три карточки: 1080×1080 для ленты, 1080×1920 для сторис и 1640×856 для шапки сообщества — всего 27 файлов. На макетах стоят название факультета, дата и время начала; у вас таблица на девять строк, время у всех разное (от 16:00 до 19:00), а у двух факультетов встреча назначена на один день. Из брендбука: заголовок — корпоративная гарнитура в начертании Bold, фон — акцентный цвет факультета из списка, логотип университета в левом верхнем углу без изменения пропорций и цвета, текст не ближе 60 пикселей к краю, в сторис нижние 250 пикселей остаются свободными под кнопку. Сейчас 11:15 среды, вы открываете чат с ИИ, чтобы собрать пакет.", "ask": "Пришлите текст запроса к ИИ — одним сообщением, так, как вы его отправите в чат. Без пояснений, что вы имели в виду.", "ind": {"1": "Уровень 1 «по образцу»: запрос — одна общая просьба, опирающаяся на готовый пример («сделай карточки по этому шаблону, как в прошлый раз, про встречи с деканами»). Есть тема и, как правило, один формат. Девяти строк данных, трёх размеров в пикселях, шаблона имени файла и запретов в запросе нет: они остаются в голове, в приложенном примере или предполагаются известными. О том, как потом смотреть результат, в запросе ничего нет.", "2": "Уровень 2 «самостоятельно»: запрос составлен так, что пакет может собраться с первого раза. В нём явным списком девять строк — факультет, дата, время; три размера в пикселях с указанием, что на каждую строку таблицы нужны все три; шаблон имени файла с примером подстановки; запреты — отступ текста 60 пикселей, свободные нижние 250 пикселей в сторис, логотип без изменений, гарнитура и акцентные цвета из брендбука. Названо, сколько файлов должно получиться. Отдельной строкой запрос просит вернуть то, по чему сверяется весь пакет, — список всех файлов с размерами и подставленными датами и временем, а не один показательный макет.", "3": "Уровень 3 «по ситуации»: вместе с полным запросом назван заранее критерий, по которому пакет бракуется, и порядок, который из этого критерия вытекает. Например: сначала один пробный макет на один факультет, сверка с таблицей и брендбуком, и только потом остальные 26 — потому что править 27 готовых файлов дороже, чем один пробный; или: если в двух файлах дата или время расходятся с таблицей, пересобирается вся серия, а не эти два, потому что причина в данных запроса, а не в конкретных макетах. Критерий назван до результата, а не после."}, "criteria": ["Прислан текст запроса, который можно отправить как есть, а не описание подхода.", "В запросе явно перечислены все девять строк данных: факультет, дата, время.", "Названы три размера в пикселях и общее число файлов на выходе (27), с правилом «три файла на каждую строку».", "Есть шаблон имени файла и пример подстановки по нему.", "Перенесены запреты из условия: отступ текста 60 пикселей, свободные нижние 250 пикселей в сторис, логотип без изменений пропорций и цвета, гарнитура и акцентные цвета из брендбука.", "Есть требование вернуть то, по чему проверяется весь пакет: список файлов с размерами и подставленными датой и временем.", "Для уровня 3 дополнительно: назван критерий брака или порядок «пробный макет — сверка — остальные» с объяснением, почему так."], "flags": ["Запрос без данных из таблицы: «сделай карточки для факультетов к встречам с деканами» — даты и время ИИ подставит свои.", "Один формат вместо трёх или размеры словами («для сторис», «квадратная») без пикселей.", "Нет шаблона имени файла — 27 файлов приедут с именами вида image_1, и контент-менеджер не поймёт, что куда.", "Запреты из брендбука не перенесены в запрос: ни отступа 60 пикселей, ни свободной зоны 250 пикселей, ни требования не трогать логотип.", "Про результат сказано «посмотрю, что получилось» — не названо, по чему сверяются 27 файлов.", "Вместо запроса прислан рассказ о том, как человек будет действовать."], "why_kind": "Второй уровень здесь — это сама постановка задачи на пакет: форматы, имена файлов и запреты либо есть в тексте запроса, либо их нет, и по рассказу о подходе это не проверить.", "marks": {"1": [["названа задача — карточки-анонсы для публикации", "карточк|макет|баннер|анонс|посты|постов|публикаци"], ["названа тема — онлайн-встречи факультетов с деканами", "декан|факультет|онлайн-встреч|встреч"], ["в ответе есть прямая просьба к ИИ, а не рассказ о подходе", "собери|сделай|подготовь|сверстай|свёрстай|сгенерируй|дай |выведи|используй|бери |возьми|не меняй|оставь|оформи|назови"]], "2": [["дата и время начала стоят в одной строке данных", "октября.{0,60}1[6-9][:.][0-5]\\d|1[6-9][:.][0-5]\\d.{0,60}октября"], ["в запросе все девять строк данных, а не пример одной", "(?:(?:1[6-9][:.][0-5]\\d|[0-9]\\s*октября|[0-9]\\.10)[\\s\\S]*?){5}(?:1[6-9][:.][0-5]\\d|[0-9]\\s*октября|[0-9]\\.10)"], ["заданы все три размера в пикселях: 1080×1080, 1080×1920, 1640×856", "(?=[\\s\\S]*1080)(?=[\\s\\S]*1920)[\\s\\S]*1640"], ["названо общее число файлов на выходе — 27", "27 (файл|макет|карточ|стро)|итого 27|всего 27|по три (файл|карточ|макет)|три (файла|карточки|макета) на кажд"], ["есть шаблон имени файла и пример готового имени", "(?=[\\s\\S]*(им(я|ена|ён|ени) файл|шаблон имен|названи(е|я) файл|назови файлы))[\\s\\S]*(\\.png|\\.jpg|\\.jpeg|<|\\{)"], ["перенесены запреты: текст не ближе 60 пикселей, нижние 250 свободны", "(?=[\\s\\S]*60\\s*(пиксел|px|пкс))[\\s\\S]*250\\s*(пиксел|px|пкс)"], ["запрошена сводка по всему пакету, а не один показательный макет", "сводн|27 строк|перечисли все (файл|27)|(дай|выведи|пришли|покажи|составь|приложи) (мне )?(таблиц|списк|перечен)"]], "3": [["сначала один пробный факультет, остальные после сверки", "пробн|пилотн|на пробу|сначала.{0,60}один (факультет|макет)|один факультет.{0,90}(потом|затем|остальн)|после подтвержден"], ["назван признак, по которому пакет уходит в брак", "браку|не приму|отклон(ю|яю|им)|не беру в работу|не принимаю"], ["решение объяснено ценой ошибки или сроком", "дороже|цена ошибк|править (все )?27|переделывать (все )?27|не успе|уже не испра|второй попытки"], ["правится общая причина, а не два файла по отдельности", "(пересобира|пересобер|перевыгру|перегенер)[а-яё]{0,8} вс|вс(ю|я) сери(ю|я) заново|весь пакет заново|заново весь пакет|причина в (данн|запрос|шаблон)|дело в (данн|запрос|шаблон)|прав(лю|ить|им) (запрос|шаблон|список|данные)|не эти два, а"]]}, "need": {"1": 2, "2": 5, "3": 2}, "stops": [["берёт пакет без сверки или смотрит выборочно", "возьму как есть|беру как есть|сдам как есть|не буду сверя|сверять не буду|не буду провер|проверять не буду|посмотрю (первые|выборочно)|гляну первые"], ["даты и время оставлены на усмотрение ИИ", "подстав(ь|ишь|им) (сам|свои|любые|нужные)|даты (найди|возьми|постав) сам|врем(я|ена) постав(ь|ишь) сам|расписание возьми сам|придума(й|ешь) (дат|врем|распис)"], ["в запрос идут закрытые данные о людях", "выгрузк(а|у|и) (студент|абитуриент|заявок)|телефоны (студент|абитуриент|декан)|личные данные|паспортн|список абитуриентов"]], "sample": "Собери пакет карточек-анонсов: девять факультетов проводят онлайн-встречи с деканами, на каждый факультет три карточки, итого 27 файлов.\n\nДевять строк данных — факультет, дата, время начала, код для имени файла:\nЭкономики — 13 октября — 18:00 — econ\nПрава — 14 октября — 16:00 — law\nПедагогики — 15 октября — 17:00 — ped\nИнформационных технологий — 16 октября — 19:00 — it\nДизайна — 17 октября — 16:30 — des\nПсихологии — 17 октября — 18:30 — psy\nЛингвистики — 18 октября — 17:00 — lin\nМенеджмента — 20 октября — 16:00 — man\nРекламы — 21 октября — 19:00 — adv\n\nДаты и время бери только из этого списка, ничего не придумывай от себя; 17 октября встреч две, оба макета нужны.\n\nФорматы: 1080×1080 для ленты, 1080×1920 для сторис, 1640×856 для шапки сообщества. На каждую строку списка — все три формата, итого 27 файлов.\n\nТекст на макете: название факультета, дата, время начала и строка «Онлайн-встреча с деканом».\n\nОформление: заголовок — корпоративная гарнитура, начертание Bold; фон — акцентный цвет факультета, коды возьми из приложенного брендбука; логотип университета в левом верхнем углу, пропорции и цвет не менять.\n\nОграничения: любой текст не ближе 60 пикселей к краю; в 1080×1920 нижние 250 пикселей оставь пустыми.\n\nИмена файлов по шаблону fak-<код>_<формат>_<дата ДД-ММ>.png, пример: fak-econ_1080x1080_13-10.png.\n\nВ конце дай сводную таблицу на 27 строк: имя файла, факультет, формат, дата и время, как они встали на макет. По ней я сверю весь пакет со списком перед сдачей в четверг."}, "F": {"set": "graphic", "key": "F", "comp": "F", "level": 3, "kind": "логика", "title": "Знак для «Инженерной смены»", "timer": 15, "situation": "Университет запускает ежегодную программу «Инженерная смена» — профориентационные выходные для школьников. Проректор просит знак программы: его поставят на дипломы участников, баннеры, мерч и подадут на регистрацию как товарный знак, срок подачи — через три недели. Юрист предупредил: если знак не пройдёт экспертизу, программу придётся переименовывать, а тираж дипломов уже будет напечатан. Вы планируете начать с генерации: быстро получить несколько направлений формы. В прошлый раз, когда вы отдавали в печать сгенерированную иллюстрацию, юрист попросил показать, что в ней сделано вами, и вопрос завис на неделю.", "ask": "Пришлите порядок своей работы от первого запроса до передачи юристу: что делаете на каждом шаге и что сохраняете. Списком из 6–10 пунктов.", "ind": {"1": "Порядок держится на чужом указании: сгенерировать варианты, выбрать понравившийся, отдать юристу. Что происходит между генерацией и подачей, не описано; вопрос о правах и о собственном вкладе переадресуется юристу или руководителю.", "2": "Человек доводит знак до файла сам: генерация как черновик, перерисовка в вектор, проверка на сходство с существующими знаками, подготовка файлов под носители. Названы форматы и то, что знак проверяется в мелком размере и в один цвет. Но вклад автора нигде не зафиксирован: что именно изменено по сравнению с генерацией, по ответу восстановить нельзя.", "3": "Сверх второго уровня: человек заранее называет, по какому признаку бракует направление (слишком близко к существующему знаку, не читается в мелком размере, держится на детали, которую сам не перерисовал), и ведёт доказательство вклада по шагам — сохраняет исходные генерации с датами, промежуточные версии, описание изменений, чтобы юрист увидел, что в знаке сделано человеком. Отдельно сказано, что сгенерированный вариант не подаётся как есть и почему, и где в сроке стоит точка, после которой направление уже не меняют."}, "criteria": ["Прислан порядок шагов от первого запроса до передачи юристу, а не рассуждение о задаче", "Сказано, что генерация используется как черновик, и названо, что делается дальше вручную", "Названа проверка на сходство с существующими знаками — до того, как знак уходит дальше", "Названо, что именно сохраняется как доказательство вклада: исходные генерации, промежуточные версии, описание изменений", "Есть проверка знака в мелком размере и в один цвет", "Назван признак, по которому направление уходит в брак, и назван он до выбора", "Названы файлы или форматы, в которых знак передаётся дальше"], "flags": ["Выбранный с <script>/* Справочник «ИИ-компетенции сотрудников». Всё рисуется из DATA (model.json + tasks + units + site). */
const M=DATA.model,TASKS=DATA.tasks,UNITS=DATA.units,S=DATA.site,SKILLS=DATA.skills||{};

/* ---------- сбор фидбека тимлидов ----------
   Ссылка вида …/?lead=graphic называет автора. Каждый ответ сохраняется в момент выбора:
   сразу в память браузера и в очередь на отправку. Перезагрузка, случайный клик и обрыв сети
   ничего не теряют — неотправленное уходит при следующем открытии. Пока endpoint пустой,
   всё работает офлайн: ответы можно скачать файлом. */
const FB=(()=>{
  const cfg=S.feedback||{}, leads=cfg.leads||[];
  const slug=(new URLSearchParams(location.search).get('lead')||'').trim();
  const who=leads.find(l=>l.slug===slug)||null;
  const KEY='fb:'+(slug||'anon'), QKEY=KEY+':queue';
  const read=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}');}catch(e){return {};}};
  const readA=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return [];}};
  const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
  let store=read(KEY), queue=readA(QKEY), sending=false;
  const stamp=()=>new Date().toISOString();
  function save(rec){
    store[rec.key]={...rec,at:stamp()};
    write(KEY,store);
    queue.push(store[rec.key]); write(QKEY,queue);
    flush(); paint();
  }
  function flush(){
    if(sending||!queue.length||!cfg.endpoint)return;
    sending=true;
    const batch=queue.slice(0,20);
    fetch(cfg.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({lead:slug,who:who?who.name:'',rows:batch})})
      .then(r=>r.ok?r.text():Promise.reject(r.status))
      .then(()=>{queue=queue.slice(batch.length);write(QKEY,queue);sending=false;paint();if(queue.length)flush();})
      .catch(()=>{sending=false;paint();});
  }
  const get=key=>store[key]||null;
  const all=()=>Object.values(store);

/* ---------- требования и уровни ---------- */
function reqs(ri,g){const r=M.roles[ri];return Object.entries(r.requirements).map(([k,v])=>({comp:+k,thr:v&&typeof v==='object'?v[g||'middle']:v})).filter(x=>x.thr).sort((a,b)=>COMP[a.comp].layer-COMP[b.comp].layer||a.comp-b.comp);}
const compAtoms=c=>M.atoms.filter(a=>a.comp===c);
const reqAtoms=(ri,g)=>reqs(ri,g).flatMap(q=>compAtoms(q.comp).filter(a=>a.level<=q.thr));
const closed=(st,id)=>['ok','nest','demo'].includes(st[id]);
function closeNested(ri,g,st){reqs(ri,g).forEach(q=>{const at=compAtoms(q.comp);const top=Math.max(0,...at.filter(a=>!a.anchor&&(st[a.id]==='ok'||st[a.id]==='demo')).map(a=>a.level));at.forEach(a=>{if(!a.anchor&&a.level<=top&&!st[a.id])st[a.id]='nest';});});}
function level(c,st){let lv=0;for(let n=1;n<=4;n++){const at=compAtoms(c).filter(a=>a.level===n&&!a.anchor),an=compAtoms(c).filter(a=>a.level===n&&a.anchor);if(!at.length){if(an.length&&an.every(a=>closed(st,a.id)))lv=n;else if(an.length)break;continue;}if(at.every(a=>closed(st,a.id))&&an.every(a=>closed(st,a.id)))lv=n;else break;}return lv;}
const hash=s=>{let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))%9973;return h;};
/* В демонстрации проверяем 5 заданий; остальное считаем пройденным, кроме части требований верхнего уровня. */
function fillDemo(ri,g,st,salt=''){reqs(ri,g).forEach(q=>compAtoms(q.comp).filter(a=>a.level<=q.thr&&!st[a.id]).forEach(a=>{if(a.anchor||a.level<q.thr||hash(a.id+salt+ri)%3)st[a.id]='demo';}));closeNested(ri,g,st);
  /* в демонстрации у профиля всегда есть хотя бы два пробела — иначе нечего показать в треке */
  const open=reqAtoms(ri,g).filter(a=>!closed(st,a.id)).length;
  if(open<2)reqAtoms(ri,g).filter(a=>st[a.id]==='demo'&&!a.anchor).sort((a,b)=>b.level-a.level||hash(a.id+salt)-hash(b.id+salt)).slice(0,2-open).forEach(a=>{delete st[a.id];});
  return st;}
const typical=(ri,g)=>{const st={};reqs(ri,g).forEach(q=>compAtoms(q.comp).filter(a=>a.level<=q.thr).forEach(a=>{if(a.level<q.thr||a.anchor||hash(a.id+'t'+ri)%2)st[a.id]='demo';}));return st;};

/* ---------- подбор заданий под роль (§4.4) ---------- */
function buildDiag(ri,g){
  const rq=reqs(ri,g),used=new Set(),out=[];
  const pick=(c,lv,types)=>{const cand=M.atoms.filter(a=>a.comp===c&&a.level<=lv&&types.includes(a.task_type)&&TASKS[a.id]&&!used.has(a.id)).sort((a,b)=>(b.anchor-a.anchor)||(b.level-a.level));if(cand[0]){used.add(cand[0].id);out.push(cand[0].id);}return cand[0];};
  const base=rq.find(q=>q.comp===1);if(base)[1,2,3].forEach(t=>pick(1,base.thr,[t]));
  const core=M.roles[ri].core,prof=rq.filter(q=>q.comp!==1).sort((a,b)=>(b.comp===core)-(a.comp===core)||b.thr-a.thr||COMP[b.comp].layer-COMP[a.comp].layer||a.comp-b.comp);
  if(prof[0]){pick(prof[0].comp,prof[0].thr,[4])||pick(prof[0].comp,prof[0].thr,[3,2,1]);
    const nx=prof[1]||prof[0];pick(nx.comp,nx.thr,[3,4])||pick(nx.comp,nx.thr,[2,1])||pick(prof[0].comp,prof[0].thr,[3,4,2,1]);}
  for(const q of rq){if(out.length>=5)break;pick(q.comp,q.thr,[1,2,3,4]);}
  return out.sort((a,b)=>ATOM[b].anchor-ATOM[a].anchor);
}
function startDiag(ri,g){ses={role:ri,grade:g,tasks:buildDiag(ri,g),ti:0,status:{},unitDone:{},finished:false};save();}

/* ---------- кейсовая оценка: один кейс на компетенцию ----------
   Комплект — по одному открытому кейсу на каждую компетенцию должности; уровень заложен в сам кейс,
   а признаки в ответе показывают, дотянул человек или перерос. Уровень засчитан, если найдено не меньше
   need признаков этого уровня И закрыт уровень ниже. В продукте признаки размечает языковая модель по
   проверяющему промпту, в прототипе — те же признаки по ключевым словам. */
const CASES=(DATA.cases||{}).cases||{};
const CBYCODE=Object.fromEntries(M.competencies.map(c=>[c.code,c]));
const kitOf=(ri,g)=>reqs(ri,g).map(q=>({...q,code:COMP[q.comp].code,cs:CASES[COMP[q.comp].code]}));
/* кейсы написаны под дизайнерские задачи — остальным должностям они не подходят по содержанию,
   у них оценка остаётся на прежних заданиях, пока комплект не написан под их работу */
const hasKit=(ri,g)=>{const k=kitOf(ri,g);return M.roles[ri].group==='Дизайн'&&!!k.length&&k.every(x=>x.cs);};
/* шаги комплекта: на компетенцию — правило, разбор ситуации с вариантами и открытый кейс.
   Правило и ситуация — прежние закрытые задания по навыкам: кейс их не заменяет, он ставит уровень. */
function kitSteps(ri,g){const out=[];
  kitOf(ri,g).forEach(q=>{const at=compAtoms(q.comp).filter(a=>a.level<=q.thr&&TASKS[a.id]);
    const rule=at.find(a=>a.anchor);
    const opts=at.filter(a=>!a.anchor&&['c','j'].includes(TASKS[a.id].type))
                 .sort((a,b)=>(TASKS[b.id].type==='c')-(TASKS[a.id].type==='c')||b.level-a.level)[0];
    if(rule)out.push({comp:q.comp,code:q.code,thr:q.thr,step:'rule',id:rule.id});
    if(opts)out.push({comp:q.comp,code:q.code,thr:q.thr,step:'opts',id:opts.id});
    if(q.cs.star)out.push({comp:q.comp,code:q.code,thr:q.thr,step:'star'});  /* свой случай — рядом с кейсом, не вместо */
    out.push({comp:q.comp,code:q.code,thr:q.thr,step:'case'});});
  return out;}
function startKit(ri,g){ses={role:ri,grade:g,mode:'case',kit:kitOf(ri,g).map(x=>x.code),steps:kitSteps(ri,g),
  si:0,ki:0,got:{},task:{},star:{},ans:{},due:{},status:{},unitDone:{},finished:false};save();}
/* уровень по кейсу закрывает навыки компетенции до него; выше требования — в трек; кейс пропущен — не проверялось.
   Правила (якоря) кейс не закрывает: их подтверждает только своё задание, иначе уровень не засчитывается. */
function kitStatus(){const st={...(ses.task||{})};
  kitOf(ses.role,ses.grade).forEach(q=>{const L=ses.got[q.code];if(L==null)return;
    compAtoms(q.comp).forEach(a=>{if(a.anchor)return;
      if(a.level<=L)st[a.id]='ok';else if(a.level<=q.thr)st[a.id]='bad';});});return st;}
/* правило компетенции: закрыто, провалено или ещё не спрошено */
function ruleState(code){const step=(ses.steps||[]).find(x=>x.code===code&&x.step==='rule');
  if(!step)return null;const v=(ses.task||{})[step.id];return v==='ok'?'ok':v?'bad':'none';}
function finishKit(){if(ses.finished)return;ses.finished=true;ses.status=kitStatus();save();}
const wordsOf=s=>s.trim().split(/\s+/).filter(Boolean).length;
function checkCase(cs,ans){
  const found={},miss={};
  [1,2,3].forEach(lv=>{const mk=cs.marks[lv]||[],hit=m=>new RegExp(m[1],'i').test(ans);
    found[lv]=mk.filter(hit).map(m=>m[0]);miss[lv]=mk.filter(m=>!hit(m)).map(m=>m[0]);});
  let lv=0;[1,2,3].forEach(n=>{if(lv===n-1&&found[n].length>=cs.need[n])lv=n;});
  if(wordsOf(ans)<25)lv=0;
  const stops=(cs.stops||[]).filter(s=>new RegExp(s[1],'i').test(ans)).map(s=>s[0]);
  if(stops.length)lv=Math.min(lv,1);
  return {lv,found,miss,stops};
}

/* ---------- задания: показ и оценка. Правило одно на тип. ---------- */
const V=ok=>`<div class="lbl">Статус</div><span class="verdict ${ok?'ok':''}">${ok?'Закрыт':'В трек'}</span>`;

function evalTask(t,box){

    const wrong=sel.filter(i=>!t.opts[i].ok),missed=t.opts.map((o,i)=>o.ok&&!sel.includes(i)?i:-1).filter(i=>i>=0),right=!wrong.length&&!missed.length;

    if(t.type==='m'){pass=right;html=`${V(pass)}<p class="small">${pass?(t.ok_fb||'Верно.'):t.fb}</p><p class="muted small">Закрытый вопрос — для правил, где важна точность. Закрывается только при полностью верном ответе.</p>`;}
    else{const hit=t.kw.map(([l,re])=>[l,new RegExp(re,'i').test(ans)]),n=hit.filter(h=>h[1]).length,why=n>=(t.need||2);pass=right&&why;
      html=`${V(pass)}<p class="small"><b>Выбор:</b> ${right?'верный.':'стоит пересмотреть. '+t.fb}</p><p class="small"><b>Обоснование:</b> ${why?(t.ok_fb||'названо главное.'):'стоит добавить: '+hit.filter(h=>!h[1]).map(h=>h[0]).join(', ')+'.'}</p><p class="muted small">Засчитывается верный выбор вместе с объяснением.</p>`;}
  }

    const res=t.checks.map(([l,re])=>[l,new RegExp(re,'i').test(ans)]),ok=res.filter(r=>r[1]).length,good=res[0][1]&&(res[1][1]||res[2][1])&&words>=12;
    const rc=[['Решает поставленную задачу',res[0][1]&&res[1][1]],['Можно использовать без переделки',good&&res[2][1]],['Ничего не додумано, ограничения соблюдены',good&&(res[3][1]||res[4][1])]];
    const rs=Math.min(5,1+rc.filter(r=>r[1]).length+(good?1:0));pass=rs>=4||(rs>=3&&ok>=4);
    html=`${V(pass)}<div class="grid2" style="gap:14px;margin-top:8px"><div><h4>Как поставлена задача <span class="muted small">${ok}/5</span></h4><div class="chk">${res.map(r=>`<div class="${r[1]?'y':''}">${r[0]}</div>`).join('')}</div></div><div><h4>Что получилось</h4><div class="chat small"><b>Ответ модели:</b> ${good?t.good:t.poor}</div><div class="chk">${rc.map(r=>`<div class="${r[1]?'y':''}">${r[0]}</div>`).join('')}</div></div></div><p class="muted small">Главное — результат: короткий запрос, который дал пригодный ответ, тоже засчитывается.</p>`;
  }

    box.querySelectorAll('.opts button').forEach(b=>{b.disabled=true;if(t.opts[+b.dataset.i].g>=4)b.classList.add('right');});
    html=`${V(pass)}<p class="small"><b>Выбор:</b> ${['','рискованное','малополезное','приемлемое с оговорками','приемлемое','лучшее'][o.g]} действие. ${o.fb}</p><p class="small"><b>Обоснование:</b> ${why?'названа причина или риск.':'стоит назвать причину или риск — иначе это угадывание.'}</p><p class="muted small">Засчитывается верный выбор вместе с объяснением.</p>`;
  }

}
/* Рисует задание в box; onDone(pass|null) — после оценки или пропуска. */

/* ---------- круг профиля ---------- */
function circle(ri,g,st,small){
  const req=reqAtoms(ri,g),total=req.length,cx=300,cy=300,r0=44,ring=44,TAU=Math.PI*2,Rout=r0+ring*4,gap=7*Math.PI/180;
  const P=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const arc=(r1,r2,a0,a1)=>{const [x0,y0]=P(r2,a0),[x1,y1]=P(r2,a1),[x2,y2]=P(r1,a1),[x3,y3]=P(r1,a0),lg=a1-a0>Math.PI?1:0;return `M${x0},${y0} A${r2},${r2} 0 ${lg} 1 ${x1},${y1} L${x2},${y2} A${r1},${r1} 0 ${lg} 0 ${x3},${y3} Z`;};
  const groups=GROUPS.filter(([t])=>req.some(a=>a.type===t)),usable=TAU-gap*groups.length;let ang=-Math.PI/2+.35,svg='';
  groups.forEach(([t,label,col,soft])=>{const at=req.filter(a=>a.type===t),span=usable*at.length/total,a0=ang,a1=ang+span,w=span/at.length;
    svg+=`<path d="${arc(Rout+30,Rout+58,a0,a1)}" fill="${col}"/>`;
    const lr=Rout+39,flip=Math.sin((a0+a1)/2)>0,pa=P(lr,flip?a1:a0),pb=P(lr,flip?a0:a1);
    if(span>.5)svg+=`<defs><path id="lp_${t}${small?'s':''}" d="M${pa[0]},${pa[1]} A${lr},${lr} 0 ${span>Math.PI?1:0} ${flip?0:1} ${pb[0]},${pb[1]}"/></defs><text fill="#fff" font-size="15" font-weight="700" letter-spacing="3"><textPath href="#lp_${t}${small?'s':''}" startOffset="50%" text-anchor="middle">${label}</textPath></text>`;
    at.forEach((a,i)=>{const s0=a0+w*i+.008,s1=a0+w*(i+1)-.008,cl=closed(st,a.id);
      for(let L=1;L<=4;L++)svg+=`<path d="${arc(r0+ring*(L-1),r0+ring*L-3,s0,s1)}" fill="${L<=a.level?(cl?(L===a.level?col:soft):'#dcdcdc'):'#f3f3f3'}"><title>${esc(a.text)} · уровень ${a.level} · ${cl?'закрыт':'в трек'}</title></path>`;
      if(!small&&w>.12){const am=(s0+s1)/2,[tx,ty]=P(Rout+14,am);svg+=`<text x="${tx}" y="${ty}" font-size="10" fill="#555" text-anchor="middle" dominant-baseline="middle">${a.id}</text>`;}});
    ang=a1+gap;});
  const n=req.filter(a=>closed(st,a.id)).length;
  svg+=`<circle cx="${cx}" cy="${cy}" r="${r0-5}" fill="#fff"/><text x="${cx}" y="${cy+9}" text-anchor="middle" font-size="26" font-weight="700" fill="#1c1c1c">${Math.round(n/total*100)}%</text>`;
  return `<svg viewBox="0 0 600 600" role="img" aria-label="Профиль: закрыто ${n} из ${total}">${svg}</svg>`;
}

const INDEX=[
  ...M.roles.map((r,i)=>({k:'Должности',n:r.name,sub:r.group,h:'#/role/'+i})),
  ...M.competencies.map(c=>({k:'Компетенции',n:c.name,sub:c.tagline,alt:c.model_name,h:'#/comp/'+c.id})),
  ...Object.keys(M.tools).map(t=>({k:'Инструменты',n:t,h:'#/tool/'+encodeURIComponent(t)})),
  ...M.divisions.map((d,i)=>({k:'Подразделения',n:d.name,sub:d.roles.length+' долж.',h:'#/division/'+i}))];
function find(q){q=norm(q.trim());if(!q)return [];
  return INDEX.map(x=>{const n=norm(x.n),a=norm(x.alt||'');const s=n.startsWith(q)?3:n.split(/[\s(/-]+/).some(w=>w.startsWith(q))?2:q.length>2&&(n.includes(q)||a.includes(q))?1:0;return {x,s};}).filter(r=>r.s).sort((a,b)=>b.s-a.s).map(r=>r.x);}
const bigr=s=>{s=' '+norm(s)+' ';const o=new Set();for(let i=0;i<s.length-1;i++)o.add(s.slice(i,i+2));return o;};
function nearest(q){const al=Object.entries(S.aliases||{}).filter(([k])=>norm(q).includes(k)).flatMap(([,v])=>v);const fromAl=INDEX.filter(x=>al.includes(x.n));
  const B=bigr(q),sc=INDEX.filter(x=>x.k==='Должности'||x.k==='Компетенции').map(x=>{let best=0;x.n.split(/\s+/).forEach(w=>{const b=bigr(w);let c=0;b.forEach(g=>{if(B.has(g))c++;});best=Math.max(best,2*c/(b.size+B.size));});return {x,best};}).sort((a,b)=>b.best-a.best).slice(0,4).filter(r=>r.best>.25).map(r=>r.x);
  return [...new Set([...fromAl,...sc])].slice(0,4);}
function sugHTML(q){
  if(!q.trim())return `<div class="none">Попробуйте: ${S.search_examples.map(e=>`<a href="#/search/${encodeURIComponent(e)}" style="display:inline;padding:0;text-decoration:underline">${e}</a>`).join(' · ')}</div>`;
  const r=find(q);
  if(!r.length){const nr=nearest(q);return `<div class="none">Такой должности в модели пока нет${nr.length?', ближайшие:':'.'}</div>${nr.map(x=>`<a href="${x.h}">${esc(x.n)} <span class="muted small">${esc(x.sub||'')}</span></a>`).join('')}`;}
  let h='';['Должности','Компетенции','Инструменты','Подразделения'].forEach(k=>{const g=r.filter(x=>x.k===k).slice(0,6);if(g.length)h+=`<div class="grp">${k}</div>`+g.map(x=>`<a href="${x.h}">${esc(x.n)} <span class="muted small">${esc(x.sub||'')}</span></a>`).join('');});return h;
}
function attachSearch(box){const inp=$('input',box),sug=$('.sug',box);
  const upd=()=>{sug.innerHTML=sugHTML(inp.value);};
  inp.oninput=upd;inp.onfocus=upd;
  inp.onkeydown=e=>{if(e.key==='Enter'){const a=$('a[href^="#/role"],a[href^="#/comp"],a[href^="#/tool"],a[href^="#/division"]',sug);sug.innerHTML='';inp.blur();go(a&&find(inp.value).length===1?a.getAttribute('href'):'#/search/'+encodeURIComponent(inp.value));}if(e.key==='Escape'){sug.innerHTML='';inp.blur();}};
  sug.onclick=()=>{sug.innerHTML='';inp.value='';};
  document.addEventListener('click',e=>{if(!box.contains(e.target))sug.innerHTML='';});}

function fbWire(){
  const app=$('#app');if(!app||!FB.active)return;
  FB.paint();FB.flush();
  app.addEventListener('click',e=>{
    const dl=e.target.closest('[data-fbdl]'); if(dl){FB.download();return;}
    const dot=e.target.closest('[data-fb]');
    if(dot){$('#fbpanel').innerHTML=fbPanel(dot.dataset.fb);return;}
  });
  app.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const dot=e.target.closest('[data-fb]');if(!dot)return;
    e.preventDefault();$('#fbpanel').innerHTML=fbPanel(dot.dataset.fb);
  });
  app.addEventListener('focusout',e=>{
    const t=e.target.closest('[data-fbcomp]');
    if(t) FB.save({key:'comp:'+t.dataset.fbcomp+':'+t.dataset.k,kind:'компетенция',comp:t.dataset.fbcomp,field:t.dataset.k,value:'',comment:t.value.trim()});
  },true);
  const panel=$('#fbpanel');if(!panel)return;
  panel.addEventListener('click',e=>{
    if(e.target.closest('[data-close]')){panel.innerHTML='';return;}
    const b=e.target.closest('[data-fbset]');if(!b)return;
    const id=b.dataset.fbset, prev=FB.get('atom:'+id)||{value:{},comment:''};
    const value={...(prev.value||{})}; value[b.dataset.k]=b.dataset.v;
    const a=M.atoms.find(x=>x.id===id);
    FB.save({key:'atom:'+id,kind:'навык',comp:COMP[a.comp].code,atom:id,field:'',value,comment:prev.comment||''});
    fbMark(id);panel.innerHTML=fbPanel(id);
  });
  panel.addEventListener('focusout',e=>{
    const t=e.target.closest('[data-fbtext]');if(!t)return;
    const id=t.dataset.fbtext, prev=FB.get('atom:'+id)||{value:{}};
    const a=M.atoms.find(x=>x.id===id);
    FB.save({key:'atom:'+id,kind:'навык',comp:COMP[a.comp].code,atom:id,field:'',value:prev.value||{},comment:t.value.trim()});
    fbMark(id);
  },true);
}

    const notes=[rs&&rs!=='ok'&&L?'правило не закрыто — уровень не засчитан':'',sv!=null?starWord(sv):''].filter(Boolean);
    return `<div class="dkrow"><span>${COMP[x.comp].name}${notes.length?`<div class="muted small">${notes.join(' · ')}</div>`:''}</span><span>${L==null?'<span class="muted small">кейс пропущен</span>'
      :`<span class="verdict ${L>=x.thr&&rs==='ok'?'ok':''}">${L?'уровень '+L:'уровень не подтверждён'}</span> <span class="muted small">нужен ${x.thr}</span>`}</span></div>`;}).join('')}</div>`;
}
function kitSide(){const cur=ses.steps[ses.si]&&ses.steps[ses.si].code;
  $('#side').innerHTML=`<h4>Ход оценки</h4><p class="muted small">На компетенцию — правило, разбор ситуации и открытый ответ. Кружки — уровни, которые нужны должности.</p>
   <div class="sleg"><span><i class="ok">✓</i>подтверждён</span><span><i class="tr"></i>в трек</span><span><i class="cur"></i>сейчас</span></div>
   ${kitOf(ses.role,ses.grade).map(x=>{const L=ses.got[x.code],rs=ruleState(x.code),sv=(ses.star||{})[x.code];
     const notes=[rs&&rs!=='ok'&&L?'правило не закрыто':'',sv!=null?starWord(sv):''].filter(Boolean);
     return `<div class="row"><span>${COMP[x.comp].name}${notes.length?`<div class="muted small">${notes.join(' · ')}</div>`:''}</span><span class="dots">${Array.from({length:x.thr},(_,i)=>i+1).map(n=>{
       const done=L!=null&&n<=L,tr=L!=null&&n>L;
       return `<i class="${done?'ok':tr?'tr':''}${x.code===cur?' cur':''}" title="уровень ${n}${done?' — подтверждён':tr?' — в трек':''}">${done?'✓':n}</i>`;}).join('')}</span></div>`;}).join('')}`;
}
function renderTask(){
  const box=$('#task');if(!box)return;
  if(ses.ti>=ses.tasks.length){finishDiag();box.innerHTML=`<h3>Готово</h3><p>Вы ответили на ${ses.tasks.length} ${plural(ses.tasks.length,['задание','задания','заданий'])}. В продукте их 9–12, и они подбираются по ходу ответов. Остальные требования в прототипе считаем закрытыми.</p><p><a class="btn" href="#/profile">Смотреть профиль</a></p>`;renderSide();return;}
  const id=ses.tasks[ses.ti],a=ATOM[id],t=TASKS[id];
  box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>Задание ${ses.ti+1} <span class="muted small" style="font-weight:400">из ${ses.tasks.length}</span></h3><span class="tag">${COMP[a.comp].name}</span></div><div class="lbl">Что проверяем</div><div class="small">${a.text} <span class="tag">${TYPE_TAG[t.type]} · уровень ${a.level}${a.anchor?' · обязательно для всех':''}</span></div><div class="lbl">Задание</div><div id="tbody"></div>${ses.ti>=3?`<p style="margin-top:16px;border-top:1px solid var(--soft);padding-top:12px"><button class="btn sec" id="enough">Достаточно, покажи профиль</button></p>`:''}`;
  mountTask($('#tbody'),id,{nextLabel:ses.ti+1<ses.tasks.length?'Следующее задание':'Завершить',onDone:(pass,next)=>{if(!next){ses.status[id]=pass?'ok':'bad';save();renderSide();}else{ses.ti++;save();renderTask();}}});
  const en=$('#enough');if(en)en.onclick=()=>{finishDiag();go('#/profile');};
  renderSide();
}
function renderSide(){const cur=ATOM[ses.tasks[ses.ti]];
  const lv=n=>Array.from({length:n},(_,k)=>k+1);
  $('#side').innerHTML=`<h4>Ход оценки</h4><p class="muted small">Кружки — уровни, которые нужны должности.</p><div class="sleg"><span><i class="ok">✓</i>закрыт</span><span><i class="tr"></i>в трек</span><span><i class="cur"></i>проверяем</span></div>${reqs(ses.role,ses.grade).map(q=>`<div class="row"><span>${COMP[q.comp].name}</span><span class="dots">${lv(q.thr).map(n=>{const st=compAtoms(q.comp).filter(a=>a.level===n).map(a=>ses.status[a.id]).find(Boolean),c=cur&&cur.comp===q.comp&&cur.level===n;return `<i class="${st==='ok'?'ok':st==='bad'?'tr':''}${c?' cur':''}" title="уровень ${n}${st==='ok'?' — закрыт':st==='bad'?' — в трек':''}">${st==='ok'?'✓':n}</i>`;}).join('')}</span></div>`).join('')}`;}

function profileHTML(ri,g,st,own){
  const req=reqAtoms(ri,g),cl=req.filter(a=>closed(st,a.id)),open=req.filter(a=>!closed(st,a.id)),anc=req.filter(a=>a.anchor),ancOk=anc.filter(a=>closed(st,a.id)).length,mins=open.reduce((s,a)=>s+unitMin(a.id),0);
  return `<div class="profile"><div>${profileViz(ri,g,st,own?'ses':'typ')}</div>
  <div><div class="card"><div class="sum"><span>Должность</span><b>${roleTitle(ri,g)}</b></div><div class="sum"><span>Закрыто требований</span><b>${cl.length} из ${req.length}</b></div><div class="sum"><span>Правила безопасности</span><b>${ancOk} из ${anc.length}</b></div><div class="sum"><span>В трек</span><b>${open.length?open.length+' '+plural(open.length,['урок','урока','уроков'])+' · ~'+mins+' мин':'—'}</b></div></div>
  <h2>В трек</h2>${open.length?open.map(a=>`<div class="gap"><span class="lv">${a.level}</span><span>${a.text}<div class="muted small">${COMP[a.comp].name}</div></span><span class="st">${st[a.id]==='bad'?'в трек':'не проверялось'}</span></div>`).join(''):'<div class="card">Все требования должности закрыты. В треке — только рекомендации следующего уровня.</div>'}
  <p style="margin-top:16px">${own?`<a class="btn big" href="#/track">Собрать трек</a> <a class="btn sec" href="#/team/${ri}/${g||'-'}">Как это видит руководитель</a>`:`<a class="btn big" href="#/diag/${ri}/${g||'-'}">Пройти оценку</a>`}</p></div></div>`;}
PAGES.profile=()=>{
  if(!ses||!ses.finished){const ri=ses?ses.role:HERO,g=ses?ses.grade:S.hero.grade;return `<h1>Профиль <span class="ex">пример</span></h1><p class="lead muted">Пример для должности «${roleTitle(ri,g)}»; пройдите оценку, чтобы увидеть свой.</p>${profileHTML(ri,g,typical(ri,g),false)}`;}
  return `<h1>Мой профиль</h1><p class="lead muted">Что уже закрыто по требованиям должности и что уходит в трек.</p>${profileHTML(ses.role,ses.grade,ses.status,true)}`;};
PAGES['hero-profile']=()=>PAGES.profile();

/* трек и урок */
let openUnit=null,ustep=0;
const trackAtoms=()=>reqAtoms(ses.role,ses.grade).filter(a=>ses.unitDone[a.id]||!closed(ses.status,a.id)).sort((a,b)=>a.level-b.level);
PAGES.track=()=>{if(!ses||!ses.finished)return `<h1>Трек</h1><p class="lead muted">Трек собирается после оценки: по одному короткому уроку на каждый пробел.</p><p><a class="btn" href="#/start">Пройти оценку</a></p>`;
  return `<h1>Мой трек</h1><p class="lead muted">По одному уроку на каждый пробел. Прошли проверку — пробел закрыт, профиль обновился.</p><div class="grid2"><div id="units"></div><div id="miniCircle"></div></div><div id="unitOpen"></div>`;};
PAGES.track.after=()=>{if($('#units'))renderTrack();};
function renderTrack(){const open=trackAtoms(),left=open.filter(a=>!ses.unitDone[a.id]);
  $('#miniCircle').innerHTML=profileViz(ses.role,ses.grade,ses.status,'ses');
  $('#units').innerHTML=(open.length?open.map((a,i)=>`<div class="unit ${ses.unitDone[a.id]?'done':''}"><div><b>${i+1}. ${unitTitle(a.id)}</b><div class="muted small">${COMP[a.comp].name} · уровень ${a.level} · ${unitMin(a.id)} мин</div></div>${ses.unitDone[a.id]?'<span class="verdict ok">закрыт</span>':`<button class="btn sec" data-u="${a.id}">Открыть</button>`}</div>`).join(''):`<div class="card"><p>Все требования должности закрыты.</p>${ses.grade&&ses.grade!=='senior'?`<p><a class="btn sec" href="#/role/${ses.role}/${ses.grade==='junior'?'middle':'senior'}">Что добавится на следующем грейде</a></p>`:''}</div>`)+(Object.keys(ses.unitDone).length?`<p style="margin-top:14px"><a class="btn" href="#/profile">К профилю</a> <a class="btn sec" href="#/end">Что дальше?</a></p>`:'');
  $('#units').onclick=e=>{const b=e.target.closest('[data-u]');if(b){openUnit=b.dataset.u;ustep=0;renderTrack();$('#unitOpen').scrollIntoView({behavior:'smooth'});}};
  if(!left.length){$('#unitOpen').innerHTML='';return;}
  if(!openUnit||!left.some(a=>a.id===openUnit)){openUnit=left[0].id;ustep=0;}
  const other=left.find(a=>a.id!==openUnit);
  mountUnit($('#unitOpen'),openUnit,{other:other&&(()=>{openUnit=other.id;ustep=0;renderTrack();}),onClose:()=>{ses.status[openUnit]='ok';ses.unitDone[openUnit]=true;save();renderTrack();}});
}
function mountUnit(box,id,{other,onClose}){
  const a=ATOM[id],f=UNITS.full[id],names=['Задача','Зачем','Алгоритм','Практика','Проверка'];
  const chk=f?f.check:{q:'Что вы сделаете в такой ситуации?',opts:[{t:'Сначала уточняю контекст и формат, затем проверяю факты в ответе и только потом использую',g:5,fb:''},{t:'Беру ответ ИИ как есть, если он выглядит уверенно и хорошо написан',g:1,fb:'Уверенный тон — не признак верности. Загляните в шаг «Алгоритм».'},{t:'Прошу ИИ проверить свой ответ и, если он подтверждает, использую',g:3,fb:'Модель проверяет себя тем же пониманием задачи. Проверка руками остаётся за вами.'}]};
  const draw=()=>{
    const body=[
      f?`<p><b>Рабочая ситуация.</b> ${f.task}</p>`:`<p><b>Рабочая ситуация.</b> ${a.text}. Именно этого ждёт должность, и именно это осталось открытым.</p><p class="muted">Урок займёт ${unitMin(id)} минут. В конце — практика в чате и короткая проверка.</p>`,
      `<p>${f?f.why:'Рутинная часть уходит модели, за человеком остаются постановка, проверка и решение. Ответственность за результат не сдвигается: за него отвечает сотрудник, не инструмент.'}</p>`,
      `<div class="algo">${(f?f.algo:['Опишите задачу как коллеге: ситуация, для кого результат, ограничения.','Задайте формат результата явно: структуру, объём, тон.','Прочитайте ответ целиком и найдите, что не так; уточните одним сообщением, не начинайте заново.','Проверьте факты и даты руками. Только потом используйте.']).map(s=>`<div>${s}</div>`).join('')}</div>`,
      `<div class="chat"><b>Корпоративный ИИ-чат</b> · ${f?f.practice:'Попробуйте на своей реальной задаче этой недели. Модель ответит и спросит: «Что в ответе вы проверили бы руками и почему?»'}</div><textarea placeholder="Ваш запрос — так, как написали бы в работе"></textarea>`,
      !f&&TASKS[id]?`<p><b>Проверка.</b> Одно задание на этот же навык. Пройдено — пробел закрыт.</p><div id="uTask"></div>`:`<p><b>Проверка.</b> ${chk.q}</p><div class="opts" id="uopts">${chk.opts.map((o,i)=>`<button data-i="${i}">${o.t}</button>`).join('')}</div><p style="margin-top:10px"><button class="btn" id="uSubmit" disabled>Ответить</button></p><div id="uEval" role="status" aria-live="polite"></div>`][ustep];
    box.innerHTML=`<div class="card" style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>${unitTitle(id)}</h3><span class="muted small">${COMP[a.comp].name} · уровень ${a.level} · ${unitMin(id)} мин${f?'':' · <span class="ex">пример структуры</span>'}</span></div>${(o=>o?`<div class="uout"><div class="small muted">Шаг к результату</div><b>${o.s.name}</b><div class="small">Результат: ${o.s.artifact}</div></div>`:'')(outcomeOf(id,ses&&ses.role))}<div class="usteps">${names.map((n,i)=>`<button data-s="${i}" class="${i===ustep?'on':i<ustep?'d':''}">${i+1}. ${n}</button>`).join('')}</div>${body}<p style="margin-top:14px">${ustep<4?'<button class="btn" id="uNext">Дальше</button> ':''}${other?'<button class="btn sec" id="uOther">Посмотреть другой урок</button>':''}</p></div>`;
    $('.usteps',box).onclick=e=>{const b=e.target.closest('button');if(b){ustep=+b.dataset.s;draw();}};
    const nx=$('#uNext',box);if(nx)nx.onclick=()=>{ustep++;draw();};
    const ot=$('#uOther',box);if(ot)ot.onclick=other;
    const ut=$('#uTask',box);if(ut)mountTask(ut,id,{skip:false,nextLabel:'Дальше',onDone:(pass,next)=>{if(!next)return;if(pass&&onClose)onClose();else draw();}});
    const uo=$('#uopts',box);if(uo){uo.onclick=e=>{const b=e.target.closest('button');if(!b)return;uo.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('#uSubmit',box).disabled=false;};
      $('#uSubmit',box).onclick=()=>{const o=chk.opts[+$('.sel',uo).dataset.i];if(o.g>=4){if(onClose)onClose();else $('#uEval',box).innerHTML=`<div class="eval"><span class="verdict ok">Закрыт</span><p class="small">${o.fb||''} В треке сотрудника после этого пробел закрывается, а профиль обновляется.</p></div>`;}
        else $('#uEval',box).innerHTML=`<div class="eval"><span class="verdict">Пока не закрыт</span><p class="small">${o.fb||''}</p><p class="muted small">Урок остаётся в треке. Через день — повторная проверка другим вопросом.</p></div>`;};}
  };draw();
}
PAGES.unit=id=>{const a=ATOM[id];if(!a)return PAGES.notfound();return `${crumbs(['Компетенции','#/comps'],[COMP[a.comp].name,'#/comp/'+a.comp],[unitTitle(id)])}<h1>Урок</h1><p class="lead muted">Пять шагов на ${unitMin(id)} минут: рабочая задача, зачем, алгоритм, практика в чате, проверка.</p><div id="unitSolo" data-id="${id}"></div>`;};
PAGES.unit.after=()=>{const b=$('#unitSolo');if(b){ustep=0;mountUnit(b,b.dataset.id,{});}};

PAGES.end=()=>{
  return `<div style="max-width:720px"><h1>Что дальше?</h1><p class="lead">Так оценка работает для любой из 35 должностей компании: свои требования, свои кейсы, свой трек.</p><div class="grid"><a class="card" href="#/divisions"><h3>Найти свою должность</h3><p class="small muted">Откройте любую — оценка соберётся под неё.</p></a><a class="card" href="#/how"><h3>Как это устроено</h3><p class="small muted">Откуда требования, кто оценивает, кто что видит.</p></a><a class="card" href="#/next"><h3>Что дальше по проекту</h3><p class="small muted">Три этапа, сроки, что нужно решить.</p></a></div><p style="margin-top:16px"><a class="btn sec" href="#/team/${ses?ses.role:HERO}/${ses&&ses.grade||'-'}">Как это видит руководитель</a></p></div>`;};

/* экран руководителя: частота × уровень. Серая полоса — частота задач, столбик: контур — нужно, заливка — есть, цвет — доля освоения. */
const FQ=DATA.freq||{},FBC={bad:'#7A4DD1',mid:'#FEBC2E',ok:'#28C840'};
const fbTone=(now,need)=>now>=need?'ok':now/need>=.5?'mid':'bad';
const tm={who:-1,flat:false,gaps:false,open:{},all:false};
const fbW=()=>window.innerWidth<600?340:620;  /* на телефоне шкала уже — подписи в SVG остаются читаемыми */
function fbBar(now,need,f,big,o={}){
  const flat=o.flat??tm.flat,W=o.W||fbW(),U=W*.62/4,h=big?50:38,bh=big?16:12,d=flat?0:(big?6:4),y0=h-5-bh,col=o.col||FBC[fbTone(now,need)];
  const mix=(hx,k,w)=>{const n=parseInt(hx.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,q=v=>Math.round(Math.max(0,Math.min(255,w?v+(255-v)*w:v*k))).toString(16).padStart(2,'0');return '#'+q(r)+q(g)+q(b);};
  const box=(x1,solid)=>{const P=a=>a.map(p=>p.join(',')).join(' '),st=solid?'':` fill-opacity=".12" stroke="${mix(col,.8)}" stroke-width="1.2"`;
    const front=`<rect x="0" y="${y0}" width="${x1}" height="${bh}" fill="${col}"${st}/>`;
    if(!d)return front.replace('<rect ','<rect rx="3" ');
    return front+`<polygon points="${P([[0,y0],[d,y0-d],[x1+d,y0-d],[x1,y0]])}" fill="${solid?mix(col,1,.4):col}"${st}/><polygon points="${P([[x1,y0],[x1+d,y0-d],[x1+d,y0+bh-d],[x1,y0+bh]])}" fill="${solid?mix(col,.78):col}"${st}/>`;};
  const fw=f?f/5*W:0,lbl=f?(FQ.scale[f]||'').toLowerCase():'';
  let s=f?`<rect x="0" y="2" width="${fw}" height="${h-4}" rx="7" fill="#7f7f7f" fill-opacity=".13"/><text x="${fw-8}" y="${big?15:12.5}" text-anchor="end" font-size="10.5" fill="#6f6f6f">${lbl}</text>`:'';
  s+=[1,2,3].map(l=>`<line x1="${l*U}" y1="${y0-d-2}" x2="${l*U}" y2="${y0+bh+2}" stroke="#d4d1d1" stroke-dasharray="2 3"/>`).join('');
  s+=box(need*U,false);if(now>0)s+=box(Math.min(now,need)*U,true);
  return `<svg viewBox="0 0 ${W+8} ${h}" width="100%" style="display:block" role="img" aria-label="нужно ${need}, есть ${now}, ${lbl}"><title>нужно уровень ${need} · есть ${now} · ${lbl}</title>${s}</svg>`;}
/* условные уровни сотрудников команды; первый — «вы», если оценка пройдена за эту должность */
function memberLevel(ri,g,pi,q,j){const n=S.team.names[pi],own=pi===0&&ses&&ses.finished&&ses.role===ri&&ses.grade===g;return own?level(q.comp,ses.status):Math.max(0,q.thr-(hash(n+q.comp)%4===0?1:0)-(hash(n+j)%5===0?1:0));}
function teamFreqHTML(ri,g){const r=M.roles[ri],F=FQ.roles[r.name],rq=reqs(ri,g),W=fbW(),U=W*.62/4,names=S.team.names,own=ses&&ses.finished&&ses.role===ri&&ses.grade===g;
  const fq=q=>F.comps[COMP[q.comp].code]||3,rows=rq.map((q,j)=>({q,j,f:fq(q)})).sort((a,b)=>b.f-a.f||a.q.comp-b.q.comp);
  const lv=(x)=>tm.who<0?Math.floor(names.reduce((s,_,pi)=>s+memberLevel(ri,g,pi,x.q,x.j),0)/names.length):memberLevel(ri,g,tm.who,x.q,x.j);
  const pct=(now,need)=>Math.round(Math.min(now,need)/need*100);
  const atomRows=x=>{if(tm.who<0)return '';const c=COMP[x.q.comp],L=lv(x),n=names[tm.who],open=tm.open[c.id]??tm.all;if(!open)return '';
    return compAtoms(c.id).filter(a=>a.level<=x.q.thr).map(a=>{const cl=a.level<=L||(a.level===L+1&&hash(a.id+n)%2===0);return {a,cl,f:F.atoms[a.id]||x.f};})
      .filter(o=>!tm.gaps||!o.cl).sort((p,q)=>q.f-p.f||p.a.level-q.a.level)
      .map(o=>{const now=o.cl?o.a.level:Math.min(L,o.a.level-1);return `<div class="fbr"><div class="tln"><span class="${o.cl?'muted':''}">${unitTitle(o.a.id)}</span>${o.a.anchor?' <span class="tag">обязательно для всех</span>':''}</div>${fbBar(now,o.a.level,o.f,false)}</div>`;}).join('');};
  const body=rows.map(x=>{const c=COMP[x.q.comp],now=lv(x),need=x.q.thr,na=compAtoms(c.id).filter(a=>a.level<=need).length,open=tm.who>=0&&(tm.open[c.id]??tm.all);
    const nm=tm.who>=0?`<button class="tlx ${open?'op':''}" data-c="${c.id}" aria-expanded="${open}"><span aria-hidden="true">▸</span><b>${c.name}</b></button>`:`<b>${c.name}</b>`;
    return `<div class="fbr fbc"><div class="tln">${nm}<div class="muted small">есть ${now} · нужно ${need} · освоено ${pct(now,need)}% · ${na} ${plural(na,['навык','навыка','навыков'])}</div></div>${fbBar(now,need,x.f,true)}</div>`+atomRows(x);}).join('');
  const hdr=`<div class="fbr fbh"><div></div><svg viewBox="0 0 ${W+8} 18" width="100%" style="display:block">${[1,2,3,4].map(l=>`<text x="${(l-.5)*U}" y="13" text-anchor="middle" font-size="10.5" fill="#6f6f6f">ур. ${l}</text>`).join('')}<text x="${W}" y="13" text-anchor="end" font-size="10.5" fill="#6f6f6f">частота задач →</text></svg></div>`;
  const sq=c=>`<i class="sq" style="background:${c}"></i>`;

function dashDiv(name){
  const d=M.divisions.find(x=>x.name===name);if(!d)return PAGES.notfound();
  const list=divPeople(name),A=agg(list);

  /* риск направления: частая компетенция, по которой никто не вышел на нужный уровень */
  const risks=codes.map(code=>{const c=C2[code];
    const rows=list.filter(p=>needOf(p,c.id)).map(p=>({p,need:needOf(p,c.id),got:p.assessed?(p.levels[code]||0):null}));
    const carriers=rows.filter(x=>x.got!=null&&x.got>=x.need).length;
    return {c,code,rows,carriers,fq:fqOf(list,code)};}).filter(x=>x.carriers===0&&x.rows.length>1&&x.fq>=4);

    <div class="dnum"><div class="dn">${A.levels}</div><div class="dl">уровней добрать</div><div class="muted small">${A.lessons} ${plural3(A.lessons,['урок','урока','уроков'])} ≈ ${Math.round(A.mins/60)} ч</div></div>
  </div>
  ${risks.length?`<div class="card drisk"><h2>Риск направления</h2>
    ${risks.map(r=>`<p class="dbig">${r.c.name}: носителей нужного уровня — 0 из ${r.rows.length}</p>
      <p class="small">Задачи этой компетенции встречаются ${FQ.scale[r.fq].toLowerCase()}, закрыть их сейчас некому.</p>`).join('')}</div>`
   :`<p class="muted">По частым компетенциям направления есть хотя бы один человек нужного уровня.</p>`}
  <h2>Команда</h2>
  <p class="muted small">Строка — сотрудник, столбец — компетенция. «−2» значит «не хватает двух уровней», галочка — требование закрыто. Пусто — компетенция должности не нужна; серая клетка с прочерком — оценки ещё нет, и это не ноль.</p>

  ${list.slice().sort((a,b)=>a.role.localeCompare(b.role)||a.name.localeCompare(b.name)).map(p=>`<tr>
    <td class="dnm"><b>${p.name}</b><span class="muted small">${p.role}${p.grade?' · '+GRADES[p.grade]:''}</span></td>
    ${codes.map(code=>{const need=needOf(p,C2[code].id);
      if(!need)return '<td class="dcell dempty"></td>';
      if(!p.assessed)return '<td class="dcell dnone" title="оценки ещё нет">—</td>';
      const got=p.levels[code]||0,gap=Math.max(0,need-got);
      return `<td class="dcell ${gap?'dgap':'dok'}" title="${C2[code].name}: нужно ${need}, есть ${got}">${gap?`−${gap}`:'✓'}</td>`;}).join('')}
  </tr>`).join('')}
  </tbody></table></div>
  <h2>Что добрать первым</h2>
  <div class="dlist">${codes.map(code=>{const c=C2[code];
    const rows=list.filter(p=>p.assessed&&needOf(p,c.id)).map(p=>({p,need:needOf(p,c.id),got:p.levels[code]||0}));
    const gapRows=rows.filter(x=>x.got<x.need);if(!gapRows.length)return '';

  <p class="note">Руководитель видит уровни, а не сами ответы сотрудников. Результат влияет на обучение, не на аттестацию. Истории здесь нет — это один снимок.</p>`;}

function fqOf(list,code){const names=[...new Set(list.map(p=>p.role))];
  const vals=names.map(n=>FQ.roles&&FQ.roles[n]&&FQ.roles[n].comps&&FQ.roles[n].comps[code]).filter(Boolean);
  return vals.length?Math.max(...vals):0;}

/* ---------- вкладка «Матрица»: сортированная матрица Бертена с кружками-четвертями (Harvey balls).
   Цифр в клетках нет: уровень — заливка кружка, главная компетенция роли — бирюзовое кольцо, пусто — не нужно.
   Строки и столбцы переставлены так, чтобы у дизайна главные компетенции легли диагональю. ---------- */
const MX={scale:'design',view:'matrix',grade:'middle',panel:null};
const DZ_ROLES=['Продуктовый дизайнер','Веб-дизайнер','Средовой (3D) дизайнер','Графический дизайнер','SMM-дизайнер','Видео/моушен-дизайнер'];
const DZ_SHORT={'Продуктовый дизайнер':'Продуктовый','Веб-дизайнер':'Веб','Средовой (3D) дизайнер':'3D','Графический дизайнер':'Графический','SMM-дизайнер':'SMM','Видео/моушен-дизайнер':'Видео'};
const DZ_GROUPS=[['Для всех',['B','M']],['Интерфейсы',['I','R']],['Пространство',['D']],['Картинка',['F','G','K']],['Видео',['W','V','Y']]];
const DIV_SHORT={'IT-департамент':'IT','Дизайн':'Дизайн','Продажи':'Продажи','Приёмная комиссия':'Приёмная','Отдел сопровождения клиентов':'Сопровождение','Проектный офис':'Проекты','ППС и сервис':'ППС'};
const LVW={1:'по образцу',2:'самостоятельно',3:'по ситуации',4:'для других'};
const C2=Object.fromEntries(M.competencies.map(c=>[c.code,c]));
const lvl=(ri,code,g)=>{const v=M.roles[ri].requirements[C2[code].id];return v==null?0:(typeof v==='object'?(v[g||'middle']||0):v);};
const hasGrades=ri=>Object.values(M.roles[ri].requirements).some(v=>v&&typeof v==='object');
const coreCode=ri=>{const c=M.roles[ri].core;return c?COMP[c].code:null;};
const hb=(lv,o={})=>`<span class="hb${lv?'':' none'}${lv>=4?' full':''}${o.core?' core':''}" style="--p:${lv*25}"${o.attrs||''}${o.title?` title="${esc(o.title)}"`:''}></span>`;
function mxModel(){
  if(MX.scale==='design')return {title:'Дизайн',roles:DZ_ROLES.map(roleIdx),groups:DZ_GROUPS.map(([t,cs])=>[t,cs.filter(c=>C2[c])]).filter(x=>x[1].length),short:ri=>DZ_SHORT[M.roles[ri].name]};
  const d=M.divisions.find(x=>x.name===MX.scale),roles=d.roles.map(roleIdx),need=c=>roles.map((ri,k)=>lvl(ri,c.code,'middle')?k:-1).filter(k=>k>=0);
  const comps=M.competencies.filter(c=>need(c).length),avg=c=>need(c).reduce((s,k)=>s+k,0)/need(c).length;
  const L={1:'Для всех',2:'Общие сценарии',3:'Профильные'};
  return {title:d.name,roles,groups:[1,2,3].map(l=>[L[l],comps.filter(c=>c.layer===l).sort((a,b)=>avg(a)-avg(b)).map(c=>c.code)]).filter(x=>x[1].length),short:ri=>M.roles[ri].name};}
const gradeOf=ri=>hasGrades(ri)?MX.grade:'middle';
const NW={nom:{1:'Одна',2:'Две',3:'Три',4:'Четыре',5:'Пять'},dat:{2:'двум',3:'трём',4:'четырём',5:'пяти',6:'шести',7:'семи'},gen:{4:'четырёх',5:'пяти',6:'шести',7:'семи'}};
const nw=(k,n)=>NW[k][n]||String(n);
function mxInsights(md){const R=md.roles,n=R.length,codes=md.groups.flatMap(g=>g[1]),cov=c=>R.filter(ri=>lvl(ri,c,gradeOf(ri))).length;
  const all=codes.filter(c=>cov(c)===n),wide=codes.filter(c=>cov(c)>=Math.max(2,Math.ceil(n*.6))&&cov(c)<n),nm=c=>`«${C2[c].name}»`;
  const list=a=>a.length<2?nm(a[0]):a.slice(0,-1).map(nm).join(', ')+' и '+nm(a[a.length-1]);
  let top=0,who=[];R.forEach(ri=>codes.forEach(c=>{const l=lvl(ri,c,gradeOf(ri));if(l>top){top=l;who=[[ri,c]];}else if(l===top)who.push([ri,c]);}));
  const out=[];
  if(all.length)out.push(['all',`${nw('nom',all.length)} ${plural(all.length,['компетенция нужна','компетенции нужны','компетенций нужны'])} всем ${nw('dat',n)} ролям — ${all.length>1?'их':'её'} учим одним курсом.`]);
  if(wide.length)out.push(['wide',`${list(wide)} ${wide.length>1?'нужны':'нужна'} ${Math.min(...wide.map(cov))===Math.max(...wide.map(cov))?nw('dat',cov(wide[0])):Math.min(...wide.map(cov))+'–'+Math.max(...wide.map(cov))} ролям из ${nw('gen',n)} — это второй общий блок.`]);
  if(R.some(ri=>coreCode(ri)))out.push(['core',`У каждой роли одна главная компетенция — бирюзовое кольцо. ${top===4?`Выше всех планка у роли «${md.short(who[0][0])}»: ${LVW[4]} в компетенции «${C2[who[0][1]].name}».`:`Самый высокий уровень на этом грейде — «${LVW[top]}».`}`]);
  else{const by={};who.forEach(([ri,c])=>{(by[ri]=by[ri]||[]).push(`«${C2[c].name}»`);});out.push(['core',`Самый высокий уровень — «${LVW[top]}»: ${Object.entries(by).slice(0,2).map(([ri,cs])=>`${md.short(+ri)} — ${cs.join(', ')}`).join('; ')}.`]);}
  return out;}
function mxMatrix(md){const R=md.roles,n=R.length,wide=MX.scale==='design',cols=`minmax(140px,230px) repeat(${n},${wide?'minmax(56px,104px)':'minmax(40px,64px)'}) minmax(70px,130px)`;
  const cov=c=>R.filter(ri=>lvl(ri,c,gradeOf(ri))).length;
  const head=`<div class="mrow mhead" style="--cols:${cols};--n:${n}"><div></div>${R.map(ri=>`<button class="mcol${wide?'':' vert'}" data-role="${ri}" title="${esc(M.roles[ri].name)}">${esc(md.short(ri))}</button>`).join('')}<div class="small muted">Нужна ролям</div></div>`;
  const rows=md.groups.map(([t,codes],gi)=>`<div class="mgroup${gi===0&&t==='Для всех'?' all':''}"><div class="mglabel">${t}</div>${codes.map(c=>`<div class="mrow hl-${cov(c)===n?'all':cov(c)>=Math.max(2,Math.ceil(n*.6))?'wide':'none'}" style="--cols:${cols};--n:${n}"><button class="mname" data-comp="${c}">${C2[c].name}</button>${R.map(ri=>{const g=gradeOf(ri),l=lvl(ri,c,g);return `<button class="mcell" data-role="${ri}" data-code="${c}" aria-label="${esc(M.roles[ri].name+' · '+C2[c].name+': '+(l?LVW[l]:'не нужна'))}">${hb(l,{core:coreCode(ri)===c,title:`${M.roles[ri].name} · ${C2[c].name} — ${l?LVW[l]:'не нужна'}${hasGrades(ri)?' ('+GRADES[g]+')':''}`})}</button>`;}).join('')}<div class="mcov" data-code="${c}"><span class="mbar"><i style="width:${cov(c)/n*100}%"></i></span><span class="small">${cov(c)} из ${n}</span></div></div>`).join('')}</div>`).join('');
  const leg=`<div class="mleg">${[1,2,3,4].map(l=>`<span>${hb(l)} ${LVW[l]}</span>`).join('')}<span>${hb(0)} не нужна</span>${R.some(ri=>coreCode(ri))?`<span>${hb(2,{core:true})} главная компетенция роли</span>`:''}</div>`;
  return `<div class="mx" id="mx">${head}${rows}</div>${leg}<p class="muted small">Нажмите на роль или компетенцию, чтобы увидеть подробности.</p>`;}
function jms(ri,c){const l=g=>lvl(ri,c,g),core=coreCode(ri)===c;return hasGrades(ri)?`<span class="jms">${['junior','middle','senior'].map(g=>hb(l(g),{core,title:`${GRADES[g]}: ${l(g)?LVW[l(g)]:'не нужна'}`})).join('<i class="ln"></i>')}</span>`:hb(l('middle'),{core});}
function mxRoles(md){const R=md.roles,shared=(md.groups.find(g=>g[0]==='Для всех')||['',[]])[1].filter(c=>R.every(ri=>lvl(ri,c,'middle')||lvl(ri,c,'senior')));
  return `${shared.length?`<div class="mshared"><b>Для всех ${R.length}:</b> ${shared.map(c=>C2[c].name).join(' · ')}</div>`:''}<div class="rcards">${R.map(ri=>{const cc=coreCode(ri),codes=md.groups.flatMap(g=>g[1]).filter(c=>!shared.includes(c)&&(lvl(ri,c,'junior')||lvl(ri,c,'middle')||lvl(ri,c,'senior')));
    return `<div class="card rcard"><h3>${esc(M.roles[ri].name)}</h3>${cc?`<div class="rmain">Главное — ${C2[cc].name}</div>`:''}${hasGrades(ri)?'<div class="jmshead small muted"><span>Junior</span><span>Middle</span><span>Senior</span></div>':''}${codes.map(c=>`<div class="rrow"><span>${C2[c].name}</span>${jms(ri,c)}</div>`).join('')}<p style="margin:10px 0 0"><button class="btn sec" data-role="${ri}">Подробнее</button></p></div>`;}).join('')}</div>`;}
function mxTogether(md){const R=md.roles,n=R.length,cov=c=>R.filter(ri=>lvl(ri,c,gradeOf(ri)));
  const chip=(ri,c)=>`<span class="rchip${coreCode(ri)===c?' main':''}">${esc(md.short(ri))}</span>`;
  const broad=md.groups.flatMap(g=>g[1]).filter(c=>cov(c).length>=Math.max(2,Math.ceil(n*.6)));
  return `<p class="lead">${nw('nom',broad.length)} ${plural(broad.length,['компетенция нужна','компетенции нужны','компетенций нужны'])} ${nw('dat',Math.max(2,Math.ceil(n*.6)))} и больше ролям из ${nw('gen',n)} — это пакет для общего обучения. Остальное учим адресно.</p>
  <div class="dgrid">${md.groups.map(([t,codes])=>`<div class="card dom${t==='Для всех'?' all':''}"><div class="mglabel">${t}</div>${codes.map(c=>{const w=cov(c);return `<button class="dtile" data-comp="${c}"><span class="dtop"><b>${C2[c].name}</b><span class="small muted">${w.length} из ${n}</span></span><span class="chips">${w.map(ri=>chip(ri,c)).join('')}</span></button>`;}).join('')}</div>`).join('')}</div>
  <p class="muted small">Бирюзовая плашка — для этой роли компетенция главная.</p>`;}
function mxCompany(){const n=M.divisions.length,divs=M.divisions,N=M.roles.length,share=(d,c)=>{const rs=d.roles.map(roleIdx);return rs.filter(ri=>lvl(ri,c.code,'middle')).length/rs.length;},cov=c=>M.roles.filter((_,ri)=>lvl(ri,c.code,'middle')).length;
  const L={1:'Для всех',2:'Общие сценарии',3:'Профильные'},cols=`minmax(150px,240px) repeat(${divs.length},minmax(44px,1fr)) minmax(80px,120px)`;
  const head=`<div class="mrow mhead" style="--cols:${cols};--n:${n}"><div></div>${divs.map(d=>`<button class="mcol" data-div="${esc(d.name)}" title="${esc(d.name)} — открыть матрицу подразделения">${DIV_SHORT[d.name]||d.name}</button>`).join('')}<div class="small muted">Нужна ролям</div></div>`;
  const rows=[1,2,3].map(l=>{const cs=M.competencies.filter(c=>c.layer===l).sort((a,b)=>cov(b)-cov(a));return `<div class="mgroup${l===1?' all':''}"><div class="mglabel">${L[l]}</div>${cs.map(c=>`<div class="mrow" style="--cols:${cols};--n:${n}"><button class="mname" data-comp="${c.code}">${c.name}</button>${divs.map(d=>{const q=share(d,c);return `<button class="mcell" data-div="${esc(d.name)}">${hb(q?Math.max(1,Math.round(q*4)):0,{title:`${d.name} · ${c.name}: нужна ${Math.round(q*100)}% ролей`})}</button>`;}).join('')}<div class="mcov"><span class="mbar"><i style="width:${cov(c)/N*100}%"></i></span><span class="small">${cov(c)} из ${N}</span></div></div>`).join('')}</div>`;}).join('');
  const many=M.competencies.filter(c=>cov(c)>N/2);
  return `<h2>${nw('nom',many.length)} ${plural(many.length,['компетенция нужна','компетенции нужны','компетенций нужны'])} больше чем половине ролей компании — их учим всей компанией</h2><p class="muted">Кружок — какая доля ролей подразделения нуждается в компетенции: четверть, половина, три четверти, все. Нажмите на подразделение, чтобы открыть его матрицу.</p><div class="mx">${head}${rows}</div><div class="mleg">${[1,2,3,4].map(l=>`<span>${hb(l)} ${['','до четверти','до половины','до трёх четвертей','все роли'][l]}</span>`).join('')}<span>${hb(0)} не нужна</span></div>`;}
function mxPanel(){const p=MX.panel;if(!p)return '';let body='';
  if(p.role!=null){const ri=p.role,r=M.roles[ri],cc=coreCode(ri),md=mxModel(),codes=md.groups.flatMap(g=>g[1]).filter(c=>lvl(ri,c,'junior')||lvl(ri,c,'middle')||lvl(ri,c,'senior'));
    const F=FQ.roles&&FQ.roles[r.name];let quad='';
    if(F){const rows=codes.filter(c=>lvl(ri,c,'middle')).sort((a,b)=>(F.comps[b]||3)-(F.comps[a]||3));
      quad=`<h4>Как часто нужна в работе <span class="ex">пример</span></h4><div class="fdot fhead"><span></span><span class="ftrack"><em>реже</em><em>каждый день</em></span></div>${rows.map(c=>{const f=F.comps[c]||3;return `<div class="fdot"><span>${C2[c].name}</span><span class="ftrack">${[1,2,3,4,5].map(k=>`<i class="${k<=f?'on':''}"></i>`).join('')}${hb(lvl(ri,c,'middle'),{core:c===cc,title:`${FQ.scale[f]} · на Middle — ${LVW[lvl(ri,c,'middle')]}`})}</span></div>`;}).join('')}<p class="muted small">Шкала — как часто задачи встречаются в работе, кружок — нужный уровень на Middle.</p>`;}
    body=`<h3>${esc(r.name)}</h3>${cc?`<div class="rmain">Главное — ${C2[cc].name}</div>`:''}<h4>${hasGrades(ri)?'Как растёт от Junior к Senior':'Что нужно'}</h4>${hasGrades(ri)?'<div class="jmshead small muted"><span>Junior</span><span>Middle</span><span>Senior</span></div>':''}${codes.map(c=>`<div class="rrow"><span>${C2[c].name}</span>${jms(ri,c)}</div>`).join('')}${quad}<p style="margin-top:14px"><a class="btn sec" href="#/role/${ri}${hasGrades(ri)?'/'+MX.grade:''}">Открыть роль</a></p>`;}
  else if(p.comp){const c=C2[p.comp],md=MX.scale==='company'?{roles:M.roles.map((_,i)=>i)}:mxModel(),rs=md.roles.filter(ri=>lvl(ri,c.code,'junior')||lvl(ri,c.code,'middle')||lvl(ri,c.code,'senior'));
    body=`<h3>${c.name}</h3><p class="small">${c.tagline}</p><h4>Кому нужна · ${rs.length} из ${md.roles.length}</h4>${rs.map(ri=>`<div class="rrow"><span>${esc(M.roles[ri].name)}</span>${jms(ri,c.code)}</div>`).join('')}<div class="rmain ${rs.length>=Math.max(2,Math.ceil(md.roles.length*.6))?'wide':'soft'}">${rs.length>=Math.max(2,Math.ceil(md.roles.length*.6))?'Учим одним курсом':'Учим адресно'}</div><p style="margin-top:14px"><a class="btn sec" href="#/comp/${c.id}">Открыть компетенцию</a></p>`;}
  return `<div class="mpanel-bg" data-close="1"></div><aside class="mpanel" role="dialog" aria-label="Подробности"><button class="mclose" data-close="1" aria-label="Закрыть">×</button>${body}</aside>`;}
PAGES.matrix=()=>{const seg=(k,opts)=>`<div class="seg" role="group">${opts.map(([v,t])=>`<button data-mx="${k}" data-v="${v}" class="${MX[k]===v?'on':''}">${t}</button>`).join('')}</div>`;
  const md=MX.scale==='company'?null:mxModel(),grades=md&&md.roles.some(hasGrades);
  const title=MX.scale==='design'?'Шесть ролей дизайна: общий фундамент, четыре направления и одна главная компетенция у каждой':md?`${md.title}: ${md.roles.length} ${plural(md.roles.length,['роль','роли','ролей'])}`:'';
  const ins=md&&MX.view==='matrix'?`<ol class="mins">${mxInsights(md).map(([k,t])=>`<li data-hl="${k}">${t}</li>`).join('')}</ol>`:'';
  return `${crumbs(['Матрица'])}<h1>Матрица компетенций</h1><div class="tbar">${seg('scale',[['design','Дизайн'],['company','Вся компания']].concat(MX.scale!=='design'&&MX.scale!=='company'?[[MX.scale,DIV_SHORT[MX.scale]||MX.scale]]:[]))}${md?seg('view',[['matrix','Матрица'],['roles','Роли'],['together','Что учить вместе']]):''}${md&&grades?seg('grade',[['junior','Junior'],['middle','Middle'],['senior','Senior']]):''}<button class="btn sec prnt" data-print="1" title="Откроется окно печати — выберите «Сохранить как PDF»">Сохранить в PDF</button></div>
  <div id="mxbody">${md?`<h2>${title}</h2>${ins}${MX.view==='matrix'?mxMatrix(md):MX.view==='roles'?mxRoles(md):mxTogether(md)}`:mxCompany()}</div><div id="mxpanel">${mxPanel()}</div>`;};
PAGES.matrix.after=()=>{const app=$('#app');
  app.onclick=e=>{const b=e.target.closest('[data-mx],[data-role],[data-comp],[data-div],[data-close],[data-print]');if(!b||!app.contains(b))return;const d=b.dataset;
    if(d.print){MX.panel=null;$('#mxpanel').innerHTML='';window.print();return;}
    if(d.close){MX.panel=null;$('#mxpanel').innerHTML='';return;}
    if(d.mx){if(d.mx==='grade'&&MX.view==='matrix'&&MX.scale!=='company'){MX.grade=d.v;mxRegrade();return;}MX[d.mx]=d.v;if(d.mx==='scale')MX.view='matrix';MX.panel=null;render('#/matrix');return;}
    if(d.div&&MX.scale==='company'){MX.scale=d.div==='Дизайн'?'design':d.div;MX.view='matrix';MX.panel=null;render('#/matrix');return;}
    if(d.role!=null){MX.panel={role:+d.role};}else if(d.comp){MX.panel={comp:d.comp};}else return;
    $('#mxpanel').innerHTML=mxPanel();const cl=$('#mxpanel .mclose');if(cl)cl.focus();};
  app.onmouseover=e=>{const li=e.target.closest('.mins li'),mx=$('#mx');if(mx)mx.dataset.hl=li?li.dataset.hl:'';};
  document.onkeydown=e=>{if(e.key==='Escape'&&MX.panel){MX.panel=null;const p=$('#mxpanel');if(p)p.innerHTML='';}};};
/* смена грейда без перерисовки: кружки плавно доливаются, изменившиеся клетки на миг подсвечиваются */
function mxRegrade(){const md=mxModel();
  document.querySelectorAll('#app [data-mx="grade"]').forEach(b=>b.classList.toggle('on',b.dataset.v===MX.grade));
  document.querySelectorAll('#mx .mcell').forEach(cell=>{const ri=+cell.dataset.role,c=cell.dataset.code,l=lvl(ri,c,gradeOf(ri)),h=cell.querySelector('.hb'),was=+getComputedStyle(h).getPropertyValue('--p')||0;
    h.style.setProperty('--p',l*25);h.classList.toggle('none',!l);h.classList.toggle('full',l>=4);h.title=`${M.roles[ri].name} · ${C2[c].name} — ${l?LVW[l]:'не нужна'} (${GRADES[gradeOf(ri)]})`;
    if(Math.round(was)!==l*25){cell.classList.remove('chg');void cell.offsetWidth;cell.classList.add('chg');}});
  const n=md.roles.length;document.querySelectorAll('#mx .mcov').forEach(el=>{const k=md.roles.filter(ri=>lvl(ri,el.dataset.code,gradeOf(ri))).length;el.querySelector('i').style.width=k/n*100+'%';el.querySelector('.small').textContent=`${k} из ${n}`;});
  const ol=$('#app .mins');if(ol)ol.innerHTML=mxInsights(md).map(([k,t])=>`<li data-hl="${k}">${t}</li>`).join('');}

/* ---------- что человек сможет после обучения (навыки-результаты из data/skills.json) ---------- */
function outcomesHTML(r,g){const all=SKILLS[r.name];if(!all)return '';const now=all.filter(s=>GORD.indexOf(s.grade)<=GORD.indexOf(g||'middle'));if(!now.length)return '';
  return `<section class="outc"><h2>Что вы сможете после обучения</h2><p class="muted">Оценка покажет, каких навыков не хватает для этих результатов. Каждый пробел закроет короткий урок на рабочей задаче.</p><div class="outgrid">${now.map(s=>`<div class="card outc-i"><b>${s.name}</b><div class="small muted">Результат: ${s.artifact}</div></div>`).join('')}</div></section>`;}
/* к какому результату ведёт урок: сначала должность сотрудника, потом любая должность, где навык нужен */
function outcomeOf(id,ri){const pick=name=>(SKILLS[name]||[]).find(s=>s.atoms.includes(id));
  if(ri!=null&&M.roles[ri]){const s=pick(M.roles[ri].name);if(s)return {s,role:M.roles[ri].name};}
  for(const name of Object.keys(SKILLS)){const s=pick(name);if(s)return {s,role:name};}return null;}
/* ---------- инструменты компетенции в трёх контурах ---------- */
function stackHTML(c){const rows=(DATA.stack||{})[c.code];if(!rows||!rows.length)return '';
  return `<h2>Чем работать</h2><p class="muted small">Для каждой задачи — основной инструмент, альтернатива и российский или свой контур: он нужен, когда данные нельзя выносить во внешние сервисы.</p><div class="scroll"><table class="stack"><tr><th class="l">Задача</th><th>Основной</th><th>Альтернатива</th><th>Российский или свой контур</th></tr>${rows.map(x=>`<tr><td class="l"><b>${x.task}</b>${x.note&&!/[A-Z]\d\d|якор/i.test(x.note)?`<div class="muted small">${x.note}</div>`:''}</td><td>${x.main}</td><td>${x.alt}</td><td>${x.ru}</td></tr>`).join('')}</table></div>`;}

/* ---------- типографика: неразрывный пробел после коротких слов, чтобы предлоги и союзы не висели в конце строки ---------- */
const NB=/(^|[\s(«„"—–-])(в|во|на|с|со|к|ко|у|о|об|обо|и|а|но|да|по|за|из|изо|от|до|не|ни|для|без|при|про|над|под|что|как|или|же|ли|бы|ее|её|их|это)[ \t\r\n]+/gi;  /* после слова — только обычный пробел, иначе уже поставленный неразрывный «съедает» следующее слово */
function typo(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('script,style,textarea,input,select,svg,code,pre')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{let t=n.data,prev;do{prev=t;t=t.replace(NB,(m,a,b)=>a+b+' ');}while(t!==prev);t=t.replace(/(\d)\s+(?=[а-яёa-z%₽])/gi,'$1 ').replace(/\s+([—–])\s/g,' $1 ');if(t!==n.data)n.data=t;});}
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)typo(n);else if(n.nodeType===3&&n.parentNode)typo(n.parentNode);}))).observe(document.body,{childList:true,subtree:true});

/* ---------- подсветка курсора «выигрывает ближайший» (идея Fluid Functionalism, MIT) ----------
   Одна плашка на контейнер: не привязана к зоне элемента, поэтому нет мёртвых зон между целями.
   Работает на делегировании — переживает перерисовку страницы. */
const FLUID=[['.seg','button','fill'],['#mx','.mcell','fill'],['.reqs','.rq','fill'],['.lvsub','li','fill'],
             ['.chips','.chip','ring'],['.grid','.card','ring'],['.rcards','.rcard','ring'],['.pcards','.pcard','ring'],
             ['.outgrid','.outc-i','ring'],['.dgrid','.dtile','ring']];
function fluidFor(el){for(const [host,item,mode] of FLUID){const h=el.closest(host);if(h)return {h,item,mode};}return null;}
function fluidShow(h,item,mode,x,y){
  h.classList.add('fluid-host');
  let f=h.querySelector(':scope > .fluid');
  if(!f){f=document.createElement('div');f.className='fluid '+mode;h.appendChild(f);}
  const items=[...h.querySelectorAll(':scope '+item)].filter(n=>n.offsetParent!==null);
  if(!items.length)return;
  const hb=h.getBoundingClientRect();let best=null,bd=1e9;
  items.forEach(n=>{const b=n.getBoundingClientRect(),dx=Math.max(b.left-x,0,x-b.right),dy=Math.max(b.top-y,0,y-b.bottom);
    const d=Math.hypot(dx,dy);if(d<bd){bd=d;best={n,b};}});
  if(!best||bd>90){f.classList.remove('on');return;}
  const {b}=best,st=getComputedStyle(best.n);
  f.style.width=b.width+'px';f.style.height=b.height+'px';
  f.style.borderRadius=st.borderRadius&&st.borderRadius!=='0px'?st.borderRadius:'10px';
  f.style.transform=`translate(${b.left-hb.left+h.scrollLeft}px,${b.top-hb.top+h.scrollTop}px)`;
  f.classList.add('on');
}
function fluidHide(h){const f=h&&h.querySelector(':scope > .fluid');if(f)f.classList.remove('on');}
document.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch')return;
  const t=e.target instanceof Element?e.target:document.elementFromPoint(e.clientX,e.clientY);if(!t)return;
  const cur=fluidFor(t);
  document.querySelectorAll('.fluid.on').forEach(f=>{if(!cur||f.parentElement!==cur.h)f.classList.remove('on');});
  if(cur)fluidShow(cur.h,cur.item,cur.mode,e.clientX,e.clientY);
},{passive:true});
document.addEventListener('pointerleave',()=>document.querySelectorAll('.fluid.on').forEach(f=>f.classList.remove('on')),true);

/* ---------- роутер ---------- */
function render(h){  /* h — маршрут без смены адреса (для автотестов) */
  const [route,...args]=((h??location.hash).replace(/^#\/?/,'')||'home').split('/');
  const page=PAGES[route]||PAGES.notfound;
  const a=args.map(x=>x==='-'?undefined:x);
  const html=page(...a);header(route);const app=$('#app');app.onclick=app.onmouseover=null;document.onkeydown=null;app.innerHTML=html;if(page.after)page.after(...a);
  $('#ftr').innerHTML=route==='home'?'Прототип. Примеры профилей, команда и сводка по компании — условные данные. Концепты визуализации: <a href="frequency.html">частота задач</a>, <a href="radar3d.html">объёмный радар</a>, <a href="skilltree.html">скилл-древо</a>.':'';
  window.scrollTo(0,0);
}
document.body.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);});
window.addEventListener('hashchange',()=>render());render();typo(document.body);
</script>
