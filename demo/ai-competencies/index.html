 ролика о посвящении в студенты", "ok": false}, {"t": "До генерации визуала с преподавателем взять у юристов форму согласия и подписать её с ним на эту кампанию", "ok": true}], "ok_fb": "Верно: человек на визуале — либо собирательный образ без сходства, либо тот, кто дал согласие; за формой согласия идут к юристам до начала работы.", "fb": "Допустимы три действия: собирательный образ с проверкой на сходство, работа с фото человека, который подписал согласие, и оформление согласия у юристов до генерации. Публичность ректора согласия не заменяет, «похожая на актрису» героиня — это та же узнаваемость, только без имени, а открытый профиль в соцсети не даёт права использовать лицо в ролике. Правило одно: узнаваемого человека — и «похожего на» — не генерируем и не публикуем без его согласия."}, "G12": {"type": "p", "q": "Ключевой визуал приёмной кампании утверждён: фон и герои сделаны в генераторе изображений, композицию, цвет и типографику вы дорабатывали вручную. Проект уходит в архив, и через год у юристов может возникнуть вопрос, откуда картинка и чьи на неё права. У вас остались заметки по ходу работы. Напишите запрос ИИ-помощнику в корпоративном чате: пусть соберёт из заметок досье генерации к макету — укажите, что в него должно войти.", "checks": [["Что нужно: досье генерации к макету для архива", "досье|архив|паспорт|карточк[аую] (проект|макет|генерац)|справк|опис(ь|ание) (проект|макет|процесс|генерац)"], ["Исходные сведения: инструмент и версия, тариф, запросы, референсы", "инструмент|генератор|сервис|верси|модел|тариф|лиценз|услови|промпт|запрос|референс"], ["Формат: структура досье, поля, файл рядом с исходниками", "таблиц|списк|список|пункт|файл|структур|раздел|пол[яе] |полями|формат|шаблон|одн(у|а) страниц"], ["Ограничения: ничего не додумывать, пробелы пометить", "не (додум|выдум|придум|добавля|сочин)|только (по|из|то)|без |пуст|пометь|отметь|пропуск|если (нет|не указан)"], ["Что уточнить и подтвердить: доля ручной работы, даты, исходники", "провер|уточни|спроси|дол[яюи] |ручн|дат[аыу]|исходник|слои|слоями|подтверд|скриншот"]], "good": "Собрала досье на одну страницу. Проект: ключевой визуал приёмной кампании, макет утверждён 12 марта. Инструмент: генератор изображений разрешённого контура, версия и тариф — как в ваших заметках; условия использования на дату работы сохранены отдельным файлом. Запросы: четыре итоговых, дословно, с датами. Референсы: два собственных наброска и описание стиля словами; чужих изображений не было. Ручная доработка: перекомпоновка героев, замена фона на втором плане, цветокоррекция под фирменный синий, вся типографика — по вашей оценке около 40% итогового изображения; подтверждают послойный исходник и три промежуточных сохранения. Пустыми оставила два поля — в заметках нет версии модели и имени того, кто утверждал макет. Подскажите их, и досье можно класть в архив рядом с исходниками.", "poor": "Вот текст: «Изображение создано с помощью нейросети и доработано дизайнером». Для архива этого мало. Подскажите: каким инструментом и на каком тарифе сделана генерация, какие запросы и референсы использовались, что именно вы дорабатывали вручную и чем это можно подтвердить, в каком виде нужно досье и что делать с пунктами, по которым в заметках ничего нет?"}, "G13": {"type": "c", "q": "Для анонса Дня открытых дверей вы сгенерировали реалистичную картинку: абитуриенты с родителями в холле главного корпуса, выглядит как репортажное фото. Менеджер по соцсетям просит опубликовать её сегодня в VK и на видеоплощадке — «как есть, без лишних плашек». Что делаете?", "opts": [{"t": "Публикую как есть: пометка для авторов дело добровольное, а картинка — всего лишь иллюстрация к анонсу, претензий к ней не будет", "g": 2, "fb": "Для авторов пометка и правда добровольна, но у площадок бывают свои требования к реалистичному ИИ-контенту, и у компании есть своё правило. Стоит свериться с ними до публикации."}, {"t": "Сверяюсь с правилом компании и требованиями площадок, ставлю пометку штатным инструментом, в подписи не выдаю картинку за фото с события", "g": 5, "fb": "Решение принято до публикации и по правилам: реалистичный ИИ-контент раскрыт штатным инструментом площадки, а подпись не обещает абитуриентам репортаж, которого не было."}, {"t": "Дописываю в самом конце подписи мелкий хэштег про ИИ, а штатную пометку площадки не включаю — формально раскрытие в посте уже есть", "g": 3, "fb": "Намерение раскрыть — верное, но хэштег в конце подписи площадка не считывает и читатель не замечает. Надёжнее штатный инструмент пометки: его видят и аудитория, и модерация."}, {"t": "Вычищаю из файла метаданные о генерации, чтобы площадка не поставила пометку сама и пост смотрелся живым, как настоящий репортаж", "g": 1, "fb": "Так реалистичная генерация выдаётся за репортаж, а раскрытие намеренно обходится. Когда это заметят, под вопросом окажется доверие ко всем фото приёмной кампании."}], "why": "потому|так как|площадк|правил|помет|маркир|раскры|довер|реалист|обман|ввод(ит|им) в заблужд|репутац|репортаж|честн"}, "G14": {"type": "c", "q": "К сентябрю нужна серия из 60 иллюстраций для лендингов программ — в фирменной манере, которую задают брендбук и 25 иллюстраций прошлых лет (права на них у университета). Срок — три недели. Загружать брендбук и исходники во внешние сервисы нельзя. Как организуете работу?", "opts": [{"t": "Загружаю брендбук и прошлые иллюстрации во внешний сервис обучения стилей: так быстрее всего, а часть картинок всё равно уже висит на сайте", "g": 1, "fb": "Скорость понятна, но брендбук и исходники — закрытые материалы, и то, что часть картинок опубликована, этого не меняет. Для таких задач есть разрешённый контур."}, {"t": "Настраиваю стилевую модель в разрешённом контуре на иллюстрациях университета, пробную десятку сверяю с брендбуком и лишь потом запускаю всю серию", "g": 5, "fb": "Материалы остаются в разрешённом контуре, манера берётся из иллюстраций, права на которые у университета, а пробная партия показывает расхождения с брендбуком до того, как сделаны все 60."}, {"t": "Описываю фирменную манеру словами во внешнем генераторе, делаю все 60 иллюстраций и каждую вручную подтягиваю к брендбуку уже в редакторе", "g": 3, "fb": "Закрытые материалы не уходят наружу — это верно. Но на 60 штуках словесное описание не удержит манеру, и ручная подгонка каждой иллюстрации съест срок. Стилевая модель в разрешённом контуре решает обе задачи."}, {"t": "Отказываюсь от ИИ и рисую все 60 иллюстраций вручную: раз брендбук нельзя загружать в сервисы, генерация в фирменной манере невозможна", "g": 2, "fb": "Материалы в безопасности, но запрет касается внешних сервисов, а не ИИ вообще. В разрешённом контуре стилевую модель настроить можно — и три недели станут реальным сроком."}], "why": "потому|так как|контур|наруж|внешн|закрыт|брендбук|бренд|прав[аоу] |стил|манер|сери|пробн|тестов|партии|сверя|провер|срок"}, "G15": {"type": "c", "q": "Для рекламы приёмной кампании на абитуриентов 16–18 лет сгенерированы три обложки, все «красивые». А — студентка с идеально гладкой кожей в сине-фиолетовом неоне; Б — безликий стеклянный кампус на закате, которого у университета нет; В — студенты в узнаваемом холле вашего корпуса, свет естественный, но композиция простовата. Руководитель приёмной комиссии говорит: «Берите самую яркую». Что делаете?", "opts": [{"t": "Беру вариант А, как просит руководитель: яркая картинка соберёт больше кликов, а разговоры о «нейросетевом виде» — дело вкуса", "g": 1, "fb": "Яркость привлекает взгляд, но глянцевую кожу и неон подростки считывают как дешёвую генерацию с первого кадра — и переносят это впечатление на университет."}, {"t": "Называю критерии: приметы шаблонной генерации и связь с реальным вузом; бракую А и Б, объясняю это руководителю и дорабатываю композицию В", "g": 5, "fb": "Критерии названы вслух, поэтому брак — не вкусовой спор: гладкая кожа, неон и чужой кампус считываются аудиторией как шаблон, а В показывает настоящий университет и доводится по композиции."}, {"t": "Запускаю все три обложки в рекламный тест с небольшим бюджетом на неделю: пусть цифры кликов покажут, какая из них работает лучше", "g": 3, "fb": "Тест — полезный инструмент, но варианты с приметами шаблонной генерации уже увидит аудитория, а клики не покажут потерю доверия. Сначала отбор по критериям, потом тест того, что его прошло."}, {"t": "Выкладываю три обложки в рабочий чат отдела, прошу коллег проголосовать и отдаю в рекламу ту, что наберёт большинство голосов", "g": 2, "fb": "Мнение коллег полезно, но голосование без критериев выбирает самое эффектное, а коллеги — не абитуриенты 16–18 лет. Стоит сначала назвать, по каким признакам отбираете."}], "why": "потому|так как|критери|шаблон|считыва|дешёв|дешев|генерац|нейросет|аудитор|абитуриент|подрост|довер|реальн|настоящ|неон|кож|глянц|безлик"}, "F01": {"type": "j", "multi": true, "q": "Вы рассматриваете при 100% сгенерированный постер «Студенческой весны»: группа студентов с гитарой на фоне главного корпуса, поверх — ваш заголовок. Какие из наблюдений — типовые артефакты генерации? Отметьте всё подходящее.", "opts": [{"t": "У гитариста на левой руке шесть пальцев, а гриф гитары «врастает» прямо в ладонь", "ok": true}, {"t": "На вывеске корпуса вместо названия — буквоподобные значки, герб над входом искажён", "ok": true}, {"t": "Заголовок, который вы набрали в макете, стоит в 40 px от края вместо 60 px по брендбуку", "ok": false}, {"t": "Тени студентов падают влево, тень фонаря — вправо, а окна корпуса «плывут» по перспективе", "ok": true}, {"t": "Файл постера сохранён в RGB, а типография в требованиях просит CMYK с её профилем", "ok": false}, {"t": "Кожа на всех лицах одинаково гладкая, «пластиковая», без пор и мелких теней", "ok": true}], "why_q": "Что вас насторожило и где на таком изображении вы ищете артефакты в первую очередь? Одной-двумя фразами.", "kw": [["анатомия: руки, пальцы, лица, кожа", "рук[иаеу ]|руках|пал[ье]ц|кист|анатом|лиц[оаеу ]|лицах|зуб|глаз|кож"], ["надписи, вывески и логотипы", "надпис|вывес|букв|логотип|герб|шрифт|значк"], ["геометрия, перспектива, свет и тени", "тен[ьией]|свет|перспектив|геометр|окн[аоу]|окон|лини|архитектур|здани"], ["просмотр при 100% по зонам", "100|масштаб|увелич|приближ|по зон|зон[аыу]|по част|кра[яйе]в? "]], "need": 2, "ok_fb": "Артефакты отмечены верно, и названо, где их искать: руки и лица, надписи и знаки, геометрия и тени — при 100% масштабе.", "fb": "Артефакты генерации здесь — шесть пальцев и гриф в ладони, буквоподобная вывеска с искажённым гербом, разнонаправленные тени с «плывущими» окнами и «пластиковая» кожа. Отступ заголовка — вопрос вёрстки и брендбука, цветовая модель — допечатной подготовки: генератор тут ни при чём. В обосновании стоит назвать хотя бы две зоны поиска: анатомия, надписи и знаки, геометрия и тени, просмотр при 100%."}, "F02": {"type": "p", "q": "Для шапки страницы факультета нужен баннер 3:1. Есть удачное фото пустой аудитории с собственной съёмки, пропорция 3:2: в кадре под потолком висит проектор с кронштейном, который отвлекает. Работаете в редакторе с генеративной заливкой из разрешённого контура. Напишите инструкцию редактору: что убрать, как расширить кадр и что при этом сохранить.", "checks": [["Что сделать: убрать проектор, расширить кадр", "убер|убра|удал|проектор|расшир|достро|дорис|продли|продолж"], ["Исходник: какое фото и что на нём", "фото|снимок|снимк|аудитори|исходн|кадр|потол|стен|парт|окн"], ["Формат результата: пропорция 3:1, куда расширять", "3:1|3 ?к ?1|три к одному|баннер|пропорц|формат|ширин|по бокам|влево|вправо|слева|справа|в стороны|пиксел|px"], ["Что сохранить и чего не добавлять", "не (меня|трога|добавля|искажа)|без |сохран|остальн|никаких|как есть"], ["Что проверить: швы, свет, перспектива при 100%", "провер|100|шов|швы|швов|стык|незамет|не (была )?видн|повтор|паттерн|перспектив|свет|тен[ьией]"]], "good": "Готово. Проектор с кронштейном убран, на его месте достроены потолочные плиты — шаг и направление швов продолжают соседние. Кадр расширен влево и вправо до 3:1: слева продолжен ряд парт и стена, справа — окна с тем же ритмом рам; центральная часть исходного фото не тронута. Людей, надписей и новых предметов не добавляла. По вашей проверке при 100%: стыков и повторяющихся фрагментов не вижу, свет из окон и тени под партами идут в одну сторону, линии парт сходятся в ту же точку. Одно место посмотрите сами: крайнее правое окно получилось на 5% уже остальных — могу перестроить.", "poor": "Вот новое изображение аудитории в формате баннера — я сгенерировала его заново: другие парты, на стене появились часы и плакат, у окна стоит человек. Чтобы сохранить именно ваше фото, подскажите: что конкретно убрать, в какие стороны и до какой пропорции расширить кадр, что в исходном снимке менять нельзя и по каким признакам проверить, что правка не видна?"}, "F03": {"type": "p", "q": "К посту о наборе в магистратуру сгенерированы три варианта обложки. В первом у студентки на правой руке шесть пальцев, остальное хорошо. Во втором на экране ноутбука и на худи — буквоподобная абракадабра. В третьем «поплыло» всё: лицо асимметрично, окна за спиной без перспективы, руки сливаются со столом. Напишите запрос в редактор на исправление того, что стоит исправлять, и укажите, при каком условии вариант бракуете.", "checks": [["Что сделать: исправить артефакты в вариантах", "исправ|поправ|перерис|перегенер|убер|убра|замен|артефакт|дефект"], ["Где именно: какой вариант, какая зона", "рук[иаеу ]|пал[ье]ц|кист|надпис|букв|экран|худи|лиц[оаеу ]|перв|втор|трет"], ["Что должно получиться в исправленном месте", "област|маск|выдел|фрагмент|локальн|пять|пяти|5 пальц|естествен|чист(ый|ая|ое|ую)|однотонн|пуст(ой|ая|ую)|гладк"], ["Что не трогать: остальное изображение сохранить", "не (меня|трога|добавля|затрагива)|остальн|сохран|без |как есть"], ["Критерий брака и проверка результата", "брак|отказ|не бер|не ид[её]т|заново|с нуля|если (не|после|артефакт)|попыт|провер|100"]], "good": "Сделала. Вариант 1: по маске на правой кисти перерисована рука — пять пальцев, естественный изгиб, свет как на левой руке; остальное изображение не менялось. Вариант 2: экран ноутбука заменён на нейтральный светлый интерфейс без надписей, принт на худи убран — ткань однотонная, складки сохранены. Проверила оба при 100%: границы правки не видны, новых надписей нет. Вариант 3 по вашему критерию в брак: артефакты в лице, руках и перспективе сразу, локальной правкой это не собрать — дешевле сгенерировать заново. Если в первом варианте после второй попытки кисть вас не устроит, по вашему же правилу он тоже уходит в брак.", "poor": "Я улучшила все три изображения целиком: они стали чётче, но лица и фон немного изменились, а пальцев на руке в первом варианте по-прежнему шесть. Чтобы правка была точной, подскажите: в каком варианте и в какой зоне что исправить, что должно получиться на этом месте, что в картинке трогать нельзя и при каком условии вариант проще отбраковать, чем чинить?"}, "F04": {"type": "p", "q": "Иллюстрация для стенда приёмной комиссии утверждена, но существует только как файл 1024 px по длинной стороне. Печатать её нужно на ролл-апе 85×200 см, типография просит не меньше 100 dpi в размере, TIFF или PDF, CMYK. В разрешённом контуре у вас есть агент с апскейлером и векторизатором. Поставьте ему задачу подготовить файл и укажите, что проверить после увеличения.", "checks": [["Что сделать: увеличить и подготовить файл к печати", "апскейл|увелич|upscal|разрешен|подготов|векториз|масштабир"], ["Исходник и носитель: файл 1024 px, ролл-ап 85×200, требования типографии", "1024|исходн|иллюстрац|85|200|ролл|типограф|требован|стенд"], ["Формат результата: размер в пикселях или dpi, тип файла, цветовая модель", "dpi|точек на|пиксел|px|tiff|тифф|pdf|cmyk|профил|кратн|в 8 раз|8x|8х|7 ?[89]\\d\\d"], ["Ограничения: не дорисовывать новое, исходник сохранить", "не (добавля|выдум|дорисов|меня|придум|перезапис)|без |сохран|копи[яюи]|отдельн(ым|ый) файл"], ["Что проверить: апскейл не выдумал детали, просмотр при 100%", "провер|сравн|100|выдума|артефакт|детал|лиц[оаеу ]|надпис|каш[аи]|мыл|контур|кра[яйе]"]], "good": "Готово. Для 85×200 см при 100 dpi нужно примерно 3350×7870 px — увеличила исходник в 8 раз в два прохода, результат сохранила отдельным файлом TIFF, исходник не тронут. Плоские заливки и контуры героя дополнительно векторизовала — они останутся чёткими в любом размере. В CMYK перевела по профилю из требований типографии; фирменный синий ушёл чуть в фиолетовый — поправила по значениям из брендбука, посмотрите на пробе. По вашей проверке при 100% сравнила с исходником: новых деталей нет, кроме одного места — на рюкзаке апскейлер «дорисовал» подобие надписи, которой не было; я её убрала. Зернистый фон в верхней трети слегка замылен — с полутора метров не заметно, но решение за вами.", "poor": "Я увеличила картинку в два раза — теперь она 2048 px. Для ролл-апа этого, скорее всего, мало, но точных требований у меня нет. Подскажите: какого размера носитель и какое разрешение просит типография, в каком формате и цветовой модели нужен файл, можно ли что-то дорисовывать и что сверить с исходником после увеличения?"}, "F05": {"type": "c", "q": "Афиша А2 осеннего концерта уходит в типографию через час, тираж 300 штук. Фон в макете сгенерирован: 1536×2048 px, RGB, обрезан ровно по краю листа. На экране всё выглядит хорошо. Что делаете?", "opts": [{"t": "Отправляю как есть: на экране фон резкий, а типография сама переведёт цвета, подгонит размер и добавит поля под обрез", "g": 1, "fb": "На экране лист А2 показан уменьшенным, поэтому нехватка разрешения не видна. Для А2 нужно около 5000×7000 px — в тираже фон выйдет мягким, а фирменный синий после автоматического пересчёта может уйти."}, {"t": "Увеличиваю фон апскейлером под А2 и смотрю его при 100%, перевожу в CMYK по профилю типографии, добавляю вылеты — и только тогда отправляю", "g": 5, "fb": "Часа на это хватает: разрешение подогнано под формат, апскейл проверен при 100%, цвет пересчитан по профилю типографии, вылеты на месте. В тираж уходит файл, в котором вы уверены."}, {"t": "Растягиваю фон в макете до размеров А2, цвета пересчитываю автоматически при экспорте PDF и просматриваю готовый лист на экране целиком", "g": 2, "fb": "Растягивание пикселей не добавляет, а просмотр листа целиком мягкость не покажет. Стоит увеличить фон апскейлером, посмотреть при 100% и перевести цвет по профилю типографии."}, {"t": "Прошу типографию перенести сдачу на утро и спокойно готовлю файл: апскейл, профиль, вылеты и проверка фона при стопроцентном масштабе", "g": 3, "fb": "Состав подготовки верный, и проверка на месте. Но эти шаги укладываются в час — перенос сдвигает тираж без необходимости. Его стоит просить, только если апскейл при 100% покажет проблему."}], "why": "потому|так как|разрешен|пиксел|dpi|апскейл|увелич|100|cmyk|профил|цвет|вылет|обрез|тираж|перепечат|печат|мыл|провер"}, "F06": {"type": "c", "q": "Для школьной олимпиады по информатике вы сгенерировали и доработали маскота — рыжего лиса в круглых очках и полосатом шарфе. Завтра показ оргкомитету, дальше — мерч и дипломы. Коллега, проходя мимо, говорит: «Он кого-то напоминает, из мультфильма, что ли». Что делаете?", "opts": [{"t": "Показываю как есть: каждая генерация уникальна, прямого копирования не было, а сходство с кем-то — субъективное впечатление коллеги", "g": 1, "fb": "Генераторы воспроизводят узнаваемые черты известных персонажей и без просьбы. На мерче и дипломах сходство заметят уже не коллеги — проверить стоит до показа."}, {"t": "До показа делаю обратный поиск по картинке, сравниваю с известными персонажами и знаками, сходство перерабатываю вручную, итог пишу в досье", "g": 5, "fb": "Проверка сделана до передачи заказчику и не на глаз: поиск показывает, на кого именно похож маскот, переработка снимает сходство прицельно, а запись в досье пригодится, если вопрос возникнет позже."}, {"t": "Спрашиваю у чат-бота, не похож ли маскот на известных персонажей, и, если он никого не называет, спокойно несу лиса на показ оргкомитету", "g": 3, "fb": "Это уже проверка, и подсказку она дать может. Но модель не ищет по базе изображений и часто отвечает «не похож» наугад — её ответ стоит дополнить обратным поиском по картинке."}, {"t": "На всякий случай меняю цвет шарфа и форму очков, чтобы лис точно отличался от кого бы то ни было, и без поиска отдаю оргкомитету", "g": 2, "fb": "Желание снять сходство — верное, но правка вслепую может не задеть того, что делает героя узнаваемым. Сначала выяснить, на кого он похож, потом менять именно эти черты."}], "why": "потому|так как|сходств|похож|напомина|персонаж|чуж|прав[аоу] |претенз|правооблад|поиск|провер|мерч|тираж|до показа|до передачи|заказчик"}, "F07": {"type": "c", "q": "Логотип молодёжного научного форума вы получили из генератора изображений практически за один запрос, оргкомитету он понравился. Теперь заказчик пишет: «Отлично, будем регистрировать как товарный знак, готовьте исходники». Что делаете?", "opts": [{"t": "Отдаю исходники и подтверждаю, что знак можно регистрировать: он сделан по нашему запросу, значит, и все права на него у нас", "g": 1, "fb": "Запрос сам по себе авторства не даёт: охрана изображения, целиком созданного генератором, под большим вопросом. Заказчик вложится в регистрацию и носители, не зная об этом."}, {"t": "Объясняю риск, беру генерацию как эскиз, перестраиваю знак вручную, фиксирую этапы и свой вклад, проверяю сходство и подключаю юристов", "g": 5, "fb": "Заказчик знает о риске заранее, ключевые элементы знака созданы человеком, вклад задокументирован, сходство проверено — юристам есть на что опереться при регистрации."}, {"t": "Трассирую сгенерированный логотип в вектор без изменений и отдаю исходники: перевод в кривые уже считается ручной работой дизайнера", "g": 2, "fb": "Вектор для знака нужен, но трассировка — техническая операция: форму по-прежнему придумал генератор. Творческий вклад появляется, когда вы перестраиваете сам знак."}, {"t": "Честно предупреждаю заказчика о риске и советую знак не регистрировать, а просто использовать на форуме в том виде, какой есть", "g": 3, "fb": "Предупредить о риске — верный шаг. Но заказчику нужен защищённый знак, и это решаемо: существенная ручная переработка с фиксацией вклада даёт основу для регистрации."}], "why": "потому|так как|авторств|автор|прав[аоу] |охран|регистр|ручн|вручную|переработ|вклад|досье|фиксир|документ|юрист|риск|сходств|генератор"}, "K07": {"type": "p", "q": "20 июня стартует приём документов на бакалавриат: 1 200 бюджетных мест, подача онлайн до 25 июля. Нужен пост для соцсетей университета — заголовок, подпись и обложка 1080×1350 с надписью на самой картинке. Работаете в генераторе, который умеет текст в изображении. Напишите запрос так, чтобы получить связку целиком и чтобы надпись на обложке не разошлась с подписью.", "checks": [["О чём публикация: старт приёма документов", "пост|публикац|набор|при[её]м|анонс|облож"], ["Исходные данные и аудитория: даты, места, для кого", "абитуриент|школьник|выпускник|родител|аудитор|20 июн|25 июл|1 ?200|бюджет|онлайн|дат[аыу]"], ["Формат: заголовок, подпись, обложка, длина и размер", "заголов|подпис|символ|знаков|коротк|1080|размер|формат|строк|до \\d+ слов"], ["Ограничения: надпись дословно, без лишнего на картинке", "без |не (добавля|меня|выдум|придум|использ)|дословн|точно|только|не больше|не более|огранич|в кавычк"], ["Что проверить: надпись без ошибок и совпадает с подписью", "провер|совпад|сверь|сверя|опечат|ошиб|орфограф|одинаков|буква в букв|побуквен"]], "good": "Готово. Заголовок: «Приём документов открыт». Подпись (420 знаков): с 20 июня по 25 июля принимаем документы на бакалавриат, 1 200 бюджетных мест, подать можно онлайн — ссылка в конце. Обложка 1080×1350: белый фон, крупная синяя геометрия, надпись в две строки — «Приём документов открыт» и «20 июня — 25 июля». По вашей проверке: надпись на картинке сверила побуквенно с заголовком и подписью — даты и формулировка совпадают, опечаток нет, других слов и цифр на изображении нет. Число мест на обложку не выносила, как вы и просили, — оно только в подписи.", "poor": "Вот картинка к посту: абитуриенты у входа и надпись «ПРИЕМ ДОКУМЕНТОВ ОТКРЫТ С 1 ИЮЛЯ» — дату я подобрала сама, а в слове «документов» буквы местами слиплись. Чтобы связка сошлась, подскажите: какие даты и цифры точные, для кого пост, какой длины заголовок и подпись, какую надпись поставить на обложку дословно и что сверить между картинкой и подписью?"}, "K08": {"type": "p", "q": "Декан факультета информационных технологий завтра в 10:00 выступает на учёном совете с итогами приёма. Он прислал тезисы на страницу и таблицу по шести программам: заявления, зачисленные, средний балл. У вас есть фирменный шаблон презентаций и ИИ-сервис для сборки слайдов во внутреннем контуре. Напишите запрос на черновик из 12 слайдов, который останется привести к шаблону.", "checks": [["Что нужно: презентация к выступлению", "презентац|слайд|выступлен|доклад"], ["Исходные материалы и адресат: тезисы, таблица, декан, совет", "тезис|таблиц|декан|совет|шаблон|приложен|прилага|исходн"], ["Формат: 12 слайдов, одна мысль на слайд, структура", "12|двенадцат|одн(а|у|ой) мысл|заголов|структур|план |сетк|шрифт|формат|диаграмм|график"], ["Ограничения: только данные из тезисов и таблицы", "не (добавля|выдум|придум|меня|округл|дописыва)|только (из|по|то)|без |огранич|не больше|не более"], ["Что проверить: цифры сверить с таблицей, сомнительное пометить", "провер|сверь|сверя|уточни|цифр|источник|отметь|пометь|расхожд"]], "good": "Собрала черновик из 12 слайдов, на каждом одна мысль в заголовке: титул, главный итог приёма, динамика заявлений, шесть программ — по слайду на каждую с тремя цифрами из таблицы, сравнение среднего балла, выводы, планы на следующий год. Тексты — только из тезисов, цифры — только из таблицы, без округлений. По вашей проверке: в тезисах сказано «рост заявлений на 18%», а по таблице выходит 16,4% — слайд 3 пометила, уточните у декана, какую цифру оставить. На слайде 7 в таблице пустая ячейка среднего балла — оставила прочерк. Вёрстка черновая: сетку, шрифты и цвета шаблона я не применяла — это за вами.", "poor": "Вот презентация «Итоги приёма»: 20 слайдов, на каждом по пять-шесть пунктов, цифры я подставила примерные, для наглядности добавила сравнение с другими вузами. Чтобы черновик пригодился, подскажите: из каких материалов брать тексты и цифры, сколько слайдов нужно и сколько мыслей на слайде, для кого выступление, чего добавлять нельзя и что сверить с таблицей?"}, "R07": {"type": "j", "multi": true, "q": "За вечер вы собрали в ИИ-инструменте, который пишет прототип в коде, личный кабинет студента: вход, расписание, оплата. В браузере всё открывается и нажимается, завтра показ разработке. Какие утверждения о таком прототипе верны? Отметьте всё подходящее.", "opts": [{"t": "Прототип показывает сценарий и логику экранов, но его код не рассчитан на нагрузку, безопасность и поддержку", "ok": true}, {"t": "Раз прототип работает в браузере, разработке остаётся подключить базу данных и выложить его на боевой сервер", "ok": false}, {"t": "Вход, оплата и данные студента в прототипе изображены на условных примерах, а не реализованы по-настоящему", "ok": true}, {"t": "Срок выхода можно обещать по прототипу: кабинет собран за вечер, значит, разработке хватит одной-двух недель", "ok": false}], "why_q": "Чем прототип отличается от кода, который пойдёт к студентам, и чего не стоит обещать разработке? Одной-двумя фразами.", "kw": [["нет безопасности и запаса под нагрузку", "безопасн|нагрузк|защит|уязвим|авториз|персональн|масштаб"], ["нет тестов, архитектуры и поддержки", "тест|архитектур|поддерж|сопровожд|ревью|стандарт|стек|перепис|с нуля|кодовую баз"], ["данные и интеграции условные", "условн|заглушк|имитир|изображ|ненастоящ|не настоящ|интеграц|вымышл|бэкенд|бекенд|сервер|баз[аыу] данных"], ["сроки и готовность оценивает разработка", "срок|оценк|оценива|обеща|готовност|продакшен|продакшн|боев"]], "need": 2, "ok_fb": "Отмечены оба верных утверждения, и названо, чем прототип отличается от боевого кода: он показывает сценарий, а безопасность, данные и сроки — работа разработки.", "fb": "Верны первое и третье утверждения. Прототип из ИИ отвечает на вопрос «как это будет работать для студента»: сценарий, экраны, переходы. Вход, оплата и данные в нём условные, а код написан без тестов, без защиты и без расчёта на нагрузку и поддержку — разработка использует его как наглядное техзадание, а не как заготовку для выкладки. Сроки и объём работ называет разработка после своей оценки. В обосновании стоит назвать хотя бы два отличия из четырёх."}, "R08": {"type": "p", "q": "Есть макеты шести экранов сценария «подать документы онлайн» в личном кабинете абитуриента: вход, анкета, загрузка паспорта и аттестата, проверка, отправка, подтверждение. В четверг вы показываете сценарий приёмной комиссии — нужен кликабельный прототип в коде, который проходится от входа до подтверждения. Напишите запрос к ИИ-инструменту, собирающему прототип по макету и описанию.", "checks": [["Что собираем: кликабельный прототип сценария подачи документов", "прототип|кликабельн|сценари|подач|подать|документ"], ["Исходные материалы и пользователь: макеты, компоненты, абитуриент", "макет|абитуриент|пользовател|дизайн-систем|компонент|библиотек|поступа|кабинет"], ["Формат: шаги от входа до подтверждения, переходы, устройство", "вход|авториз|подтвержд|шаг|переход|от начала|до конца|375|мобильн|телефон|десктоп|экранов|ссылк"], ["Ограничения: условные данные, только экраны из макетов", "условн|вымышл|заглушк|без |не (придум|добавля|использ|дорисов|меня)|только|ненастоящ"], ["Что проверить: проходимость, тупики, что ИИ добавил сам", "провер|уточн|пройд|пометь|отмет|спроси|тупик|перечисл|от себя|сам добавил|не хватает"]], "good": "Собрал прототип из шести экранов по макетам: вход → анкета → загрузка паспорта и аттестата → проверка данных → отправка → подтверждение с номером заявления. Сценарий проходится от начала до конца на ширине 375 px и на десктопе; кнопка «Назад» работает на каждом шаге, прогресс «шаг 3 из 6» обновляется. Данные условные: абитуриент «Иван Петров», файлы-заглушки, вход по любому коду. Компоненты взял из вашей библиотеки, новых экранов не добавлял. Два места пометил: в макетах нет состояния «файл не загрузился» и нет экрана после повторного входа с незаконченной заявкой — поставил временные плашки, их видно по жёлтой рамке. Уточните, нужен ли показ ошибки загрузки на встрече.", "poor": "Вот страница подачи документов: одна длинная форма с двадцатью полями, кнопка «Отправить» и баннер с фотографией кампуса. Переходов между экранами нет, после отправки ничего не происходит. Чтобы сценарий проходился целиком, уточните: из каких шагов он состоит и чем заканчивается, какие макеты и компоненты брать за основу, какими данными заполнять поля и что отметить, если в макетах чего-то не хватает?"}, "R09": {"type": "p", "q": "ИИ-инструмент собрал макет экрана расписания в личном кабинете студента: сетка занятий на неделю, светло-серые подписи аудиторий, иконки «ссылка на вебинар» и «материалы» размером 20 px, переключатель недель. Экраном пользуются и с телефона, и с клавиатуры, и с программой экранного доступа. Напишите запрос к ИИ: что проверить на доступность и как исправить найденное.", "checks": [["Что проверяем: контраст, кликабельные зоны, порядок фокуса, альтернативные тексты", "контраст|кликабельн|зон[аыу]? |зоны|касани|фокус|альтернативн|alt|доступност"], ["Какой экран и кто им пользуется", "расписани|студент|телефон|мобильн|клавиатур|экранн|скринридер|слабовид|макет|иконк"], ["Формат: список находок по элементам, что было и что предлагается", "таблиц|списк|список|перечен|по элемент|было|стало|по пунктам|критичн|приоритет|формат|колонк|столб"], ["Ограничения: компоновку не менять, цвета из палитры дизайн-системы", "не (меня|трога|перерисов|добавля|лома)|без |только|сохран|палитр|токен|дизайн-систем"], ["Что перепроверить самому: в чём ИИ не уверен, что пройти вручную", "провер|вручную|уточн|пометь|отмет|не уверен|спроси|сомнева|пройд"]], "good": "Проверил экран расписания по четырём пунктам, находки — таблицей «элемент — что сейчас — что предлагаю». Контраст: подписи аудиторий 2,8:1 — заменил на цвет из палитры с 4,6:1; остальной текст в норме. Кликабельные зоны: иконки вебинара и материалов 20 px — увеличил область нажатия до 44 px, сам рисунок не менял. Порядок фокуса: переключатель недель получал фокус последним — поставил его перед сеткой, дальше дни идут слева направо. Альтернативные тексты: у иконок их не было — добавил «Открыть вебинар: Статистика, 10:30» и «Материалы занятия». Компоновку и сетку не трогал. Не уверен в одном: как программа экранного доступа прочитает объединённые ячейки сдвоенных пар — пройдите этот фрагмент вручную с клавиатуры.", "poor": "Экран расписания выглядит современно и аккуратно, серьёзных замечаний нет. Для красоты можно сделать подписи ещё светлее, а иконки — тоньше. Чтобы проверка была по делу, уточните: что именно смотреть — контраст, размер зон нажатия, порядок фокуса, тексты для иконок; кто и с каких устройств пользуется экраном; что в макете менять нельзя и в каком виде вам нужен список находок?"}, "R10": {"type": "c", "q": "Третий макет подряд возвращается из разработки: ИИ-инструмент при каждой генерации рисует кнопки и поля заново — похожие на дизайн-систему, но с другими отступами и радиусами, и верстальщик не находит их в библиотеке. В дизайн-системе кабинета 64 компонента, все есть в коде. Что делаете?", "opts": [{"t": "Дописываю в каждый запрос размеры, цвета и радиусы кнопок из дизайн-системы, чтобы ИИ рисовал точнее и ближе к библиотеке", "g": 3, "fb": "Кнопки станут ближе к библиотеке, и часть возвратов уйдёт. Но ИИ по-прежнему рисует похожее, а не берёт готовое: стоит описание устареть или забыться — расхождения вернутся. Надёжнее один раз дать инструменту саму библиотеку."}, {"t": "Подключаю к ИИ-инструменту библиотеку компонентов и токены, связываю компоненты с кодом и проверяю на одном экране", "g": 5, "fb": "Генерация идёт из тех же 64 компонентов, что лежат в коде: верстальщик видит знакомые названия, а не «похожую кнопку». Проба на одном экране покажет, какие компоненты ИИ пока не подхватывает, — их стоит описать подробнее."}, {"t": "После каждой генерации вручную заменяю нарисованные кнопки и поля на компоненты библиотеки и только потом отдаю макет", "g": 2, "fb": "Разработка получит чистый макет, но вы каждый раз тратите на замену то время, которое ИИ сэкономил. Причина остаётся: инструмент не знает о библиотеке. Подключив её один раз, вы уберёте ручную замену совсем."}, {"t": "Договариваюсь с разработкой считать макет ориентиром: пусть верстают своими компонентами и сами подбирают ближайшие", "g": 1, "fb": "Так решение о том, какой компонент стоит на экране, переезжает к верстальщику, а макет перестаёт быть договорённостью. Проще сделать, чтобы ИИ собирал экран сразу из компонентов библиотеки, — тогда подбирать ничего не придётся."}], "why": "потому|так как|компонент|библиотек|токен|дизайн-систем|код|готов|похож|заново|возврат|разработ|верстальщик|один раз|причин"}, "R11": {"type": "c", "q": "Гипотеза: подачу документов можно сократить с семи шагов до четырёх. ИИ-инструмент собрал рабочий прототип, пять абитуриентов прошли его и остались довольны. Разбирая записи, вы заметили: два шага ИИ добавил сам — «анкета заполняется по фото паспорта» и «документ проверен за 5 секунд», — в планах разработки их нет, и больше всего хвалили именно их. Что несёте команде?", "opts": [{"t": "Несу вывод «гипотеза подтверждена, 5 из 5 довольны»: прототип был рабочий, респонденты настоящие, сценарий пройден", "g": 1, "fb": "Респонденты настоящие, но хвалили они в том числе то, чего в продукте не будет. Команда решит, что четыре шага проверены, хотя часть оценки относится к дорисованному. Стоит показать, какая доля восторга к чему относится."}, {"t": "Разделяю выводы: что проверено про четыре шага, что относится к двум дорисованным; их отдаю на оценку и повторяю тест без них", "g": 5, "fb": "Команда видит две разные вещи: проверенный порядок шагов и две идеи ИИ, которые понравились людям, но пока ничем не обеспечены. Повторный проход без них покажет, держится ли гипотеза сама, а идеи уйдут разработке на оценку."}, {"t": "Считаю тест несостоявшимся: выбрасываю записи, пересобираю прототип строго по сценарию и набираю пять новых респондентов", "g": 3, "fb": "Чистый повтор — надёжно, но в записях уже есть полезное: как люди проходили остальные шаги и где задерживались. Достаточно разметить, какие наблюдения к чему относятся, и допроверить только то, на что повлияли дорисованные шаги."}, {"t": "Предлагаю взять оба шага в план: раз абитуриентам понравилось больше всего именно это, значит, ИИ нашёл сильное решение", "g": 2, "fb": "Идеи могут оказаться сильными, и сохранить их стоит. Но «понравилось в прототипе» ещё не значит «осуществимо»: распознавание паспорта и проверка за 5 секунд — отдельные задачи. Сначала оценка разработки, и отдельно — проверка исходной гипотезы."}], "why": "потому|так как|дорисов|придум|добавил|сам|провер|гипотез|отдел|раздел|план|осуществ|реализ|респондент|хвалил|шаг|вывод"}, "R12": {"type": "c", "q": "ИИ-помощник в личном кабинете ответил студентке: «Оплатить семестр нужно до 25 сентября» — по её договору срок был 15-е, начислены пени, пришла жалоба. Помощник отвечал тем же уверенным тоном, что и всегда, источника в ответе не было. Вам поручили доработать функцию. С чего начинаете?", "opts": [{"t": "Добавляю под окном чата мелкую строку «Ответы формирует ИИ, он может ошибаться» — остальное в помощнике оставляю как было", "g": 2, "fb": "Раскрыть, что отвечает ИИ, — нужная часть решения. Но строка под окном чата не помогает студенту отличить надёжный ответ от догадки и не даёт ему способа исправить неточность. Стоит добавить источник в ответе и понятный путь, когда модель не уверена."}, {"t": "Сроки и суммы — только из договора студента со ссылкой на него; нет данных — «не знаю, вот где посмотреть»; кнопка «неточно»", "g": 5, "fb": "Вы проектируете поведение при неуверенности: ответ о деньгах опирается на договор и показывает источник, без данных помощник честно отправляет к графику платежей или оператору, а студент может отметить неточность. Вместе с пометкой «отвечает ИИ» это закрывает все три вопроса."}, {"t": "Закрываю помощнику тему оплаты целиком: на любые вопросы о деньгах он отвечает «обратитесь к оператору» и даёт контакт", "g": 3, "fb": "Риск с платежами снят — это разумная срочная мера. Но про оплату студенты спрашивают чаще всего, а в сроках пересдач помощник может ошибиться так же уверенно. Дальше стоит спроектировать общее правило: источник, поведение при неуверенности, исправление."}, {"t": "Прошу разработку дописать в инструкцию модели «не ошибайся в сроках и суммах», а сам случай считаю единичным сбоем", "g": 1, "fb": "Модель не станет точнее от просьбы быть точной: без доступа к договору она продолжит отвечать правдоподобно. Здесь нужна работа с интерфейсом и данными — откуда берётся срок, что видит студент при неуверенности модели и как он сообщает о неточности."}], "why": "потому|так как|источник|договор|неуверен|не уверен|исправ|сообщ|пометк|раскры|довер|деньг|срок|оператор|данн|провер"}, "I06": {"type": "m", "q": "После исследования оттока у вас пять материалов, и вы хотите разобрать их с помощью ИИ-сервиса в корпоративном контуре. Какие из них готовы к загрузке прямо сейчас? Отметьте всё подходящее.", "opts": [{"t": "Расшифровка интервью: имя заменено на «Респондент 3», город, место работы и группа убраны", "ok": true}, {"t": "Расшифровка интервью с пометкой «конфиденциально» в шапке: имена и телефоны оставлены в тексте", "ok": false}, {"t": "Выгрузка формы обратной связи: тексты отзывов вместе с адресами почты и номерами договоров", "ok": false}, {"t": "Таблица отзывов: только текст, курс и дата; колонки с ФИО удалены, имена в текстах вычищены", "ok": true}, {"t": "Аудиозапись интервью: имя не звучит, но слышен голос и рассказ о работе в названной компании", "ok": false}], "ok_fb": "Верно: к загрузке готово только то, из чего уже убрано всё, что указывает на конкретного человека.", "fb": "Готовы два материала: расшифровка с «Респондентом 3» без города, работы и группы и таблица отзывов, где остались только текст, курс и дата. Пометка «конфиденциально» ничего не убирает из текста; почта и номер договора прямо указывают на человека; голос и рассказ о месте работы позволяют узнать его и без имени. Порядок один для любого ИИ-сервиса, включая корпоративный контур: сначала обезличить, потом загружать."}, "I07": {"type": "j", "multi": true, "q": "Вы готовите исследование: почему студенты перестают заходить на платформу после первой сессии. Коллега предлагает завести в ИИ «синтетического студента» — персону, которая отвечает от лица второкурсника-заочника. Какие способы её использовать допустимы? Отметьте всё подходящее.", "opts": [{"t": "Накидать вместе с персоной гипотезы о причинах ухода, чтобы затем проверить их на интервью со студентами", "ok": true}, {"t": "Прогнать на персоне черновик гайда: найти непонятные и наводящие вопросы до первого живого респондента", "ok": true}, {"t": "Провести с персоной три интервью из восьми: на эти слоты студентов не нашлось, а сроки уже поджимают", "ok": false}, {"t": "Вставить самые яркие ответы персоны в отчёт как цитаты студентов и посчитать по ним доли причин ухода", "ok": false}], "why_q": "Почему персона годится для одного и не годится для другого? Одной-двумя фразами.", "kw": [["у персоны нет реального опыта: модель выдаёт усреднённое и правдоподобное", "реальн|настоящ|жив[ыоу]|опыт|усредн|правдоподоб|выдум|придум|сочин|стереотип|обобщ|не был|типичн"], ["её ответы — гипотезы, которые проверяют на людях", "гипотез|предполож|провер|подтвержд|не доказ|не данные|не являются данн|не факт"], ["допустимое применение — подготовка: идеи и разминка гайда", "гайд|подготов|разминк|чернов|репетиц|формулиров|вопрос|до интервью|до исследовани"], ["неожиданное узнаётся только от настоящих студентов", "неожидан|сюрприз|нов[оы][ег]|не узна|поддакив|соглаша|удив|инсайт|заменя|замен[аи]"]], "need": 2, "ok_fb": "Отмечены оба допустимых способа, и названа граница: персона помогает подготовиться, а данные дают только настоящие студенты.", "fb": "Допустимы первые два способа: гипотезы, которые потом проверяются на интервью, и разминка гайда до первого респондента. Персона отвечает правдоподобно и усреднённо — у неё нет опыта ваших студентов, поэтому она не закрывает пустые слоты интервью, а её реплики не становятся цитатами и долями в отчёте. Всё, что она выдала, — гипотезы с пометкой «проверить на людях». В обосновании стоит назвать хотя бы две причины из четырёх."}, "I08": {"type": "c", "q": "Нужно понять, почему 23% студентов бросают платформу после первой сессии; вы запланировали 8 интервью за три недели. Руководитель пишет: «Решение по доработкам нужно через неделю. Опросите нейросеть вместо студентов — быстрее, а отвечает она не хуже». Что делаете?", "opts": [{"t": "Завожу в ИИ 50 синтетических студентов, провожу опрос за вечер и приношу руководителю сводку как результаты исследования", "g": 1, "fb": "Сводка получится гладкой, но в ней нет ни одного вашего студента: модель выдаст типичные причины ухода, а не то, что происходит на вашей платформе. Доработки на неделю вперёд будут выбраны по правдоподобному тексту. Сохраните скорость, но назовите результат гипотезами."}, {"t": "Объясняю, что ИИ даст правдоподобное, а не опыт наших студентов; за день готовлю с персоной гипотезы и гайд, за неделю — 5 интервью", "g": 5, "fb": "Вы отвечаете на настоящую потребность руководителя — срок — и не подменяете данные. Персона ускоряет подготовку, её результат помечен как гипотезы, а пять коротких интервью за неделю дадут то, чего модель знать не может: что случилось у ваших студентов."}, {"t": "Отвечаю, что нейросеть в исследованиях неприменима, и оставляю прежний план: восемь интервью и результаты через три недели", "g": 2, "fb": "Данные вы защитили, но срок руководителя остался без ответа, и решение примут без вас. ИИ-персона здесь как раз пригодится: гипотезы и гайд за день, а интервью можно сократить до пяти коротких и уложиться в неделю."}, {"t": "Провожу синтетический опрос, честно подписываю сводку «гипотезы от ИИ» и отдаю руководителю — интервью со студентами отменяю", "g": 3, "fb": "Пометка «гипотезы» — верный шаг: никто не примет текст модели за голос студентов. Но решение всё равно будет принято по непроверенному. Добавьте хотя бы пять коротких интервью на этой же неделе — и гипотезы станут выводами."}], "why": "потому|так как|гипотез|правдоподоб|реальн|настоящ|жив|опыт|студент|интервью|провер|срок|недел|подготов|гайд|усредн|замен"}, "V07": {"type": "c", "q": "До Дня знаний три дня, ректор в командировке и записать поздравление первокурсникам не успевает. Маркетинг предлагает: взять его официальный портрет, «оживить» видеогенератором и озвучить клоном голоса по старым выступлениям — «он же всё равно согласится». Ролик пойдёт в соцсети университета. Что делаете?", "opts": [{"t": "Собираю аватар по портрету и клону голоса и публикую к празднику: текст нейтральный, а ректор посмотрит ролик, когда вернётся из командировки", "g": 1, "fb": "Первокурсники увидят и услышат слова, которых ректор не произносил, — и узнает он об этом уже после публикации. Голос и лицо человека используются только с его письменного согласия, полученного заранее. Стоит начать с вопроса самому ректору: короткая запись на телефон или аватар с его согласием и утверждённым текстом."}, {"t": "Предлагаю ректору выбор: полминуты на телефон или аватар — с письменным согласием, утверждённым текстом и отметкой о синтезе на площадке", "g": 5, "fb": "Решение остаётся за человеком, чьё лицо и голос окажутся в кадре. Живая запись на телефон для поздравления часто уместнее аватара. Если ректор выберет аватар — письменное согласие, утверждённый им текст и отметка о синтезе на площадке делают ролик честным перед зрителем и спокойным для университета."}, {"t": "Отказываюсь от аватара совсем: собираю ролик из кадров кампуса с текстом поздравления в титрах и подписью ректора, без его лица и голоса", "g": 3, "fb": "Безопасное решение, и оно может оказаться итоговым. Стоит добавить один шаг до него: спросить самого ректора. Возможно, он запишет полминуты на телефон или согласится на аватар — письменно, с утверждённым текстом и отметкой о синтезе. Текст в титрах от его имени тоже стоит с ним согласовать."}, {"t": "Собираю аватар и шлю ректору готовый ролик в мессенджер: ответит «ок» — публикую как обычное видеообращение, без каких-либо отметок", "g": 2, "fb": "Хорошо, что ректор увидит ролик до публикации. Стоит добавить два шага: согласие на синтез лица и голоса оформляется письменно и до начала работы, а не ответом «ок» на готовое видео; и реалистичный синтетический ролик отмечается на площадке — зритель вправе знать, что это не съёмка."}], "why": "потому|так как|согласи|письмен|голос|лиц[оа]|довер|репутац|пометк|отметк|раскры|маркир|синте|не говорил|не произносил|риск|разрешен|подпис|зрител"}, "W04": {"type": "p", "q": "Для ролика о кампусе нужны три шота с одной героиней — студенткой Аней: входит в главный корпус, идёт по коридору к библиотеке, садится у окна с ноутбуком. Съёмки не будет. Героиня вымышленная, её портрет и образ в полный рост уже сгенерированы и утверждены; есть три фото реальных интерьеров. Напишите запрос видеогенератору, который работает от референсов и первого/последнего кадра, — так, чтобы шоты склеились без скачков.", "checks": [["Что генерируем: серия из трёх шотов с одной героиней под склейку", "шот|сцен[аыу]|сери[яюи]|склей|героин|персонаж|студентк|план[аы ]"], ["Исходники: референсы героини и интерьеров, первый и последний кадр", "референс|портрет|образ|фото|перв(ый|ого|ым) кадр|последн|исходн|прилага|изображен|интерьер"], ["Формат: длительность шотов, размер кадра, число дублей", "секунд|сек\\.|16:9|9:16|1920|1080|fps|кадров в|вариант|дубл|длительн|горизонт|вертикал|хронометраж"], ["Ограничения: лицо, причёска, одежда и свет одинаковы во всех шотах, без надписей и лишних людей", "без |не (меня|добавля|должн|трога)|одинаков|та же|те же|тот же|одна и та же|сохран|неизмен|един(ый|ое|ая)|постоянн|огранич"], ["Что проверить: стыки шотов, лицо, костюм, свет, руки", "провер|сравн|стык|скач|прыг|совпада|артефакт|покажи|отбер|отбор|убедись|уточн"]], "good": "Сделал три шота по 5 секунд, 1920×1080, 24 кадра в секунду, по два дубля на каждый. Героиня везде собрана от ваших двух референсов: каре, бежевый тренч, серый рюкзак на правом плече. Последний кадр первого шота (Аня в дверях, свет слева) взял первым кадром второго, последний кадр второго — первым кадром третьего, поэтому поза и направление света на стыках совпадают. Интерьеры — по вашим фото, надписей и других людей в кадре нет. Что стоит посмотреть: в шоте 2, дубль А, на 4-й секунде лямка рюкзака на мгновение переходит на левое плечо — дубль Б чистый. В шоте 3 пальцы на клавиатуре в норме, но экран ноутбука пустой — заставку лучше добавить на монтаже. Приложил раскадровку стыков: по три кадра до и после каждой склейки.", "poor": "Вот видео: девушка идёт по университету. Получился один шот на 4 секунды; внешность, одежду и освещение я подобрал сам, поэтому в следующей генерации героиня выйдет другой. Чтобы шоты склеились, уточните, пожалуйста: сколько шотов и что происходит в каждом, какие референсы героини и интерьеров использовать, какая длительность и размер кадра, что должно оставаться одинаковым от шота к шоту?"}, "W05": {"type": "c", "q": "Из восьми дублей шота «студент идёт по кампусу» (6 секунд) лучший по движению и свету — пятый. Но на третьей секунде логотип университета на толстовке героя «плывёт»: буквы около секунды переливаются и меняют форму. Кредитов осталось на три генерации, сдача завтра. Что делаете?", "opts": [{"t": "Ставлю дубль как есть: это секунда на общем плане, зритель смотрит на лицо героя, а после сжатия на площадке буквы всё равно никто не разберёт", "g": 1, "fb": "Плывущие буквы — первое, по чему зритель узнаёт генерацию, а здесь это ещё и логотип университета: искажённый фирменный знак в ролике приёмной кампании заметят свои же. Участок небольшой и движется предсказуемо — его можно закрыть маской с настоящим логотипом."}, {"t": "Трачу оставшиеся три генерации на новые дубли с тем же запросом и референсом: возможно, в одном из них логотип сам по себе выйдет ровным", "g": 3, "fb": "Перегенерация — рабочий инструмент, но здесь она рискованная: текст на одежде плывёт у видеогенераторов почти всегда, а лучший по движению дубль уже найден. Три попытки могут закончиться тремя новыми артефактами. Надёжнее поправить локальный участок маской, а кредиты оставить в запасе."}, {"t": "Трекаю грудь героя и закрываю участок настоящим логотипом из брендбука по маске; потом смотрю весь дубль покадрово: руки, фон, мерцание", "g": 5, "fb": "Способ правки выбран по характеру артефакта: участок небольшой, движется вместе с героем, правильный логотип есть в брендбуке — маска с трекингом решает задачу за час и не тратит кредиты. Покадровый просмотр всего дубля после правки показывает, что других артефактов в кадре нет."}, {"t": "Отказываюсь от шота целиком и перекрываю эти шесть секунд титром на фирменном фоне: так надёжнее, чем возиться с одной толстовкой до ночи", "g": 2, "fb": "Отказ — уместное решение, когда артефакт не лечится: плывёт лицо, ломается физика по всему кадру. Здесь же хороший дубль портит один небольшой участок. Его стоит закрыть маской с настоящим логотипом — ролик сохранит живой план с героем."}], "why": "потому|так как|логотип|бренд|маск|трек|покадр|кредит|артефакт|морфинг|плыв|провер|риск|дешевле|быстрее|дубл|перегенер|локальн|участ"}, "W06": {"type": "c", "q": "К образовательной выставке нужен 20-секундный ролик-открытие «Город, в котором вы учитесь»: четыре плана по 5 секунд — панорама с высоты, набережная, узнаваемый главный корпус, студенты на ступенях. Срок — четыре дня. На тарифе команды кредитов на 15 генераций по 5 секунд; по вашему опыту в монтаж годится один дубль из четырёх. Что делаете?", "opts": [{"t": "Сразу запускаю генерацию всех четырёх планов: пятнадцати попыток хватит, если писать запросы аккуратно, а остаток докуплю, когда кредиты кончатся", "g": 1, "fb": "Стоит посчитать до запуска: четыре плана при одном годном дубле из четырёх — это около 16 попыток при запасе 15, и это без учёта того, что узнаваемое реальное здание генератор не воспроизведёт. Бюджет закончится на середине, а докупка посреди срока — время на согласование. Часть планов дешевле снять или взять на стоке."}, {"t": "Считаю: четыре плана по четыре попытки — уже 16 при запасе 15. Корпус и студентов снимаю сам за час, панораму беру со стока, генерирую лишь набережную", "g": 5, "fb": "Решение принято по расчёту, а не по привычке. Узнаваемый корпус и студенты на ступенях — то, что генератор сделает хуже и дороже часа съёмки; панорама с высоты есть на стоках по лицензии; генерация остаётся там, где она выигрывает, и 15 попыток на один план дают запас на итерации."}, {"t": "Беру все четыре плана со стока по лицензии команды: это быстро и предсказуемо по деньгам, а главный корпус заменю похожим зданием в том же стиле", "g": 3, "fb": "Сток — предсказуемый по срокам и бюджету вариант, и для панорамы он подходит хорошо. Стоит добавить: главный корпус в ролике о своём университете должен быть настоящим — «похожее здание» абитуриенты и сотрудники заметят. Час съёмки корпуса и студентов закрывает два плана из четырёх."}, {"t": "Трачу первые десять попыток на главный корпус, потому что он важнее всего: добиваюсь сходства с реальным зданием, а остальное — уж как получится", "g": 2, "fb": "Корпус действительно главный план, но как раз его генерировать невыгодно: точного сходства с реальным зданием генератор не даёт, и десять попыток уйдут на приближение. Настоящий корпус снимается за час, а кредиты стоит оставить для плана, где съёмка и сток не помогают."}], "why": "потому|так как|кредит|попыт|итерац|бюджет|дешевле|дороже|сток|съ[её]мк|снять|сним|узнава|реальн|корпус|счита|посчит|расч[её]т|риск|хватит|не хват|запас"}, "Y07": {"type": "p", "q": "Интервью со студенткой снято в холле кампуса: камера на штативе, план по пояс. С 01:12 по 01:20 за её плечом проходит посторонний человек и на пару секунд оказывается прямо за распущенными волосами. Пересъёмки не будет. Напишите запрос ИИ-ассистенту в монтажной программе (маски и удаление объектов), чтобы убрать прохожего и получить фрагмент, готовый к монтажу.", "checks": [["Что делаем: убираем прохожего из фрагмента интервью", "прохож|посторон|убра|убер|удал|вычист|стере|лишн(ий|его) человек"], ["Исходник: какой фрагмент, таймкоды, что в кадре", "интервью|таймкод|01:12|01:20|1:12|1:20|8 ?сек|восемь сек|фрагмент|штатив|статичн|холл|героин|студентк"], ["Формат результата: размер и частота кадров как в исходнике, маска отдельным слоем", "разрешен|fps|кадров в|частот|сло[йяею]|альфа|кодек|prores|mp4|формат|1920|1080|4k|экспорт|отдельн"], ["Ограничения: героиню, волосы и звук не трогать, фон восстановить из соседних кадров", "без |не (трога|меня|задева|размыва|затрагива)|только|огранич|сохран|соседн|чист(ый|ого|ых|ые) кадр"], ["Что проверить: края маски на волосах и движении покадрово, мерцание фона", "провер|покадр|кра[яйе]|мерца|дыш|дрож|покажи|пометь|отметь|убедись|сравн|уточн"]], "good": "Убрал прохожего на участке 01:12–01:20 (200 кадров). Камера статичная, поэтому фон за ним восстановил из чистых кадров до и после прохода, без генерации. Героиню, её волосы и звук не трогал; размер и частота кадров как в исходнике, маска лежит отдельным слоем — можно поправить вручную. Просмотрел покадрово: на кадрах 01:15:08–01:16:02, где прохожий шёл за волосами, край маски слегка «дышит» на отдельных прядях — отметил этот отрезок маркером, там стоит вручную подвинуть контур на 10–12 кадрах. На стене за плечом после удаления осталась чуть более светлая полоса — заметна только на стоп-кадре; при желании выровняю яркость.", "poor": "Я размыл область за спиной студентки на всём интервью — прохожего теперь не видно, но вместе с ним размылись край причёски и часть плеча. Чтобы сделать аккуратно, уточните, пожалуйста: на каком отрезке появляется человек, двигается ли камера, что в кадре нельзя затрагивать и в каком виде нужен результат — готовый фрагмент или маска отдельным слоем?"}, "Y08": {"type": "p", "q": "В ролик приёмной кампании на 60 секунд (пойдёт в платное продвижение) входит 25 секунд интервью выпускника, записанного в коридоре: гул вентиляции, эхо, хлопает дверь. Под весь ролик нужна музыкальная подложка. У команды оплачен тариф генератора музыки и есть ИИ-чистка звука в монтажной программе. Напишите запрос ИИ-ассистенту: что сделать со звуком и что подтвердить по правам на музыку.", "checks": [["Что делаем: чистим запись интервью и собираем подложку", "шум|чист|гул|эхо|подложк|музык|трек|саундтрек|звук"], ["Исходники и назначение: интервью выпускника, ролик приёмной кампании, платное продвижение", "интервью|выпускник|при[её]мн|кампани|реклам|продвижен|коридор|вентиляц|двер"], ["Формат: длительность, настроение и темп, громкость под голосом, файлы на выходе", "60|секунд|минут|темп|bpm|настроен|спокойн|бодр|громк|тише|дб|lufs|wav|mp3|дорожк|формат|инструментал"], ["Ограничения: голос остаётся естественным, слова не вырезаются, музыка без вокала и узнаваемых мелодий", "без |не (меня|выреза|трога|искажа|пережим|заглуша|перебива)|естествен|натурал|огранич|только"], ["Что подтвердить: тариф разрешает коммерческое использование, подтверждение лицензии сохранено, результат прослушан", "лиценз|тариф|прав[аоу] |прав[аоу]$|прав[аоу][.,]|коммерч|подтвержд|сохран|провер|прослуш|послуш|скриншот|услови"]], "good": "Интервью: снял гул вентиляции и приглушил эхо на умеренных настройках — голос остался естественным, без «металла»; хлопок двери на 00:14 попал в паузу между фразами, вырезал его, слова не затронуты. Подложка: сгенерировал три инструментальных варианта по 60 секунд, спокойный оптимистичный темп, без вокала и узнаваемых мелодий; под интервью музыка уходит на −18 дБ, в начале и финале возвращается. Дорожки отдал отдельно: голос, музыка, сведённый вариант, WAV 48 кГц. По правам: на оплаченном тарифе команды условия сервиса разрешают коммерческое использование, включая рекламу; сохранил в папку проекта страницу условий на сегодняшнюю дату, название тарифа и номера генераций. Что стоит послушать самому: фразу на 00:31 — там шумоподавление слегка съело окончание слова, могу ослабить чистку на этом участке.", "poor": "Я наложил на ролик популярную мелодию, похожую на известный хит, и выкрутил шумоподавление на максимум: гул исчез, но голос выпускника зазвучал глухо, будто из-под воды. Чтобы сделать пригодную дорожку, уточните, пожалуйста: где будет размещаться ролик, какой длительности и настроения нужна музыка, насколько сильно можно обрабатывать голос и на каком тарифе сервиса вы работаете — от этого зависят права на музыку."}, "Y09": {"type": "c", "q": "Ролик о дне открытых дверей готов к загрузке на видеоплатформу и в соцсети. Закадровый текст читает синтезированный голос из библиотеки сервиса, а план «полный актовый зал абитуриентов» сгенерирован: на съёмке прошлого года людей было заметно меньше. Выглядит как настоящая съёмка. В форме загрузки есть отметка «содержит реалистичный контент, созданный ИИ». Что делаете?", "opts": [{"t": "Отметку не ставлю: голос взят из библиотеки по лицензии, в толпе нет реальных людей — значит, ничьи права не затронуты и раскрывать тут нечего", "g": 1, "fb": "Права на голос и изображение здесь действительно в порядке — но раскрытие ИИ про другое: про доверие зрителя. Сгенерированный зал выглядит как настоящая съёмка события, и площадка просит отмечать именно такой контент. Отметка ставится до публикации."}, {"t": "Ставлю отметку только на видеоплатформе, где в форме есть такая галочка; в соцсетях публикую как обычно — отдельного поля для этого там ведь нет", "g": 3, "fb": "На видеоплатформе всё сделано верно. Стоит добавить соцсети: если отдельного поля нет, раскрытие уходит в описание или подпись к ролику — зритель там тот же. И отдельный вопрос — сам план с полным залом: его лучше обсудить с руководителем до публикации."}, {"t": "Ставлю отметку об ИИ на каждой площадке и дублирую в описании; полный зал, которого не было, предлагаю руководителю заменить реальной съёмкой", "g": 5, "fb": "Раскрытие выставлено везде, где ролик увидят, — отметкой площадки и строкой в описании. И замечено главное: сгенерированный полный зал показывает событие, которого в таком виде не было. Отметка делает ролик честным, а замена плана реальной съёмкой снимает сам вопрос — это решение стоит принять вместе с руководителем."}, {"t": "Пишу в конце описания мелкой строкой «при создании использованы нейросети», а отметку площадки не трогаю: из-за неё могут снизиться охваты ролика", "g": 2, "fb": "Строка в описании — шаг в верную сторону, но описание читают немногие, а отметка площадки видна всем зрителям и предусмотрена её правилами именно для реалистичного синтетического контента. Стоит поставить отметку, а строку в описании оставить как дополнение."}], "why": "потому|так как|реалист|зрител|довер|обман|ввод|заблужд|раскры|пометк|отметк|маркир|площадк|правил|синте|сгенерир|событи|не было|риск|репутац|честн"}, "Y10": {"type": "c", "q": "К международному форуму через неделю нужно выпустить на английском 40-минутную лекцию профессора о цифровой педагогике. Есть сервис дубляжа с клоном голоса и липсинком. Профессор на конференции, на почту отвечает раз в день. Письменного согласия на синтез его голоса нет, глоссария терминов кафедры тоже. Что делаете первым делом?", "opts": [{"t": "Запускаю дубляж всей лекции с клоном голоса прямо сейчас, чтобы успеть к форуму; согласие оформим задним числом, когда профессор вернётся с конференции", "g": 1, "fb": "Срок понятен, но на форуме профессор заговорит по-английски голосом, на синтез которого он не соглашался. Согласие на клон голоса и липсинк оформляется письменно и до начала работы. Письмо профессору сегодня — и ответ будет завтра, неделя это позволяет."}, {"t": "Сегодня запрашиваю у профессора письменное согласие на синтез голоса, у кафедры — глоссарий; после согласия делаю пробу на 2 минутах: термины, артикуляция", "g": 5, "fb": "Порядок выстроен от рисков: сначала письменное согласие человека, чей голос будет синтезирован, и глоссарий, по которому сверяются термины. Проба на двух минутах показывает, как сервис справляется с терминами и не выглядит ли артикуляция неестественно, — до того как обработаны все сорок минут."}, {"t": "Клон голоса не использую: делаю английские субтитры и закадровый перевод библиотечным голосом сервиса, а термины перевожу так, как предложит сам сервис", "g": 3, "fb": "Вариант без клона голоса снимает вопрос согласия и может стать запасным. Стоит добавить: термины цифровой педагогики сверяются с глоссарием кафедры или с самим профессором — автоматический перевод терминов на профессиональном форуме заметят первым. И спросить профессора о дубляже всё же стоит: неделя это позволяет."}, {"t": "Получаю от профессора устное «ок» по телефону и выпускаю дубляж целиком без просмотра: сорок минут проверять некогда, а переводит сервис вполне прилично", "g": 2, "fb": "Хорошо, что профессор в курсе. Стоит добавить два шага: согласие на синтез голоса оформляется письменно — хотя бы ответом на письмо с описанием того, что именно будет сделано; а дубляж проверяется до выпуска — термины по глоссарию и артикуляция хотя бы на ключевых фрагментах."}], "why": "потому|так как|согласи|письмен|голос|клон|синтез|термин|глоссари|артикуляц|липсинк|губ|проб[ауы]|тест|фрагмент|провер|риск|репутац|разрешен"}, "D01": {"type": "m", "q": "Вы готовите стенд университета к образовательной выставке и хотите ускорить работу внешними облачными сервисами: ИИ-рендером поверх модели и генератором 3D по изображению. Что из перечисленного можно туда загрузить? Отметьте всё подходящее.", "opts": [{"t": "Вид белой модели уже анонсированного стенда: без логотипов, названий и примет площадки", "ok": true}, {"t": "План павильона от организатора: инженерные сети, точки подвеса, номера соседних стендов", "ok": false}, {"t": "Скан действующего офиса заказчика: в кадре сотрудники, экраны мониторов, бумаги на столах", "ok": false}, {"t": "Ваш эскиз стойки ресепшн от руки: без фирменной символики и без примет конкретного проекта", "ok": true}, {"t": "Модель кресла, купленная на стоке по лицензии, которая запрещает передачу третьим лицам", "ok": false}, {"t": "Стенд нового факультета, о запуске которого университет объявит лишь в день открытия выставки", "ok": false}], "ok_fb": "Верно: наружу уходит только своё, обезличенное и уже публичное — белая модель анонсированного стенда без примет площадки и собственный эскиз.", "fb": "Загрузить можно два материала: вид белой модели анонсированного стенда без логотипов и примет площадки и собственный эскиз стойки. Облачный ИИ-рендер получает сцену целиком, поэтому планы и сканы площадок заказчика, особенно с инженерией, людьми и документами в кадре, остаются внутри. Неанонсированный стенд — закрытая информация до дня анонса, даже если это «просто картинка». Купленная модель несёт свою лицензию: если она запрещает передачу третьим лицам, загрузка во внешний сервис — это и есть передача. Для таких задач подходят локальные инструменты."}, "D02": {"type": "j", "multi": true, "q": "Коллега принёс ИИ-рендер стенда 6×4 м для образовательной выставки, сделанный по текстовому описанию, без модели. Вы разглядываете картинку и выписываете шесть наблюдений. Какие из них говорят о том, что в таком виде стенд построить нельзя? Отметьте всё подходящее.", "opts": [{"t": "Козырёк с логотипом вынесен над проходом метра на четыре — ни опор, ни подвесов не видно", "ok": true}, {"t": "Стойка ресепшн доходит посетителям до плеча, а дверь в переговорную — им примерно по пояс", "ok": true}, {"t": "Стены отделаны светлым деревом, пол серый, у входа — синяя стойка в фирменном цвете вуза", "ok": false}, {"t": "Задняя стена — шесть метров цельного «светящегося стекла» без швов, креплений и каркаса", "ok": true}, {"t": "Лестница на второй ярус: ступени разной высоты, а верхний марш упирается в глухую панель", "ok": true}, {"t": "На стенде шесть посетителей: двое сидят за столом, один читает буклет у стойки ресепшн", "ok": false}], "why_q": "Что именно вас насторожило — и чем такая картинка отличается от визуализации по модели? Одной-двумя фразами.", "kw": [["конструкция ни на чём не держится: нет опор, подвесов, каркаса", "опор|держ|консол|подвес|висит|крепл|каркас|нагруз|несущ|упад|рухн"], ["масштаб сбит: размеры не сходятся с ростом человека", "масштаб|размер|пропорц|рост|высот|габарит|по пояс|по плечо"], ["материала или узла в таком виде не существует", "материал|стекл|шв[аоые]|шов|не существ|не бывает|выдуман|ступен|лестниц|в никуда"], ["ИИ-рендер угадывает правдоподобную картинку, а не строит её по геометрии модели", "модел|угадыва|рисует|дорисов|картинк|геометр|не знает|придум|правдоподоб|сверя|сверить|черт[её]ж"]], "need": 2, "ok_fb": "Отмечены все четыре нестроящихся места, и названо, по каким признакам они видны: конструкция без опоры, сбитый масштаб, несуществующий материал — следствие того, что ИИ-рендер рисует правдоподобное, а не построенное по модели.", "fb": "Построить нельзя четыре вещи: четырёхметровый козырёк без опор и подвесов, стойку и дверь со сбитым масштабом, шестиметровое «светящееся стекло» без швов и каркаса, лестницу с разными ступенями, ведущую в глухую панель. ИИ-рендер по описанию работает с плоской картинкой и угадывает, как выглядит «красивый стенд», — нагрузок, размеров и реальных материалов он не знает. Визуализация по модели показывает то, что вы начертили. Цвета отделки и посетители на стенде — обычное содержание картинки, к строительству вопросов не вызывают."}, "D03": {"type": "p", "q": "Университет едет на образовательную выставку: стенд 6×4 м, открыт с двух сторон, высота застройки до 3 м. Есть три ваших фото пустого зала с места будущего стенда (название площадки и соседи в кадр не попали) и бриф: консультации абитуриентов, зона VR-экскурсии по кампусу, до 12 человек одновременно. Напишите запрос генератору изображений, чтобы получить концепты стенда, которые сохраняют пропорции зала.", "checks": [["Назначение: стенд университета на образовательной выставке", "стенд|выставк|экспозиц|застройк"], ["Исходники и сценарий: фото зала, бриф, зоны, путь посетителя", "фото|бриф|референс|зон[аыу]|посетител|абитуриент|консультац|vr|сценари|ресепшн|маршрут|поток|12 человек"], ["Габариты и формат: 6×4 м, высота 3 м, число вариантов, ракурс", "6 ?[xх×*] ?4|6 на 4|шесть на четыре|метр|3 м|высот|габарит|вариант|ракурс|16:9|уровня глаз"], ["Ограничения: пропорции зала, материалы, без подвесов и второго яруса, без надписей", "без |не (меня|искажа|добавля|рису|выход|превыша)|пропорц|огранич|только|сохран|материал|дерев|фирменн"], ["Что проверить: масштаб по фигуре человека, совпадение с фото, что можно построить", "провер|масштаб|сверь|сравн|совпад|постро|уточн|покажи|отметь|фигур|рост человек"]], "good": "Сделал четыре концепта стенда 6×4 м, высота застройки до 3 м, ракурс с уровня глаз из прохода — как на вашем втором фото; потолок, колонна и линия пола зала сохранены. Во всех вариантах стенд открыт с двух сторон: у угла стойка ресепшн, вдоль длинной стороны три места для консультаций, в глубине зона VR-экскурсии на двоих; свободный проход не меньше 1,2 м. Материалы: светлое дерево, белые панели, синий акцент. Подвесов, второго яруса и надписей нет — логотип поставите сами. Для масштаба в каждом кадре фигура человека 1,75 м. Что стоит проверить: в концепте В задняя стена получилась заметно выше трёх метров по сравнению с фигурой, а в концепте Г зал выглядит шире, чем на фото, — эти два я бы пересобрал. Все варианты — концепты, не в масштабе; размеры сверяйте по модели.", "poor": "Вот концепт: двухэтажный стенд с подвесным кольцом-экраном под потолком, зал получился вдвое больше, чем обычно бывает, на стенах — надписи из случайных букв. Вариант один. Чтобы попасть в вашу задачу, уточните, пожалуйста: какие габариты и высота у стенда, что на нём должно происходить и для скольких человек, по каким фото держать пропорции зала, какие материалы использовать и чего на картинке быть не должно?"}, "D04": {"type": "p", "q": "Белая модель сцены для дня открытых дверей готова в 3D-редакторе: подиум 8×4 м, задник с экраном, две боковые колонны, трибуна. Мероприятие уже анонсировано; вид из камеры «из зала, с уровня глаз» сохранён картинкой 1920×1080. К обсуждению с заказчиком нужны три варианта атмосферы. Напишите запрос для ИИ-рендера поверх модели — так, чтобы геометрия и ракурс остались вашими.", "checks": [["Что делаем: ИИ-рендер поверх белой модели, варианты атмосферы", "рендер|визуализ|атмосфер|поверх|оформлен|настроен"], ["Исходник: вид из редактора и что есть в сцене", "модел|вид из|скриншот|исходн|изображен|подиум|задник|колонн|трибун|сцен[аыу]|камер"], ["Формат: три варианта и чем они отличаются, размер кадра", "три |тр[её]х|3 вариант|вариант|1920|1080|16:9|разрешен|вечерн|дневн|т[её]пл|холодн|камерн|торжествен|свет"], ["Ограничения: геометрия, пропорции и ракурс не меняются, ничего не добавляется", "без |не (меня|добавля|двига|трога|искажа|дорисов)|геометр|пропорц|ракурс|огранич|только|сохран|сил[аыу] генерац"], ["Что проверить: наложить результат на исходный вид, найти дорисованное", "провер|налож|сверь|сравн|совпад|лишн|покажи|отметь|уточн|убедись|расхожд"]], "good": "Сделал три варианта поверх вашего вида, 1920×1080, с опорой на карту глубины и контуры модели, сила генерации невысокая. А — торжественный: тёмный зал, тёплый контровой свет, задник в синем, подиум — тёмное дерево. Б — дневной: светлые панели, рассеянный свет, серый ковролин. В — камерный: приглушённый свет, акцент на трибуне, задник графитовый. Подиум 8×4, задник с экраном, обе колонны и трибуна стоят на своих местах, ракурс из зала тот же. Наложил каждый результат на исходный вид с прозрачностью 50%: контуры совпадают. Два расхождения отметил красным: в варианте А на заднике появились софиты на ферме, которой нет в модели; в варианте В у трибуны дорисована вторая ступень. Эти места я бы закрасил по маске или убрал перед показом — либо подписал «концепт».", "poor": "Вот красивая сцена: я добавил арку над подиумом, подвесные экраны и второй ряд колонн, а ракурс взял сверху — так эффектнее. Вариант получился один и с вашей моделью он совпадает только по общей идее. Чтобы сделать рендер именно поверх вашей геометрии, уточните, пожалуйста: какой вид брать за основу, что в нём менять нельзя, сколько вариантов нужно и чем они должны различаться — светом, материалами, цветом?"}, "D05": {"type": "p", "q": "Для стенда нужна стойка ресепшн второго плана: есть ваш эскиз от руки (вид спереди и сбоку) и размеры — 2,4 м в длину, 1,1 м в высоту, 0,6 м в глубину. Модель пойдёт в сцену для визуализаций коммерческого проекта. Напишите запрос ИИ-ассистенту: сгенерировать 3D-модель по эскизу, довести её до сцены и указать, что подтвердить по лицензии.", "checks": [["Что делаем: 3D-модель стойки ресепшн по эскизу", "стойк|ресепшн|3d|3д|трёхмерн|трехмерн|ассет"], ["Исходник и назначение: собственный эскиз, два вида, второй план сцены стенда", "эскиз|рисун|наброс|вид спереди|вид сбоку|спереди|сбоку|второго плана|второй план|сцен[аыуе]|стенд"], ["Размеры и формат: габариты в метрах, полигонаж, формат файла, развёртка и материалы", "2[,.]4|1[,.]1|0[,.]6|метр|габарит|размер|полигон|треугольник|fbx|obj|glb|gltf|формат|uv|разв[её]ртк|pbr"], ["Ограничения: простая форма по эскизу, без логотипов и чужого дизайна", "без |не (добавля|копир|повтор|усложн|меня|выдум)|огранич|только|строго по|чуж"], ["Что проверить и подтвердить: масштаб в сцене, сетка, материалы, тариф с правом коммерческого использования", "провер|масштаб|лиценз|тариф|коммерч|подтвержд|сохран|сверь|чек-?лист|уточн|убедись"]], "good": "Сгенерировал модель стойки по двум видам вашего эскиза и довёл до сцены. Чек-лист доводки: 1) масштаб — привёл к 2,4 × 1,1 × 0,6 м, поставил рядом фигуру 1,75 м: столешница на уровне локтя; 2) сетка — после упрощения 18 тысяч треугольников вместо 410 тысяч, для второго плана достаточно; убрал внутренние поверхности и «слипшиеся» грани на торце; 3) развёртка пересобрана, материалы заменены на ваши из сцены: шпон и синий пластик, без запечённых бликов; 4) точка опоры — на полу по центру, формат FBX. Форма строго по эскизу, логотипов и декора от себя не добавлял. Что подтвердить по лицензии: генерация сделана на оплаченном тарифе команды, его условия разрешают коммерческое использование и не делают модель публичной; сохранил в папку проекта страницу условий с датой и название тарифа. Одно место посмотрите сами: скругление левого угла генератор сделал радиусом около 15 см, на эскизе оно меньше.", "poor": "Вот модель стойки: генератор сделал её в духе известного дизайнерского бренда, с логотипом на фасаде, 600 тысяч треугольников, размер в сцене — примерно со спичечный коробок. На каком тарифе и с какими правами она сделана, я не проверял. Чтобы довести модель до вашей сцены, уточните, пожалуйста: какие у стойки размеры, насколько подробной должна быть сетка, в каком формате нужен файл, что нельзя добавлять от себя и для какого проекта модель — от этого зависит подходящая лицензия."}, "D06": {"type": "p", "q": "Стены стенда 6×4 м высотой 3 м по концепту отделаны панелями «тёплое дерево»: светлый дуб, вертикальные ламели шириной около 10 см. Готового материала в библиотеке нет. Напишите запрос генератору текстур, чтобы получить бесшовный материал для 3D-сцены, и укажите, как проверить его до того, как он встанет на все стены.", "checks": [["Что генерируем: бесшовный материал для 3D-сцены", "текстур|материал|фактур|бесшовн|тайл"], ["Назначение и образ: стены стенда, порода, тон, рисунок ламелей", "стен[аыду]|стенд|панел|светл|т[её]пл|дуб|дерев|ламел|вертикал|матов|референс|оттен"], ["Формат: набор карт, разрешение, физический размер фрагмента", "карт[ыау]|normal|нормал|roughness|шероховат|albedo|альбедо|базов(ый|ого) цвет|displacement|2k|4k|2048|4096|разрешен|png|метр|10 см|сантиметр|pbr"], ["Ограничения: без заметных повторов, запечённых теней и бликов, ровный тон", "без |не (должн|добавля|повторя)|огранич|только|равномерн|ровн|избега|никаких"], ["Что проверить: стыки и повтор на тестовой плоскости, масштаб фактуры, карты", "провер|тест|стык|шв[ыаео]|шов|повтор|масштаб|плоскост|покажи|убедись|сравн|уточн"]], "good": "Сгенерировал бесшовный материал «светлый дуб, вертикальные ламели»: фрагмент 1 × 1 м, на нём десять ламелей по 10 см; карты — базовый цвет, нормали, шероховатость, высота; 4096 × 4096, PNG. Тон тёплый, матовый, без запечённых теней и бликов — свет даст сцена. Проверил на тестовой плоскости 6 × 3 м, как длинная стена стенда: стыков по краям фрагмента не видно; ширина ламели рядом с фигурой человека выглядит на свои 10 см. Одно замечание: тёмный сучок в левой трети фрагмента повторяется шесть раз по длине стены и складывается в заметный ритм — сделал второй вариант без сучка, приложил оба. Карта нормалей даёт мягкий рельеф между ламелями; если нужен глубокий паз, надёжнее сделать его геометрией. Генерация на оплаченном тарифе команды, условия сохранил в папку проекта.", "poor": "Вот картинка дерева: тёмный орех с крупными сучками, с бликом от лампы в правом верхнем углу, 1024 × 1024, одна карта цвета. Бесшовность не проверял — на большой стене края фрагмента, скорее всего, будут заметны. Чтобы получить материал под вашу задачу, уточните, пожалуйста: какая порода и тон, какой рисунок и какой физический размер фрагмента, какие карты и в каком разрешении нужны и на какой поверхности его проверять?"}, "D07": {"type": "c", "q": "Неделю назад заказчику ушла ИИ-визуализация стенда для образовательной выставки; он её согласовал и уже показал своему руководству. Собирая модель для застройщика, вы замечаете: на картинке над проходом — шестиметровый козырёк-консоль с логотипом, без опор и подвесов. В вашей модели его нет, а регламент площадки требует согласовывать подвесы и подтверждать несущие конструкции расчётом. До подачи документов девять дней. Что делаете?", "opts": [{"t": "Молчу и сдаю застройщику модель без козырька: заказчик увидит готовый стенд только на монтаже, а в выставочной суете разницу с картинкой вряд ли заметят", "g": 1, "fb": "Заказчик согласовал картинку с козырьком и показал её руководству — для него это обещание. Разница обнаружится на монтаже, когда исправить уже ничего нельзя. Девять дней — достаточный срок, чтобы сегодня показать заказчику, что строится, и предложить вариант по модели."}, {"t": "Сверяю всю картинку с моделью и регламентом и сегодня пишу заказчику: козырёк так не строится, вот два варианта с опорами по модели; остальное помечаю «концепт»", "g": 5, "fb": "Сверка идёт по всей картинке, а не по одному козырьку: где один нестроящийся элемент, могут найтись и другие. Заказчик узнаёт о расхождении сразу и получает решение — варианты, собранные по модели и проходящие по регламенту. Пометка «концепт, не для производства» на остальных ИИ-картинках закрывает такие ситуации на будущее."}, {"t": "Добавляю козырёк в модель ровно как на картинке и отправляю застройщику на расчёт: пусть конструкторы сами решат, на чём его держать и сколько это будет стоить", "g": 3, "fb": "Расчёт у конструкторов — правильный адрес для такого вопроса. Стоит добавить два шага: заказчик узнаёт сегодня, что козырёк потребует опор или подвесов, согласования с площадкой и отдельного бюджета; и остальная картинка сверяется с моделью — чтобы на расчёт ушло всё сразу, а не по одной находке."}, {"t": "Перегенерирую картинку уже без козырька и отправляю заказчику как «уточнённую версию», не объясняя причин: незачем привлекать лишнее внимание к этому промаху", "g": 2, "fb": "Картинка без козырька ближе к тому, что будет построено, — это шаг в нужную сторону. Но заказчик уже показал руководству другую версию и заметит подмену. Стоит прямо назвать причину: консоль без опор не проходит по регламенту площадки, — и приложить вариант по модели. Новую картинку тоже стоит сверить с моделью до отправки."}], "why": "потому|так как|консол|козыр[её]к|опор|подвес|регламент|расч[её]т|
