<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ИИ-компетенции сотрудников</title>
<style>/* Визуальный слой: Raleway, шапка в акцентном цвете, белый контент со скруглением,
   три цвета групп — знания / действия / инструменты. */
@import url("https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap");

:root{
  /* токены Figma */
  --accent:#0E7490;--accent-d:#155E75;--green:#0EA900;--blue:#5B7BEA;
  --title:#1C1C1C;--usual:#7F7F7F;--stroke:#D4D1D1;--bg:#F4F4F4;--card:#fff;
  /* производные: текст мельче 18px — контраст AA на белом и на #F4F4F4 */
  --mu:#666;--ok:#0A7A00;--ok-bg:#E4F6E1;--soft:#EEEDED;--ink:#1C1C1C;
  --g-know:#7A4DD1;--g-act:#0EA900;--g-tool:#5B7BEA;
  /* совместимость со старыми именами */
  --ac:var(--accent);--tx:var(--title);--bd:var(--stroke);
  --r-lg:20px;--r:12px;--r-sm:8px;
  --focus:0 0 0 3px #fff,0 0 0 5px var(--title);
  --hdr-h:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hdr-h) + 12px)}
body{margin:0;font:16px/1.55 Raleway,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:lining-nums;color:var(--title);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{text-decoration-color:var(--accent)}
button,a,input,textarea,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:38px;line-height:1.15;margin:.15em 0 .45em}
h2{font-size:26px;line-height:1.25;margin:1.7em 0 .6em;scroll-margin-top:calc(var(--hdr-h) + 12px)}
h3{font-size:19px;line-height:1.3;margin:0 0 .4em}
h4{font-size:16px;margin:0 0 .4em}
p{margin:.5em 0;text-wrap:pretty}
main{max-width:1120px;margin:0 auto;padding:28px 32px 64px;background:var(--card);border-radius:var(--r-lg) var(--r-lg) 0 0;position:relative;top:-14px;min-height:70vh}
main p,main li{max-width:75ch}
.muted{color:var(--mu)}.small{font-size:14px}.lead{font-size:19px;line-height:1.5;max-width:68ch;font-weight:500}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:0;border-radius:var(--r-sm);background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:10px 20px;cursor:pointer;text-decoration:none;transition:background-color .15s,border-color .15s,color .15s}
.btn:hover{background:var(--accent-d)}
.btn.sec{background:#fff;color:var(--title);border:1.5px solid var(--stroke)}
.btn.sec:hover{border-color:var(--title);background:#fff}
.btn:disabled,.btn[disabled]{background:var(--soft);color:#8a8a8a;border-color:var(--soft);cursor:not-allowed}
.btn.big{font-size:17px;padding:14px 26px;min-height:52px}
.btn+.btn{margin-left:8px}
.btn+.muted,.btn+.small{margin-left:12px}

/* карточки, сетки, чипы */
.card{background:var(--card);border:1px solid var(--stroke);border-radius:var(--r);padding:20px;display:block;text-decoration:none;color:inherit}
a.card{transition:border-color .15s}
a.card:hover,.chip:hover{border-color:var(--title)}
a.card:hover h3{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:.18em}
main .card{background:#fff}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid4{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
.grid2{display:grid;gap:24px;grid-template-columns:repeat(2,minmax(0,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:36px;background:var(--bg);border:1px solid transparent;border-radius:999px;padding:6px 14px;text-decoration:none;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;color:inherit;transition:border-color .15s}
.tag{display:inline-block;background:var(--bg);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:500;color:var(--mu)}
.ex{display:inline-block;vertical-align:middle;background:#FFF4CC;border:1px solid #E8D48A;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:600;color:#6B5600;letter-spacing:0}
.crumbs{font-size:14px;color:var(--mu);margin-bottom:10px}.crumbs a{color:var(--mu)}.crumbs a:hover{color:var(--title)}

/* шапка: градиент акцентного цвета — единственное «громкое» место */
#hdr{background:linear-gradient(100deg,#0E7490 0%,#0C6783 55%,#0A546B 100%);color:#fff;position:sticky;top:0;z-index:20;padding-bottom:14px}
.hdr{max-width:1120px;margin:0 auto;padding:12px 32px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;min-height:var(--hdr-h)}
.logo{font-weight:800;font-size:17px;text-decoration:none;white-space:nowrap;color:#fff}
.hdr nav{display:flex;gap:18px;font-size:15px;font-weight:600}
.hdr nav a{text-decoration:none;color:#fff;opacity:.92}.hdr nav a:hover{opacity:1;text-decoration:underline;text-decoration-color:#fff}
#hdr .btn{background:#fff;color:var(--accent)}
#hdr .btn:hover{background:#E2F1F5}
#hdr .btn.sec{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}
#hdr .btn.sec:hover{border-color:#fff;background:rgba(255,255,255,.1)}
#hdr :focus-visible{box-shadow:0 0 0 2px var(--accent),0 0 0 4px #fff}
.sbox{position:relative;flex:1;min-width:200px}
.sbox input{width:100%;font:inherit;font-size:16px;min-height:44px;padding:9px 14px;border:1.5px solid var(--stroke);border-radius:var(--r-sm);background:#fff;color:var(--title)}
.sbox input::placeholder{color:#8a8a8a}
.sbox input:focus-visible{box-shadow:none;border-color:var(--title);outline:2px solid var(--title);outline-offset:1px}
#hdr .sbox input{border-color:transparent;background:rgba(255,255,255,.96)}
#hdr .sbox input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sbox.big input{padding:14px 18px;font-size:18px;min-height:56px;background:#fff}
.sug{position:absolute;left:0;right:0;top:100%;background:#fff;color:var(--title);border:1px solid var(--stroke);border-radius:var(--r-sm);margin-top:6px;max-height:60vh;overflow:auto;overscroll-behavior:contain;z-index:30;box-shadow:0 12px 32px rgba(28,28,28,.14)}
.sug:empty{display:none}
.sug .grp{font-size:13px;font-weight:700;color:var(--mu);padding:10px 14px 2px}
.sug a{display:block;padding:8px 14px;text-decoration:none}.sug a:hover,.sug a.on{background:var(--bg)}
.sug .none{padding:12px 14px;font-size:15px}
.pathbar{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.pathbar span{font-size:14px;font-weight:600;padding:4px 11px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;white-space:nowrap}
.pathbar span.on{background:#fff;border-color:#fff;color:var(--accent)}
.pathbar span.done{background:rgba(0,0,0,.22);border-color:transparent;color:#fff}
.pathbar span.done::before{content:"✓ "}

/* главная */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:center;background:#fff;border:1px solid var(--stroke);border-radius:var(--r-lg);padding:32px}
.hero h1{margin-top:0}
.hero ol{padding-left:1.3em;margin:.8em 0 1.2em}.hero li{margin:.35em 0}.hero li::marker{font-weight:700;color:var(--accent)}
.hero .teaser{text-align:center}.hero .teaser svg{max-width:300px;width:100%;height:auto}
.facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:8px 28px;margin-top:20px;padding-top:16px;border-top:1px solid var(--soft);font-size:14px;color:var(--mu)}
.facts span{white-space:nowrap}
.facts b{display:block;color:var(--title);font-size:26px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}

/* уровни */
.scale{display:inline-flex;gap:3px;vertical-align:middle}.scale i{width:22px;height:8px;border-radius:2px;background:var(--soft)}.scale i.f{background:var(--title)}
.req{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1.5px solid var(--stroke);border-radius:var(--r-sm);overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;color:var(--title);font:inherit;font-weight:600;min-height:40px;padding:6px 16px;cursor:pointer}
.seg button+button{border-left:1px solid var(--stroke)}
.seg button:hover{background:var(--bg)}
.seg button.on{background:var(--title);color:#fff}
.seg button:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);border-radius:0}
.lv{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--title);color:#fff;font-size:13px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}

/* диагностика */
.diag{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.diag .side{position:sticky;top:calc(var(--hdr-h) + 24px)}
.qbox{background:var(--bg);border-radius:var(--r);padding:16px 18px;margin:8px 0;font-size:17px}
.lbl{font-size:14px;font-weight:700;color:var(--title);margin-top:16px}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{text-align:left;font:inherit;color:var(--title);background:#fff;border:1.5px solid var(--stroke);border-radius:var(--r-sm);padding:12px 14px;min-height:48px;cursor:pointer;transition:border-color .15s,background-color .15s}
.opts button:hover{border-color:#9a9a9a}
.opts button.sel{border-color:var(--title);background:#FAFAFA;box-shadow:inset 0 0 0 1px var(--title)}
.opts button.right{border-color:var(--green);background:var(--ok-bg);box-shadow:inset 0 0 0 1px var(--green)}
textarea{width:100%;min-height:110px;font:inherit;color:var(--title);padding:12px;border:1.5px solid var(--stroke);border-radius:var(--r-sm);margin-top:8px;resize:vertical;background:#fff}
textarea:focus-visible{box-shadow:none;border-color:var(--title);outline:2px solid var(--title);outline-offset:1px}
textarea::placeholder{color:#8a8a8a}
.ans{display:block}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}.acts .btn+.btn{margin-left:0}
.evalbox:empty{display:none}
.eval{border:1px solid var(--stroke);border-left:4px solid var(--title);border-radius:var(--r-sm);padding:16px;margin-top:16px;background:#fff}
.eval:has(.verdict.ok){border-left-color:var(--green)}
.verdict{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;background:var(--soft);color:var(--title)}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.chk div{padding-left:24px;position:relative;font-size:15px;color:var(--mu);margin:3px 0}.chk div:before{content:"○";position:absolute;left:0}
.chk div.y{color:var(--title)}.chk div.y:before{content:"●";color:var(--green)}
.chat{background:var(--bg);border-radius:var(--r);padding:12px 16px;margin:10px 0}
.side h4{font-size:16px}
.side .row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--soft);font-size:14px}
.side .row>span:first-child{min-width:0}
.dots{display:inline-flex;gap:4px;flex:none}.dots i{width:24px;height:24px;border-radius:50%;border:1px solid var(--stroke);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;color:var(--mu);background:#fff}
.dots i.ok{background:var(--ok-bg);border-color:var(--green);color:var(--ok)}.dots i.tr{border-style:dashed;border-color:#8a8a8a}
.dots i.cur{outline:2px solid var(--title);outline-offset:1px}

/* профиль, трек */
.profile{display:grid;grid-template-columns:minmax(280px,480px) minmax(0,1fr);gap:32px;align-items:start}
.radar svg{width:100%;height:auto;display:block}
.sum{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:15px}.sum:last-child{border-bottom:0}.sum span{color:var(--mu)}.sum b{text-align:right;font-variant-numeric:tabular-nums}
.gap{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--soft)}.gap>span:nth-child(2){min-width:0}.gap .st{margin-left:auto;white-space:nowrap;font-size:13px;color:var(--mu)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mu);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.unit{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;border:1px solid var(--stroke);border-radius:var(--r);padding:12px 16px;margin-bottom:8px}
.unit>*:first-child{min-width:0}
.unit.done{background:var(--ok-bg);border-color:#BFE6B9}
.usteps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.usteps button{border:1px solid var(--stroke);background:#fff;color:var(--title);border-radius:999px;font:inherit;font-size:14px;font-weight:600;padding:6px 14px;min-height:36px;cursor:pointer}
.usteps button.on{background:var(--title);color:#fff;border-color:var(--title)}.usteps button.d{color:var(--ok);border-color:#BFE6B9}
.algo{counter-reset:s}.algo div{counter-increment:s;padding:6px 0 6px 36px;position:relative}.algo div:before{content:counter(s);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--title);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}

/* команда, компания, карта */
.scroll{overflow-x:auto;overscroll-behavior-x:contain}
table{border-collapse:collapse;font-size:14px;background:#fff;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--stroke);padding:7px 9px;text-align:center}th{background:var(--bg);font-weight:700}
td.l,th.l{text-align:left;white-space:nowrap}
td.met{background:var(--ok-bg);color:var(--ok);font-weight:600}td.open{background:#F7F7F7;color:var(--mu)}td.na{color:#A8A8A8}
.bar{display:grid;grid-template-columns:240px minmax(0,1fr) 52px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--soft)}
.bar:last-child{border-bottom:0}
.bar>span:last-of-type{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.bar .b{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}.bar .b i{display:block;height:100%;background:var(--title);border-radius:6px}
.bar p{grid-column:1/-1;margin:0;font-size:14px;color:var(--mu)}
details.skill{margin-top:8px;padding:12px 16px}details.skill summary{font-weight:700}details.skill p{margin:.35em 0}
details{background:#fff;border:1px solid var(--stroke);border-radius:var(--r);padding:12px 18px;margin-top:14px}
summary{cursor:pointer;font-weight:700;min-height:28px;list-style-position:outside}
summary:hover{color:var(--accent-d)}
details[open]>summary{margin-bottom:6px}
.stage{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--soft)}
.stage:last-child{border-bottom:0}
#ftr{max-width:1120px;margin:0 auto;padding:18px 32px 32px;font-size:14px;color:var(--mu);background:var(--card)}

/* экран руководителя: частота × уровень */
.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.fbwrap{overflow-x:auto;overscroll-behavior-x:contain}.fbt{min-width:600px;font-size:14px;font-variant-numeric:tabular-nums}
.fbr{display:grid;grid-template-columns:minmax(190px,30%) 1fr;column-gap:14px;align-items:center;padding:2px 0}.fbc{padding-top:12px}.fbh{padding-bottom:2px}
.tln{line-height:1.3}.fbr:not(.fbc) .tln{padding-left:24px}
.tlx{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.tlx span{display:inline-grid;place-items:center;width:18px;height:18px;border:1px solid var(--stroke);border-radius:5px;font-size:.7rem;transition:transform .15s}.tlx.op span{transform:rotate(90deg)}.tlx:focus-visible{outline:2px solid var(--title);outline-offset:2px;border-radius:4px;box-shadow:none}
.fbc .tln>b,.fbc .tln>.muted{padding-left:24px;display:block}.fbc .tln>.tlx+.muted{padding-left:24px}
.fleg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mu);margin-bottom:10px}.fleg span{display:inline-flex;align-items:center;gap:6px}
.sq{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px}
.card.pick .seg{margin-top:8px}

/* адаптив */
@media screen and (max-width:960px){
 .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .facts{grid-template-columns:repeat(2,auto)}
 .diag{grid-template-columns:1fr}.diag .side{position:static}
}
@media screen and (max-width:760px){
 :root{--hdr-h:0px}
 h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}.lead{font-size:17px}
 #hdr{position:static;padding-bottom:12px}
 .hdr{padding:10px 16px;gap:10px;min-height:0}
 .hdr .logo{flex:1}
 .hdr .sbox{order:3;flex-basis:100%}
 .hdr nav{order:4;width:100%;overflow-x:auto;gap:16px;white-space:nowrap;padding-bottom:2px;scrollbar-width:none}
 .hdr nav::-webkit-scrollbar{display:none}
 #hdr .btn{min-height:40px;padding:8px 14px;font-size:15px}
 .pathbar{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
 .pathbar::-webkit-scrollbar{display:none}
 main{padding:20px 16px 48px;border-radius:16px 16px 0 0;top:-10px}
 #ftr{padding:16px}
 .hero,.grid2,.diag,.profile{grid-template-columns:1fr}
 .grid4{grid-template-columns:1fr 1fr}
 .grid{grid-template-columns:1fr}
 .hero{padding:20px;gap:20px}
 .hero .teaser svg{max-width:240px}
 .facts{grid-template-columns:1fr 1fr;gap:12px 20px}.facts b{font-size:22px}
 .bar{grid-template-columns:minmax(0,1fr) 52px}.bar .b{grid-column:1/-1;order:3}
 .stage{grid-template-columns:1fr;gap:4px}
 .btn.big{width:100%}
 .btn+.btn{margin-left:0;margin-top:8px}
 .btn+.muted,.btn+.small{display:block;margin:8px 0 0}
 .gap{flex-wrap:wrap}.gap .st{margin-left:36px}
 .unit{flex-wrap:wrap}
 .side .row{gap:6px}
}
@media screen and (max-width:420px){.grid4{grid-template-columns:1fr}}

@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
 .tlx span{transition:none}
}
@media print{#hdr{position:static;background:#fff;color:var(--title)}main{top:0}}

.nox .fbc .tln>b,.nox .fbc .tln>.muted{padding-left:0}
#ftr:empty{display:none}
/* экран руководителя на телефоне: подпись над столбиком, график на всю ширину */
@media screen and (max-width:600px){
 .fbt{min-width:0}.fbr{grid-template-columns:1fr;row-gap:4px}.fbh>div:first-child{display:none}
 .fbc .tln>b,.fbc .tln>.muted,.fbr:not(.fbc) .tln{padding-left:0}
 .tbar .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.tbar .seg button{flex:none}
}

/* уровни компетенции: строки — линии оценки, столбцы — уровни; пунктир = «то же, что слева» */
.lvmx{display:grid;grid-template-columns:136px repeat(var(--cols),minmax(0,1fr));gap:10px 12px;align-items:start}
.lvhead{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--stroke);border-radius:var(--r);padding:12px 14px}
.lnlab{font-size:12.5px;font-weight:600;color:var(--mu);line-height:1.3;padding-top:10px}
.lnlab.hd{padding:0}
.lvcell{display:grid;gap:6px;align-content:start;min-height:22px}
.lvitem{background:var(--bg);border-radius:var(--r-sm);padding:10px 12px;font-size:14px;line-height:1.4}
.lvitem.anc{background:#EEF6F9;border-left:3px solid var(--accent)}
.lvcell.carry{position:relative}
.lvcell.carry::before{content:"";position:absolute;left:-14px;right:-14px;top:14px;border-top:2px dashed var(--stroke)}
@media screen and (max-width:860px){
 .lvmx{display:block}
 .lnlab{padding:16px 0 6px;font-size:13px;color:var(--title);border-top:1px solid var(--stroke)}
 .lnlab.hd,.lvmx .lvhead{display:none}
 .lvcell{margin:0 0 6px}
 .lvcell::before{content:"Уровень " attr(data-lv);display:block;font-size:11.5px;color:var(--mu);margin-bottom:2px}

/* ---------- система движения и поверхностей (по Fluid Functionalism, MIT: fluidfunctionalism.com) ----------
   Три пресета пружин: быстрый — ховеры и фокус, средний — вкладки и панели (без отскока), медленный — шторки.
   Выход всегда быстрее входа: закрытие не «тянет». linear() приближает пружину, cubic-bezier — запасной вариант. */
:root{
  --sp-fast-in:80ms;   --sp-fast-out:60ms;
  --sp-mod-in:160ms;   --sp-mod-out:120ms;
  --sp-slow-in:240ms;  --sp-slow-out:160ms;
  --ease-fast:cubic-bezier(.32,.72,0,1);
  --ease-mod:cubic-bezier(.2,0,0,1);
  --ease-slow:linear(0,.35 12%,.73 24%,.93 34%,1.03 44%,1.05 54%,1.02 70%,1);
  /* поверхности */
  --s-0:var(--bg); --s-1:#fff; --s-2:#fff;
  --s-border:var(--stroke);
  --s-shadow-1:0 1px 2px rgba(16,16,16,.04);
  --s-shadow-2:0 8px 24px rgba(16,16,16,.10);
  --s-shadow-3:-8px 0 30px rgba(16,16,16,.12);
  /* размеры контролов */
  --ctl-sm:32px; --ctl-md:40px; --ctl-lg:44px;
  /* подсветка курсора */
  --fluid-tint:rgba(91,123,234,.10);
  --fluid-ring:rgba(91,123,234,.55);
}
/* тонкие скроллбары везде, где есть своя прокрутка */
.scroll,.fbwrap,.mx,.mpanel,.hdr nav,.tbar .seg{scrollbar-width:thin;scrollbar-color:#c7c7c7 transparent}
.scroll::-webkit-scrollbar,.fbwrap::-webkit-scrollbar,.mx::-webkit-scrollbar,.mpanel::-webkit-scrollbar{height:8px;width:8px}
.scroll::-webkit-scrollbar-thumb,.fbwrap::-webkit-scrollbar-thumb,.mx::-webkit-scrollbar-thumb,.mpanel::-webkit-scrollbar-thumb{background:#c7c7c7;border-radius:8px}
.scroll::-webkit-scrollbar-track,.fbwrap::-webkit-scrollbar-track,.mx::-webkit-scrollbar-track,.mpanel::-webkit-scrollbar-track{background:transparent}
/* пружины на существующие состояния */
.btn{transition:background-color var(--sp-fast-in) var(--ease-fast),border-color var(--sp-fast-in) var(--ease-fast),color var(--sp-fast-in) var(--ease-fast),transform var(--sp-fast-in) var(--ease-fast)}
.btn:active{transform:scale(.985)}
a.card,.chip,.seg button,.opts button,.dtile,.mcell,.mname,.mcol{transition:background-color var(--sp-fast-in) var(--ease-fast),border-color var(--sp-fast-in) var(--ease-fast),color var(--sp-fast-in) var(--ease-fast)}
:focus-visible{transition:box-shadow var(--sp-fast-in) var(--ease-fast)}
.hb{transition:--p var(--sp-mod-in) var(--ease-mod),width var(--sp-fast-in) var(--ease-fast),height var(--sp-fast-in) var(--ease-fast)}
.mbar i{transition:width var(--sp-mod-in) var(--ease-mod)}
.tlx span{transition:transform var(--sp-fast-in) var(--ease-fast)}
/* появление шторки и подложки — медленный пресет, закрытие быстрее */
.mpanel{animation:sheet-in var(--sp-slow-in) var(--ease-slow) both;box-shadow:var(--s-shadow-3)}
.mpanel-bg{animation:fade-in var(--sp-mod-in) var(--ease-mod) both}
@keyframes sheet-in{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@media screen and (max-width:600px){.mpanel{animation-name:sheet-up}@keyframes sheet-up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}}
/* раскрытие навыков и уровней — средний пресет */
.rqbody,.lvsub li,.outc-i{animation:reveal var(--sp-mod-in) var(--ease-mod) both}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* ---------- подсветка «выигрывает ближайший»: одна плашка на контейнер, ездит трансформом ---------- */
.fluid-host{position:relative}
.fluid{position:absolute;left:0;top:0;pointer-events:none;opacity:0;border-radius:10px;z-index:0;
  transition:opacity var(--sp-fast-in) var(--ease-fast),transform var(--sp-mod-in) var(--ease-mod),width var(--sp-mod-in) var(--ease-mod),height var(--sp-mod-in) var(--ease-mod)}
.fluid.on{opacity:1}
.fluid.fill{background:var(--fluid-tint)}
.fluid.ring{box-shadow:inset 0 0 0 1.5px var(--fluid-ring);background:transparent;z-index:2}
.seg,.mx,.reqs,.chips,.grid,.rcards,.pcards,.outgrid,.dgrid{position:relative}
.seg button,.mcell,.rq,.chip,.dtile{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){

  .btn:active{transform:none}
}

.lvitem.fbdone{box-shadow:inset 2px 0 0 var(--green)}
.lvitem.fbdone .fbcta{content:none}
.lvitem.fbdone:hover .fbcta::after{content:" — изменить"}
.fbcard{margin-top:18px}
.fbcard h3{margin:0 0 10px;font-size:18px}
.fbl{display:block;font-size:14px;font-weight:600;margin:10px 0 0}
.fbl textarea{display:block;width:100%;margin-top:6px;font:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--stroke);border-radius:var(--r-sm);resize:vertical}
.fbl textarea:focus-visible{outline:none;border-color:var(--title)}
.fbatom{background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;font-size:14px;line-height:1.45}
.fbrow{margin:14px 0 0}
.fbrow>span{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
.fbseg{flex-wrap:wrap}
.fbseg button{font-size:13px;padding:6px 10px}
@media print{.fbbar,.fbcta,.fbok,.fbcard,.fbhint{display:none!important}}

/* сводка фидбека */
.fbt{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:14px}
.fbt th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mu);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--stroke)}
.fbt td{padding:8px;border-bottom:1px solid #f1f0ee;vertical-align:top}
.fbt td.num,.fbt th.num{text-align:right;white-space:nowrap}
.fbbarline{display:block;height:8px;border-radius:5px;background:var(--bg);overflow:hidden;min-width:80px}
.fbbarline i{display:block;height:100%;background:var(--green);border-radius:5px}
.fbcomments{display:grid;gap:10px;margin-top:8px}
.fbc{background:#fff;border:1px solid var(--stroke);border-radius:var(--r-sm);padding:12px 14px}
.fbc p{margin:4px 0 6px;font-size:14px;line-height:1.45}

/* ---------- дашборд результатов оценки ---------- */
.dnote{background:#fff;border:1.5px solid var(--stroke);border-radius:var(--r);padding:12px 16px;font-size:13.5px;color:var(--mu);margin:14px 0 18px}
.dnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 22px}
.dnum{background:#fff;border:1.5px solid var(--stroke);border-radius:var(--r);padding:16px 18px}
.dn{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.dn .muted{font-size:18px;font-weight:600}
.dl{font-size:14px;margin-top:4px}
.drisk{border-color:var(--accent);background:#F0F7FA;margin:0 0 22px}
.drisk h2{margin-top:0}
.dbig{font-size:20px;font-weight:700;color:var(--accent);margin:10px 0 4px}
.dbar{display:block;height:8px;border-radius:5px;background:var(--bg);overflow:hidden;margin:6px 0 0;min-width:70px}
.dbar i{display:block;height:100%;border-radius:5px;background:var(--green)}
.dbar.cov i{background:var(--title)}
.dtab{width:100%;border-collapse:collapse;margin:8px 0 26px;font-size:14px}
.dtab th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mu);font-weight:600;padding:8px;border-bottom:1px solid var(--stroke)}
.dtab td{padding:10px 8px;border-bottom:1px solid #f1f0ee;vertical-align:top}
.dtab td.num,.dtab th.num{text-align:right;white-space:nowrap}
.dtab tr.thin td{color:var(--mu)}
.dlist{display:grid;gap:10px;margin:8px 0 26px}
.drow{background:#fff;border:1.5px solid var(--stroke);border-radius:var(--r);padding:14px 16px}
.drh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.chip.wide{background:rgba(14,169,0,.12);color:#0A7A00;border-color:transparent}
.dmxwrap{overflow-x:auto;margin:8px 0 26px}
.dmx{border-collapse:collapse;font-size:13px;min-width:100%}
.dmx th{font-size:11.5px;color:var(--mu);font-weight:600;padding:6px;border-bottom:1px solid var(--stroke);vertical-align:bottom;text-align:center}
.dmx th:first-child{text-align:left}
.dmx th span{display:block;width:84px;line-height:1.2;margin:0 auto;hyphens:auto}
.dmx td{padding:8px 6px;border-bottom:1px solid #f4f3f1;text-align:center;min-width:76px}
.dmxwrap{position:relative}
.dmxhint{font-size:12.5px;color:var(--mu);margin:0 0 6px}
.dnm{text-align:left!important;white-space:nowrap}
.dnm b{display:block;font-size:13.5px}
.dcell{font-weight:700}
.dcell{display:table-cell}
.dcell.dok{color:var(--ok)}
.dcell.dgap{color:var(--title);background:#f6f5f3}
.dcell.dnone{color:var(--mu);background:#fafafa}
.dcell.dempty{background:transparent}
@media screen and (max-width:760px){.dnums{grid-template-columns:1fr}.dn{font-size:26px}}
@media print{.dnote{display:none}}

/* ---------- кейсовая оценка: ситуация, таймер, разбор по признакам уровней ---------- */
.dkkit,.dksum{display:grid;gap:2px;margin-top:14px}
.dkrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:10px 0;border-top:1px solid var(--soft)}
.dkhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.dksit{background:var(--bg);border-radius:var(--r);padding:16px 18px;margin:8px 0;font-size:16.5px;line-height:1.6;white-space:pre-line}
.dkask{font-size:16.5px;font-weight:600;margin:8px 0 0}
.dkbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:16px 0 8px}
.dkt{font-size:14px;font-weight:600;color:var(--mu)}
.dkt i{font-style:normal;font-weight:700;color:var(--title);font-variant-numeric:tabular-nums}
.dkt.out{color:var(--accent-d)}
.dkans{min-height:190px}
.dklv{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dkok,.dkno{margin:6px 0 0;padding-left:22px;font-size:15px}
.dkok li{color:var(--title)}
.dkno li{color:var(--mu)}
.dkline{margin-top:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
  background:var(--bg);border-radius:var(--r-sm);padding:8px 10px;color:var(--title)}
.dkmeth{margin-top:14px;border-top:1px solid var(--soft);padding-top:10px}
.dkmeth summary{cursor:pointer;font-weight:600;font-size:14px}
.dkmeth[open] summary{margin-bottom:6px}
.dkmeth ul{padding-left:22px}
@media screen and (max-width:760px){.dksit{padding:14px}.dkans{min-height:220px}}

/* шаги кейсовой оценки: рамка «своего случая», голосовой ответ, предупреждение про правило */
.dkbtns{display:inline-flex;gap:8px;flex-wrap:wrap}
.dkframe{display:grid;gap:6px;font-size:15.5px}
.dkframe b{color:var(--title)}
.dkwarn{margin-top:12px;background:#FFF6E6;border-radius:var(--r-sm);padding:10px 12px;font-size:14.5px}
.dkvoice:empty{display:none}
.dkvrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:var(--r);padding:10px 12px;margin:0 0 8px}
.dkvrow b{font-variant-numeric:tabular-nums}
.micdot{width:12px;height:12px;border-radius:50%;background:var(--mu);display:inline-block;flex:none}
.btn .micdot{margin-right:7px;vertical-align:-1px}
.micdot.on{background:var(--accent);animation:dkpulse 1.1s ease-in-out infinite}
@keyframes dkpulse{0%,100%{opacity:1}50%{opacity:.25}}
.dkwave{display:inline-flex;align-items:center;gap:3px;height:22px;flex:1 1 90px;min-width:90px}
.dkwave i{width:3px;height:40%;background:var(--stroke);border-radius:2px;animation:dkbar 1s ease-in-out infinite}
.dkwave i:nth-child(3n){height:85%}.dkwave i:nth-child(3n+1){height:60%}
.dkwave i:nth-child(2n){animation-delay:.12s}.dkwave i:nth-child(3n){animation-delay:.26s}.dkwave i:nth-child(5n){animation-delay:.4s}
.dkwave.still i{animation:none;background:#c9c6c2}
@keyframes dkbar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.micdot.on,.dkwave i{animation:none}}

/* пометка для портфолио */
.demo-note{background:#E2F1F5;color:#0A546B;font-size:13px;font-weight:600;line-height:1.4;text-align:center;padding:7px 16px;text-wrap:balance;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 20px}
.demo-note a{color:#0A546B;font-weight:500;text-decoration:underline;text-decoration-color:rgba(10,84,107,.45);text-underline-offset:.2em;white-space:nowrap}
.demo-note a:hover{text-decoration-color:#0A546B}
/* шапка: поле поиска не уже подсказки «Найти должность…», кнопка оценки всегда в первой строке.
   Минимальную ширину поля задаёт невидимая копия подсказки — она меряется тем шрифтом, который загрузился.
   От 1121px — одна строка; если шрифт шире обычного, переносятся ссылки меню, а не кнопка.
   761–1120px — логотип, поиск и кнопка в первой строке, меню во второй. */
@media screen and (min-width:761px){
 .hdr .sbox{min-width:auto}
 .hdr .sbox::after{content:attr(data-ph);display:block;height:0;overflow:hidden;visibility:hidden;white-space:nowrap;font-size:16px;padding:0 31px 0 14px} /* справа ещё место под крестик очистки поля */
 #hdr .sbox input{padding-left:12px;padding-right:12px}
 .hdr>.btn{flex:none;white-space:nowrap}
}
@media screen and (min-width:1121px){
 .hdr{gap:12px;flex-wrap:nowrap}
 .hdr .logo{flex:none}
 .hdr .sbox{flex:1 1 0}
 .hdr nav{flex:0 1 auto;min-width:0;flex-wrap:wrap;gap:2px 10px}
}
@media screen and (min-width:761px) and (max-width:1120px){
 .hdr{row-gap:8px}
 .hdr>.btn{order:3}
 .hdr nav{order:4;flex-basis:100%;flex-wrap:wrap;gap:2px 18px}
}
#ftr a{color:var(--title)}

ми", "checks": "есть ли письменное согласие человека на использование его голоса и лица"}]}, {"id": 14, "code": "W", "name": "Генерация видео", "model_name": "ИИ-генерация визуала для видео", "layer": 3, "description": "Вставки, заставки и серии шотов по описанию — с контролем героя, артефактов и расхода кредитов.", "tagline": "Вставки, заставки и серии шотов по описанию — с контролем героя, артефактов и расхода кредитов.", "how_it_looks": "фоновая анимация, заставка или серия шотов генерируется по описанию и референсам, а не ищется на стоках. При склейке шотов лицо, костюм и свет героя не меняются, логотип и текст в кадре не плывут — это проверяют покадрово. До запуска считают кредиты: сколько дублей уходит на один годный шот. Перед публикацией сверяют условия тарифа и правила площадки о раскрытии ИИ-контента.", "levels": {"1": "Работает по памятке о правах: проверяет тариф и пометку об ИИ до публикации; ролик без пометки не публикует, спорный случай показывает руководителю", "2": "Пишет запрос на вставку, генерирует три варианта и отбирает по признакам: нет артефактов и мерцания, есть свободная зона под титры, длительность совпадает с фрагментом; держит одного героя в серии шотов", "3": "Разбирает артефакты и выбирает: перегенерация, маска, ручная правка или отказ; до запуска считает кредиты на дубли; фиксирует общий запрос для серии вставок и проверяет его на пробной партии", "4": "Пишет для команды правила видеогенерации: разрешённые модели и тарифы, что проверяем, как помечаем"}, "who_needs": "Уровень для Middle: Видео/моушен-дизайнер — 2, SMM-дизайнер — 1. Junior — на уровень ниже, Senior — выше.", "top_level": 4, "lines": [{"name": "Обращение с данными", "checks": "учтены ли условия тарифа, права на коммерческое использование и пометка об ИИ"}, {"name": "Постановка задачи ИИ", "checks": "как собран запрос на генерацию — описание, образцы, референсы и настройки для серии"}, {"name": "Проверка результата", "checks": "отобран ли кадр по признакам и найдены ли артефакты генерации"}]}, {"id": 15, "code": "Y", "name": "Анимация, озвучка и дубляж", "model_name": "ИИ в видеопроизводстве и моушене", "layer": 3, "description": "Раскадровки, оживление макетов, маски, озвучка и музыка с лицензией, дубляж, апскейл архива.", "tagline": "Раскадровки, оживление макетов, маски, озвучка и музыка с лицензией, дубляж, апскейл архива.", "how_it_looks": "раскадровка ролика собирается по брифу за час; статичная обложка превращается в пятисекундный цикл; посторонний человек убирается из кадра маской за минуты. Закадровый текст озвучивается синтезом, и человек сверяет произношение названий программ со списком; на музыку сохраняется подтверждение лицензии. Голос и лицо реального человека используются только с его письменного согласия.", "levels": {"1": "Работает с голосом и лицом человека только по письменному согласию, полученному до начала работы; без согласия работу не начинает, а спрашивает руководителя", "2": "Собирает по брифу раскадровку и 2–3 варианта сценария, оживляет макет, делает маски, готовит озвучку и музыку с подтверждённой коммерческой лицензией, ставит отметку об ИИ на площадке", "3": "Решает про апскейл по тесту на фрагменте с лицами, делает дубляж и липсинк после письменного согласия спикера и сверяет термины с глоссарием", "4": "Пишет правила для видеопроизводства: что можно генерировать, чьё согласие нужно, где хранятся лицензии, как помечается ролик"}, "who_needs": "Уровень для Middle: Видео/моушен-дизайнер — 3. Junior — на уровень ниже, Senior — выше.", "top_level": 4, "lines": [{"name": "Обращение с данными", "checks": "есть ли согласие на голос и лицо, подтверждённые лицензии и раскрытие ИИ на площадке"}, {"name": "Постановка задачи ИИ", "checks": "как по брифу собраны раскадровка и варианты сценария"}, {"name": "Производство материала", "checks": "как сделаны движение макета, маски и дубляж с липсинком"}, {"name": "Проверка результата", "checks": "сверены ли произношение терминов и качество апскейла на тестовом фрагменте"}]}, {"id": 16, "code": "I", "name": "Анализ отзывов и интервью", "model_name": "ИИ в исследовании и анализе", "layer": 3, "description": "Разбор отзывов с частотой и цитатами, гайды интервью, проверка выводов по выгрузке, гипотезы для спринта.", "tagline": "Разбор отзывов с частотой и цитатами, гайды интервью, проверка выводов по выгрузке, гипотезы для спринта.", "how_it_looks": "четыреста отзывов разбираются в пять–семь повторяющихся проблем с частотой и дословными цитатами — за вечер, а не за неделю. Каждый вывод сверяется с выгрузкой: ИИ может обобщить то, чего в отзывах нет. Персональные данные убираются до загрузки. Ответы нейросети от лица студента подписываются как гипотеза.", "levels": {"1": "Готовит подборку отзывов по инструкции и обезличивает материалы до загрузки; цитаты в сводке ИИ сверяет с исходными отзывами; вывод показывает руководителю", "2": "Разбирает выгрузку отзывов на проблемы с частотой и дословными цитатами. Готовит гайд интервью с таймингом и открытыми вопросами без наводящих", "3": "Сверяет каждый вывод ИИ с выгрузкой. К каждой проблеме готовит гипотезу причины и решения с эффектом и трудозатратами. ИИ-персону использует только для гипотез", "4": "Пишет порядок ИИ-анализа исследований для команды: что обезличиваем, как храним, как помечаем выводы, проверенные по исходным данным"}, "who_needs": "Уровень для Middle: Продуктовый дизайнер — 2. Junior — на уровень ниже, Senior — выше. Исследования нужны также тем, кто работает с обратной связью.", "top_level": 4, "lines": [{"name": "Обращение с данными", "checks": "обезличены ли расшифровки и отзывы до загрузки в сервис"}, {"name": "Проверка результата", "checks": "сверены ли цитаты и выводы ИИ с исходной выгрузкой"}, {"name": "Разбор отзывов и интервью", "checks": "как массив разобран на проблемы, вопросы гайда и гипотезы решений"}, {"name": "ИИ-персона вместо людей", "checks": "для каких задач допустима ИИ-персона и как помечен её результат"}]}, {"id": 17, "code": "E", "name": "Анализ рын
